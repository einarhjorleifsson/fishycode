# stk — what the dump's dictionary cannot say of the columns fishycode reads (plan 040; format in README.md).
# Seeded 2026-10-22 by Claude (AI) from R/stk_trail.R, decision 164 and the correction ais_invalid_position, on the
# dump of 2026-10-16; not yet checked by a person. Oracle has no comment on the trail's columns. The trail's three
# streams and the heading's meaning were added 2026-10-27 by Claude (AI) from data tests; not yet checked by a person.
# The time by stream (posdate, recdate, the definitions stream and received_late, and the trail's assertions on time) was
# added 2026-11-01 by Claude (AI) from data tests (plan 059 step 4); not yet checked by a person.
$version: 0.1.0
name: stk
tables:
  - name: trail
    details: |
      The STK vessel monitoring trail, 2003 on, dumped by year of recdate (the receipt time). Read through stk_trail()
      (R/stk_trail.R), which converts the radians to degrees and the speed to knots. A row whose in_out_of_harbor is
      set is a port event, not a fix (decision 164).

      Three streams under one mobileid, which no column tells apart: msgtype (0), comsystemid (100) and mobile's type
      (0) and comsystem (100) are the same on every row. They part by the grid of the position (the definitions
      on_ais_grid and on_centiminute_grid) and by their signatures. Fixes only, distances to the nearest Icelandic
      port's centre; the names are what the signatures fit, not established:
      - AIS: on a ten-thousandth of a minute (AIS's resolution) and not on a hundredth. 11.8 M fixes in 2006-2010,
        118 M in 2020-2026. Every 10 minutes (median); 89-95 % within 50 nm to 2019, and 19.5 % beyond 200 nm in
        2020-2026. Satellite AIS from 2020: in the open ocean (Irminger Sea 57-62 N 36-27 W, Norwegian Sea 65-69.5 N
        5 W-3 E) 15-2,360 AIS fixes a year to 2019, 10,809-29,019 a year from 2020.
      - Centiminute, VMS: on a hundredth of a minute. In 2006-2010 1.5 M fixes, hourly (median 60 minutes), 81 % at
        whole minutes, 20 % beyond 200 nm, and the most of the open-ocean fixes every year to 2019. From 2011 mostly
        every 10-12 minutes, and from 2013 near the coast (76-80 % within 50 nm): 6.2 M fixes in 2013-2019, 8.8 M in
        2020-2026. Not all VMS: 0.67 % of it in 2006-2010 is AIS's 511.
      - No grid, STK's own shore-received units: on none of 1e-5 degree, a thousandth of a minute, radians to 1e-6
        to 1e-8. In 2006-2011 20.9 M fixes, 76 % of all in 2007, 44 % in 2010, 20 % in 2011; every 9.5-14.5
        minutes (95 %), 99.8 % within 50 nm. From 2012 7,620-25,275 a year, hourly (median), half beyond 200 nm, the
        farthest (500 nm and more) mostly in the Barents Sea.
      In 2007-2010, 4,488 mobileid-years send both gridded and ungridded fixes, 2,074 only ungridded, 1,145 only
      gridded. AIS class is in no column. In the ping union, 2014-2024, 48.3 % of the STK fixes with a vid are of
      vessel-years ASTD hears only in astdB (its Class B feed), 45.4 % only in astd (its main feed, taken to be Class
      A), 1.2 % in both and 5.1 % in neither. Evidence: data tests of 2026-10-27 on the dump of 2026-10-16.
    definitions:
      - name: on_ais_grid
        label: Position on a ten-thousandth of a minute (AIS's resolution); true of the centiminute grid too
        expr: >-
          ABS(poslat * 34377467.7078 - ROUND(poslat * 34377467.7078)) < 0.02 AND
          ABS(poslon * 34377467.7078 - ROUND(poslon * 34377467.7078)) < 0.02
      - name: on_centiminute_grid
        label: Position on a hundredth of a minute
        expr: >-
          ABS(poslat * 343774.677078 - ROUND(poslat * 343774.677078)) < 0.0002 AND
          ABS(poslon * 343774.677078 - ROUND(poslon * 343774.677078)) < 0.0002
      - name: stream
        label: >-
          STK's stream, by the position's grid (the details above), named as curate/checks/ais_feed_clock.R names them;
          a port event row is stk_event
        expr: >-
          CASE WHEN in_out_of_harbor IS NOT NULL THEN 'stk_event' WHEN on_centiminute_grid THEN 'stk_vms'
          WHEN on_ais_grid THEN 'stk_ais' ELSE 'stk_unit' END
      - name: received_late
        label: Received more than an hour after its position time
        expr: posdate < recdate - interval(1, hours)
      - name: lon
        label: Longitude, decimal degrees
        expr: poslon * 180 / 3.141592653589793
      - name: lat
        label: Latitude, decimal degrees
        expr: poslat * 180 / 3.141592653589793
      - name: speed_kn
        label: Speed, knots
        expr: speed * 3600 / 1852
      - name: heading_deg
        label: Heading, degrees
        expr: heading * 180 / 3.141592653589793
    constraints:
      - assert: poslon IS NULL OR poslat IS NULL OR poslon <> poslat
        description: >-
          A position has its longitude apart from its latitude. Expected false on 22,733 rows (dump of 2026-10-16):
          placeholders, 6,893 at (0, 0) and 3 beside it, 15,822 with both at 56-76 degrees (mostly 2012), 15 at -1
          degree (2010). The ping union drops them before cleaning (correction ais_invalid_position).
      # The time by stream (posdate's details). Each is an aggregate, tested by year file as check_data_dict() reads
      # them, so it fails on a whole file; a period is the receipt's, recdate's. Each tests one stream and period, the
      # period first and the stream by its grid, not through the definition stream: 2.6-2.8 times faster (2024's
      # file: 38 s for these against 100 s; 3.7 s without them).
      - assert: >-
          AVG(CASE WHEN recdate >= '2007-01-01T00:00:00' AND recdate < '2025-05-01T00:00:00' AND
          in_out_of_harbor IS NULL AND on_ais_grid AND NOT on_centiminute_grid
          THEN CASE WHEN posdate = recdate THEN 1 ELSE 0 END END) >= 0.85
        description: >-
          STK's AIS stream gives a fix the time of its receipt: to April 2025, posdate equals recdate on 85 % or more of
          a year file's fixes (87.0-99.3 %). Expected false on 9,738,321 rows (dump of 2026-10-16): the year file of 2009,
          61.3 %, which the aggregate fails whole (posdate 2 s after recdate on most fixes of June and July 2009, and
          decision 233's clock episode in September and October).
      - assert: >-
          AVG(CASE WHEN recdate >= '2025-05-01T00:00:00' AND NOT received_late AND
          in_out_of_harbor IS NULL AND on_ais_grid AND NOT on_centiminute_grid
          THEN CASE WHEN posdate = recdate THEN 1 ELSE 0 END END) < 0.95
        description: >-
          From May 2025 STK's AIS stream no longer gives every fix its receipt's time to the second: of the fixes
          received within the hour, posdate equals recdate on under 95 % of a year file's (72.2 % of 2025's from May,
          66.0 % of 2026's). Holds on every year file of the dump of 2026-10-16.
      - assert: >-
          AVG(CASE WHEN recdate >= '2025-05-01T00:00:00' AND NOT received_late AND
          in_out_of_harbor IS NULL AND on_ais_grid AND NOT on_centiminute_grid
          THEN CASE WHEN posdate <= recdate AND posdate >= recdate - interval(60, seconds) THEN 1 ELSE 0 END END) >= 0.95
        description: >-
          The change of May 2025 is of a second or two: of the AIS stream's fixes received within the hour, posdate lies
          within a minute before recdate on 95 % or more of a year file's (99.9 % of 2025's from May, 98.9 % of 2026's),
          most of the unequal 1-2 s before. Holds on every year file of the dump of 2026-10-16.
      - assert: >-
          AVG(CASE WHEN recdate < '2011-01-01T00:00:00' AND in_out_of_harbor IS NULL AND on_centiminute_grid
          THEN CASE WHEN posdate = recdate THEN 1 ELSE 0 END END) < 0.5
        description: >-
          STK's centiminute stream gives a fix the report's own time to 2010: posdate equals recdate on under half of a
          year file's fixes (0-38.6 %), most of the rest 1-60 minutes before it. Holds on every year file of the dump of
          2026-10-16.
      - assert: >-
          AVG(CASE WHEN recdate >= '2016-01-01T00:00:00' AND recdate < '2025-05-01T00:00:00' AND
          in_out_of_harbor IS NULL AND on_centiminute_grid THEN CASE WHEN posdate = recdate THEN 1 ELSE 0 END END) >= 0.75
        description: >-
          STK's centiminute stream gives a fix mostly its receipt's time from 2016 to April 2025: posdate equals recdate
          on 75 % or more of a year file's fixes (80.7-93.5 %). Holds on every year file of the dump of 2026-10-16.
      - assert: >-
          AVG(CASE WHEN recdate >= '2025-05-01T00:00:00' AND NOT received_late AND in_out_of_harbor IS NULL AND
          on_centiminute_grid THEN CASE WHEN posdate = recdate THEN 1 ELSE 0 END END) < 0.95
        description: >-
          From May 2025 the centiminute stream changes as the AIS stream: of the fixes received within the hour, posdate
          equals recdate on under 95 % of a year file's (66.8 % of 2025's from May, 66.0 % of 2026's). Holds on every
          year file of the dump of 2026-10-16.
      - assert: >-
          AVG(CASE WHEN in_out_of_harbor IS NULL AND NOT on_ais_grid
          THEN CASE WHEN posdate = recdate THEN 1 ELSE 0 END END) < 0.05
        description: >-
          STK's own units (no grid) stamp their own time: posdate equals recdate on under 5 % of a year file's fixes
          (0-3.6 %). Holds on every year file of the dump of 2026-10-16.
      - assert: >-
          AVG(CASE WHEN recdate >= '2007-01-01T00:00:00' AND NOT (
          recdate >= '2026-01-15T00:00:00' AND recdate < '2026-01-16T00:00:00' OR
          recdate >= '2026-05-11T00:00:00' AND recdate < '2026-05-13T00:00:00' OR
          recdate >= '2026-10-12T00:00:00' AND recdate < '2026-10-15T00:00:00') AND
          in_out_of_harbor IS NULL AND on_ais_grid AND NOT on_centiminute_grid
          THEN CASE WHEN received_late THEN 1 ELSE 0 END END) < 0.01
        description: >-
          STK's AIS stream is received within the hour: under 1 % of a year file's fixes are received more than an hour
          after their posdate (0-0.23 %), the days of 2026's three backlogs left out (recdate's details); with them, 19.1
          % of 2026's. Holds on every year file of the dump of 2026-10-16: a new backlog fails it.
      - assert: posdate <= recdate + interval(1, days)
        description: >-
          A report is stamped no later than its receipt, but for a clock's error. Expected false on 6,199 rows (dump of
          2026-10-16): posdate a day or more after recdate, up to February 2106, in the year files of 2005-2017 and none
          since.
    columns:
      - name: poslat
        label: Latitude
        type: number(quantity)
        units: rad
        constraints:
          - assert: ABS(poslat) <= 1.5707963268
            description: >-
              Radians: within a quarter turn of the equator, as no latitude in degrees of the Icelandic area would be.
              Holds on every row of the dump of 2026-10-16.
        details: |
          Radians, north positive, ten decimals (Oracle declares NUMBER(14,10)), finer than a metre. In degrees: lat.
          The grid tells the stream (the table's details): a ten-thousandth of a minute (about 0.2 m) for AIS, a
          hundredth (about 18 m) for the centiminute stream, none for STK's own units.
          Evidence: R/stk_trail.R; the old dump computed degrees in Oracle the same way; data tests of 2026-10-27.
      - name: poslon
        label: Longitude
        type: number(quantity)
        units: rad
        details: |
          Radians, east positive. 2,401 values lie beyond half a turn (dump of 2026-10-16). In degrees: lon.
          Evidence: R/stk_trail.R.
      - name: speed
        label: Speed over ground
        type: number(quantity)
        units: m/s
        details: In knots, speed_kn. Evidence - R/stk_trail.R (x 3600 / 1852).
      - name: heading
        label: Heading
        type: number(quantity)
        units: rad
        constraints:
          - assert: heading < 6.28318
            description: >-
              A heading is under a full turn. Expected false on 991,213 rows (dump of 2026-10-16), all but 12 codes and
              not headings: 987,974 at 511 degrees (2007-2010 only), 2,717 at 360.0, 498 at 360.1-690.0 (65 at 409.5,
              the top of AIS's 12-bit course field) and 12 at exactly 10 rad (2006). The 12 are within 0.0002 degrees
              under 360 (2013-2026), north or the 360.0 code, which the assertion cannot tell apart.
          - assert: ABS(heading - 8.91863) > 0.00001 OR posdate < '2010-06-09T17:41:00'
            description: >-
              AIS true heading's 511 code ends with the switch to course over ground at 2010-06-09 17:40. A claim about
              form, tested on the dump of 2026-10-16.
        details: |
          Radians, nearly all in whole tenths of a degree. In degrees: heading_deg. One field holding two quantities,
          by stream and date (the streams are in the table's details):
          - AIS to 2010-06-09 17:40: true heading, in whole degrees, 511 when not available (ITU-R M.1371). In
            2006-2010 (the switch included) 7.5 % of the AIS fixes are 511, and 78 % of the values above 0 and under
            a full turn are whole degrees. Of the 1,205 mobileid-years with 200 gridded fixes (centiminute included)
            above 2 knots before the switch, 1,022 are 90 % whole degrees or more, and 128 others are 95 % 511.
          - AIS from then: course over ground. The switch is STK's, not the units': 511 is in every hour of 2010-06-09
            up to the 17:00 hour and in none after, and the last 511 of each of the 308 units that sent one falls at
            17:38-17:40 (95th percentile to latest). Matched to the same AIS message in astdB (2014-2024) and EMODnet
            (2017), 344,282 fixes of 1,791 vessels (EMODnet's missing heading is -1, astdB's 511): where that message
            had both, the STK value is its course in 18,744 of 19,735 and its heading alone in 12; where it had only a
            course, that course in 303,202 of 303,624; where only a heading, that heading in 3 of 1,888. A unit may
            send its course in whole degrees: on 12 vessel-years in the match whose STK values are 90 % whole degrees
            or more, the STK value is the message's course in 1,815 of 1,865 (that course is whole degrees in 99.8 %).
          - Centiminute: in whole degrees (99 % of the values above 0 in 2006-2010, 93-97 % later), course as VMS
            reports it; exactly 0 on 23 % of the fixes in 2006-2010 and 71-89 % from 2013.
          - No grid: course in tenths (90 % of the values above 0 in 2006-2012), exactly 0 on 42-66 %; from 2013 63-66
            % whole degrees. Neither of the last two has an outside source to test it against.
          A full turn or more is a code for "not available", not a value: 511 degrees true heading's, 360.0 course
          over ground's (3600 tenths). Exactly 0 is mostly a stationary fix's (0.0-0.4 % of the fixes above 3 knots in
          each year), and stands in for a missing course too: where the matched AIS message had no course, the STK
          value is 0 in 5,293 of 20,923.
          Evidence: R/stk_trail.R; data tests of 2026-10-27 on the dump of 2026-10-16.
        todo: >-
          Not established: what the centiminute and ungridded streams are beyond their signatures, what their course
          is beyond its resolution, a fix's AIS class, and what STK wrote in the other 15,630 fixes whose AIS message
          had no course. stk_trail() and the trail carry the field as heading, both quantities and the codes included,
          and no stream.
      - name: in_out_of_harbor
        label: Port event
        type: enum
        values:
          'I': into port
          'U': out of port
        constraints:
          - assert: in_out_of_harbor IS NULL OR in_out_of_harbor <> 'U' OR harborid IS NOT NULL OR posdate >= '2013-01-01T00:00:00'
            description: >-
              A U without a port code is the second row of a doubled U, which begins in 2013. A claim about form,
              tested on the dump of 2026-10-16.
        details: |
          Set on 13,147,352 rows (dump of 2026-10-16), empty on the fixes. A row with a code is STK's own port event
          (decision 164), read by sources/stk/event.R; harborid names the port. An event is a row of its own, not a
          flagged fix: under 0.5 % of the events of 2007-2026 share their instant with a fix of the same unit
          (centiminute U up to 24 %). It comes from the three streams (the table's details) and carries its stream's
          values: AIS events 511 on 14-23 % to the switch, course in tenths after; ungridded events of 2007-2012 the
          tenths of STK's units. From 2013 the ungridded events (1.1 M) are made by STK at a port's marker: 98.5-99.4 %
          at one of 3,351 positions used by 10 or more units, with speed and heading 0. From 2013 a U is mostly two
          rows at one instant, one with the port code and one without (45-50 % of U rows have none, 0 % before). The
          codes alternate: I -> U 3.41 M and U -> I 3.41 M against I -> I 105 thousand and U -> U 47 thousand in
          2013-2026; I -> I is 15 % of the I of 2007-2012. tilk_stk is these events with the vessel's number.
          Evidence: data tests of 2026-10-28 on the dump of 2026-10-16.
      - name: harborid
        label: STK port
        details: |
          The port code of a port event, joined to stk_hafnir; also set on 116,422 rows without an event code (dump of
          2026-10-16).
      - name: posdate
        label: Position time
        time_zone: UTC
        details: |
          Iceland's clock is UTC. stk_trail() calls it time. What it holds differs by stream (the table's details, the
          definition stream) and period: the receipt's time, recdate's to the second, or the report's own, which the
          delay of its delivery puts before it. Fixes, by year file (the year of recdate), dump of 2026-10-16:
          - AIS: equal to recdate on 87-99 % of a year file's fixes from 2007 to April 2025, and 1-2 s before it on most
            of the rest. 2009 is the exception, 61 %: posdate 2 s after recdate on most fixes of June and July, and one
            clock episode, 2009-09-14 to 2009-10-05, when 247 thousand fixes have posdate 2.8-2.9 minutes after recdate
            (49 % of September's) and the AIS stream's whack rate that September is 3.64 % against 0.10-0.90 % around
            it. Which clock was off is not established. From May 2025 equal on 25-94 % by month (65 % in May), and 1-2
            s before it on most of the rest: a change of a second or two, within a minute before receipt on 98.9-99.9 %
            of the fixes received within the hour.
          - Centiminute: to 2010 mostly the report's own time, 1-60 minutes before receipt (77 % of 2007's fixes, 52 %
            of 2010's), equal on 4-39 %; equal on 42-55 % in 2011-2014 and 75-93 % from 2015 to April 2025, the rest
            mostly 1-60 minutes before (6-22 % a year in 2015-2024). From May 2025 equal on 24-92 % by month, as the
            AIS stream.
          - No grid, STK's own units: their own time, equal to recdate on under 5 % of a year file's fixes, a median 3-5
            s before it to 2011 (48 s in 2009) and 16 s to 9 minutes from 2013.
          - The three backlogs of 2026 (recdate's details): the report's time, hours to days before receipt.
          A posdate a day or more after recdate is a broken value: 6,199 rows in the year files of 2005-2017, up to
          February 2106.
          No time-zone offset in any stream: the lags with posdate after recdate lie no nearer whole hours than chance
          (6.5 % within 2 minutes, chance 6.7 %), in summer as in winter; against ASTD at the same position (moving AIS
          fixes, 2016, 2021, 2024) 95-99 % agree within a minute and 0.18 % or fewer sit a whole hour or two off, as many
          ahead as behind.
          Evidence: data tests of 2026-10-28 on the dump of 2026-10-16; decision 233; for the time by stream and period,
          plan 059 §1 and $FISHYDATA/archive/2026-11-01-feed-clocks/ (scripts 01 and 12, 2026-11-01).
        todo: >-
          Not established: what posdate holds where it is not recdate in the AIS and centiminute streams from May 2025
          (a stamp earlier in the chain, the unit's or the network's), and which clock is off on the 30,603 rows of 2026
          stamped 1-2 hours after their receipt (recdate's details).
      - name: recdate
        label: Receipt time
        time_zone: UTC
        details: |
          The time STK received the report; the year partition is its year. Within the hour of posdate on all but 0-0.23
          % of the AIS stream's fixes of a year file from 2007, but for three backlogs in 2026, each received in a burst, of all
          three streams: on 2026-01-15, 583 thousand fixes from 2026-01-13 to 15 (a median 20 hours late); on 2026-05-11
          and 12, 2.1 million from 2026-04-30 to 05-05 (7.5 days); on 2026-10-12 to 14, 911 thousand, most from the days
          before (42 hours), some from 2025-09-09. Few repeat a fix received in time (at most 6 % in a month): they are
          first receipts, late. On the backlogs' days of January and October 30,570 rows have recdate 1-2 hours before
          posdate, and 33 on three other days of 2026 (31 on 2026-06-02); which of the two is off is not established.
          Evidence: $FISHYDATA/archive/2026-11-01-feed-clocks/ (script 12, 2026-11-01), dump of 2026-10-16.
  - name: stk_hafnir
    details: STK's ports, the code table of trail.harborid; stad_nr is the port's number elsewhere.
    columns:
      - name: harborid
        constraints: [primary_key]
relationships:
  - join: trail.harborid = stk_hafnir.harborid
    cardinality: many-to-one
    description: The port of a port event, in STK's own port table.
