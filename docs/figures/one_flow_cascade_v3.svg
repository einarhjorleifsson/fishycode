<svg xmlns="http://www.w3.org/2000/svg" width="760" height="950" viewBox="0 0 760 950" role="img">
<title>One flow, version 3: each step takes the best source it has, ping by ping, amended from the groups' reports</title>
<desc>Rows are the pipeline from vessel identity and ping flagging through trip, record, gear, fishing, effort and catch, closed by the products made from the fixes; boxes are each step's sources, best first. Dashed bands: the ping rate sets how far down a track can go; trips, landings and voyages are linked and reconciled many-to-many; records also take positions and times from the track; gear codes are mapped to one vocabulary and a trip may use several gears; catch units can be coarser than the activity. A vertical band marks validation across the rows. Version 3, 2026-10-19: version 2 amended from a reading of seven ICES reports (WGSFD 2019-2025, WGSFDGOV, WKSSFGEO, WKSSFGEO2; fishycode decision 150). Drafted by Claude (Anthropic); human review pending.</desc>
<style>
  .bg  { fill: #FFFFFF; }
  .box { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.5; }
  .band { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.5; stroke-dasharray: 4 3; }
  .th  { font-family: Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 500; fill: #444441; }
  .ts  { font-family: Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 400; fill: #5F5E5A; }
  .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="bg" x="0" y="0" width="760" height="950"/>

<!-- the vertical line: steps -->
<rect class="box" x="40" y="40" width="126" height="44" rx="6"/><text class="th" x="103" y="61" text-anchor="middle">Vessel</text><text class="ts" x="103" y="77" text-anchor="middle">assign_vessel</text>
<rect class="box" x="40" y="100" width="126" height="44" rx="6"/><text class="th" x="103" y="121" text-anchor="middle">Flag pings</text><text class="ts" x="103" y="137" text-anchor="middle">flag_pings</text>
<rect class="box" x="40" y="212" width="126" height="44" rx="6"/><text class="th" x="103" y="233" text-anchor="middle">1. Trip</text><text class="ts" x="103" y="249" text-anchor="middle">assign_trip</text>
<rect class="box" x="40" y="324" width="126" height="44" rx="6"/><text class="th" x="103" y="345" text-anchor="middle">2. Record</text><text class="ts" x="103" y="361" text-anchor="middle">assign_record</text>
<rect class="box" x="40" y="422" width="126" height="44" rx="6"/><text class="th" x="103" y="443" text-anchor="middle">3. Gear</text><text class="ts" x="103" y="459" text-anchor="middle">assign_gear</text>
<rect class="box" x="40" y="534" width="126" height="44" rx="6"/><text class="th" x="103" y="555" text-anchor="middle">4. Fishing?</text><text class="ts" x="103" y="571" text-anchor="middle">assign_fishing</text>
<rect class="box" x="40" y="594" width="126" height="44" rx="6"/><text class="th" x="103" y="615" text-anchor="middle">5. Effort</text><text class="ts" x="103" y="631" text-anchor="middle">assign_effort</text>
<rect class="box" x="40" y="654" width="126" height="44" rx="6"/><text class="th" x="103" y="675" text-anchor="middle">6. Catch</text><text class="ts" x="103" y="691" text-anchor="middle">share_catch</text>
<rect class="box" x="40" y="766" width="126" height="44" rx="6"/><text class="th" x="103" y="787" text-anchor="middle">7. Products</text><text class="ts" x="103" y="803" text-anchor="middle">from the fixes</text>

<line x1="103" y1="84" x2="103" y2="98" class="arr" marker-end="url(#arrow)"/>
<line x1="103" y1="144" x2="103" y2="210" class="arr" marker-end="url(#arrow)"/>
<line x1="103" y1="256" x2="103" y2="322" class="arr" marker-end="url(#arrow)"/>
<line x1="103" y1="368" x2="103" y2="420" class="arr" marker-end="url(#arrow)"/>
<line x1="103" y1="466" x2="103" y2="532" class="arr" marker-end="url(#arrow)"/>
<line x1="103" y1="578" x2="103" y2="592" class="arr" marker-end="url(#arrow)"/>
<line x1="103" y1="638" x2="103" y2="652" class="arr" marker-end="url(#arrow)"/>
<line x1="103" y1="698" x2="103" y2="764" class="arr" marker-end="url(#arrow)"/>

<!-- vessel: best first -->
<rect class="box" x="176" y="40" width="108" height="44" rx="6"/><text class="th" x="230" y="61" text-anchor="middle">own track</text><text class="ts" x="230" y="77" text-anchor="middle">feeds agree</text>
<rect class="box" x="292" y="40" width="108" height="44" rx="6"/><text class="th" x="346" y="61" text-anchor="middle">register</text><text class="ts" x="346" y="77" text-anchor="middle">dated MMSI</text>
<rect class="box" x="408" y="40" width="108" height="44" rx="6"/><text class="th" x="462" y="61" text-anchor="middle">logbook</text><text class="ts" x="462" y="77" text-anchor="middle">or landing</text>
<rect class="box" x="524" y="40" width="108" height="44" rx="6"/><text class="th" x="578" y="61" text-anchor="middle">continuity</text><text class="ts" x="578" y="77" text-anchor="middle">same device</text>

<!-- flag pings: in order, not a fallback -->
<rect class="box" x="176" y="100" width="100" height="44" rx="6"/><text class="th" x="226" y="121" text-anchor="middle">invalid</text><text class="ts" x="226" y="137" text-anchor="middle">placeholder</text>
<rect class="box" x="292" y="100" width="100" height="44" rx="6"/><text class="th" x="342" y="121" text-anchor="middle">duplicate</text><text class="ts" x="342" y="137" text-anchor="middle">second feed</text>
<rect class="box" x="408" y="100" width="100" height="44" rx="6"/><text class="th" x="458" y="121" text-anchor="middle">impossible</text><text class="ts" x="458" y="137" text-anchor="middle">set aside</text>
<rect class="box" x="524" y="100" width="100" height="44" rx="6"/><text class="th" x="574" y="121" text-anchor="middle">port</text><text class="ts" x="574" y="137" text-anchor="middle">in the trail</text>
<line x1="276" y1="122" x2="290" y2="122" class="arr" marker-end="url(#arrow)"/>
<line x1="392" y1="122" x2="406" y2="122" class="arr" marker-end="url(#arrow)"/>
<line x1="508" y1="122" x2="522" y2="122" class="arr" marker-end="url(#arrow)"/>
<rect class="band" x="176" y="152" width="456" height="44" rx="6"/><text class="ts" x="404" y="171" text-anchor="middle">The ping rate sets how far down a track can go: interpolate</text><text class="ts" x="404" y="188" text-anchor="middle">or downsample to a regular series; gaps and device kept</text>

<!-- trip -->
<rect class="box" x="176" y="212" width="108" height="44" rx="6"/><text class="th" x="230" y="233" text-anchor="middle">declared trip</text><text class="ts" x="230" y="249" text-anchor="middle">logbook</text>
<rect class="box" x="292" y="212" width="108" height="44" rx="6"/><text class="th" x="346" y="233" text-anchor="middle">landing</text><text class="ts" x="346" y="249" text-anchor="middle">T2, T1 if given</text>
<rect class="box" x="408" y="212" width="108" height="44" rx="6"/><text class="th" x="462" y="233" text-anchor="middle">voyage</text><text class="ts" x="462" y="249" text-anchor="middle">port stays</text>
<rect class="box" x="524" y="212" width="108" height="44" rx="6"/><text class="th" x="578" y="233" text-anchor="middle">gaps</text><text class="ts" x="578" y="249" text-anchor="middle">device power</text>
<rect class="band" x="176" y="264" width="456" height="44" rx="6"/><text class="th" x="404" y="285" text-anchor="middle">Link and reconcile T2</text><text class="ts" x="404" y="301" text-anchor="middle">many-to-many: trips, landings, voyages</text>

<!-- logbook record -->
<rect class="box" x="176" y="324" width="108" height="44" rx="6"/><text class="th" x="230" y="345" text-anchor="middle">haul</text><text class="ts" x="230" y="361" text-anchor="middle">with t1–t4</text>
<rect class="box" x="292" y="324" width="108" height="44" rx="6"/><text class="th" x="346" y="345" text-anchor="middle">haul</text><text class="ts" x="346" y="361" text-anchor="middle">with positions</text>
<rect class="box" x="408" y="324" width="108" height="44" rx="6"/><text class="th" x="462" y="345" text-anchor="middle">period</text><text class="ts" x="462" y="361" text-anchor="middle">× area</text>
<rect class="box" x="524" y="324" width="108" height="44" rx="6"/><text class="th" x="578" y="345" text-anchor="middle">trip</text><text class="ts" x="578" y="361" text-anchor="middle">one record</text>
<rect class="band" x="176" y="376" width="456" height="30" rx="6"/><text class="ts" x="404" y="395" text-anchor="middle">Two-way: records also take positions and times from the track</text>

<!-- gear -->
<rect class="box" x="176" y="422" width="108" height="44" rx="6"/><text class="th" x="230" y="443" text-anchor="middle">logbook</text><text class="ts" x="230" y="459" text-anchor="middle">record</text>
<rect class="box" x="292" y="422" width="108" height="44" rx="6"/><text class="th" x="346" y="443" text-anchor="middle">landing</text><text class="ts" x="346" y="459" text-anchor="middle">declaration</text>
<rect class="box" x="408" y="422" width="108" height="44" rx="6"/><text class="th" x="462" y="443" text-anchor="middle">licence</text><text class="ts" x="462" y="459" text-anchor="middle">gear register</text>
<rect class="box" x="524" y="422" width="108" height="44" rx="6"/><text class="th" x="578" y="443" text-anchor="middle">predicted</text><text class="ts" x="578" y="459" text-anchor="middle">from the track</text>
<rect class="band" x="176" y="474" width="456" height="44" rx="6"/><text class="ts" x="404" y="493" text-anchor="middle">Gear codes mapped to one vocabulary (FAO, DATSU, métier);</text><text class="ts" x="404" y="510" text-anchor="middle">a trip may use several gears</text>

<!-- fishing -->
<rect class="box" x="176" y="534" width="108" height="44" rx="6"/><text class="th" x="230" y="555" text-anchor="middle">haul window</text><text class="ts" x="230" y="571" text-anchor="middle">t1–t4 + speed</text>
<rect class="box" x="292" y="534" width="108" height="44" rx="6"/><text class="th" x="346" y="555" text-anchor="middle">phases</text><text class="ts" x="346" y="571" text-anchor="middle">dense track</text>
<rect class="box" x="408" y="534" width="108" height="44" rx="6"/><text class="th" x="462" y="555" text-anchor="middle">track model</text><text class="ts" x="462" y="571" text-anchor="middle">mixture, HMM</text>
<rect class="box" x="524" y="534" width="108" height="44" rx="6"/><text class="th" x="578" y="555" text-anchor="middle">speed range</text><text class="ts" x="578" y="571" text-anchor="middle">of the gear</text>

<!-- effort -->
<rect class="box" x="176" y="594" width="86" height="44" rx="6"/><text class="th" x="219" y="615" text-anchor="middle">pressure</text><text class="ts" x="219" y="631" text-anchor="middle">+ gear size</text>
<rect class="box" x="268" y="594" width="86" height="44" rx="6"/><text class="th" x="311" y="615" text-anchor="middle">static gear</text><text class="ts" x="311" y="631" text-anchor="middle">soak, hauls</text>
<rect class="box" x="360" y="594" width="86" height="44" rx="6"/><text class="th" x="403" y="615" text-anchor="middle">kW-hours</text><text class="ts" x="403" y="631" text-anchor="middle">+ engine kW</text>
<rect class="box" x="452" y="594" width="86" height="44" rx="6"/><text class="th" x="495" y="615" text-anchor="middle">hours</text><text class="ts" x="495" y="631" text-anchor="middle">pings only</text>
<rect class="box" x="544" y="594" width="88" height="44" rx="6"/><text class="th" x="588" y="615" text-anchor="middle">fishing days</text><text class="ts" x="588" y="631" text-anchor="middle">days at sea</text>

<!-- catch -->
<rect class="box" x="176" y="654" width="108" height="44" rx="6"/><text class="th" x="230" y="675" text-anchor="middle">haul</text><text class="ts" x="230" y="691" text-anchor="middle">logbook catch</text>
<rect class="box" x="292" y="654" width="108" height="44" rx="6"/><text class="th" x="346" y="675" text-anchor="middle">period × area</text><text class="ts" x="346" y="691" text-anchor="middle">logbook catch</text>
<rect class="box" x="408" y="654" width="108" height="44" rx="6"/><text class="th" x="462" y="675" text-anchor="middle">trip</text><text class="ts" x="462" y="691" text-anchor="middle">or landing</text>
<rect class="box" x="524" y="654" width="108" height="44" rx="6"/><text class="th" x="578" y="675" text-anchor="middle">several trips</text><text class="ts" x="578" y="691" text-anchor="middle">weekly landing</text>
<rect class="band" x="176" y="706" width="456" height="44" rx="6"/><text class="ts" x="404" y="725" text-anchor="middle">Catch can be coarser than the activity: each unit's catch</text><text class="ts" x="404" y="742" text-anchor="middle">is shared over the fishing pings it covers, by effort</text>

<!-- products: from the fixes -->
<rect class="box" x="176" y="766" width="108" height="44" rx="6"/><text class="th" x="230" y="787" text-anchor="middle">grid</text><text class="ts" x="230" y="803" text-anchor="middle">c-squares</text>
<rect class="box" x="292" y="766" width="108" height="44" rx="6"/><text class="th" x="346" y="787" text-anchor="middle">data call</text><text class="ts" x="346" y="803" text-anchor="middle">delivery</text>
<rect class="box" x="408" y="766" width="108" height="44" rx="6"/><text class="th" x="462" y="787" text-anchor="middle">quality</text><text class="ts" x="462" y="803" text-anchor="middle">of submissions</text>

<!-- validation: across the rows -->
<rect class="band" x="648" y="212" width="64" height="538" rx="6"/>
<text class="th" x="674" y="481" text-anchor="middle" transform="rotate(-90 674 481)">Validate each answer</text>
<text class="ts" x="692" y="481" text-anchor="middle" transform="rotate(-90 692 481)">labelled tracks · observers · EM · gear sensors</text>

<!-- bottom bar -->
<rect class="box" x="40" y="826" width="672" height="90" rx="6"/>
<text class="th" x="376" y="850" text-anchor="middle">Every ping is accounted for: impossible ones are set aside</text>
<text class="ts" x="376" y="869" text-anchor="middle">all others stay in the trail, labelled with each step's result and its basis</text>
<text class="ts" x="376" y="887" text-anchor="middle">basis: recorded · derived · reconstructed · synthesised · none (no source left)</text>
<text class="ts" x="376" y="905" text-anchor="middle">ambiguity kept as counts (n_records, n_trips)</text>
</svg>
