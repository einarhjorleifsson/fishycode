<rect class="box s-ramb" x="176" y="594" width="86" height="44" rx="6"/><text class="th" x="219" y="615" text-anchor="middle">pressure</text><text class="ts" x="219" y="631" text-anchor="middle">+ gear size</text>
<rect class="box s-plan" x="268" y="594" width="86" height="44" rx="6"/><text class="th" x="311" y="615" text-anchor="middle">static gear</text><text class="ts" x="311" y="631" text-anchor="middle">soak, hauls</text>
<rect class="box s-ramb" x="360" y="594" width="86" height="44" rx="6"/><text class="th" x="403" y="615" text-anchor="middle">kW-hours</text><text class="ts" x="403" y="631" text-anchor="middle">+ engine kW</text><circle class="dot" cx="439" cy="601" r="3.5"/>
<rect class="box s-ramb" x="452" y="594" width="86" height="44" rx="6"/><text class="th" x="495" y="615" text-anchor="middle">hours</text><text class="ts" x="495" y="631" text-anchor="middle">pings only</text><circle class="dot" cx="531" cy="601" r="3.5"/>
<rect class="box s-none" x="544" y="594" width="88" height="44" rx="6"/><text class="th" x="588" y="615" text-anchor="middle">fishing days</text><text class="ts" x="588" y="631" text-anchor="middle">days at sea</text>

<!-- catch -->
<rect class="box s-ramb" x="176" y="654" width="108" height="44" rx="6"/><text class="th" x="230" y="675" text-anchor="middle">haul</text><text class="ts" x="230" y="691" text-anchor="middle">logbook catch</text><circle class="dot" cx="277" cy="661" r="3.5"/>
<rect class="box s-ramb" x="292" y="654" width="108" height="44" rx="6"/><text class="th" x="346" y="675" text-anchor="middle">period × area</text><text class="ts" x="346" y="691" text-anchor="middle">logbook catch</text><circle class="dot" cx="393" cy="661" r="3.5"/>
<rect class="box s-ramb" x="408" y="654" width="108" height="44" rx="6"/><text class="th" x="462" y="675" text-anchor="middle">trip</text><text class="ts" x="462" y="691" text-anchor="middle">or landing</text><circle class="dot" cx="509" cy="661" r="3.5"/>
<rect class="box s-plan" x="524" y="654" width="108" height="44" rx="6"/><text class="th" x="578" y="675" text-anchor="middle">several trips</text><text class="ts" x="578" y="691" text-anchor="middle">weekly landing</text>
<rect class="band s-ramb" x="176" y="706" width="456" height="44" rx="6"/><text class="ts" x="404" y="725" text-anchor="middle">Catch can be coarser than the activity: each unit's catch</text><text class="ts" x="404" y="742" text-anchor="middle">is shared over the fishing pings it covers, by effort</text><circle class="dot" cx="625" cy="713" r="3.5"/>
<rect class="box s-plan" x="728" y="654" width="232" height="44" rx="6"/><text class="rs" x="844" y="673" text-anchor="middle">every kilogram in a catch unit (191)</text><text class="rs" x="844" y="689" text-anchor="middle">transfer trips' excess apart (199)</text>

