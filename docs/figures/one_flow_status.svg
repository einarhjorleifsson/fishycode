<svg xmlns="http://www.w3.org/2000/svg" width="680" height="840" viewBox="0 0 680 840" role="img">
<title>One flow: who has each piece (2026-10-09)</title>
<desc>Rows are the pipeline from vessel identity and ping flagging through trip, record, gear, fishing, effort and catch; boxes are each step's sources, best first. A dashed band under trip links and reconciles sources many-to-many; a dashed band under record notes the two-way flow; a dashed band under catch states that catch units can be coarser than the activity. Version 2, 2026-10-08, drafted by Claude (Anthropic); human review pending.</desc>
<style>
  .bg  { fill: #FFFFFF; }
  .box { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.5; }
  .band { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.5; stroke-dasharray: 4 3; }
  .th  { font-family: Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 500; fill: #444441; }
  .ts  { font-family: Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 400; fill: #5F5E5A; }
  .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
  .s-ramb  { fill: #DCEBD5; stroke: #4F7A43; }
  .s-fishy { fill: #D7E5F2; stroke: #3E6A8C; }
  .s-plan  { fill: #F7E6C4; stroke: #9A6B22; }
  .s-else  { fill: #EDEDEA; stroke: #8A8984; stroke-dasharray: 3 2; }
  .s-none  { fill: #FFFFFF; stroke: #8A8984; stroke-dasharray: 3 2; }
  .lg  { font-family: Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #444441; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="bg" x="0" y="0" width="680" height="840"/>

<!-- the vertical line: steps -->
<rect class="box" x="40" y="40" width="126" height="44" rx="6"/><text class="th" x="103" y="61" text-anchor="middle">Vessel</text><text class="ts" x="103" y="77" text-anchor="middle">assign_vessel</text>
<rect class="box" x="40" y="100" width="126" height="44" rx="6"/><text class="th" x="103" y="121" text-anchor="middle">Flag pings</text><text class="ts" x="103" y="137" text-anchor="middle">flag_pings</text>
<rect class="box" x="40" y="160" width="126" height="44" rx="6"/><text class="th" x="103" y="181" text-anchor="middle">1. Trip</text><text class="ts" x="103" y="197" text-anchor="middle">assign_trip</text>
<rect class="box" x="40" y="272" width="126" height="44" rx="6"/><text class="th" x="103" y="293" text-anchor="middle">2. Record</text><text class="ts" x="103" y="309" text-anchor="middle">assign_record</text>
<rect class="box" x="40" y="370" width="126" height="44" rx="6"/><text class="th" x="103" y="391" text-anchor="middle">3. Gear</text><text class="ts" x="103" y="407" text-anchor="middle">assign_gear</text>
<rect class="box" x="40" y="430" width="126" height="44" rx="6"/><text class="th" x="103" y="451" text-anchor="middle">4. Fishing?</text><text class="ts" x="103" y="467" text-anchor="middle">assign_fishing</text>
<rect class="box" x="40" y="490" width="126" height="44" rx="6"/><text class="th" x="103" y="511" text-anchor="middle">5. Effort</text><text class="ts" x="103" y="527" text-anchor="middle">assign_effort</text>
<rect class="box" x="40" y="550" width="126" height="44" rx="6"/><text class="th" x="103" y="571" text-anchor="middle">6. Catch</text><text class="ts" x="103" y="587" text-anchor="middle">share_catch</text>

<line x1="103" y1="84" x2="103" y2="98" class="arr" marker-end="url(#arrow)"/>
<line x1="103" y1="144" x2="103" y2="158" class="arr" marker-end="url(#arrow)"/>
<line x1="103" y1="204" x2="103" y2="270" class="arr" marker-end="url(#arrow)"/>
<line x1="103" y1="316" x2="103" y2="368" class="arr" marker-end="url(#arrow)"/>
<line x1="103" y1="414" x2="103" y2="428" class="arr" marker-end="url(#arrow)"/>
<line x1="103" y1="474" x2="103" y2="488" class="arr" marker-end="url(#arrow)"/>
<line x1="103" y1="534" x2="103" y2="548" class="arr" marker-end="url(#arrow)"/>

<!-- vessel: best first -->
<rect class="box s-fishy" x="176" y="40" width="108" height="44" rx="6"/><text class="th" x="230" y="61" text-anchor="middle">own track</text><text class="ts" x="230" y="77" text-anchor="middle">feeds agree</text>
<rect class="box s-fishy" x="292" y="40" width="108" height="44" rx="6"/><text class="th" x="346" y="61" text-anchor="middle">register</text><text class="ts" x="346" y="77" text-anchor="middle">dated MMSI</text>
<rect class="box s-fishy" x="408" y="40" width="108" height="44" rx="6"/><text class="th" x="462" y="61" text-anchor="middle">logbook</text><text class="ts" x="462" y="77" text-anchor="middle">or landing</text>
<rect class="box s-fishy" x="524" y="40" width="108" height="44" rx="6"/><text class="th" x="578" y="61" text-anchor="middle">continuity</text><text class="ts" x="578" y="77" text-anchor="middle">same device</text>

<!-- flag pings: in order, not a fallback -->
<rect class="box s-ramb" x="176" y="100" width="100" height="44" rx="6"/><text class="th" x="226" y="121" text-anchor="middle">invalid</text><text class="ts" x="226" y="137" text-anchor="middle">placeholder</text>
<rect class="box s-ramb" x="292" y="100" width="100" height="44" rx="6"/><text class="th" x="342" y="121" text-anchor="middle">duplicate</text><text class="ts" x="342" y="137" text-anchor="middle">second feed</text>
<rect class="box s-ramb" x="408" y="100" width="100" height="44" rx="6"/><text class="th" x="458" y="121" text-anchor="middle">impossible</text><text class="ts" x="458" y="137" text-anchor="middle">set aside</text>
<rect class="box s-ramb" x="524" y="100" width="100" height="44" rx="6"/><text class="th" x="574" y="121" text-anchor="middle">port</text><text class="ts" x="574" y="137" text-anchor="middle">in the trail</text>
<line x1="276" y1="122" x2="290" y2="122" class="arr" marker-end="url(#arrow)"/>
<line x1="392" y1="122" x2="406" y2="122" class="arr" marker-end="url(#arrow)"/>
<line x1="508" y1="122" x2="522" y2="122" class="arr" marker-end="url(#arrow)"/>

<!-- trip -->
<rect class="box s-ramb" x="176" y="160" width="108" height="44" rx="6"/><text class="th" x="230" y="181" text-anchor="middle">declared trip</text><text class="ts" x="230" y="197" text-anchor="middle">logbook</text>
<rect class="box s-fishy" x="292" y="160" width="108" height="44" rx="6"/><text class="th" x="346" y="181" text-anchor="middle">landing</text><text class="ts" x="346" y="197" text-anchor="middle">T2, T1 if given</text>
<rect class="box s-ramb" x="408" y="160" width="108" height="44" rx="6"/><text class="th" x="462" y="181" text-anchor="middle">voyage</text><text class="ts" x="462" y="197" text-anchor="middle">port stays</text>
<rect class="band s-plan" x="176" y="212" width="340" height="44" rx="6"/><text class="th" x="346" y="233" text-anchor="middle">Link and reconcile T2</text><text class="ts" x="346" y="249" text-anchor="middle">many-to-many: trips, landings, voyages</text>

<!-- logbook record -->
<rect class="box s-ramb" x="176" y="272" width="108" height="44" rx="6"/><text class="th" x="230" y="293" text-anchor="middle">haul</text><text class="ts" x="230" y="309" text-anchor="middle">with t1–t4</text>
<rect class="box s-else" x="292" y="272" width="108" height="44" rx="6"/><text class="th" x="346" y="293" text-anchor="middle">haul</text><text class="ts" x="346" y="309" text-anchor="middle">with positions</text>
<rect class="box s-ramb" x="408" y="272" width="108" height="44" rx="6"/><text class="th" x="462" y="293" text-anchor="middle">period</text><text class="ts" x="462" y="309" text-anchor="middle">× area</text>
<rect class="box s-else" x="524" y="272" width="108" height="44" rx="6"/><text class="th" x="578" y="293" text-anchor="middle">trip</text><text class="ts" x="578" y="309" text-anchor="middle">one record</text>
<rect class="band s-fishy" x="176" y="324" width="456" height="30" rx="6"/><text class="ts" x="404" y="343" text-anchor="middle">Two-way: records also take positions and times from the track</text>

<!-- gear -->
<rect class="box s-fishy" x="176" y="370" width="108" height="44" rx="6"/><text class="th" x="230" y="391" text-anchor="middle">logbook</text><text class="ts" x="230" y="407" text-anchor="middle">record</text>
<rect class="box s-fishy" x="292" y="370" width="108" height="44" rx="6"/><text class="th" x="346" y="391" text-anchor="middle">landing</text><text class="ts" x="346" y="407" text-anchor="middle">declaration</text>
<rect class="box s-none" x="408" y="370" width="108" height="44" rx="6"/><text class="th" x="462" y="391" text-anchor="middle">licence</text><text class="ts" x="462" y="407" text-anchor="middle">gear register</text>
<rect class="box s-else" x="524" y="370" width="108" height="44" rx="6"/><text class="th" x="578" y="391" text-anchor="middle">predicted</text><text class="ts" x="578" y="407" text-anchor="middle">from the track</text>

<!-- fishing -->
<rect class="box s-ramb" x="176" y="430" width="108" height="44" rx="6"/><text class="th" x="230" y="451" text-anchor="middle">haul window</text><text class="ts" x="230" y="467" text-anchor="middle">t1–t4 + speed</text>
<rect class="box s-else" x="292" y="430" width="108" height="44" rx="6"/><text class="th" x="346" y="451" text-anchor="middle">phases</text><text class="ts" x="346" y="467" text-anchor="middle">dense track</text>
<rect class="box s-plan" x="408" y="430" width="108" height="44" rx="6"/><text class="th" x="462" y="451" text-anchor="middle">track model</text><text class="ts" x="462" y="467" text-anchor="middle">mixture, HMM</text>
<rect class="box s-plan" x="524" y="430" width="108" height="44" rx="6"/><text class="th" x="578" y="451" text-anchor="middle">speed range</text><text class="ts" x="578" y="467" text-anchor="middle">of the gear</text>

<!-- effort -->
<rect class="box s-plan" x="176" y="490" width="108" height="44" rx="6"/><text class="th" x="230" y="511" text-anchor="middle">pressure</text><text class="ts" x="230" y="527" text-anchor="middle">+ gear size</text>
<rect class="box s-plan" x="292" y="490" width="108" height="44" rx="6"/><text class="th" x="346" y="511" text-anchor="middle">kW-hours</text><text class="ts" x="346" y="527" text-anchor="middle">+ engine kW</text>
<rect class="box s-plan" x="408" y="490" width="108" height="44" rx="6"/><text class="th" x="462" y="511" text-anchor="middle">hours</text><text class="ts" x="462" y="527" text-anchor="middle">pings only</text>

<!-- catch -->
<rect class="box s-fishy" x="176" y="550" width="108" height="44" rx="6"/><text class="th" x="230" y="571" text-anchor="middle">haul</text><text class="ts" x="230" y="587" text-anchor="middle">logbook catch</text>
<rect class="box s-plan" x="292" y="550" width="108" height="44" rx="6"/><text class="th" x="346" y="571" text-anchor="middle">period × area</text><text class="ts" x="346" y="587" text-anchor="middle">logbook catch</text>
<rect class="box s-plan" x="408" y="550" width="108" height="44" rx="6"/><text class="th" x="462" y="571" text-anchor="middle">trip</text><text class="ts" x="462" y="587" text-anchor="middle">or landing</text>
<rect class="box s-plan" x="524" y="550" width="108" height="44" rx="6"/><text class="th" x="578" y="571" text-anchor="middle">several trips</text><text class="ts" x="578" y="587" text-anchor="middle">weekly landing</text>
<rect class="band s-plan" x="176" y="602" width="456" height="44" rx="6"/><text class="ts" x="404" y="621" text-anchor="middle">Catch can be coarser than the activity: each unit's catch</text><text class="ts" x="404" y="638" text-anchor="middle">is shared over the fishing pings it covers, by effort</text>

<!-- bottom bar -->
<rect class="box" x="40" y="662" width="592" height="90" rx="6"/>
<text class="th" x="336" y="686" text-anchor="middle">Every ping is accounted for: impossible ones are set aside</text>
<text class="ts" x="336" y="705" text-anchor="middle">all others stay in the trail, labelled with each step's result and its basis</text>
<text class="ts" x="336" y="723" text-anchor="middle">basis: recorded · derived · reconstructed · synthesised · none (no source left)</text>
<text class="ts" x="336" y="741" text-anchor="middle">ambiguity kept as counts (n_records, n_trips)</text>
<!-- legend -->
<rect class="box s-ramb" x="40" y="800" width="16" height="14" rx="3"/><text class="lg" x="62" y="811">built in ramb</text>
<rect class="box s-fishy" x="152" y="800" width="16" height="14" rx="3"/><text class="lg" x="174" y="811">built in fishycode only</text>
<rect class="box s-plan" x="318" y="800" width="16" height="14" rx="3"/><text class="lg" x="340" y="811">planned in ramb</text>
<rect class="box s-else" x="446" y="800" width="16" height="14" rx="3"/><text class="lg" x="468" y="811">elsewhere only</text>
<rect class="box s-none" x="566" y="800" width="16" height="14" rx="3"/><text class="lg" x="588" y="811">nowhere</text>
</svg>
