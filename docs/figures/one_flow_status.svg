<rect class="box s-else" x="408" y="766" width="108" height="44" rx="6"/><text class="th" x="462" y="787" text-anchor="middle">quality</text><text class="ts" x="462" y="803" text-anchor="middle">of submissions</text>
<rect class="box s-ramb" x="524" y="766" width="108" height="44" rx="6"/><text class="th" x="578" y="787" text-anchor="middle">map viewer</text><text class="ts" x="578" y="803" text-anchor="middle">rb_map</text><circle class="dot" cx="625" cy="773" r="3.5"/>
<rect class="box s-plan" x="728" y="766" width="232" height="44" rx="6"/><text class="rs" x="844" y="785" text-anchor="middle">the data call from the curated</text><text class="rs" x="844" y="801" text-anchor="middle">catch and kW (202)</text>

<!-- validation: across the rows -->
<rect class="band s-fishy" x="648" y="212" width="64" height="538" rx="6"/><circle class="dot" cx="705" cy="219" r="3.5"/>
<text class="th" x="674" y="481" text-anchor="middle" transform="rotate(-90 674 481)">Validate each answer</text>
<text class="ts" x="692" y="481" text-anchor="middle" transform="rotate(-90 692 481)">allocation audit · fates · survey tows · flags</text>

<!-- bottom bar -->
<rect class="box" x="40" y="826" width="920" height="90" rx="6"/>
<text class="th" x="500" y="850" text-anchor="middle">Every ping is accounted for: impossible ones are set aside</text>
<text class="ts" x="500" y="869" text-anchor="middle">all others stay in the trail, labelled with each step's result and its basis</text>
<text class="ts" x="500" y="887" text-anchor="middle">basis: recorded · derived · reconstructed · synthesised · none (no source left)</text>
<text class="ts" x="500" y="905" text-anchor="middle">ambiguity kept as counts (n_records, n_trips)</text>

<!-- legend -->
<rect class="box s-ramb" x="40" y="932" width="16" height="14" rx="3"/><text class="lg" x="62" y="943">built in ramb or fishymodel</text>
<rect class="box s-fishy" x="236" y="932" width="16" height="14" rx="3"/><text class="lg" x="258" y="943">built in fishycode only</text>
