<rect class="box s-fishy" x="176" y="422" width="108" height="44" rx="6"/><text class="th" x="230" y="443" text-anchor="middle">logbook</text><text class="ts" x="230" y="459" text-anchor="middle">record</text><circle class="dot" cx="277" cy="429" r="3.5"/>
<rect class="box s-fishy" x="292" y="422" width="108" height="44" rx="6"/><text class="th" x="346" y="443" text-anchor="middle">landing</text><text class="ts" x="346" y="459" text-anchor="middle">declaration</text><circle class="dot" cx="393" cy="429" r="3.5"/>
<rect class="box s-plan" x="408" y="422" width="108" height="44" rx="6"/><text class="th" x="462" y="443" text-anchor="middle">licence</text><text class="ts" x="462" y="459" text-anchor="middle">gear register</text>
<rect class="box s-else" x="524" y="422" width="108" height="44" rx="6"/><text class="th" x="578" y="443" text-anchor="middle">predicted</text><text class="ts" x="578" y="459" text-anchor="middle">from the track</text>
<rect class="band s-ramb" x="176" y="474" width="456" height="44" rx="6"/><text class="ts" x="404" y="493" text-anchor="middle">Gear codes mapped to one vocabulary (FAO, DATSU, métier);</text><text class="ts" x="404" y="510" text-anchor="middle">a trip may use several gears</text>
