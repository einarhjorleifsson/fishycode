<rect class="box s-ramb" x="176" y="534" width="108" height="44" rx="6"/><text class="th" x="230" y="555" text-anchor="middle">haul window</text><text class="ts" x="230" y="571" text-anchor="middle">t1–t4 + speed</text><circle class="dot" cx="277" cy="541" r="3.5"/>
<rect class="box s-ramb" x="292" y="534" width="108" height="44" rx="6"/><text class="th" x="346" y="555" text-anchor="middle">phases</text><text class="ts" x="346" y="571" text-anchor="middle">dense track</text>
<rect class="box s-ramb" x="408" y="534" width="108" height="44" rx="6"/><text class="th" x="462" y="555" text-anchor="middle">track model</text><text class="ts" x="462" y="571" text-anchor="middle">mixture, HMM</text>
<rect class="box s-ramb" x="524" y="534" width="108" height="44" rx="6"/><text class="th" x="578" y="555" text-anchor="middle">speed range</text><text class="ts" x="578" y="571" text-anchor="middle">of the gear</text><circle class="dot" cx="625" cy="541" r="3.5"/>
<rect class="box s-plan" x="728" y="534" width="232" height="44" rx="6"/><text class="rs" x="844" y="553" text-anchor="middle">no record: undecided (200)</text><text class="rs" x="844" y="569" text-anchor="middle">soak drift is not fishing (198)</text>

