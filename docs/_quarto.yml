# The book of plan 033. Its main part is one chapter per row of the flow diagram, each with a section per box
# (the horizontal elements), as skeletons first (maintainer, 2026-10-20). Cases use ramb's example data; the
# Icelandic data are all in the appendices. A book renders only its listed chapters; notes_duckdbfs-vs-duckspatial.md
# is a seed for the tools chapter, not one.
project:
  type: book
  pre-render: fetch_figures.R   # the book's images, from $FISHYDATA

book:
  title: "From pings to effort and catch"
  subtitle: "Spatial fisheries data with ramb"
  site-url: https://heima.hafro.is/~einarhj/fishybook
  repo-url: https://github.com/einarhjorleifsson/fishycode
  chapters:
    - index.qmd
    - part: "At sea"
      chapters:
        - at_sea.qmd
        - one_flow.qmd
    - part: "The flow, row by row"
      chapters:
        - flow_vessel.qmd
        - flow_pings.qmd
        - flow_trip.qmd
        - flow_record.qmd
        - flow_gear.qmd
        - flow_fishing.qmd
        - flow_effort.qmd
        - flow_catch.qmd
        - flow_products.qmd
        - flow_validation.qmd
    - part: "The groups"
      chapters:
        - wkssfgeo.qmd
  appendices:
    - grammar.qmd
    # the Icelandic data: sources
    - afli-tables.qmd
    - source-schemas.md
    - grammar_logbooks.qmd
    - skipaskra.qmd
    - stk_data-inspection.qmd
    - on_ais.qmd
    - ports.md
    # the Icelandic data: building the data
    - pipeline.qmd
    - merge.qmd
    - afli-backentry.qmd
    - landings-match.qmd
    - landings_match2.qmd
    - ais_trail.qmd
    - output-schema.md
    # the Icelandic data: defects and corrections
    - wacky-tracks_recovery.qmd
    - afli-dropped-stations.qmd
    - qc_fs_afladagbok_2025.qmd
    - convert-bugs.qmd
    # the Icelandic data: how they are used
    - datacall-strategy.qmd

format:
  html:
    theme: flatly
    css: styles.css
    toc: true
    toc-depth: 3
    message: false
    warning: false
    echo: true
    code-fold: true

execute:
  freeze: auto  # re-render only when source changes
