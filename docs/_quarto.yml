# The book of plan 033. A chapter is listed here only once its text exists (plan 033 §8), so the
# parts hold the pages written so far: the part "The flow, row by row" has none yet. A book renders
# only its listed chapters; notes_duckdbfs-vs-duckspatial.md is a seed (§4, chapter 5), not one.
project:
  type: book

book:
  title: "From pings to effort and catch"
  subtitle: "Spatial fisheries data with ramb"
  site-url: https://heima.hafro.is/~einarhj/fishybook
  repo-url: https://github.com/einarhjorleifsson/fishycode
  chapters:
    - index.qmd
    - part: "At sea"
      chapters:
        - at_sea.qmd
        - one_flow.qmd
    - part: "The groups"
      chapters:
        - wkssfgeo.qmd
    - part: "Background: the Icelandic data"
      chapters:
        # sources
        - afli-tables.qmd
        - source-schemas.md
        - grammar_logbooks.qmd
        - skipaskra.qmd
        - stk_data-inspection.qmd
        - on_ais.qmd
        - ports.md
        # building the data
        - pipeline.qmd
        - merge.qmd
        - afli-backentry.qmd
        - landings-match.qmd
        - landings_match2.qmd
        - ais_trail.qmd
        - output-schema.md
        # defects and corrections
        - wacky-tracks_recovery.qmd
        - afli-dropped-stations.qmd
        - qc_fs_afladagbok_2025.qmd
        - convert-bugs.qmd
        # how the data are used
        - datacall-strategy.qmd
  appendices:
    - grammar.qmd

format:
  html:
    theme: flatly
    css: styles.css
    toc: true
    toc-depth: 3
    message: false
    warning: false
    echo: true
    code-fold: true

execute:
  freeze: auto  # re-render only when source changes
