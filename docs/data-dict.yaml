$version: 0.1.0
$learn_more: https://data-dict.tidyverse.org/

name: fishydata
description: >
  Icelandic logbook, landings and AIS data, cross-checked and corrected against
  each other. `curated/` is the sweep an analyst opens directly — see
  `AGENTS.md` in `fishycode` for the pipeline that builds it.
details: >
  Drafted 2026-09-25 with `data-dict draft` from the parquet files under
  `curated/` (one representative file per year-partitioned table — `ais/ping`,
  `logbook/sensor_gps` are also Hive-partitioned by `year` on disk, so the
  `range`/`examples` on their columns, `year` included, reflect one year's
  file, not the whole table). Every table and column `description` was then
  filled in the same day, grounded in the scripts/docs/decisions that produce
  each table — never guessed from a column name alone; a column left
  ungrounded after checking says so explicitly rather than fabricating one
  (see `reference_port.hafnarnumer_id`, `reference_port_code.hid_new`). See
  `curate/decisions/029-data-dict-introduced.md` in `fishycode` for what's
  still open: `constraints`/`examples` refinement, and expect this file to
  keep changing as descriptions get corrected — see decision 028's `.sid`
  reasoning-correction for what that looks like in practice.

  Three tables (`link_trip_voyage`, `logbook_catch_by_species_trip`,
  `landing_catch`) briefly reflected the pre-rename schema from
  `curate/decisions/028-join-key-naming-aligned.md`; rebuilt and redrafted
  2026-09-25 — see `curate/decisions/029-data-dict-introduced.md`, "The
  three tables mid-rename — rebuilt 2026-09-25".

  `landing_catch`/`landing_landings`' `.tid` was renamed `.tid_land` the same
  day (`curate/plans/006-trip-identity-and-catch-to-ais-pings.md` §1) — `.tid`
  bare is reserved for the logbook's own trip id, never another system's;
  landings' synthetic trip key needed its own name from the start, the way
  `.sid` did for species vs station.

  2026-09-26: `.tid_land` renamed again, to `.lid` (`curate/plans/
  007-landings-merge-agf-lods.md` §3) — landings is merged from two source
  systems (`agf`, `lods`) as of this same change, and `.lid` reuses landings'
  own already-reserved name rather than keeping a second one for a grain that
  no longer exists in the curated table after the collapse. See plan 007 for
  the fuller story, including a real key-recycling defect (`lods`'s raw
  record id, `komunr`) found and fixed while building it.

  2026-10-15: the tables and columns of decisions 099-104 added by Claude
  (AI-assisted), from their scripts' heads, the decisions and the data
  (`ais_catch`, `ais_voyage_gear`, the three checks, and the trail's effort,
  fishing-flow and voyage-gear columns); TODO 51.

  2026-10-21: the ten columns of the curated logbook tables the file lacked added
  by Claude (AI-assisted), from the scripts that make them and the schema of the
  build at de25239: trip T1_basis, T2_basis (curate/aflaskeyti_trip.R); station
  lat1_raw, lat2_raw (curate/corrections/aflaskeyti_coordinates.R);
  fishing_sample target (the gear mapping), t_shift_min, time_basis
  (curate/corrections/aflaskeyti_local_time.R); catch condition, catch_whole (the
  adapters) and condition_basis (curate/corrections/aflaskeyti_weight.R). The four
  tables' descriptions now name aflaskeyti (plan 026), and logbook_catch's grain is
  (station, species, condition).

  2026-10-21: the six tables of afli's sent layer (staging/afli_sent, plan 037)
  added by Claude (AI-assisted), from sources/afli_sent/convert.R and a scratch
  build of it (ranges and examples from that build; the store holds none until the
  afli_sent target is built). The first staging tables here: nothing in curated/
  carries the sent layer yet, and its consumers (curate/, plan 037 phase 2) need
  its columns written down first.

  2026-10-23: brought up to the data-dict 0.0.3 spec by Claude (AI-assisted), not
  checked by a person (TODO 51, decision 188). Plan 016's tables added
  (`vessel_mmsi`, `vessel_year`, `vessel_class`, `vessel_sign`), with the columns
  the files had gained; the missing `examples` and `range` were filled from each
  table's file; a partitioned table's are from its one representative file. The
  examples hold no person's name, address or kennitala: such columns are
  `display: restricted`, with made-up examples. `validate-spec` passes with no
  error. `validate-meta` reports 17 errors, all one cause: every DATE column in
  these files is written by DuckDB without a Parquet LogicalType, and data-dict
  0.0.3 reads it as `number`. Those columns stay `date`, which is what every other
  reader sees (curate/issues/data-dict.yml). The landing tables' `date` columns
  are still `number` with day counts from the first draft (decision 029).

  2026-10-23: `logbook_station_note` and the four staging note tables added by Claude
  (AI-assisted), not checked by a person (decision 213).

  2026-10-23: `logbook_station_fate` and `logbook_trip_fate` added by Claude
  (AI-assisted), not checked by a person, from curate/logbook.R and a scratch
  build of it (plan 024, TODO 79; ranges and examples from that build, since the
  store holds neither until the logbook is rebuilt).

tables:
  - name: ais_voyage
    source:
      parquet: ../../fishydata/curated/ais/voyage.parquet
    description: >
      One row per port-to-port voyage, one vessel at a time: contiguous sea
      time bracketed by two port calls (curated/ais/port_call: at least 2 h at a
      port by elapsed time, from any provider, decision 074; a shorter call is part of the
      voyage). Built in curate/ais_voyage.R from the cleaned, merged AIS/GPS track
      (staging/ais/ping_clean). Until 2026-10-01 a stay was the span of the pings
      in a polygon run and day trips merged into year-long voyages (decision 061).
      Trips with fewer than 10 pings are dropped. Numbered 1..n per vessel per
      year (`voyage_id`; `voyage` until decision 149); a voyage spanning New Year is split at the boundary.
    todo: |
      - Record a `primary_key`, if present.
    columns:
      - name: vid
        type: number
        range: [-7830, 9853]
        examples: [162, 2325, 4283, 7007, 7882]
        description: >
          Vessel identifier.
        todo: |
          - Pick a more specific numeric type, and keep whichever of `range` and
            `examples` is appropriate.
          - Specify `constraints`. Some options suggested by the data:
            - constraints: [required] # all values present
      - name: year
        type: number
        range: [2007, 2026]
        examples: [2007, 2012, 2017, 2021, 2026]
        description: >
          Calendar year the voyage falls in (trips are numbered per vessel per year; a
          voyage spanning New Year is split at the boundary).
        todo: |
          - Pick a more specific numeric type, and keep whichever of `range` and
            `examples` is appropriate.
          - Specify `constraints`. Some options suggested by the data:
            - constraints: [required] # all values present
      - name: voyage_id
        type: number
        range: [1, 463]
        examples: [4, 143, 243, 338, 463]
        description: >
          Voyage number, 1..n per vessel per year.
        todo: |
          - Pick a more specific numeric type, and keep whichever of `range` and
            `examples` is appropriate.
          - Specify `constraints`. Some options suggested by the data:
            - constraints: [required] # all values present
      - name: T1
        type: datetime
        time_zone: UTC
        range: [2007-06-01T00:00:44, 2026-04-27T09:57:54]
        description: >
          Voyage start: the vessel leaves harbour (trip-level time, uppercase per
          curate/decisions/010-time-variable-naming.md).
        todo: |
          - Specify `constraints`. Some options suggested by the data (distinct
            count is approximate):
            - constraints: [required, unique] # values look distinct & present
            - constraints: [primary_key] # values look distinct & present
            - constraints: [required] # all values present
      - name: T2
        type: datetime
        time_zone: UTC
        range: [2007-06-01T03:26:45, 2026-04-27T12:26:14]
        description: >
          Voyage end: the vessel returns to harbour.
        todo: |
          - Specify `constraints`. Some options suggested by the data (distinct
            count is approximate):
            - constraints: [required, unique] # values look distinct & present
            - constraints: [primary_key] # values look distinct & present
            - constraints: [required] # all values present
      - name: pid1
        type: string
        examples: [FO-ANI, IS-BOA, IS-HOF, IS-PUR, IS-VPN]
        description: >
          Departure port: the port id (pid) of the port call before the voyage. An AIS table has no
          `hid`, which is a source's own code (plan 014).
      - name: pid2
        type: string
        examples: [FO-ANI, IS-BOL, IS-HOF, IS-RAU, IS-VPN]
        description: >
          Arrival port: the port id (pid) of the port call after the voyage.
      - name: n_pings
        type: number
        range: [10, 183785]
        examples: [103, 2204, 4552, 7358, 43679]
        description: >
          Number of AIS/GPS position fixes making up this voyage.
        todo: |
          - Pick a more specific numeric type, and keep whichever of `range` and
            `examples` is appropriate.
          - Specify `constraints`. Some options suggested by the data:
            - constraints: [required] # all values present
  - name: ais_ping
    source:
      parquet: ../../fishydata/curated/ais/ping/year=2023/part_001.parquet
    description: >
      One row per AIS/GPS position fix, across every measured source (STK, ASTD,
      ASTDB, EmodNet) unioned and cleaned. Hive-partitioned by year. Each ping
      carries the harbour it falls inside (`pid`, NA at sea) and, once ais_voyage.R
      has run, the voyage it belongs to (`trip`). ASTD (`provider` astd) carries only
      vessels with an IMO number in 2026-02 to 2026-06, so small vessels have no ASTD
      fixes in those months (curate/corrections/astd_2026_imo_only.yml).
    todo: |
      - Record a `primary_key`, if present.
      - `curated/ais/ping/` is also Hive-partitioned by `year` on disk
        (2007-2026, one directory per year). This draft was profiled from a
        single 2023 partition file, so the `range`/`examples` below (including
        on `year` itself) reflect one year, not the whole table.
    columns:
      - name: vid
        type: number
        range: [1136, 3037]
        examples: [1136, 1977, 2740, 2912, 3037]
        description: >
          Vessel identifier.
        todo: |
          - Pick a more specific numeric type, and keep whichever of `range` and
            `examples` is appropriate.
          - Specify `constraints`. Some options suggested by the data:
            - constraints: [required] # all values present
      - name: mmsi
        type: string
        examples:
          - "251006110"
          - "251177110"
          - "251314110"
          - "251452000"
          - "251858870"
        description: >
          The vessel's MMSI at the time of this ping (used to resolve commercial-feed
          pings to vid; STK pings resolve via mid instead).
        todo: |
          - Specify `constraints`. Some options suggested by the data:
            - constraints: [required] # all values present
      - name: time
        type: datetime
        time_zone: UTC
        range: [2023-01-01T00:00:01, 2023-12-31T23:59:55]
        description: >
          Timestamp of the position fix.
        todo: |
          - Specify `constraints`. Some options suggested by the data:
            - constraints: [required] # all values present
      - name: lon
        type: number
        range: [-33.25234166773056, 28.883496602372777]
        examples:
          - -27.2066383333333
          - -24.3224916666667
          - -21.928694
          - -17.58406499801204
          - 24.95558499935206
        description: >
          Longitude, decimal degrees.
        todo: |
          - Pick a more specific numeric type, and keep whichever of `range` and
            `examples` is appropriate.
          - Specify `constraints`. Some options suggested by the data:
            - constraints: [required] # all values present
      - name: lat
        type: number
        range: [61.97405500217418, 74.48200000169508]
        examples:
          - 63.16804333281082
          - 64.26107
          - 65.88229333153564
          - 66.51488666527962
          - 74.0742983333333
        description: >
          Latitude, decimal degrees.
        todo: |
          - Pick a more specific numeric type, and keep whichever of `range` and
            `examples` is appropriate.
          - Specify `constraints`. Some options suggested by the data:
            - constraints: [required] # all values present
      - name: speed
        type: number
        range: [0, 102.199999999957]
        examples:
          - 0.0007153816825942685
          - 1.5697283762805978
          - 3.586885119686531
          - 4.625197978354074
          - 14.015197251093694
        description: >
          Speed over ground, knots.
        todo: |
          - Pick a more specific numeric type, and keep whichever of `range` and
            `examples` is appropriate.
      - name: heading
        type: number
        range: [0, 360.00000000117]
        examples:
          - 0.9948376720415174
          - 100.200000000096
          - 208.400000002511
          - 272.30000000111403
          - 357.99999959092605
        description: >
          True heading (STK/ASTD/ASTDB); course made good where true heading is
          unavailable.
        todo: |
          - Pick a more specific numeric type, and keep whichever of `range` and
            `examples` is appropriate.
      - name: cog
        type: number
        examples: []
        description: >
          Course over ground. Only populated by the ASTDB feed
          (curate/ais_ping_union.R); NA for STK/ASTD/EmodNet pings.
        todo: |
          - Pick a more specific numeric type, and keep whichever of `range` and
            `examples` is appropriate.
      - name: provider
        type: string
        examples: [astd, stk]
        description: >
          Which measured source this ping came from: "stk" (Iceland's domestic AIS
          receiver network), "astd"/"astdB" (commercial global AIS feeds), or
          "emodnet" (EmodNet's 2017 Iceland snapshot).
        todo: |
          - Only 2 distinct values. Is this an enum? If so change `string` to
            `enum` and `examples` to `values`.
          - Specify `constraints`. Some options suggested by the data:
            - constraints: [required] # all values present
      - name: pid
        type: string
        examples: [FO-FRO, IS-FAS, IS-NES, IS-SIL, NO-SJH]
        description: >
          Standardised harbour id the ping falls inside (spatial join against harbour
          polygons); NA when the vessel is at sea.
      - name: port_call_id
        type: number
        examples: [43, 586, 1208, 2589, 7275]
        description: >
          The port call the ping falls in: a key, with `vid`, into curated/ais/port_call.parquet; NA at
