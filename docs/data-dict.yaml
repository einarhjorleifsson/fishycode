        description: >
          The voyage the ping belongs to: a key, with `vid` and `year`, into
          curated/ais/voyage.parquet; NA outside every voyage (`voyage` until decision 149).
      - name: speed_raw
        type: number
        examples: [0, 1.28332, 3.59628, 5.15476, 102.2]
        description: >
          The speed as the feed gave it, knots; `speed` is NA where this is no vessel speed.
      - name: pos_basis
        type: string
        examples: [recorded]
        description: >
          recorded (AIS) or reconstructed (the gps logger: interpolated from the AIS track once,
          a frozen input). Only recorded positions shape the track (plan 014).
      - name: speed_basis
        type: string
        examples: [derived, recorded]
        description: >
          recorded (stk, gps), derived (astd, astdB, emodnet: distance over time) or placeholder.
      - name: dt_sec
        type: number
        examples: [2, 2627, 5295, 11104, 7679133]
        description: >
          gps only: the AIS gap, seconds, the position was interpolated across.
        details: >
          No logger fix is left after 2020 (TODO 98's exclusion of whole-degree readings, decision 154), so
          the representative file holds none; the examples are from every partition.
      - name: sid_gps
        type: number
        examples: [-1157137, -951839, -732856, -477228, -40920]
        description: >
          gps only: the logbook station the logger fix is stamped to, when exactly one.
        details: >
          No logger fix is left after 2020 (TODO 98's exclusion of whole-degree readings, decision 154), so
          the representative file holds none; the examples are from every partition.
      - name: n_sid_gps
        type: number
        examples: [1, 3, 7, 12, 30]
        description: >
          gps only: how many stations the logger fix is stamped to.
        details: >
          No logger fix is left after 2020 (TODO 98's exclusion of whole-degree readings, decision 154), so
          the representative file holds none; the examples are from every partition.
  - name: ais_port_call
    source:
      parquet: ../../fishydata/curated/ais/port_call.parquet
    description: >
      One row per port call: elapsed time a vessel spent at one Iceland/Faroe port (an `einar`
      polygon), 2007-2026, all providers. Built from AIS only; logbook and landings are not inputs.
      curate/ais_voyage.R cuts voyages at it. Built by `curate/port_call.R` (decision 060; a stay in
      `port_stay.parquet` until decisions 147 and 149).
    columns:
      - name: vid
        type: number
        examples: [10, 2471, 4777, 7121, 100999]
        description: >
          Vessel registration number.
      - name: pid
        type: string
        examples: [FO-ANI, IS-BLO, IS-HNR, IS-PUR, IS-VPN]
        description: >
          Standard harbour key (`pid`) of the polygon the vessel was in or within 2 km of.
      - name: year
        type: number
        examples: [2007, 2011, 2016, 2021, 2026]
        description: >
          Year of `T_in`. A port call over New Year belongs to the year it began.
      - name: T_in
        type: datetime
        time_zone: UTC
        range: [2007-06-01T00:00:12, 2026-10-16T14:00:08]
        description: >
          First ping of the port call (or the `I` event of a pair), UTC.
      - name: T_out
        type: datetime
        time_zone: UTC
        range: [2007-06-01T08:08:32, 2026-10-16T17:11:31]
        description: >
          Last ping of the port call, or the first ping after the gap that ends it (or the `U` event), UTC. A
          port call that ends in the next year's first ping is cut there.
      - name: dur_h
        type: number
        examples: [2, 40.9256, 94.4975, 215.549, 16136.6]
        description: >
          Elapsed hours, `T_out - T_in`. At least 2 by construction (decision 074).
      - name: rule
        type: string
        examples: [event_pair, gap_near_port, tag_span, tag_then_gap]
        description: >
          The strongest evidence present: `event_pair` > `tag_then_gap` > `tag_span` > `gap_near_harbour`.
      - name: evidence
        type: string
        examples:
          - event_pair
          - event_pair+gap_near_port+tag_span+tag_then_gap
          - event_pair+tag_then_gap
          - gap_near_port+tag_span+tag_then_gap
          - tag_then_gap
        description: >
          Every rule that fired, joined with `+`. `tag_then_gap`: two consecutive pings at the harbour 2 h
          or more apart, one inside the polygon. `gap_near_harbour`: the same with neither inside.
          `tag_span`: consecutive pings inside the polygon spanning 2 h or more. `event_pair`: an STK `I`
          then `U` at the same harbour 2 h or more apart, both `io_ok` and kept by `ping_clean`, used from
          2017 only.
      - name: T_in_ping
        type: datetime
        time_zone: UTC
        range: [2007-06-01T00:00:12, 2026-10-16T14:00:08]
        description: >
          Start of the port call according to the ping rules; NA when only an event pair evidences it.
      - name: T_out_ping
        type: datetime
        time_zone: UTC
        range: [2007-06-01T08:08:32, 2026-10-16T17:11:31]
        description: >
          End of the port call according to the ping rules; NA when only an event pair evidences it.
      - name: T_in_ev
        type: datetime
        time_zone: UTC
        range: [2017-01-01T00:30:21, 2026-10-16T14:00:08]
        description: >
          `I` event time; NA when no event pair evidences the port call. Beside `T_in_ping` it shows how far
          the two sources agree (median 0 s at the start, 72 s at the end in 2019).
      - name: T_out_ev
        type: datetime
        time_zone: UTC
        range: [2017-01-01T11:52:54, 2026-10-16T17:02:43]
        description: >
          `U` event time; NA when no event pair evidences the port call.
      - name: basis
        type: string
        examples: [reconstructed]
        description: >
          `reconstructed`: inferred from positions, not recorded.
      - name: port_call_id
        type: number
        examples: [1, 2121, 4243, 6364, 8485]
        description: >
          The port call's key within the vessel, numbered by T_in over all years (plan 014), so a call over New
          Year keeps one number; pings carry it (`stay` until decision 149).
  - name: ais_trail
    source:
      parquet: ../../fishydata/curated/ais/trail/year=2024/month=6/part_001.parquet
    description: >
      The product: one row per fix (AIS pings and onboard GPS logger fixes of every vessel), 2007-2026,
      with its AIS voyage, the logbook station it falls in and the logbook trip of its voyage. Parquet
      partitioned by year and month (`year` and `month` are the partition keys, not columns in the files),
      sorted by vessel and time, unique on (vid, time). Open it with open_dataset() and work in dplyr;
      nothing needs calling. Built by `curate/ais_trail.R` from `ais/ping`, `station_window` and
      `link/trip_voyage` (plan 011 Phase 5, decision 065). A new month, or a late logbook correction,
      rewrites that month's files only. `source` names one representative file, June 2024.
    columns:
      - name: vid
        type: number
        examples: [108, 2560, 6070, 7221, 100951]
        description: >
          Vessel registration number.
      - name: mmsi
        type: string
        examples: ["251003000", "251280340", "251473440", "251803110", "251990961"]
        description: >
          MMSI of the AIS ping; NA for a GPS logger fix.
      - name: time
        type: datetime
        time_zone: UTC
        range: [2024-06-01T00:00:04, 2024-06-30T23:59:58]
        description: >
          Time of the fix, UTC.
      - name: lon
        type: number
        examples: [-54.3471, -23.892, -22.2534, -17.9914, 135.357]
        description: >
          Longitude.
      - name: lat
        type: number
        examples: [35.7348, 64.233, 65.6537, 66.2139, 70.4771]
        description: >
          Latitude.
      - name: speed
        type: number
        examples: [0, 0.0101744, 0.0688308, 3.89288, 39.9]
        description: >
          Cleaned speed in knots; NA where the source value was implausible (above 40 kn) and for a
          logger speed of exactly 1.000 m/s, which is a placeholder (`speed_basis = placeholder`).
      - name: speed_raw
        type: number
        examples: [0, 0.0101749, 0.0688592, 3.8931, 102.3]
        description: >
          Speed as received, converted to knots.
      - name: heading
        type: number
        examples: [0, 88.7, 178.6, 270.1, 511]
        description: >
          Heading.
      - name: cog
        type: number
        examples: [0, 89.9, 180, 270, 360]
        description: >
          Course over ground.
      - name: provider
        type: string
        examples: [astd, astdB, stk]
        description: >
          `stk`, `astd`, `astdB`, `emodnet` or `gps` (the onboard logger).
      - name: pos_basis
        type: string
        examples: [recorded]
        description: >
          `recorded` for an AIS position, `reconstructed` for a logger fix interpolated from the AIS
          track.
      - name: speed_basis
        type: string
        examples: [derived, recorded]
        description: >
          `recorded`, `derived` (ASTD speed is derived from distance over time) or `placeholder` (a
          logger fix whose speed was exactly 1.000 m/s; `speed` is NA and `speed_raw` keeps the value).
      - name: dt_sec
        type: number
        examples: [2, 2627, 5295, 11104, 7679133]
        description: >
          Logger fix: seconds to the previous logger fix; NA for AIS pings.
        details: >
          No logger fix is left after 2020 (TODO 98's exclusion of whole-degree readings, decision 154), so
          the representative file holds none; the examples are from every partition.
      - name: port_call_id
        type: number
        examples: [1, 761, 1540, 2584, 7489]
        description: >
          Key of the port call the fix is in (curated/ais/port_call.parquet, with `vid`); NA at sea (`stay`
          until decision 149).
      - name: voyage_id
        type: number
        examples: [1, 63, 126, 189, 278]
        description: >
          Key of the AIS voyage (curated/ais/voyage.parquet, with `vid` and `year`; `voyage` until decision 149).
      - name: .tid_voyage
        type: string
        examples: ["-1326693", "148474", "154222", "157476"]
        description: >
          The logbook trip linked to the fix's voyage (link/trip_voyage); filled only when exactly one
          logbook trip is on the voyage, else NA.
      - name: schema_voyage
        type: string
        examples: [afli, fs_afladagbok]
        description: >
          Logbook source (`afli`, `fs_afladagbok`, `adb`) of `.tid_voyage`; `.tid` is unique only within a
          schema.
      - name: n_tid_voyage
        type: number
        examples: [0, 1, 2, 4, 5]
        description: >
          Logbook trips linked to the fix's voyage: 0 = none or the fix is in no voyage, 1 = one, more
          than 1 = trips share the voyage (3-4 % of linked voyages).
      - name: n_sid
        type: number
        examples: [0, 1]
        description: >
          Number of logbook station windows that contain the fix (0 = none).
      - name: .sid
        type: number
        examples: [-1326692, 329366, 332269, 335191, 384496]
        description: >
          The logbook station; filled only when `n_sid` is 1. A station is (.sid, schema).
      - name: schema
        type: string
        examples: [afli, fs_afladagbok]
        description: >
          Logbook source of the station.
      - name: .tid
        type: string
        examples: ["-1326685", "146251", "153722", "162205"]
        description: >
          The logbook trip of the station, from the station window; filled only when `n_sid` is 1.
      - name: gear
        type: string
        examples: [DRB, FPO, LHM, OTB, SDN]
        description: >
          Gear code of the station.
      - name: target
        type: string
        examples: [CRU, DEF, DES, SPF, SWD]
        description: >
          Target group of the station's gear (the middle part of `metier`), as in logbook_gear. Filled
          only when `n_sid` is 1.
      - name: target2
        type: string
        examples: [DEF, DES, GHL, LUM, SPF, SWD]
        description: >
          Finer target of the station's gear (the last part of `metier`), as in logbook_gear. Filled only
          when `n_sid` is 1.
      - name: gid
        type: number
        examples: [2, 6, 8, 11, 12, 14]
        description: >
          The station's gear id as the logbook records it (curated/logbook/gear.parquet); filled only
          when `n_sid` is 1.
      - name: gid_landing
        type: number
        examples: [2, 6, 8, 11, 12, 14]
        description: >
          The gear id of the station's landing, where the landing names one; filled only when `n_sid`
          is 1.
      - name: gid_used
        type: number
        examples: [2, 6, 8, 11, 12, 14]
        description: >
          The gear id the station's windows were built with (`gid` in station_window.parquet); filled
          only when `n_sid` is 1.
      - name: gid_basis
        type: string
        examples: [none, reconstructed, recorded]
        description: >
          How `gid_used` was obtained: "recorded" (the logbook's), "reconstructed" (from the landing),
          "none".
      - name: gear_class
        type: string
        examples: [jigged, other, static, towed]
        description: >
          `static`, `towed`, `jigged` or `other`.
      - name: s1
        type: number
        examples: [0, 0.05, 0.1, 1.2, 2.625]
        description: >
          Lower end of the station gear's fishing speed range, knots (reference/gear/windows.R:
          fleet-wide and declared, not fitted). Filled only when `n_sid` is 1. Not the station's outer
          time bound that docs/grammar.qmd also calls s1.
      - name: s2
        type: number
        examples: [1.4, 2.75, 2.9, 4.7, 6]
        description: >
          Upper end of the station gear's fishing speed range, knots. Filled only when `n_sid` is 1.
      - name: phase
        type: string
        examples: [day, jig, set, tow]
        description: >
          `tow`, `haul`, `set`, `jig` or `day`.
      - name: phase_frac
        type: number
        examples: [0, 0.247166, 0.497686, 0.749907, 0.999979]
        description: >
          How far through the phase window the fix is (0-1); NA for `day`.
      - name: win_basis
        type: string
        examples: [capped, derived, recorded, synthesised]
        description: >
          How the station window was drawn (`recorded`, `derived`, `capped`, `synthesised`).
      - name: events
        type: string
        examples: [t1, t1+t3, t1+t4, t2, t3+t4]
        description: >
          The times the station recorded (t1..t4).
      - name: nearest_event
        type: string
        examples: [t2, t3, t3+t4]
        description: >
          The event times this fix bounds (curated/link/station_event.parquet): the first fix of a setting (t1)
          or hauling (t3), the last of a setting (t2) or hauling (t4); t3+t4 for a haul of one fix. All of one
          station and one phase: when two events would share the fix, the nearer keeps it (decision 091). NA
          otherwise. Decision 088.
      - name: fishing
        type: boolean
        description: >
          Inside a tow, haul, jig or day window and the speed inside that gear's speed range; a set is
          never fishing. The speed tested is the median of the vessel's fix speeds within ±10 min
          (decision 093). FALSE for a fix with no match. NA where a window holds the fix but the fix has
          no speed (unknown, not FALSE).
      - name: gid_voyage
        type: number
        examples: [3, 9, 11, 14, 21]
        description: >
          The gear of the fix's voyage, from curated/ais/voyage_gear (decision 101); NA for a fix in no
          voyage or a voyage with no gear.
      - name: s1_voyage
        type: number
        examples: [0, 0.05, 0.125, 1.2, 2.625]
        description: >
          Lower end of the voyage gear's speed range, knots; what `fishing_flow` tests where no station
          window holds the fix.
      - name: s2_voyage
        type: number
        examples: [1.25, 1.7, 2.75, 3, 6]
        description: >
          Upper end of the voyage gear's speed range, knots.
      - name: gear_voyage_basis
        type: enum
        values: [logbook, ambiguous, landing, none]
        description: >
          Where the voyage's gear came from (curated/ais/voyage_gear): the logbook trip's stations, gears
          with different speed ranges (no range), the landing, or none. NA for a fix in no voyage.
      - name: fishing_flow
        type: boolean
        description: >
          Fishing by the flow's cascade (plan 013 item 3, decisions 099 and 101): the station window and
          its speed range where a window holds the fix, as `fishing`; else the speed range of the voyage's
          gear; else NA. `fishing` is the window alone. Each is an approach of its own, so choose one and
          keep to it.
      - name: fishing_flow_basis
        type: enum
        values: [window, speed, none]
        description: >
          Which source decided `fishing_flow`: a station window, the voyage gear's speed range, or none.
      - name: hours
        type: number
        examples: [0.0022, 0.29, 0.59, 0.96, 1.44, 2]
        description: >
          The effort the fix stands for: hours to the vessel's next fix in the same voyage (a vessel's fixes
          in port form one group), capped at 2 h (ramb::rb_assign_effort(), plan 013 item 1). On every fix,
          fishing or not; sum it over the fixes of one fishing approach. NA where there is no next fix
          (`interval_flag` edge, `effort_basis` none).
      - name: kw_hours
        type: number
        examples: [0.44, 15.3, 33.9, 98.9, 221]
        description: >
          `hours` times the vessel's engine power (kW). NA where the engine power is not known.
      - name: interval_flag
        type: enum
        values: [edge, capped]
        description: >
          `capped`: the interval to the next fix was longer than 2 h and `hours` is 2. `edge`: the fix
          has no next fix in its group. NA otherwise.
      - name: effort_basis
        type: enum
        values: [derived, none]
        description: >
          `derived` where `hours` is computed, `none` where there are no hours.
      - name: kw_basis
        type: enum
        values:
          register: the ship register's power on 1 July of the fix's year
          register_later: the register's earliest power after that day (a hull registered later)
          register_earlier: the register's last power before it (a hull struck before)
          current: the `vessel` schema's current power, for a hull the register never carries
          none: no power known
        description: >
          Where the kW behind `kw_hours` came from: the engine power of the fix's own year in
          curated/vessel/vessel_year.parquet (plan 016), whose `kw_basis` this is. NA where the vessel has no
          row there, as an SKB pleasure craft (reference/vessels/vessel_year.R).
      - name: sid_gps
        type: number
        examples: [-1157137, -951839, -732856, -477228, -40920]
        description: >
          The logger's own station reference for a GPS fix.
        details: >
          No logger fix is left after 2020 (TODO 98's exclusion of whole-degree readings, decision 154), so
          the representative file holds none; the examples are from every partition.
      - name: n_sid_gps
        type: number
        examples: [1, 3, 7, 12, 30]
        description: >
          Stations the logger fix refers to.
        details: >
          No logger fix is left after 2020 (TODO 98's exclusion of whole-degree readings, decision 154), so
          the representative file holds none; the examples are from every partition.
      - name: leisure
        type: boolean
        description: >
          TRUE for a fix outside any logbook record (`.sid` empty) of a boat in a frístundaveiðar class at the
          time (curated/vessel/vessel_class.parquet), an SKB pleasure craft (vid 100000 and up), or a sailing,
          pleasure or recreational-fishing usage type that year (mclass 60, 62, 68 in vessel_year); FALSE
          otherwise, and always FALSE inside a logbook record (plan 016 §7 b, R/trail_sql.R).
      - name: leisure_basis
        type: enum
        values:
          class: a frístundaveiðar class at the time of the fix
          skb: an SKB pleasure craft
          usage: a sailing, pleasure or recreational-fishing usage type that year
        description: >
          Which rule made `leisure` TRUE, the first that holds in the order above; NA where `leisure` is
          FALSE.
      - name: metier
        type: string
        examples: [DRB_DES, GNS_GAD, HMS_SWD, OTB_DEF, SDN_DEF]
        description: >
          The station's gear as a metier label, gear_target2 (e.g. OTB_NEP); the label the flow
          works from (plan 014). Filled only when `n_sid == 1`.
  - name: ais_trail_match
    source:
