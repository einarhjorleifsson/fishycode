  - name: staging_afli_sent_record
    source:
      parquet: ../../fishydata/staging/afli_sent/record.parquet
    description: >
      One row per record (FAERSLA) of every message afli's electronic logbook apps sent
      (fs_afli.afladagb_xml_mottaka, 565,192 messages, 2002-2024): what became of each copy. A record
      is sent again when changed (a higher VERSION) and sometimes unchanged in another message; the
      latest version of each record is the one staged in the other tables of staging/afli_sent. Plan
      037's sent layer; sources/afli_sent/convert.R.
    columns:
      - name: .xid
        type: number
        range: [16001, 566147001]
        examples: [14998007, 94505017, 246855001, 404210005, 534606002]
        description: >
          The copy's key: its message id x 1000 + its ordinal in the message (`mid`, `rec`).
      - name: mid
        type: number
        range: [16, 566147]
        examples: [14998, 94505, 246855, 404210, 534606]
        description: >
          The message (afladagb_xml_mottaka.id).
      - name: rec
        type: number
        range: [1, 533]
        examples: [1, 2, 6, 13, 55]
        description: >
          The record's ordinal in its message, from 1.
      - name: vid
        type: number
        range: [5, 9999]
        examples: [1019, 1451, 1976, 2586, 2893]
        description: >
          The vessel: the message's SKIP_NR as sent. Oracle's receipt (skip_nr) is NULL on 11,440
          copies whose message names it.
      - name: visir_sent
        type: number
        range: [-15834, 116372682]
        examples: [112, 932, 3032, 8645, 78552860]
        description: >
          The record's VISIR as sent: the app's own number, reused by the apps years apart, so not
          an identity alone.
      - name: version
        type: number
        range: [0, 20]
        examples: [1]
        description: >
          The record's VERSION as sent.
      - name: date
        type: datetime
        time_zone: naive
        range: [1899-12-30T00:00:00, 2099-11-01T00:00:00]
        description: >
          The fishing date (STOFN/VEDAGS) as sent, at 00:00: a date only.
      - name: received
        type: datetime
        time_zone: naive
        range: [2002-12-05T10:32:14, 2024-07-12T14:59:03]
        description: >
          When Oracle received the message (afladagb_xml_mottaka.snt).
      - name: test_message
        type: boolean
        description: >
          The message is marked a test (afladagb_xml_mottaka.gerd = 9).
      - name: .sid
        type: number
        range: [-10556515003, -379]
        examples: [-1274128, -998904, -660872, -332853, -69942]
        description: >
          The record this copy is a copy of, as staged (station.parquet's .sid). NA for a copy in a
          test message that belongs to no loaded record.
      - name: .sid_loaded
        type: number
        range: [-1326693, -379]
        examples: [-1260779, -997000, -667422, -337826, -73548]
        description: >
          The rafr_stofn row this copy was loaded as (the lesser of two for the 34 copies Oracle
          loaded twice); NA where Oracle did not load it. With .sid it maps every rafr_stofn row
          found in its message to its staged record: 15,916 rows are another version of a record,
          or the same version loaded again, and not the record's .sid.
      - name: n_sid
        type: number
        range: [0, 2]
        examples: [0, 1]
        description: >
          How many rafr_stofn rows the copy was loaded as: 2 for the 34 sent records Oracle loaded
          twice from one message, 0 for copies Oracle did not load.
      - name: copy_loaded
        type: boolean
        description: >
          This copy is the one Oracle loaded: the source of a rafr_stofn row (its
          xml_sending_visir, xml_faerslu_version and xml_faerslu_visir).
      - name: key_form
        type: number
        range: [1, 3]
        examples: [1]
        description: >
          Where copy_loaded: the form of the sent VISIR in rafr_stofn.xml_faerslu_visir, tried in
          this order: 1 as sent, 2 negated, 3 -(1,000,000 + VISIR) (2003-2011).
      - name: .xid_staged
        type: number
        range: [107001, 566147001]
        examples: [15120001, 94024007, 244175120, 401236003, 534550001]
        description: >
          The staged copy of its record (the highest VERSION, then the copy Oracle loaded, then the
          last received).
      - name: version_staged
        type: number
        range: [1, 20]
        examples: [1]
        description: >
          The staged copy's VERSION.
      - name: version_loaded
        type: number
        range: [1, 12]
        examples: [1]
        description: >
          The VERSION of the record's copy Oracle loaded; NA where Oracle loaded none.
      - name: staged
        type: boolean
        description: >
          This copy is the one staged for its record.
      - name: outcome
        type: enum
        values: ["loaded", "loaded, a newer version sent", "loaded, the same version staged from another message", "never loaded", "newer than the loaded one", "older version", "repeated in the message", "same haul as a loaded record, another VISIR", "same version, other message", "test message"]
        description: >
          What became of the copy, one each: "loaded" (Oracle loaded it, and it is staged); "newer
          than the loaded one" (staged: a later version than the one Oracle loaded); "never loaded"
          (staged: Oracle holds no version of the record); "loaded, a newer version sent" (Oracle
          loaded it as a row of its own, and a later version is staged); "loaded, the same version
          staged from another message" (Oracle loaded the same version twice, from two messages);
          "older version" (a later version of its record was sent); "same version, other message"
          (its record's version is staged from another copy); "same haul as a loaded record,
          another VISIR" (not loaded, and not a version of a loaded record by VISIR and date, but
          the same vessel, date, gear section and a sent time as a loaded record: the haul sent
          again under another number, kept with that record and never staged); "repeated in the
          message" (the same VISIR and VERSION again in its message); "test message" (in a test
          message, and a version of no loaded record). A copy is a version of a loaded record when
          it has the same vessel and VISIR and a date within 31 days of that record's loaded copy.
      - name: schema
        type: enum
        values: ["afli"]
        description: >
          The source system: always "afli" (the layer is in `layer`).
      - name: layer
        type: enum
        values: ["sent"]
        description: >
          The layer of afli's electronic logbook the row is from (plan 037 <c2><a7>2): always
          "sent", the XML the app sent.
      - name: app
        type: enum
        values: ["SeaData - Fishing Log", "SeaData - Fishing Logbook", "Trackwell - SeaData - Fishing Log", "Trackwell - TrackWell - Fishing Log", "Trackwell - Trackwell - Fishing Log", "XML Spy"]
        description: >
          The app that sent the message, its HUGBUNADUR without the version (e.g. "Trackwell -
          TrackWell - Fishing Log"); NA on the 4,400 messages that name none (Oracle's receipt
          names none for them either).
      - name: app_version
        type: string
        examples: ["1.1.0.0", "1.3.0.0", "2.6.26.0", "2.7.0.0", "4.4"]
        description: >
          The app's version, the numbers ending HUGBUNADUR (e.g. "2.6.7.0").
  - name: staging_afli_sent_trip
    source:
      parquet: ../../fishydata/staging/afli_sent/trip.parquet
    description: >
