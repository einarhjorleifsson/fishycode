      - name: fishing
        type: boolean
        description: >
          This match is a tow, haul, jig or day window and the median of the vessel's fix speeds within
          ±10 min is inside [s1, s2] (decision 093).
      - name: metier
        type: string
        examples: [DRB_DES, GNS_GAD, HMS_SWD, OTB_DEF, SDN_DEF]
