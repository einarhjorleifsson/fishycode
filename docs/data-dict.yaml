          (sources/fs_afladagbok/convert.R, sources/adb/convert.R). aflaskeyti: `catch`
          where condition is UNGU, NA where it is GUTT or unknown
          (curate/corrections/aflaskeyti_weight.R). afli: NA (its `catch` is the whole
          weight). catch_by_species_station's catch_round fills the gaps.
      - name: condition_basis
        type: enum
        values: [recorded, derived, none]
        description: >
          How `condition` was obtained, aflaskeyti only
          (curate/corrections/aflaskeyti_weight.R): "recorded" on the foreign vessels'
          rows; "derived" on the Icelandic vessels', from their hauls matched to the
          afli logbook; "none" where nothing says (condition NA; taken as round by
          catch_by_species_station). NA for the other schemas: fs_afladagbok's and
          adb's condition is the source's own, and afli has none.
