          from the share of the vessel's fishing days with more than one record
          (at least 0.1 is "operation"); longlines are "operation" whatever the
          share. NA where the station has no vessel. Decision 084.
      - name: station_type_basis
        type: string
        examples: [derived, none, synthesised]
        description: >
          How station_type was obtained: "derived" from the vessel's own pattern,
          "synthesised" for a longline whose pattern alone would say "event", "none"
          where there is no pattern.
      - name: twin
        type: enum
        values: [kept, duplicate, same_time]
        description: >
          Twin records (curate/corrections/logbook_twin.yml, decision 094): stations
          of one vessel with identical t1-t4, at least one a time of day. NA for a
          station with no twin. "duplicate" is the same record entered again: same
          times and identical catch to the "kept" record named in twin_of. A
          duplicate's catch and effort are the kept record's, so leave duplicates out
          of any sum or count: catch_by_species_station, catch_by_species_trip,
          station_window, lid_map and the trail already do. "same_time" is a record
          of its own whose times equal another's (its catch differs); it is kept
          everywhere, but the AIS track cannot tell it from its twin.
      - name: twin_of
        type: number
        examples: [-1322871, 140434, 248612, 2766209, 101625326]
        description: >
          For a "duplicate" twin, the .sid (same schema) of the kept record it
          repeats. NA otherwise.
