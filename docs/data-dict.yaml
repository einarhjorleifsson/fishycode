  - name: ais_port_stay
    source:
      parquet: ../../fishydata/curated/ais/port_stay.parquet
    description: >
      One row per harbour stay: elapsed time a vessel spent at one Iceland/Faroe harbour (an `einar`
      polygon), 2007-2026, all providers. Built from AIS only; logbook and landings are not inputs.
      Nothing consumes it yet; Phase 4 of plan 011 cuts voyages at it. Built by `curate/port_stay.R`
      (decision 060).
    columns:
      - name: vid
        type: number
        description: >
          Vessel registration number.
      - name: pid
        type: string
        description: >
          Standard harbour key (`pid`) of the polygon the vessel was in or within 2 km of.
      - name: year
        type: number
        description: >
          Year of `T_in`. A stay over New Year belongs to the year it began.
      - name: T_in
        type: timestamp
        description: >
          First ping of the stay (or the `I` event of a pair), UTC.
      - name: T_out
        type: timestamp
        description: >
          Last ping of the stay, or the first ping after the gap that ends it (or the `U` event), UTC. A
          stay that ends in the next year's first ping is cut there.
      - name: dur_h
        type: number
        description: >
          Elapsed hours, `T_out - T_in`. At least 4 by construction.
      - name: rule
        type: string
        description: >
          The strongest evidence present: `event_pair` > `tag_then_gap` > `tag_span` > `gap_near_harbour`.
      - name: evidence
        type: string
        description: >
          Every rule that fired, joined with `+`. `tag_then_gap`: two consecutive pings at the harbour 4 h
          or more apart, one inside the polygon. `gap_near_harbour`: the same with neither inside.
          `tag_span`: consecutive pings inside the polygon spanning 4 h or more. `event_pair`: an STK `I`
          then `U` at the same harbour 4 h or more apart, both `io_ok` and kept by `ping_clean`, used from
          2017 only.
      - name: T_in_ping
        type: timestamp
        description: >
          Start of the stay according to the ping rules; NA when only an event pair evidences it.
      - name: T_out_ping
        type: timestamp
        description: >
          End of the stay according to the ping rules; NA when only an event pair evidences it.
      - name: T_in_ev
        type: timestamp
        description: >
          `I` event time; NA when no event pair evidences the stay. Beside `T_in_ping` it shows how far
          the two sources agree (median 0 s at the start, 72 s at the end in 2019).
      - name: T_out_ev
        type: timestamp
        description: >
          `U` event time; NA when no event pair evidences the stay.
      - name: basis
        type: string
        description: >
          `reconstructed`: inferred from positions, not recorded.
      - name: stay
        type: number
        description: >
          The stay's key within the vessel, numbered by T_in (plan 014); pings carry it.
  - name: ais_trail
    source:
      parquet: ../../fishydata/curated/ais/trail/year=*/month=*/part_001.parquet
    description: >
      The product: one row per fix (AIS pings and onboard GPS logger fixes of every vessel), 2007-2026,
      with its AIS voyage, the logbook station it falls in and the logbook trip of its voyage. Parquet
      partitioned by year and month (`year` and `month` are the partition keys, not columns in the files),
      sorted by vessel and time, unique on (vid, time). Open it with open_dataset() and work in dplyr;
      nothing needs calling. Built by `curate/ais_trail.R` from `ais/ping`, `station_window` and
      `link/trip_voyage` (plan 011 Phase 5, decision 065). A new month, or a late logbook correction,
      rewrites that month's files only.
    columns:
      - name: vid
        type: number
        description: >
          Vessel registration number.
      - name: mmsi
        type: string
        description: >
          MMSI of the AIS ping; NA for a GPS logger fix.
      - name: time
        type: timestamp
        description: >
          Time of the fix, UTC.
      - name: lon
        type: number
        description: >
          Longitude.
      - name: lat
        type: number
        description: >
          Latitude.
      - name: speed
        type: number
        description: >
          Cleaned speed in knots; NA where the source value was implausible (above 40 kn) and for a
          logger speed of exactly 1.000 m/s, which is a placeholder (`speed_basis = placeholder`).
      - name: speed_raw
        type: number
        description: >
          Speed as received, converted to knots.
      - name: heading
        type: number
        description: >
          Heading.
      - name: cog
        type: number
        description: >
          Course over ground.
      - name: provider
        type: string
        description: >
          `stk`, `astd`, `astdB`, `emodnet` or `gps` (the onboard logger).
      - name: pos_basis
        type: string
        description: >
          `recorded` for an AIS position, `reconstructed` for a logger fix interpolated from the AIS
          track.
      - name: speed_basis
        type: string
        description: >
          `recorded`, `derived` (ASTD speed is derived from distance over time) or `placeholder` (a
          logger fix whose speed was exactly 1.000 m/s; `speed` is NA and `speed_raw` keeps the value).
      - name: dt_sec
        type: number
        description: >
          Logger fix: seconds to the previous logger fix; NA for AIS pings.
      - name: stay
        type: number
        description: >
          Key of the stay the fix is in (curated/ais/port_stay.parquet, with `vid`); NA at sea.
      - name: voyage
        type: number
        description: >
          Key of the AIS voyage (curated/ais/voyage.parquet, with `vid` and `year`).
      - name: .tid_voyage
        type: number
        description: >
          The logbook trip linked to the fix's voyage (link/trip_voyage); filled only when exactly one
          logbook trip is on the voyage, else NA.
      - name: schema_voyage
        type: string
        description: >
          Logbook source (`afli`, `fs_afladagbok`, `adb`) of `.tid_voyage`; `.tid` is unique only within a
          schema.
      - name: n_tid_voyage
        type: number
        description: >
          Logbook trips linked to the fix's voyage: 0 = none or the fix is in no voyage, 1 = one, more
          than 1 = trips share the voyage (3-4 % of linked voyages).
      - name: n_sid
        type: number
        description: >
          Number of logbook station windows that contain the fix (0 = none).
      - name: .sid
        type: number
        description: >
          The logbook station; filled only when `n_sid` is 1. A station is (.sid, schema).
      - name: schema
        type: string
        description: >
          Logbook source of the station.
      - name: .tid
        type: number
        description: >
          The logbook trip of the station, from the station window; filled only when `n_sid` is 1.
      - name: gear
        type: string
        description: >
          Gear code of the station.
      - name: gear_class
        type: string
        description: >
          `static`, `towed`, `jigged` or `other`.
      - name: phase
        type: string
        description: >
          `tow`, `haul`, `set`, `jig` or `day`.
      - name: phase_frac
        type: number
        description: >
          How far through the phase window the fix is (0-1); NA for `day`.
      - name: win_basis
        type: string
        description: >
          How the station window was drawn (`recorded`, `derived`, `capped`, `synthesised`).
      - name: events
        type: string
        description: >
          The times the station recorded (t1..t4).
      - name: fishing
        type: boolean
        description: >
          Inside a tow, haul, jig or day window and the speed inside that gear's speed range; a set is
          never fishing. FALSE for a fix with no match. NA where a window holds the fix but the fix has
          no speed (unknown, not FALSE).
      - name: sid_gps
        type: number
        description: >
          The logger's own station reference for a GPS fix.
      - name: n_sid_gps
        type: number
        description: >
          Stations the logger fix refers to.
      - name: metier
        type: string
        description: >
          The station's gear as a metier label, gear_target2 (e.g. OTB_NEP); the label the flow
          works from (plan 014). Filled only when `n_sid == 1`.
  - name: ais_trail_match
    source:
      parquet: ../../fishydata/curated/ais/trail_match/year=*/month=*/part_001.parquet
    description: >
      One row per (fix, logbook station) match: every station window that contains a fix, including the
      fixes that several stations claim (where `trail.n_sid` is above 1 and `.sid` is empty). For analysts
      who want to choose between ambiguous stations themselves. Same year-month partitioning as
      `ais_trail`; join on (vid, time). Built by `curate/ais_trail.R`.
    columns:
      - name: vid
        type: number
        description: >
          Vessel registration number.
      - name: time
        type: timestamp
        description: >
          Time of the fix, UTC.
      - name: .sid
        type: number
        description: >
          The logbook station.
      - name: schema
        type: string
        description: >
          Logbook source; the station is (.sid, schema).
      - name: .tid
        type: number
        description: >
          The station's logbook trip.
      - name: gear
        type: string
        description: >
          Gear code.
      - name: gear_class
        type: string
        description: >
          `static`, `towed`, `jigged` or `other`.
      - name: phase
        type: string
        description: >
          `tow`, `haul`, `set`, `jig` or `day`.
      - name: phase_frac
        type: number
        description: >
          Position within the phase window (0-1); NA for `day`.
      - name: win_basis
        type: string
        description: >
          How the window was drawn.
      - name: events
        type: string
        description: >
          The times the station recorded.
      - name: s1
        type: number
        description: >
          Lower speed bound of the gear's fishing range, knots.
      - name: s2
        type: number
        description: >
          Upper speed bound.
      - name: w_start
        type: timestamp
        description: >
          Start of the window.
      - name: w_end
        type: timestamp
        description: >
          End of the window.
      - name: fishing
        type: boolean
        description: >
          This match is a tow, haul, jig or day window and the fix's speed is inside [s1, s2].
      - name: metier
        type: string
        description: >
          The station's gear as a metier label, gear_target2 (e.g. OTB_NEP).
  - name: check_afli_rafr_stofn_corroboration
    source:
      parquet: ../../fishydata/curated/check/afli_rafr_stofn_corroboration.parquet
    description: >
      One row per live electronic logbook submission (visir) that either was lost
      (submitted electronically but absent from afli's own stofn merge) or is a
      matched control drawn from the same vessel-year that did merge. Verifies,
      independently of the logbook merge, whether each lost station's vessel and
      position are corroborated by AIS and by a nearby landing - REPORTS only,
      never adds or removes a station from any curated product
      (curate/plans/005-recover-the-dropped-afli-stations.md).
    todo: |
      - Record a `primary_key`, if present.
    columns:
      - name: visir
        type: number
        range: [-1157084, -580]
        examples: [-1014967, -612594, -344712, -137623, -3004]
        description: >
          The electronic logbook submission's unique id (row key for both lost and
          control stations).
        todo: |
          - Pick a more specific numeric type, and keep whichever of `range` and
            `examples` is appropriate.
          - Specify `constraints`. Some options suggested by the data:
            - constraints: [required] # all values present
      - name: vid
        type: number
        range: [5, 9999]
        examples: [13, 1525, 2184, 2641, 9999]
        description: >
          Vessel registration number.
        todo: |
          - Pick a more specific numeric type, and keep whichever of `range` and
            `examples` is appropriate.
          - Specify `constraints`. Some options suggested by the data:
            - constraints: [required] # all values present
      - name: route
        type: string
        examples: [rafr_stofn, stofn]
        description: >
