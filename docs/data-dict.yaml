$version: 0.1.0
$learn_more: https://data-dict.tidyverse.org/

name: fishydata
description: >
  Icelandic logbook, landings and AIS data, cross-checked and corrected against
  each other. `curated/` is the sweep an analyst opens directly — see
  `AGENTS.md` in `fishycode` for the pipeline that builds it.
details: >
  Drafted 2026-09-25 with `data-dict draft` from the parquet files under
  `curated/` (one representative file per year-partitioned table — `ais/ping`,
  `logbook/sensor_gps` are also Hive-partitioned by `year` on disk, so the
  `range`/`examples` on their columns, `year` included, reflect one year's
  file, not the whole table). Every table and column `description` was then
  filled in the same day, grounded in the scripts/docs/decisions that produce
  each table — never guessed from a column name alone; a column left
  ungrounded after checking says so explicitly rather than fabricating one
  (see `reference_port.hafnarnumer_id`, `reference_port_code.hid_new`). See
  `curate/decisions/029-data-dict-introduced.md` in `fishycode` for what's
  still open: `constraints`/`examples` refinement, and expect this file to
  keep changing as descriptions get corrected — see decision 028's `.sid`
  reasoning-correction for what that looks like in practice.

  Three tables (`link_trip_voyage`, `logbook_catch_by_species_trip`,
  `landing_catch`) briefly reflected the pre-rename schema from
  `curate/decisions/028-join-key-naming-aligned.md`; rebuilt and redrafted
  2026-09-25 — see `curate/decisions/029-data-dict-introduced.md`, "The
  three tables mid-rename — rebuilt 2026-09-25".

  `landing_catch`/`landing_landings`' `.tid` was renamed `.tid_land` the same
  day (`curate/plans/006-trip-identity-and-catch-to-ais-pings.md` §1) — `.tid`
  bare is reserved for the logbook's own trip id, never another system's;
  landings' synthetic trip key needed its own name from the start, the way
  `.sid` did for species vs station.

  2026-09-26: `.tid_land` renamed again, to `.lid` (`curate/plans/
  007-landings-merge-agf-lods.md` §3) — landings is merged from two source
  systems (`agf`, `lods`) as of this same change, and `.lid` reuses landings'
  own already-reserved name rather than keeping a second one for a grain that
  no longer exists in the curated table after the collapse. See plan 007 for
  the fuller story, including a real key-recycling defect (`lods`'s raw
  record id, `komunr`) found and fixed while building it.

  2026-10-15: the tables and columns of decisions 099-104 added by Claude
  (AI-assisted), from their scripts' heads, the decisions and the data
  (`ais_catch`, `ais_voyage_gear`, the three checks, and the trail's effort,
  fishing-flow and voyage-gear columns); TODO 51.

  2026-10-21: the ten columns of the curated logbook tables the file lacked added
  by Claude (AI-assisted), from the scripts that make them and the schema of the
  build at de25239: trip T1_basis, T2_basis (curate/aflaskeyti_trip.R); station
  lat1_raw, lat2_raw (curate/corrections/aflaskeyti_coordinates.R);
  fishing_sample target (the gear mapping), t_shift_min, time_basis
  (curate/corrections/aflaskeyti_local_time.R); catch condition, catch_whole (the
  adapters) and condition_basis (curate/corrections/aflaskeyti_weight.R). The four
  tables' descriptions now name aflaskeyti (plan 026), and logbook_catch's grain is
  (station, species, condition).

  2026-10-21: the six tables of afli's sent layer (staging/afli_sent, plan 037)
  added by Claude (AI-assisted), from sources/afli_sent/convert.R and a scratch
  build of it (ranges and examples from that build; the store holds none until the
  afli_sent target is built). The first staging tables here: nothing in curated/
  carries the sent layer yet, and its consumers (curate/, plan 037 phase 2) need
  its columns written down first.

tables:
  - name: ais_voyage
    source:
      parquet: ../../fishydata/curated/ais/voyage.parquet
    description: >
      One row per port-to-port voyage, one vessel at a time: contiguous sea
      time bracketed by two port calls (curated/ais/port_call: at least 2 h at a
      port by elapsed time, from any provider, decision 074; a shorter call is part of the
      voyage). Built in curate/ais_voyage.R from the cleaned, merged AIS/GPS track
      (staging/ais/ping_clean). Until 2026-10-01 a stay was the span of the pings
      in a polygon run and day trips merged into year-long voyages (decision 061).
      Trips with fewer than 10 pings are dropped. Numbered 1..n per vessel per
      year (`voyage_id`; `voyage` until decision 149); a voyage spanning New Year is split at the boundary.
    todo: |
      - Record a `primary_key`, if present.
    columns:
      - name: vid
        type: number
        range: [-7830, 9853]
        examples: [162, 2325, 4283, 7007, 7882]
        description: >
          Vessel identifier.
        todo: |
          - Pick a more specific numeric type, and keep whichever of `range` and
            `examples` is appropriate.
          - Specify `constraints`. Some options suggested by the data:
            - constraints: [required] # all values present
      - name: year
        type: number
        range: [2007, 2026]
        examples: [2007, 2012, 2017, 2021, 2026]
        description: >
          Calendar year the voyage falls in (trips are numbered per vessel per year; a
          voyage spanning New Year is split at the boundary).
        todo: |
          - Pick a more specific numeric type, and keep whichever of `range` and
            `examples` is appropriate.
          - Specify `constraints`. Some options suggested by the data:
            - constraints: [required] # all values present
      - name: voyage_id
        type: number
        range: [1, 463]
        examples: [4, 143, 243, 338, 463]
        description: >
          Voyage number, 1..n per vessel per year.
        todo: |
          - Pick a more specific numeric type, and keep whichever of `range` and
            `examples` is appropriate.
          - Specify `constraints`. Some options suggested by the data:
            - constraints: [required] # all values present
      - name: T1
        type: datetime
        time_zone: naive
        range: [2007-06-01T00:00:44, 2026-04-27T09:57:54]
        description: >
          Voyage start: the vessel leaves harbour (trip-level time, uppercase per
          curate/decisions/010-time-variable-naming.md).
        todo: |
          - Needs a `time_zone`?
          - Specify `constraints`. Some options suggested by the data (distinct
            count is approximate):
            - constraints: [required, unique] # values look distinct & present
            - constraints: [primary_key] # values look distinct & present
            - constraints: [required] # all values present
      - name: T2
        type: datetime
        time_zone: naive
        range: [2007-06-01T03:26:45, 2026-04-27T12:26:14]
        description: >
          Voyage end: the vessel returns to harbour.
        todo: |
          - Needs a `time_zone`?
          - Specify `constraints`. Some options suggested by the data (distinct
            count is approximate):
            - constraints: [required, unique] # values look distinct & present
            - constraints: [primary_key] # values look distinct & present
            - constraints: [required] # all values present
      - name: pid1
        type: string
        description: >
          Departure port: the port id (pid) of the port call before the voyage. An AIS table has no
          `hid`, which is a source's own code (plan 014).
      - name: pid2
        type: string
        description: >
          Arrival port: the port id (pid) of the port call after the voyage.
      - name: n_pings
        type: number
        range: [10, 183785]
        examples: [103, 2204, 4552, 7358, 43679]
        description: >
          Number of AIS/GPS position fixes making up this voyage.
        todo: |
          - Pick a more specific numeric type, and keep whichever of `range` and
            `examples` is appropriate.
          - Specify `constraints`. Some options suggested by the data:
            - constraints: [required] # all values present
  - name: ais_ping
    source:
      parquet: ../../fishydata/curated/ais/ping/year=2023/part_001.parquet
    description: >
      One row per AIS/GPS position fix, across every measured source (STK, ASTD,
      ASTDB, EmodNet) unioned and cleaned. Hive-partitioned by year. Each ping
      carries the harbour it falls inside (`pid`, NA at sea) and, once ais_voyage.R
      has run, the voyage it belongs to (`trip`). ASTD (`provider` astd) carries only
      vessels with an IMO number in 2026-02 to 2026-06, so small vessels have no ASTD
      fixes in those months (curate/corrections/astd_2026_imo_only.yml).
    todo: |
      - Record a `primary_key`, if present.
      - `curated/ais/ping/` is also Hive-partitioned by `year` on disk
        (2007-2026, one directory per year). This draft was profiled from a
        single 2023 partition file, so the `range`/`examples` below (including
        on `year` itself) reflect one year, not the whole table.
    columns:
      - name: vid
        type: number
        range: [1136, 3037]
        examples: [1136, 1977, 2740, 2912, 3037]
        description: >
          Vessel identifier.
        todo: |
          - Pick a more specific numeric type, and keep whichever of `range` and
            `examples` is appropriate.
          - Specify `constraints`. Some options suggested by the data:
            - constraints: [required] # all values present
      - name: mmsi
        type: string
        examples:
          - "251006110"
          - "251177110"
          - "251314110"
          - "251452000"
          - "251858870"
        description: >
          The vessel's MMSI at the time of this ping (used to resolve commercial-feed
          pings to vid; STK pings resolve via mid instead).
        todo: |
          - Specify `constraints`. Some options suggested by the data:
            - constraints: [required] # all values present
      - name: time
        type: datetime
        time_zone: naive
        range: [2023-01-01T00:00:01, 2023-12-31T23:59:55]
        description: >
          Timestamp of the position fix.
        todo: |
          - Needs a `time_zone`?
          - Specify `constraints`. Some options suggested by the data:
            - constraints: [required] # all values present
      - name: lon
        type: number
        range: [-33.25234166773056, 28.883496602372777]
        examples:
          - -27.2066383333333
          - -24.3224916666667
          - -21.928694
          - -17.58406499801204
          - 24.95558499935206
        description: >
          Longitude, decimal degrees.
        todo: |
          - Pick a more specific numeric type, and keep whichever of `range` and
            `examples` is appropriate.
          - Specify `constraints`. Some options suggested by the data:
            - constraints: [required] # all values present
      - name: lat
        type: number
        range: [61.97405500217418, 74.48200000169508]
        examples:
          - 63.16804333281082
          - 64.26107
          - 65.88229333153564
          - 66.51488666527962
          - 74.0742983333333
        description: >
          Latitude, decimal degrees.
        todo: |
          - Pick a more specific numeric type, and keep whichever of `range` and
            `examples` is appropriate.
          - Specify `constraints`. Some options suggested by the data:
            - constraints: [required] # all values present
      - name: speed
        type: number
        range: [0, 102.199999999957]
        examples:
          - 0.0007153816825942685
          - 1.5697283762805978
          - 3.586885119686531
          - 4.625197978354074
          - 14.015197251093694
        description: >
          Speed over ground, knots.
        todo: |
          - Pick a more specific numeric type, and keep whichever of `range` and
            `examples` is appropriate.
      - name: heading
        type: number
        range: [0, 360.00000000117]
        examples:
          - 0.9948376720415174
          - 100.200000000096
          - 208.400000002511
          - 272.30000000111403
          - 357.99999959092605
        description: >
          True heading (STK/ASTD/ASTDB); course made good where true heading is
          unavailable.
        todo: |
          - Pick a more specific numeric type, and keep whichever of `range` and
            `examples` is appropriate.
      - name: cog
        type: number
        examples: []
        description: >
          Course over ground. Only populated by the ASTDB feed
          (curate/ais_ping_union.R); NA for STK/ASTD/EmodNet pings.
        todo: |
          - Pick a more specific numeric type, and keep whichever of `range` and
            `examples` is appropriate.
      - name: provider
        type: string
        examples: [astd, stk]
        description: >
          Which measured source this ping came from: "stk" (Iceland's domestic AIS
          receiver network), "astd"/"astdB" (commercial global AIS feeds), or
          "emodnet" (EmodNet's 2017 Iceland snapshot).
        todo: |
          - Only 2 distinct values. Is this an enum? If so change `string` to
            `enum` and `examples` to `values`.
          - Specify `constraints`. Some options suggested by the data:
            - constraints: [required] # all values present
      - name: pid
        type: string
        examples: [FO-FRO, IS-FAS, IS-NES, IS-SIL, NO-SJH]
        description: >
          Standardised harbour id the ping falls inside (spatial join against harbour
          polygons); NA when the vessel is at sea.
      - name: port_call_id
        type: number
        description: >
          The port call the ping falls in: a key, with `vid`, into curated/ais/port_call.parquet; NA at
          sea. The call's port, times and duration are in that table, not on the ping (plan 014; `stay`
          until decision 149).
      - name: year
        type: number
        range: [2023, 2023]
        examples: [2023]
        description: >
          Calendar year, and the Hive partition key.
        todo: |
          - Pick a more specific numeric type, and keep whichever of `range` and
            `examples` is appropriate.
          - Specify `constraints`. Some options suggested by the data:
            - constraints: [required] # all values present
      - name: voyage_id
        type: number
        description: >
          The voyage the ping belongs to: a key, with `vid` and `year`, into
          curated/ais/voyage.parquet; NA outside every voyage (`voyage` until decision 149).
      - name: speed_raw
        type: number
        description: >
          The speed as the feed gave it, knots; `speed` is NA where this is no vessel speed.
      - name: pos_basis
        type: string
        description: >
          recorded (AIS) or reconstructed (the gps logger: interpolated from the AIS track once,
          a frozen input). Only recorded positions shape the track (plan 014).
      - name: speed_basis
        type: string
        description: >
          recorded (stk, gps), derived (astd, astdB, emodnet: distance over time) or placeholder.
      - name: dt_sec
        type: number
        description: >
          gps only: the AIS gap, seconds, the position was interpolated across.
      - name: sid_gps
        type: number
        description: >
          gps only: the logbook station the logger fix is stamped to, when exactly one.
      - name: n_sid_gps
        type: number
        description: >
          gps only: how many stations the logger fix is stamped to.
  - name: ais_port_call
    source:
      parquet: ../../fishydata/curated/ais/port_call.parquet
    description: >
      One row per port call: elapsed time a vessel spent at one Iceland/Faroe port (an `einar`
      polygon), 2007-2026, all providers. Built from AIS only; logbook and landings are not inputs.
      curate/ais_voyage.R cuts voyages at it. Built by `curate/port_call.R` (decision 060; a stay in
      `port_stay.parquet` until decisions 147 and 149).
    columns:
      - name: vid
        type: number
        description: >
          Vessel registration number.
      - name: pid
        type: string
        description: >
          Standard harbour key (`pid`) of the polygon the vessel was in or within 2 km of.
      - name: year
        type: number
        description: >
          Year of `T_in`. A port call over New Year belongs to the year it began.
      - name: T_in
        type: timestamp
        description: >
          First ping of the port call (or the `I` event of a pair), UTC.
      - name: T_out
        type: timestamp
        description: >
          Last ping of the port call, or the first ping after the gap that ends it (or the `U` event), UTC. A
          port call that ends in the next year's first ping is cut there.
      - name: dur_h
        type: number
        description: >
          Elapsed hours, `T_out - T_in`. At least 2 by construction (decision 074).
      - name: rule
        type: string
        description: >
          The strongest evidence present: `event_pair` > `tag_then_gap` > `tag_span` > `gap_near_harbour`.
      - name: evidence
        type: string
        description: >
          Every rule that fired, joined with `+`. `tag_then_gap`: two consecutive pings at the harbour 2 h
          or more apart, one inside the polygon. `gap_near_harbour`: the same with neither inside.
          `tag_span`: consecutive pings inside the polygon spanning 2 h or more. `event_pair`: an STK `I`
          then `U` at the same harbour 2 h or more apart, both `io_ok` and kept by `ping_clean`, used from
          2017 only.
      - name: T_in_ping
        type: timestamp
        description: >
          Start of the port call according to the ping rules; NA when only an event pair evidences it.
      - name: T_out_ping
        type: timestamp
        description: >
          End of the port call according to the ping rules; NA when only an event pair evidences it.
      - name: T_in_ev
        type: timestamp
        description: >
          `I` event time; NA when no event pair evidences the port call. Beside `T_in_ping` it shows how far
          the two sources agree (median 0 s at the start, 72 s at the end in 2019).
      - name: T_out_ev
        type: timestamp
        description: >
          `U` event time; NA when no event pair evidences the port call.
      - name: basis
        type: string
        description: >
          `reconstructed`: inferred from positions, not recorded.
      - name: port_call_id
        type: number
        description: >
          The port call's key within the vessel, numbered by T_in over all years (plan 014), so a call over New
          Year keeps one number; pings carry it (`stay` until decision 149).
  - name: ais_trail
    source:
      parquet: ../../fishydata/curated/ais/trail/year=2024/month=6/part_001.parquet
    description: >
      The product: one row per fix (AIS pings and onboard GPS logger fixes of every vessel), 2007-2026,
      with its AIS voyage, the logbook station it falls in and the logbook trip of its voyage. Parquet
      partitioned by year and month (`year` and `month` are the partition keys, not columns in the files),
      sorted by vessel and time, unique on (vid, time). Open it with open_dataset() and work in dplyr;
      nothing needs calling. Built by `curate/ais_trail.R` from `ais/ping`, `station_window` and
      `link/trip_voyage` (plan 011 Phase 5, decision 065). A new month, or a late logbook correction,
      rewrites that month's files only. `source` names one representative file, June 2024.
    columns:
      - name: vid
        type: number
        description: >
          Vessel registration number.
      - name: mmsi
        type: string
        description: >
          MMSI of the AIS ping; NA for a GPS logger fix.
      - name: time
        type: timestamp
        description: >
          Time of the fix, UTC.
      - name: lon
        type: number
        description: >
          Longitude.
      - name: lat
        type: number
        description: >
          Latitude.
      - name: speed
        type: number
        description: >
          Cleaned speed in knots; NA where the source value was implausible (above 40 kn) and for a
          logger speed of exactly 1.000 m/s, which is a placeholder (`speed_basis = placeholder`).
      - name: speed_raw
        type: number
        description: >
          Speed as received, converted to knots.
      - name: heading
        type: number
        description: >
          Heading.
      - name: cog
        type: number
        description: >
          Course over ground.
      - name: provider
        type: string
        description: >
          `stk`, `astd`, `astdB`, `emodnet` or `gps` (the onboard logger).
      - name: pos_basis
        type: string
        description: >
          `recorded` for an AIS position, `reconstructed` for a logger fix interpolated from the AIS
          track.
      - name: speed_basis
        type: string
        description: >
          `recorded`, `derived` (ASTD speed is derived from distance over time) or `placeholder` (a
          logger fix whose speed was exactly 1.000 m/s; `speed` is NA and `speed_raw` keeps the value).
      - name: dt_sec
        type: number
        description: >
          Logger fix: seconds to the previous logger fix; NA for AIS pings.
      - name: port_call_id
        type: number
        description: >
          Key of the port call the fix is in (curated/ais/port_call.parquet, with `vid`); NA at sea (`stay`
          until decision 149).
      - name: voyage_id
        type: number
        description: >
          Key of the AIS voyage (curated/ais/voyage.parquet, with `vid` and `year`; `voyage` until decision 149).
      - name: .tid_voyage
        type: string
        examples: ["-1326693", "148474", "154222", "157476"]
        description: >
          The logbook trip linked to the fix's voyage (link/trip_voyage); filled only when exactly one
          logbook trip is on the voyage, else NA.
      - name: schema_voyage
        type: string
        description: >
          Logbook source (`afli`, `fs_afladagbok`, `adb`) of `.tid_voyage`; `.tid` is unique only within a
          schema.
      - name: n_tid_voyage
        type: number
        description: >
          Logbook trips linked to the fix's voyage: 0 = none or the fix is in no voyage, 1 = one, more
          than 1 = trips share the voyage (3-4 % of linked voyages).
      - name: n_sid
        type: number
        description: >
          Number of logbook station windows that contain the fix (0 = none).
      - name: .sid
        type: number
        description: >
          The logbook station; filled only when `n_sid` is 1. A station is (.sid, schema).
      - name: schema
        type: string
        description: >
          Logbook source of the station.
      - name: .tid
        type: string
        examples: ["-1326685", "146251", "153722", "162205"]
        description: >
          The logbook trip of the station, from the station window; filled only when `n_sid` is 1.
      - name: gear
        type: string
        description: >
          Gear code of the station.
      - name: target
        type: string
        examples: [CRU, DEF, DES, SPF, SWD]
        description: >
          Target group of the station's gear (the middle part of `metier`), as in logbook_gear. Filled
          only when `n_sid` is 1.
      - name: target2
        type: string
        examples: [DEF, DES, GHL, LUM, SPF, SWD]
        description: >
          Finer target of the station's gear (the last part of `metier`), as in logbook_gear. Filled only
          when `n_sid` is 1.
      - name: gid
        type: number
        examples: [2, 6, 8, 11, 12, 14]
        description: >
          The station's gear id as the logbook records it (curated/logbook/gear.parquet); filled only
          when `n_sid` is 1.
      - name: gid_landing
        type: number
        examples: [2, 6, 8, 11, 12, 14]
        description: >
          The gear id of the station's landing, where the landing names one; filled only when `n_sid`
          is 1.
      - name: gid_used
        type: number
        examples: [2, 6, 8, 11, 12, 14]
        description: >
          The gear id the station's windows were built with (`gid` in station_window.parquet); filled
          only when `n_sid` is 1.
      - name: gid_basis
        type: string
        examples: [none, reconstructed, recorded]
        description: >
          How `gid_used` was obtained: "recorded" (the logbook's), "reconstructed" (from the landing),
          "none".
      - name: gear_class
        type: string
        description: >
          `static`, `towed`, `jigged` or `other`.
      - name: s1
        type: number
        examples: [0, 0.05, 0.1, 1.2, 2.625]
        description: >
          Lower end of the station gear's fishing speed range, knots (reference/gear/windows.R:
          fleet-wide and declared, not fitted). Filled only when `n_sid` is 1. Not the station's outer
          time bound that docs/grammar.qmd also calls s1.
      - name: s2
        type: number
        examples: [1.4, 2.75, 2.9, 4.7, 6]
        description: >
          Upper end of the station gear's fishing speed range, knots. Filled only when `n_sid` is 1.
      - name: phase
        type: string
        description: >
          `tow`, `haul`, `set`, `jig` or `day`.
      - name: phase_frac
        type: number
        description: >
          How far through the phase window the fix is (0-1); NA for `day`.
      - name: win_basis
        type: string
        description: >
          How the station window was drawn (`recorded`, `derived`, `capped`, `synthesised`).
      - name: events
        type: string
        description: >
          The times the station recorded (t1..t4).
      - name: nearest_event
        type: string
        examples: [t2, t3, t3+t4]
        description: >
          The event times this fix bounds (curated/link/station_event.parquet): the first fix of a setting (t1)
          or hauling (t3), the last of a setting (t2) or hauling (t4); t3+t4 for a haul of one fix. All of one
          station and one phase: when two events would share the fix, the nearer keeps it (decision 091). NA
          otherwise. Decision 088.
      - name: fishing
        type: boolean
        description: >
          Inside a tow, haul, jig or day window and the speed inside that gear's speed range; a set is
          never fishing. The speed tested is the median of the vessel's fix speeds within ±10 min
          (decision 093). FALSE for a fix with no match. NA where a window holds the fix but the fix has
          no speed (unknown, not FALSE).
      - name: gid_voyage
        type: number
        examples: [3, 9, 11, 14, 21]
        description: >
          The gear of the fix's voyage, from curated/ais/voyage_gear (decision 101); NA for a fix in no
          voyage or a voyage with no gear.
      - name: s1_voyage
        type: number
        examples: [0, 0.05, 0.125, 1.2, 2.625]
        description: >
          Lower end of the voyage gear's speed range, knots; what `fishing_flow` tests where no station
          window holds the fix.
      - name: s2_voyage
        type: number
        examples: [1.25, 1.7, 2.75, 3, 6]
        description: >
          Upper end of the voyage gear's speed range, knots.
      - name: gear_voyage_basis
        type: enum
        values: [logbook, ambiguous, landing, none]
        description: >
          Where the voyage's gear came from (curated/ais/voyage_gear): the logbook trip's stations, gears
          with different speed ranges (no range), the landing, or none. NA for a fix in no voyage.
      - name: fishing_flow
        type: boolean
        description: >
          Fishing by the flow's cascade (plan 013 item 3, decisions 099 and 101): the station window and
          its speed range where a window holds the fix, as `fishing`; else the speed range of the voyage's
          gear; else NA. `fishing` is the window alone. Each is an approach of its own, so choose one and
          keep to it.
      - name: fishing_flow_basis
        type: enum
        values: [window, speed, none]
        description: >
          Which source decided `fishing_flow`: a station window, the voyage gear's speed range, or none.
      - name: hours
        type: number
        examples: [0.0022, 0.29, 0.59, 0.96, 1.44, 2]
        description: >
          The effort the fix stands for: hours to the vessel's next fix in the same voyage (a vessel's fixes
          in port form one group), capped at 2 h (ramb::rb_assign_effort(), plan 013 item 1). On every fix,
          fishing or not; sum it over the fixes of one fishing approach. NA where there is no next fix
          (`interval_flag` edge, `effort_basis` none).
      - name: kw_hours
        type: number
        examples: [0.44, 15.3, 33.9, 98.9, 221]
        description: >
          `hours` times the vessel's engine power (kW). NA where the engine power is not known.
      - name: interval_flag
        type: enum
        values: [edge, capped]
        description: >
          `capped`: the interval to the next fix was longer than 2 h and `hours` is 2. `edge`: the fix
          has no next fix in its group. NA otherwise.
      - name: effort_basis
        type: enum
        values: [derived, none]
        description: >
          `derived` where `hours` is computed, `none` where there are no hours.
      - name: sid_gps
        type: number
        description: >
          The logger's own station reference for a GPS fix.
      - name: n_sid_gps
        type: number
        description: >
          Stations the logger fix refers to.
      - name: metier
        type: string
        description: >
          The station's gear as a metier label, gear_target2 (e.g. OTB_NEP); the label the flow
          works from (plan 014). Filled only when `n_sid == 1`.
  - name: ais_trail_match
    source:
      parquet: ../../fishydata/curated/ais/trail_match/year=2024/month=6/part_001.parquet
    description: >
      One row per (fix, logbook station) match: every station window that contains a fix, including the
      fixes that several stations claim (where `trail.n_sid` is above 1 and `.sid` is empty). For analysts
      who want to choose between ambiguous stations themselves. Same year-month partitioning as
      `ais_trail`; join on (vid, time). Built by `curate/ais_trail.R`.
    columns:
      - name: vid
        type: number
        description: >
          Vessel registration number.
      - name: time
        type: timestamp
        description: >
          Time of the fix, UTC.
      - name: .sid
        type: number
        description: >
          The logbook station.
      - name: schema
        type: string
        description: >
          Logbook source; the station is (.sid, schema).
      - name: .tid
        type: string
        examples: ["-1326685", "146251", "153722", "162205"]
        description: >
          The station's logbook trip.
      - name: gear
        type: string
        description: >
          Gear code.
      - name: target
        type: string
        examples: [CRU, DEF, DES, SPF, SWD]
        description: >
          Target group of the station's gear (the middle part of `metier`), as in logbook_gear.
      - name: target2
        type: string
        examples: [DEF, DES, GHL, LUM, SPF, SWD]
        description: >
          Finer target of the station's gear (the last part of `metier`), as in logbook_gear.
      - name: gear_class
        type: string
        description: >
          `static`, `towed`, `jigged` or `other`.
      - name: phase
        type: string
        description: >
          `tow`, `haul`, `set`, `jig` or `day`.
      - name: phase_frac
        type: number
        description: >
          Position within the phase window (0-1); NA for `day`.
      - name: win_basis
        type: string
        description: >
          How the window was drawn.
      - name: events
        type: string
        description: >
          The times the station recorded.
      - name: s1
        type: number
        description: >
          Lower speed bound of the gear's fishing range, knots.
      - name: s2
        type: number
        description: >
          Upper speed bound.
      - name: w_start
        type: timestamp
        description: >
          Start of the window.
      - name: w_end
        type: timestamp
        description: >
          End of the window.
      - name: fishing
        type: boolean
        description: >
          This match is a tow, haul, jig or day window and the median of the vessel's fix speeds within
          ±10 min is inside [s1, s2] (decision 093).
      - name: metier
        type: string
        description: >
          The station's gear as a metier label, gear_target2 (e.g. OTB_NEP).
  - name: ais_catch
    source:
      parquet: ../../fishydata/curated/ais/catch/year=2024/part_001.parquet
    description: >
      The catch on the fixes (flow step 6, plan 013 item 2, decisions 100 and 102): one row per fishing fix,
      catch unit, species and approach. Each catch unit's catch (logbook stations, a logbook trip, or a landing
      with no logbook trip) is shared over its fishing fixes in proportion to their `hours`, separately for each
      approach to fishing on the trail (`fishing` and `fishing_flow`). A unit with no fishing fix moves its
      catch up: to its trip, a landing period, or the vessel's month (`shared_resolution`); where none of these
      has a fishing fix, the row has no fix and `catch_basis` none. The kilograms written equal the kilograms in,
      per year and approach (the script stops if not). Duplicate twins are left out (decision 094). Built by
      curate/ais_catch.R; partitioned by `year` (the partition key, not a column in the files), one file per
      vessel group (vid modulo 4). `unit_id` is unique within a year only. `source` names one representative
      file, 2024's first vessel group; open the whole table with open_dataset() on curated/ais/catch.
    columns:
      - name: vid
        type: number
        examples: [2430, 2958, 6484, 7212, 9851]
        description: >
          Vessel id. The few negative values are the landings' own placeholders (agf, lods) for a landing
          with no registration number, carried as they are.
      - name: time
        type: datetime
        time_zone: naive
        range: [2007-06-01T00:06:27, 2026-04-16T14:27:53]
        description: >
          The fishing fix (vid, time) on curated/ais/trail. NA where the catch found no fishing fix
          (`catch_basis` none).
      - name: unit_id
        type: number
        examples: [1493, 2008, 4436, 9358, 29507]
        description: >
          The catch unit (ramb::rb_build_catch_units(), decision 100), unique within a year.
      - name: resolution
        type: string
        examples: [tow, haul+set, jig, day, landing_trip, landing+landing_trip]
        description: >
          The unit's level: a station window (tow, haul, set, jig), the stations of a vessel-day (day), a
          landing with no logbook trip linked to its voyages (landing_trip) or not linked (landing); joined
          with `+` where events of several kinds formed one unit.
      - name: shared_unit_id
        type: number
        examples: [993, 1014, 13033, 23651, 34188]
        description: >
          The unit whose fishing fixes the catch was shared over: almost always `unit_id` itself where
          `shared_resolution` equals `resolution`, else the unit the catch moved up to. NA where it went to
          the vessel's month.
      - name: shared_resolution
        type: string
        examples: [tow, haul+set, jig, trip, landing, landing_trip, vessel_month]
        description: >
          The level the catch was shared at: the unit's own `resolution`, or the level it moved up to
          (trip, landing, landing_trip, vessel_month) because the unit had no fishing fix.
      - name: species
        type: number
        examples: [1, 7, 24, 43, 161]
        description: >
          Species, MFRI code, as in logbook_catch and landing_catch.
      - name: kg
        type: number
        examples: [0.044, 1.48, 19.1, 31.3, 91.9]
        description: >
          Kilograms of the species on this fix: the logbook's estimate or the landed weight (`source`), not
          raised. The raised value is kg × raise_factor.
      - name: catch_basis
        type: enum
        values: [derived, none]
        description: >
          `derived` where the catch sits on a fix; `none` where no fishing fix was found at any level, so the
          kilograms are kept on the vessel and month with no fix.
      - name: approach
        type: enum
        values: [fishing, fishing_flow]
        description: >
          The trail's fishing column the catch was shared over. Each approach carries all the catch, so
          filter to one before summing.
      - name: source
        type: enum
        values: [logbook, landing]
        description: >
          Where the kilograms came from: the logbook (a trip with a logbook) or the landing (a landing with
          no logbook trip, most of them foreign vessels).
      - name: raise_factor
        type: number
        examples: [0.0096, 0.95, 1.04, 1.14, 1.32, 8.93]
        description: >
          The trip's landed weight of the species over its logged weight (lid_map's landings), on the
          logbook's rows; NA where there is none. Raising is a column, not a choice (maintainer, plan 013
          item 2).
  - name: ais_voyage_gear
    source:
      parquet: ../../fishydata/curated/ais/voyage_gear.parquet
    description: >
      The gear each AIS voyage fished with, for the fixes no logbook window holds (flow step 3, plan 013 item 3,
      decision 101): one row per voyage of curated/ais/voyage. Its speed range lets the track decide whether a fix
      is fishing (`fishing_flow` on the trail). A voyage takes the gears of its logbook trips' stations when they
      share one speed range (the gear used most is named), none when they differ (ambiguous), else the gear that
      holds most of the landed weight of a landing dated within the voyage (to the day after it ends), else
      nothing. Duplicate twin stations are left out (decision 094). Built by curate/voyage_gear.R.
    details: >
      Key: (vid, year, voyage_id), as in ais_voyage.
    columns:
      - name: vid
        type: number
        examples: [100, 2282, 3032, 6089, 9852]
        description: >
          Vessel id.
      - name: year
        type: number
        range: [2007, 2026]
        examples: [2007, 2015, 2026]
        description: >
          The voyage's year (voyages are numbered per vessel per year).
      - name: voyage_id
        type: number
        examples: [1, 20, 98, 311, 534]
        description: >
          The voyage, a key into curated/ais/voyage within (vid, year).
      - name: gid_voyage
        type: number
        examples: [1, 4, 9, 14, 22]
        description: >
          The voyage's gear (new gear code, reference_gear): for an ambiguous voyage the gear its stations
          used most. NA where `gear_voyage_basis` is none.
      - name: gear_class_voyage
        type: enum
        values: [towed, static, jigged, other]
        description: >
          The class of `gid_voyage` (reference/gear/windows.R); NA where `gear_voyage_basis` is ambiguous or
          none.
      - name: s1_voyage
        type: number
        examples: [0, 0.05, 0.125, 1.2, 2.625]
        description: >
          Lower end of the gear's fishing speed range, knots; NA where there is no single range (ambiguous,
          none) and for the few gears with no range.
      - name: s2_voyage
        type: number
        examples: [1.125, 1.7, 2.9, 3.7, 6]
        description: >
          Upper end of the gear's fishing speed range, knots.
      - name: gear_voyage_basis
        type: enum
        values: [logbook, ambiguous, landing, none]
        description: >
          `logbook`: the logbook trip's stations, one speed range. `ambiguous`: its stations use gears with
          different speed ranges, so no range and only the windows decide. `landing`: no logbook trip, the
          landing's main gear. `none`: neither.
