          adb's `quantity`), gutted weight where it is GUTT. afli: the whole weight
          (curate/catch_by_species_station.R, measured against fs_afladagbok). aflaskeyti:
          the weight reported as live weight, which some Icelandic vessels report gutted
          (condition GUTT; curate/corrections/aflaskeyti_weight.R).
