        description: >
          Dredge width (PLOGUR/PLOG_STAERD@BREIDD).
      - name: g_height
        type: number
        range: [0, 999]
        examples: [12, 30, 40, 50, 110]
        description: >
          Dredge height (PLOG_STAERD@HAED); net height (NET@HAED); purse seine depth (NOT@D_NOTAR,
          metres as sent: Oracle converts it to fathoms).
      - name: g_length
        type: number
        range: [0, 30969]
        examples: [0, 214, 1160]
        description: >
          Dredge length (PLOG_STAERD@LENGD); gillnet fleet length, nets x mean net length
          (NET@FJOLDI x NET@MEDAL_LENGD_NETA, derived); purse seine length (NOT@L_NOTAR, metres as
          sent: Oracle converts it to fathoms).
      - name: length_togle
        type: number
        range: [2, 16459]
        examples: [677, 1829, 2195, 2560, 2926]
        description: >
          Danish seine rope length (DRAGNOT/TOG_LENGD), metres as sent: Oracle converts it to
          fathoms, so the edited layer's is in fathoms.
      - name: length_virle
        type: number
        range: [0, 0]
        examples: [0]
        description: >
          Danish seine wire length (DRAGNOT/VIR_LENGD).
      - name: mesh_vod
        type: number
        range: [0, 800]
        examples: [100, 135, 155]
        description: >
          Danish seine wing mesh (DRAGNOT/MOSKVI_VOD).
      - name: length_headline
        type: number
        range: [0, 1234]
        examples: [20, 55, 60, 65, 70]
        description: >
          Danish seine headline (DRAGNOT/HOFLINULENGD).
      - name: length_fotreipi
        type: number
        range: [0, 999]
        examples: [1, 2, 3]
        description: >
          Danish seine footrope (DRAGNOT/FOTREIPI).
      - name: n_total
        type: number
        range: [0, 39500090]
        examples: [7200, 14400, 17600, 33750, 42872]
        description: >
          Longline hooks: LINA/FJ_KROKA, else LINA@ONGLAR x LINA@FJ_BJODA (derived).
      - name: n_total_basis
        type: enum
        values: ["derived", "none", "recorded"]
        description: >
          "recorded", "derived" or "none".
      - name: n_per_unit
        type: number
        range: [0, 13000]
        examples: [4, 450, 1000, 1250, 1650]
        description: >
          Hooks per tub (LINA@ONGLAR); hooks per jig line (FAERI@FJ_KROKA, never loaded by Oracle).
      - name: n_lost
        type: number
        range: [1, 90]
        examples: [1, 2, 5, 15, 70]
        description: >
          Nets lost (NET@FJ_TAP_NETA).
      - name: twin_gear
        type: boolean
        description: >
          Two trawls at once (TVO_VEIDARF), as sent.
      - name: bait
        type: number
        range: [1, 967]
        examples: [30, 55]
        description: >
          Bait code (LINA@BEITA).
      - name: hook_type
        type: number
        range: [0, 999]
        examples: [1, 2, 3, 4, 6]
        description: >
          Hook type code (LINA/KROKAR@GERD), never loaded by Oracle.
      - name: hook_size
        type: number
        range: [0, 99]
        examples: [7, 12, 15]
        description: >
          Hook size (LINA/KROKAR@STAERD), never loaded by Oracle.
      - name: hand_baited
        type: boolean
        description: >
          Hand-baited (LINA/HANDBEITT, FAERI/HANDBEITT), never loaded by Oracle.
  - name: staging_afli_sent_catch
    source:
      parquet: ../../fishydata/staging/afli_sent/catch.parquet
    description: >
      One row per staged station, species and state: the catch as logged in the message (AFLI items),
      never a whole weight. Plan 037 <c2><a7>4 and its ask e: the observation is the catch as logged
      with its state; Oracle's whole weight (round(gutted x 1.25) for every species) and any other
      factor are curate/'s. sources/afli_sent/convert.R.
    columns:
      - name: .sid
        type: number
        range: [-10556515003, -379]
        examples: [-1275458, -1002748, -661278, -336225, -71214]
        description: >
          The station.
      - name: .xid
        type: number
        range: [107001, 566147001]
        examples: [15386101, 95785001, 244280002, 403441004, 536213007]
        description: >
          The staged copy (record.parquet).
      - name: sid
        type: number
        range: [0, 99999]
        examples: [1, 2, 5, 13, 41]
        description: >
          Species code (AFLI/TEGUND) as sent.
      - name: catch
        type: number
        range: [-330, 7999999]
        examples: [10, 100, 310, 1350, 7500]
        description: >
          Weight, kg, as logged (AFLI/AFLI), in the state `condition` names; summed over the items
          of one species and state in the record.
      - name: condition
        type: enum
        values: ["GUTT", "UNGU"]
        description: >
          "GUTT" gutted (AFLI@SLAEGT true), "UNGU" ungutted (false), adb's codes as in
          curated/logbook/catch.
      - name: catch_basis
        type: enum
        values: ["recorded"]
        description: >
          "recorded".
      - name: n_items
        type: number
        range: [1, 2]
        examples: [1]
        description: >
          Items summed into the row.
      - name: mean_weight_g
        type: number
        range: [1, 500000]
        examples: [770, 1800, 2966, 4222, 150000]
        description: >
          Mean weight, g (AFLI/MEDALTHYNGD), where the row is one item.
      - name: schema
        type: enum
        values: ["afli"]
        description: >
          The source system: always "afli" (the layer is in `layer`).
      - name: layer
        type: enum
        values: ["sent"]
        description: >
          The layer of afli's electronic logbook the row is from (plan 037 <c2><a7>2): always
          "sent", the XML the app sent.
      - name: app
        type: enum
        values: ["SeaData - Fishing Log", "SeaData - Fishing Logbook", "Trackwell - SeaData - Fishing Log", "Trackwell - TrackWell - Fishing Log", "Trackwell - Trackwell - Fishing Log", "XML Spy"]
        description: >
          The app that sent the message, its HUGBUNADUR without the version (e.g. "Trackwell -
          TrackWell - Fishing Log"); NA on the 4,400 messages that name none (Oracle's receipt
          names none for them either).
      - name: app_version
        type: string
        examples: ["1.1.0.0", "1.1.9.0", "2.6.26.0", "2.7.1.0", "4.4"]
        description: >
          The app's version, the numbers ending HUGBUNADUR (e.g. "2.6.7.0").
  - name: staging_afli_sent_landing_confirmation
    source:
      parquet: ../../fishydata/staging/afli_sent/landing_confirmation.parquet
    description: >
      One row per landing confirmation the apps sent: a message of its own
      (afladagb_xml_mottaka.londun_faersla L, 275,973), one LONDUN each. The skipper's declaration of a
      landing (vessel, date, port), with the period its records cover. Not a trip: TIMAB_FRA is the
      first fishing date, not a departure. sources/afli_sent/convert.R.
    columns:
      - name: mid
        type: number
        range: [32, 566156]
        examples: [31519, 144594, 286008, 426290, 538115]
        description: >
          The message (afladagb_xml_mottaka.id).
      - name: vid
        type: number
        range: [5, 9999]
        examples: [968, 1636, 2457, 2732, 2894]
        description: >
          The vessel, the message's SKIP_NR.
      - name: T2
        type: datetime
        time_zone: naive
        range: [2002-01-21T00:00:00, 2024-06-27T00:00:00]
        description: >
          Landing date (LONDUN@DAGSETNING), at 00:00.
      - name: hid2
        type: number
        range: [-1, 3477]
        examples: [11, 21, 67, 97, 147]
        description: >
          Landing port (LONDUN@HOFN), afli's port code.
      - name: pid2
        type: string
        examples: ["IS-AKR", "IS-DRA", "IS-HVM", "IS-SAN", "IS-VPN"]
        description: >
          The landing port in the standard port key.
      - name: period_from
        type: datetime
        time_zone: naive
        range: [0001-01-01T00:00:00, 2024-06-27T00:00:00]
        description: >
          TIMAB_FRA, at 00:00: the first fishing date of the records it confirms.
      - name: period_to
        type: datetime
        time_zone: naive
        range: [0001-01-01T00:00:00, 2099-11-01T00:00:00]
        description: >
          TIMAB_TIL, at 00:00: the end of that period.
      - name: received
        type: datetime
        time_zone: naive
        range: [2002-12-11T11:48:42, 2024-07-12T14:59:20]
        description: >
          When Oracle received the message (snt).
      - name: schema
        type: enum
        values: ["afli"]
        description: >
          The source system: always "afli" (the layer is in `layer`).
      - name: layer
        type: enum
        values: ["sent"]
        description: >
          The layer of afli's electronic logbook the row is from (plan 037 <c2><a7>2): always
          "sent", the XML the app sent.
      - name: app
        type: enum
        values: ["SeaData - Fishing Log", "SeaData - Fishing Logbook", "Trackwell - SeaData - Fishing Log", "Trackwell - TrackWell - Fishing Log", "Trackwell - Trackwell - Fishing Log"]
        description: >
          The app that sent the message, its HUGBUNADUR without the version (e.g. "Trackwell -
          TrackWell - Fishing Log"); NA on the 4,400 messages that name none (Oracle's receipt
          names none for them either).
      - name: app_version
        type: string
        examples: ["1.1.0.0", "1.3.0.0", "2.6.26.0", "2.7.0.0", "2.7.9.0"]
        description: >
          The app's version, the numbers ending HUGBUNADUR (e.g. "2.6.7.0").
relationships:
  # vessel.vid is a measured, clean primary key (7,043 rows, 7,043 distinct
  # vid, checked 2026-09-25) so these four are the only relationships in this
  # first pass backed by a verified unique column on their "one" side.
  - join: logbook_trip.vid = vessel.vid
    cardinality: many-to-one
  - join: ais_voyage.vid = vessel.vid
    cardinality: many-to-one
  - join: landing_landings.vid = vessel.vid
    cardinality: many-to-one
  - join: vessel_ais_key.vid = vessel.vid
    cardinality: many-to-one

  # Every relationship below this line is real (each join key exists and is
  # used exactly this way by the code that builds these tables — see the
  # cited scripts) but is deliberately NOT declared as a `relationships` entry
  # yet: declaring one asserts a `primary_key`/`unique` constraint on its
  # "one" side, and measuring the actual data 2026-09-25 found every one of
  # these candidate keys currently has duplicates:
  #   logbook_trip..tid      1,820,387 rows, 1,813,822 distinct (6,565 dupes)
  #   logbook_station..sid   7,239,778 rows, 7,224,594 distinct (15,184 dupes)
  #   reference_gear.gid            59 rows,        37 distinct
  #   reference_port.pid           112 rows,        86 distinct, 21 missing
  # Declaring `primary_key` on any of these would be asserting something the
  # data does not currently satisfy - see AGENTS.md, "measure before claiming
  # scope". Add each relationship once its key column's duplication (or, for
  # `reference_gear`/`reference_port`, its intended real key) has been
  # investigated and either fixed or understood well enough to state a
  # constraint truthfully.
  #
  #   logbook_trip..tid      = logbook_station..tid       (one-to-many)
  #     curate/logbook.R — a trip covers many fishing operations
  #   logbook_station..sid   = logbook_fishing_sample..sid (one-to-one)
  #     docs/output-schema.md — gear/effort detail kept in its own table
  #   logbook_station..sid   = logbook_catch..sid          (one-to-many)
  #     curate/logbook.R — catch recorded one row per species and condition
  #   link_trip_voyage..tid  = logbook_trip..tid            (one-to-one)
  #     curate/link_trip_voyage.R:70 (`row_number() ... rn = 1` per tid).
  #     Rebuilt 2026-09-25 (curate/decisions/028) — now carries `year`/`trip`
  #     like `ais_voyage`, not `voyage_year`/`voyage`.
  #   logbook_catch_by_species_trip..tid = logbook_trip..tid (many-to-one)
  #     curate/catch_by_species_trip.R. Rebuilt 2026-09-25 — now carries
  #     `.tid`/`.lid` dotted, like every other logbook table.
  #   logbook_lid_map..tid   = logbook_trip..tid            (one-to-one)
  #     curate/link_lid_map.R
  #   logbook_fishing_sample.gid = reference_gear.gid       (many-to-one)
  #     `gid`'s 59-vs-37 split needs understanding before this is declared —
  #     it may mean `reference_gear`'s real key is (gid, some other column),
  #     not gid alone.
  #   landing_landings.pid = reference_port.pid
  #   ais_ping.pid          = reference_port.pid            (many-to-one)
  #     `reference_port.pid` has 21 missing values (18.8%) on top of the
  #     duplication - `ais_ping.pid` is separately expected to be NA at sea
  #     (docs/grammar.qmd), a different and legitimate kind of missing.

glossary:
  vid: >
    Vessel identifier. The one identifier that is spelled the same in every
    curated table — see `curate/decisions/015-identity-is-separate-from-the-key.md`
    for how it differs from `mmsi` (a vessel's radio identity, which changes
    over the vessel's life; `vid` does not).
  dot-prefixed column (.tid, .sid, .lid, ...): >
    Describes what `.tid`/`.sid`/`.lid` already are — a synthetic/derived key
    generated by the source database or this pipeline, sequential, no meaning
    in the value itself — not a style rule to test every dotted name against.
    `.tid` and `.sid` in particular are specific, reserved names (see their
    own entries below), not a generic category; a column can't be made
    dotted or bare by checking whether its *values* look like an enum. See
    `docs/grammar.qmd` and
    `curate/decisions/028-join-key-naming-aligned.md` ("The reasoning was
    wrong").
  .tid: >
    Logbook trip identifier (synthetic), and only that — reserved for the
    logbook tables. Chains down to `.sid` per trip. `landing_catch`/
    `landing_landings` used to carry their own, unrelated `.tid` (a
    landings-internal id, `min(.lid)` per `vid`×`date`×`hid`) — the same
    collision class as `.sid` below, fixed the same way, see `.lid`.
  .lid: >
    Landings' own synthetic trip key — a different value space from the
    logbook's `.tid`, even though both are "a trip" in the everyday sense.
    The two are linked only through `logbook_lid_map`'s fuzzy match
    (`vid`×`date`×`hid` cascade, then catch-weight tiebreak), never by
    comparing the columns directly. Was `.tid_land` (see
    `curate/plans/006-trip-identity-and-catch-to-ais-pings.md` for the
    general rule that named it: every source system's own trip-like
    identifier is either the logbook's reserved bare `.tid`, or carries an
    explicit source suffix, never a bare name borrowed from another system);
    renamed to `.lid` once landings merged two source systems and the
    pre-collapse per-delivery grain stopped existing in the curated table at
    all, so `.lid` was free to mean only the trip-level key — see
    `curate/plans/007-landings-merge-agf-lods.md` §3. Since that merge, `.lid`
    is not globally unique on its own — the real key is `(.lid, schema)`; see
    the `schema` entry and `landing_catch..lid`'s own description for the
    `komunr`-recycling defect that made this concrete rather than
    theoretical.
  .sid: >
    Logbook station (fishing operation) identifier (synthetic), and only
    that — reserved for the logbook tables (`station.parquet` and anything
    joined to it). Never reused for another concept in another table, even
    one that also happens to be a code sharing the "sid" stem — that
    confusion (a landings-side species column briefly named `.sid`) is
    exactly what `curate/decisions/028` fixed.
  sid: >
    Species code (`tegundnúmer`) — e.g. `1` = cod. One vocabulary, shared by
    logbook and landings alike (confirmed with the maintainer,
    2026-09-25) — the same bare `sid` in both is deliberate, not
    coincidental. Bare because the *value* is meaningful, not because of any
    general dot/bare test.
  stid: >
    Fishing stock code (`veiðistofn`) — an ecological population within a
    species (e.g. separate stocks of the same species by area). Bare, for
    the same reason as `sid`: the value is a meaningful classification, not
    a synthetic key.
  gid: >
    Gear code (enum). Paired with a `gear` string column carrying the ICES
    gear-type code (e.g. `"OTB"`, `"LLS"`) in tables that have both.
  hid / pid: >
    Harbour identifiers. `hid` is source-local (e.g. Fiskistofa's
    `hafnarnumer`); `pid` is the standardised cross-source port key minted in
    `reference/ports/ports_all.R`. Both are kept, never one replacing the
    other — see `curate/decisions/007-hid-maps-to-pid.md`. Trip-level tables
    split into `hid1`/`pid1` (departure) and `hid2`/`pid2` (arrival).
  T1 / T2 vs t1…t4: >
    Case encodes the level, not the source: uppercase `T1`/`T2` is the
    harbour-to-harbour trip or voyage; lowercase `t1`…`t4` is the four
    gear-deployment event times within one fishing operation. See
    `curate/decisions/010-time-variable-naming.md`.
  schema: >
    Which source system a row came from. Two independent, non-interchangeable
    uses of this same column name exist in this dictionary: the logbook
    tables' `"afli"`/`"fs_afladagbok"`/`"adb"`/`"aflaskeyti"` (see `curate/logbook.R`),
    and `landing_catch`/`landing_landings`'s `"agf"`/`"lods"`
    (`curate/plans/007`). `curate/link_lid_map.R` and
    `curate/catch_by_species_trip.R` join both together, so a landings-side
    `schema` value is renamed `schema_land` internally there specifically to
    avoid colliding with the logbook one - the two are never the same value
    space, same as `.tid`/`.lid`.
  basis: >
    Carried by every inferred value: `"recorded"`, `"reconstructed"`, or
    `"synthesised"`, per `docs/grammar.qmd`.
