  - name: staging_afli_sent_station
    source:
      parquet: ../../fishydata/staging/afli_sent/station.parquet
    description: >
      One row per staged record of afli's electronic logbook as the apps sent it: the latest version of
      each record (see record.parquet). Plan 037's sent layer, keyed so that .sid is the edited layer's
      (staging/afli/station.parquet) wherever Oracle loaded the record; values only from the message,
      nothing from the loaded or edited layers. sources/afli_sent/convert.R.
    columns:
      - name: .sid
        type: number
        range: [-10556515003, -379]
        examples: [-1274920, -1008235, -675683, -342301, -74427]
        description: >
          Station key. Where Oracle loaded the record: rafr_stofn.visir of its row, found through
          the message id, VERSION and VISIR in one of its three forms (record.key_form). Oracle
          loads some versions as rows of their own, so a vessel's loaded rows of one VISIR within
          31 days are one record, and its .sid is the row loaded from its highest version (then the
          last received). It is the edited layer's .sid on 1,273,587 of the 1,302,406 records
          Oracle loaded (Claude, 2026-10-21); record.parquet maps every other row. Where Oracle
          holds no version: -(10^10 + .xid of the record's first copy), outside every Oracle id.
          Unique.
      - name: .tid
        type: number
        range: [-10556246012, -379]
        examples: [-1272319, -1005643, -674698, -341994, -74204]
        description: >
          The trip (trip.parquet).
      - name: .xid
        type: number
        range: [107001, 566147001]
        examples: [16035025, 98847025, 252044034, 406843002, 535760004]
        description: >
          The staged copy (record.parquet). Unique.
      - name: date
        type: datetime
        time_zone: naive
        range: [1899-12-30T00:00:00, 2099-11-01T00:00:00]
        description: >
          The fishing date (STOFN/VEDAGS) as sent, at 00:00.
      - name: lon1
        type: number
        range: [-180.0833333, 174.9719444]
        examples: [-26.33333333, -24.09833330, -22.59888890, -17.36666667, -11.81666667]
        description: >
          Start longitude, decimal degrees, as sent: STOFN/POS@LON (decimal degrees to the
          arc-second, west negative), else STOFN/STADSETNING@LENGD (the older apps' DDMM, west
          positive, read as sources/afli/convert.R reads Oracle's). Placeholders such as 0 are kept
          as sent.
      - name: lat1
        type: number
        range: [-66.2333333, 90.98333333]
        examples: [63.20000000, 63.84611110, 64.95000000, 66.21722220, 67.08333333]
        description: >
          Start latitude, decimal degrees, as sent: STOFN/POS@LAT, else STOFN/STADSETNING@BREIDD
          (DDMM).
      - name: lon2
        type: number
        range: [-180, 180]
        examples: [-26.20000000, -24.06666667, -22.57833330, -17.55611110, -11.72777780]
        description: >
          End longitude, decimal degrees, as sent: STOFN/POS_END@LON (never loaded by Oracle), else
          STOFN/STADSETNING_LOK@LENGD (DDMM; the value Oracle overwrote with the end latitude on
          many 2010-2012 records, decision 158).
      - name: lat2
        type: number
        range: [-65.6027778, 90]
        examples: [63.19805560, 63.86666667, 64.98138890, 66.25833330, 67.10555560]
        description: >
          End latitude, decimal degrees, as sent: STOFN/POS_END@LAT, else
          STOFN/STADSETNING_LOK@BREIDD (DDMM).
      - name: pos1_form
        type: enum
        values: ["ddmm", "degrees"]
        description: >
          The start position's form: "degrees" (POS) or "ddmm" (STADSETNING, to the minute); NA
          where none was sent.
      - name: pos2_form
        type: enum
        values: ["ddmm", "degrees"]
        description: >
          The end position's form, as pos1_form.
      - name: sq
        type: number
        range: [-12632, 3230]
        examples: [319, 372, 474, 623, 719]
        description: >
          Statistical rectangle (reitur), derived from lat1, lon1 (geo::d2r, as Oracle derives
          rafr_stofn.reitur).
      - name: ssq
        type: number
        range: [1, 4]
        examples: [1, 2, 3, 4]
        description: >
          Sub-rectangle (smareitur, 1-4), derived from lat1, lon1 (geo::d2sr).
      - name: sq_basis
        type: enum
        values: ["derived"]
        description: >
          "derived" where sq and ssq are computed, "none" where no start position was sent.
      - name: z1_raw
        type: number
        range: [-1, 14795]
        examples: [27.432, 75.000, 140.000, 238.000, 514.000]
        description: >
          Start depth, STOFN/DYPI as sent (decimal commas read as points). Its unit is not decided
          here: SeaData 1.x sent fathoms, the later apps mostly metres, Fishing Log 2.6 and 2.7
          fathoms on some vessels in some periods (the TODO 113 notes); the per-vessel-period unit
          test is curate/'s.
      - name: z2_raw
        type: number
        range: [-2, 1047281]
        examples: [23.89631996, 77.00000000, 146.00000000, 243.00000000, 530.00000000]
        description: >
          End depth, STOFN/DYPI_LOK as sent; unit as z1_raw. Some values are negative as sent.
      - name: record_closed
        type: datetime
        time_zone: naive
        range: [2000-11-29T13:12:44, 2095-09-05T04:38:25]
        description: >
          When the record was closed in the app (FAERSLA_LOKUD), never loaded by Oracle.
      - name: edited_after_closing
        type: boolean
        description: >
          STOFN@BREYTT_EFTIR_LOKUN as sent: true where the app marked the record changed after
          closing (669 copies); NA where absent. Oracle stores it as 0.
      - name: version
        type: number
        range: [1, 20]
        examples: [1]
        description: >
          The staged copy's VERSION.
      - name: n_versions
        type: number
        range: [1, 12]
        examples: [1]
        description: >
          Distinct VERSIONs sent of the record under its own VISIR.
      - name: n_copies
        type: number
        range: [1, 606]
        examples: [1, 2]
        description: >
          Copies of the record sent under its own VISIR (versions, resends and repeats).
      - name: n_other_visir
        type: number
        range: [0, 10]
        examples: [0]
        description: >
          Copies of the same haul sent under another VISIR (record.outcome "same haul as a loaded
          record, another VISIR").
      - name: loaded
        type: boolean
        description: >
          Oracle holds a version of the record (.sid is Oracle's).
      - name: copy_loaded
        type: boolean
        description: >
          The staged copy is the one Oracle loaded; false on the 5 records whose latest version
          Oracle did not load.
      - name: version_loaded
        type: number
        range: [1, 12]
        examples: [1]
        description: >
          The VERSION of the copy loaded as the record's .sid row; NA where Oracle loaded none.
      - name: n_oracle_rows
        type: number
        range: [0, 12]
        examples: [1]
        description: >
          rafr_stofn rows that hold the record: more than 1 where Oracle loaded several versions,
          or one version twice, as rows of their own (14,370 records); 0 where it loaded none.
      - name: schema
        type: enum
        values: ["afli"]
        description: >
          The source system: always "afli" (the layer is in `layer`).
      - name: layer
        type: enum
        values: ["sent"]
        description: >
          The layer of afli's electronic logbook the row is from (plan 037 <c2><a7>2): always
          "sent", the XML the app sent.
      - name: app
        type: enum
        values: ["SeaData - Fishing Log", "SeaData - Fishing Logbook", "Trackwell - SeaData - Fishing Log", "Trackwell - TrackWell - Fishing Log", "Trackwell - Trackwell - Fishing Log", "XML Spy"]
        description: >
          The app that sent the message, its HUGBUNADUR without the version (e.g. "Trackwell -
          TrackWell - Fishing Log"); NA on the 4,400 messages that name none (Oracle's receipt
          names none for them either).
      - name: app_version
        type: string
        examples: ["1.1.0.0", "1.1.9.0", "2.6.26.0", "2.7.1.0", "4.4"]
        description: >
          The app's version, the numbers ending HUGBUNADUR (e.g. "2.6.7.0").
