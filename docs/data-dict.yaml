    description: >
      One row per logbook trip (twins left out): its departure (T1, pid1) and return (T2, pid2), time and
      port, each from the best-ranked witness that holds one - the AIS voyage, the logbook's own, STK, the
      quota system's records, the phone calls, and for the return the landing (the maintainer's ranking;
      decisions 173, 174, TODO 121) - with the witness, the basis and one outcome per field. A value that is a
      date only gives way to a time on that day. Each witness's own values are kept beside the chosen ones.
