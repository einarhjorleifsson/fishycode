  - name: vessel_identity
    source:
      parquet: ../../fishydata/curated/vessel/vessel_identity.parquet
    description: >
      One row per (vid, time period) - not one row per hull. Reshapes
      vessel.parquet's flat attributes into a time-bounded history, since a hull's
      MMSI, call sign and name can change while vid persists across its life. Each
      row's [t1, t2] window intersects the MMSI's own registered window with the
      hull's lifetime (yh1/yh2); a hull struck before STK began (2007-06-01) is
      dropped entirely. Asserts as an invariant that (mmsi, time) resolves to
      exactly one vid - built specifically so AIS-to-vessel joins can resolve on
      (mmsi, time) rather than mmsi alone (reference/vessels/identity.R).
