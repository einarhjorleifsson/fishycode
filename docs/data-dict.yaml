  - name: ais_catch
    source:
      parquet: ../../fishydata/curated/ais/catch/year=2024/part_001.parquet
    description: >
      The catch on the fixes (flow step 6, plan 013 item 2, decisions 100 and 102): one row per fishing fix,
      catch unit, species and approach. Each catch unit's catch (logbook stations, a logbook trip, or a landing
      with no logbook trip) is shared over its fishing fixes in proportion to their `hours`, separately for each
      approach to fishing on the trail (`fishing` and `fishing_flow`). A unit with no fishing fix moves its
      catch up: to its trip, a landing period, or the vessel's month (`shared_resolution`); where none of these
      has a fishing fix, the row has no fix and `catch_basis` none. The kilograms written equal the kilograms in,
      per year and approach (the script stops if not). Duplicate twins are left out (decision 094). Built by
      curate/ais_catch.R; partitioned by `year` (the partition key, not a column in the files), one file per
      vessel group (vid modulo 4). `unit_id` is unique within a year only. `source` names one representative
      file, 2024's first vessel group; open the whole table with open_dataset() on curated/ais/catch.
    columns:
      - name: vid
        type: number
        examples: [2430, 2958, 6484, 7212, 9851]
        description: >
          Vessel id. The few negative values are the landings' own placeholders (agf, lods) for a landing
          with no registration number, carried as they are.
      - name: time
        type: datetime
        time_zone: naive
        range: [2007-06-01T00:06:27, 2026-04-16T14:27:53]
        description: >
          The fishing fix (vid, time) on curated/ais/trail. NA where the catch found no fishing fix
          (`catch_basis` none).
      - name: unit_id
        type: number
        examples: [1493, 2008, 4436, 9358, 29507]
        description: >
          The catch unit (ramb::rb_build_catch_units(), decision 100), unique within a year.
      - name: resolution
        type: string
        examples: [tow, haul+set, jig, day, landing_trip, landing+landing_trip]
        description: >
          The unit's level: a station window (tow, haul, set, jig), the stations of a vessel-day (day), a
          landing with no logbook trip linked to its voyages (landing_trip) or not linked (landing); joined
          with `+` where events of several kinds formed one unit.
      - name: shared_unit_id
        type: number
        examples: [993, 1014, 13033, 23651, 34188]
        description: >
          The unit whose fishing fixes the catch was shared over: almost always `unit_id` itself where
          `shared_resolution` equals `resolution`, else the unit the catch moved up to. NA where it went to
          the vessel's month.
      - name: shared_resolution
        type: string
        examples: [tow, haul+set, jig, trip, landing, landing_trip, vessel_month]
        description: >
          The level the catch was shared at: the unit's own `resolution`, or the level it moved up to
          (trip, landing, landing_trip, vessel_month) because the unit had no fishing fix.
      - name: species
        type: number
        examples: [1, 7, 24, 43, 161]
        description: >
          Species, MFRI code, as in logbook_catch and landing_catch.
      - name: kg
        type: number
        examples: [0.044, 1.48, 19.1, 31.3, 91.9]
        description: >
          Kilograms of the species on this fix: the logbook's estimate or the landed weight (`source`), not
          raised. The raised value is kg × raise_factor.
      - name: kg_flagged
        type: number
        examples: [0.40, 1.58, 4.04, 11.7, 108]
        description: >
          The part of `kg` that the trip's landing contradicts (logbook_catch_flag, plan 038 §8 step 1c): shared
          over the same fixes with the same weights as the kilograms, so 0 ≤ kg_flagged ≤ kg, and 0 on the
          landing's rows. Nothing is corrected; leaving the flagged catch out is the analyst's filter
          (sum(kg - kg_flagged)). Not yet in the store: built with the next rebuild of ais_catch; the examples are
          a scratch build's of 2026-10-23 (2015, 2021, 2023; the flagged rows' deciles 1, 3, 5, 7, 9).
      - name: catch_basis
        type: enum
        values: [derived, none]
        description: >
          `derived` where the catch sits on a fix; `none` where no fishing fix was found at any level, so the
          kilograms are kept on the vessel and month with no fix.
      - name: approach
        type: enum
        values: [fishing, fishing_flow]
        description: >
          The trail's fishing column the catch was shared over. Each approach carries all the catch, so
          filter to one before summing.
      - name: source
        type: enum
        values: [logbook, landing]
        description: >
          Where the kilograms came from: the logbook (a trip with a logbook) or the landing (a landing with
          no logbook trip, most of them foreign vessels).
      - name: raise_factor
        type: number
        examples: [0.0096, 0.95, 1.04, 1.14, 1.32, 8.93]
        description: >
          The trip's landed weight of the species over its logged weight (lid_map's landings), on the
          logbook's rows; NA where there is none. Raising is a column, not a choice (maintainer, plan 013
          item 2).
  - name: ais_voyage_gear
    source:
      parquet: ../../fishydata/curated/ais/voyage_gear.parquet
    description: >
      The gear each AIS voyage fished with, for the fixes no logbook window holds (flow step 3, plan 013 item 3,
      decision 101): one row per voyage of curated/ais/voyage. Its speed range lets the track decide whether a fix
      is fishing (`fishing_flow` on the trail). A voyage takes the gears of its logbook trips' stations when they
      share one speed range (the gear used most is named), none when they differ (ambiguous), else the gear that
      holds most of the landed weight of a landing dated within the voyage (to the day after it ends), else
      nothing. Duplicate twin stations are left out (decision 094). Built by curate/voyage_gear.R.
    details: >
      Key: (vid, year, voyage_id), as in ais_voyage.
    columns:
      - name: vid
        type: number
        examples: [100, 2282, 3032, 6089, 9852]
        description: >
          Vessel id.
      - name: year
        type: number
        range: [2007, 2026]
        examples: [2007, 2015, 2026]
        description: >
          The voyage's year (voyages are numbered per vessel per year).
      - name: voyage_id
        type: number
        examples: [1, 20, 98, 311, 534]
        description: >
          The voyage, a key into curated/ais/voyage within (vid, year).
      - name: gid_voyage
        type: number
        examples: [1, 4, 9, 14, 22]
        description: >
          The voyage's gear (new gear code, reference_gear): for an ambiguous voyage the gear its stations
          used most. NA where `gear_voyage_basis` is none.
      - name: gear_class_voyage
        type: enum
        values: [towed, static, jigged, other]
        description: >
          The class of `gid_voyage` (reference/gear/windows.R); NA where `gear_voyage_basis` is ambiguous or
          none.
      - name: s1_voyage
        type: number
        examples: [0, 0.05, 0.125, 1.2, 2.625]
        description: >
          Lower end of the gear's fishing speed range, knots; NA where there is no single range (ambiguous,
          none) and for the few gears with no range.
      - name: s2_voyage
        type: number
        examples: [1.125, 1.7, 2.9, 3.7, 6]
        description: >
          Upper end of the gear's fishing speed range, knots.
      - name: gear_voyage_basis
        type: enum
        values: [logbook, ambiguous, landing, none]
        description: >
          `logbook`: the logbook trip's stations, one speed range. `ambiguous`: its stations use gears with
          different speed ranges, so no range and only the windows decide. `landing`: no logbook trip, the
          landing's main gear. `none`: neither.
      - name: landing_gap_d
        type: number(quantity)
        units: days
        range: [2, 7]
        description: >
          For a `landing` gear taken from landings after the voyage: the days from the voyage's end date to
          the first of those landings. NA for a landing within the voyage and for every other basis
          (curate/voyage_gear.R, decision 154).
