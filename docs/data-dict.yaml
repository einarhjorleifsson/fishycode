        description: >
          The app's version, the numbers ending HUGBUNADUR (e.g. "2.6.7.0").
      - name: t1_basis
        type: enum
        values: ["none", "recorded"]
        description: >
          "recorded" or "none".
      - name: t2_basis
        type: enum
        values: ["none", "recorded"]
        description: >
