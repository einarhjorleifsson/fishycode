          Trip key: the least Oracle .sid among its records, so it equals the edited layer's .tid
          where the grouping is the same; the least .sid where Oracle loaded none of them.
      - name: vid
        type: number
        range: [5, 9999]
        examples: [967, 1636, 2457, 2732, 2893]
        description: >
          The vessel, the message's SKIP_NR.
      - name: T1
        type: datetime
        time_zone: naive
        range: [1899-12-30T00:00:00, 2024-06-27T00:00:00]
        description: >
          The trip's first fishing date (VEDAGS), at 00:00: no departure is sent.
      - name: T2
        type: datetime
        time_zone: naive
        range: [2001-10-03T00:00:00, 2024-06-27T00:00:00]
        description: >
          The landing date its records were sent with (STOFN/LONDUN@DAGSETNING), at 00:00. Oracle
          replaces it on loading with the landing confirmation's on many records, and in-house
          edits change it again: the edited layer's differs on 133,174 of 1,274,136 shared stations
          (Claude, 2026-10-21).
      - name: hid2
        type: number
        range: [-1, 3477]
        examples: [11, 21, 65, 97, 147]
        description: >
          The landing port its records were sent with (STOFN/LONDUN@HOFN), afli's port code.
      - name: n_crew
        type: number
        range: [-4, 99]
        examples: [2, 3, 4, 9, 15]
        description: >
          Crew (STOFN/AHOFN) of the trip's key record (the one whose .sid is .tid).
      - name: schema
        type: enum
        values: ["afli"]
        description: >
          The source system: always "afli" (the layer is in `layer`).
      - name: layer
        type: enum
        values: ["sent"]
        description: >
          The layer of afli's electronic logbook the row is from (plan 037 <c2><a7>2): always
          "sent", the XML the app sent.
      - name: app
        type: enum
        values: ["SeaData - Fishing Log", "SeaData - Fishing Logbook", "Trackwell - SeaData - Fishing Log", "Trackwell - TrackWell - Fishing Log", "Trackwell - Trackwell - Fishing Log", "XML Spy"]
        description: >
          The app that sent the message, its HUGBUNADUR without the version (e.g. "Trackwell -
          TrackWell - Fishing Log"); NA on the 4,400 messages that name none (Oracle's receipt
          names none for them either).
      - name: app_version
        type: string
        examples: ["1.1.0.0", "1.1.9.0", "2.6.26.0", "2.7.1.0", "4.4"]
        description: >
          The app's version, the numbers ending HUGBUNADUR (e.g. "2.6.7.0").
      - name: port
        type: string
        examples: ["Akranes", "F<U+00E1>skr<U+00FA><U+00F0>sfj<U+00F6>r<U+00F0>ur", "Keflav<U+00ED>k", "Stykkish<U+00F3>lmur", "<U+00DE><U+00F3>rsh<U+00F6>fn"]
        description: >
          The landing port's name (curated/reference/port.parquet).
      - name: pid2
        type: string
        examples: ["IS-AKR", "IS-DRA", "IS-HVM", "IS-SAN", "IS-VPN"]
        description: >
