  - name: logbook_lid_map
    source:
      parquet: ../../fishydata/curated/logbook/lid_map.parquet
    description: >
      One row per logbook trip matched to a landing trip: a .tid -> .lid
      crosswalk (curate/link_lid_map.R), built by an eight-step cascade of
      decreasing key specificity (exact vid x date x hid, relaxing the date
      window, then catch-weight tiebreaking, then a wrong-date QA pass).
      match_type records which step produced the match. Not written back into
      trip.parquet - a consumer joins this on separately.
    todo: |
      - Record a `primary_key`, if present.
    columns:
      - name: .tid
        type: string
        examples: ["-1007642", "-648142", "103733035", "105785128", "79358526"]
        description: >
          Logbook trip id.
        todo: |
          - Specify `constraints`. Some options suggested by the data (distinct
            count is approximate):
            - constraints: [required, unique] # values look distinct & present
            - constraints: [primary_key] # values look distinct & present
            - constraints: [required] # all values present
      - name: schema
        type: string
        examples: [adb, afli, fs_afladagbok]
        description: >
          Which logbook source system the trip came from.
        todo: |
          - Only 3 distinct values. Is this an enum? If so change `string` to
            `enum` and `examples` to `values`.
          - Specify `constraints`. Some options suggested by the data:
            - constraints: [required] # all values present
      - name: .lid
        type: number
        range: [6439, 4502971185386244]
        examples: [319773, 344014, 405846, 578252, 797525]
        description: >
          Matched landing trip id (landing_landings..lid); present only
          where the cascade found an unambiguous match. Renamed from
          `.tid_land` (curate/plans/007 §3). This table does NOT carry
          landing_landings' own `schema` (agf/lods) alongside this value -
          `curate/link_lid_map.R` renames it to `schema_land` internally
          purely to avoid colliding with this table's own `schema` column
          (the logbook source system), and does not carry it into the final
          output - so a value collision across landing_catch's two source
          schemas cannot be detected or resolved from this table alone
          (curate/plans/007 §6 item 3).
        todo: |
          - Pick a more specific numeric type, and keep whichever of `range` and
            `examples` is appropriate.
          - Specify `constraints`. Some options suggested by the data:
            - constraints: [required] # all values present
      - name: match_type
        type: string
        examples:
          - 01 exact
          - 02 exact ±1 day
          - 03 vid_date
          - 04 vid_date ±1
          - 05 vid_date ±2
          - 06 weight_dem
          - 08 expected_date
        description: >
          Which of the eight cascade steps produced this match, e.g. "01 exact" (vid x
          date x hid), "05 vid_date ±2", "06 weight_dem" (catch-weight tiebreak), "08
          expected_date" (wrong-date QA). See curate/link_lid_map.R.
        todo: |
          - Only 7 distinct values. Is this an enum? If so change `string` to
            `enum` and `examples` to `values`.
          - Specify `constraints`. Some options suggested by the data:
            - constraints: [required] # all values present
      - name: schema_land
        type: string
        description: >
          The landing's system: agf or lods.
      - name: date_land
        type: date
        description: >
          The landing's own date (not the shifted copy a cascade step matched).
      - name: hid_land
        type: number
        description: >
          The landing's port code (hid), the landing system's own.
      - name: pid_land
        type: string
        description: >
          The landing's port id (pid).
      - name: n_trips
        type: number
        description: >
          Trips on the landing; above 1 is a declared many-to-many (plan 014).
