  - name: vessel_mmsi
    source:
      parquet: ../../fishydata/curated/vessel/mmsi.parquet
    description: >
      The Icelandic MMSI archive: one row per MMSI and holder period, rebuilt from every source held (the
      Fjarskiptastofa lists, the Oracle snapshots, the `vessel` schema's MMSI table, the old archive's
      hand-set windows and the confirmed corrections), each row evidence with its sources and dates (plan
      016 §4 step 1, reference/vessels/mmsi.R). An MMSI has one holder at a time: the script stops on an
      overlap. vessel.parquet takes one current vessel MMSI per vid from here.
    details: >
      Windows from list dates are coarse: the sources are dated 2019, 2020, 2022 and 2024-26. A
      single-holder MMSI is opened to all time by curate/ais_ping_union.R anyway, so the windows matter
      where an MMSI has several holders. Added 2026-10-23 by Claude (AI-assisted), from the script and the
      built file (TODO 51).
    columns:
      - name: mmsi
        type: string
        examples: ["002510000", "251361540", "251808940", "992511096", "992518001"]
        constraints: [primary_key]
        description: >
          Maritime Mobile Service Identity, as text. With `zombie_no`, the row's key.
      - name: mmsi_cat
        type: string
        examples: [Child vessel, Navigational aid, SAR aircraft, testing, vessel]
        description: >
          What the MMSI is: ramb::rb_classify_mmsi() from its digits, with a few set by hand (a SAR
          aircraft, test transmitters).
      - name: sknr
        type: string
        examples: ["0133", "2480", "6171", "7331", SKBXXX]
        description: >
          The holder's registration number as the source writes it ("0741"), or an SKB pleasure craft's code.
      - name: vid
        type: number(id)
        examples: [12, 2427, 6134, 7295, 102772]
        description: >
          The holder: the registration number as an integer ("0741" and 741 are one hull), or for an SKB
          pleasure craft 100000 + its number (plan 016 §5). NA where the holder is not a numbered hull.
      - name: cs
        type: string
        examples: [TFA, TFET, TFJQ, TFRK, TFZZ]
        description: >
          Call sign, as the sources give it.
      - name: nafn
        type: string
        display: restricted
        examples: [VESSEL NAME, Company ehf, Buoy name]
        description: >
          The name in the list: a vessel's name, or for a station, buoy or test transmitter its owner's,
          sometimes with an address. The examples are made up.
      - name: note
        type: string
        display: restricted
        examples: [Afskráður 1.1.2020, Seldur 15.3.2018, Sökk 2011]
        description: >
          The list's free-text note (athugasemdir), or Oracle's, from which `note_date` and `note_fate` are
          read. It can name a buyer. The examples are made up.
      - name: note_date
        type: date
        range: [1997-02-21, 2026-02-04]
        description: >
          The date read from the note (day, month, year); NA where it has none.
      - name: note_fate
        type: enum
        values:
          Fórst: lost (sank or burnt)
          Niðurrif: scrapped
          Seldur: sold
          Afskráður: deregistered
          Úr rekstri: out of service
        description: >
          The hull's fate read from the note's words; NA where the note names none.
      - name: mmsi_t1
        type: date
        range: [2007-06-01, 2026-06-16]
        description: >
          Start of the holder period: 2007-06-01 (STK begins) for an MMSI's first holder; for a later holder
          the day after the previous holder's deregistration date in its note, else the first source it
          appears in. A hand-set window of the old archive, or a correction, takes precedence.
      - name: mmsi_t2
        type: date
        range: [2007-06-01, 2028-12-24]
        description: >
          End of the holder period: the day before the next holder; for the last holder its deregistration
          date from the note, else open while the latest list or Oracle has it, else the last source it
          appears in. Open is written 2028-12-24, the archive's open-end marker kept so its readers need not
          change, which every reader takes as open (decision 183).
      - name: zombie_no
        type: number(ordinal)
        range: [1, 3]
        constraints: [primary_key]
        description: >
          The holder's order on the MMSI, 1 for its first. With `mmsi`, the row's key.
      - name: first_seen
        type: date
        range: [2019-06-27, 2026-06-16]
        description: >
          Date of the first source the MMSI and holder appear in together.
      - name: last_seen
        type: date
        range: [2019-06-27, 2026-06-16]
        description: >
          Date of the last source they appear in together.
      - name: current
        type: boolean
        description: >
          The latest list or Oracle has the pair, and the note does not say the hull is struck, scrapped or
          lost.
      - name: sources
        type: string
        examples:
          - list_2024-08-21+list_2024-11-07+list_2025-04-10
          - list_2024-08-21+list_2024-11-07+list_2025-04-10+list_2026-03-09+oracle_mmsi_icelandic_registry+oracle_vessel_mmsi_20190627+oracle_vessel_mmsi_20201215
          - list_2024-08-21+list_2024-11-07+list_2025-04-10+oracle_mmsi_icelandic_registry+oracle_vessel_mmsi_20190627+oracle_vessel_mmsi_20201215+oracle_vessel_mmsi_20220405
          - oracle_mmsi_icelandic_registry+oracle_vessel_mmsi
          - overrides/mmsi_broadcast.csv
        description: >
          The sources the pair appears in, joined by "+": a list as `list_<date>`, the Oracle snapshots by
          name, or the correction file.
      - name: window_basis
        type: enum
        values:
          default: the open defaults, 2007-06-01 to open
          list: dated by a list's date
          note: dated by a note's deregistration date
          reconstructed: a hand-set window of the old archive, or a correction
        description: >
          Where the window's dates came from.
      - name: basis
        type: enum
        values: [recorded, reconstructed]
        description: >
          `reconstructed` for a broadcast MMSI put in by a confirmed correction
          (curate/corrections/mmsi_broadcast_unregistered.yml), else `recorded`.
  - name: vessel_year
    source:
      parquet: ../../fishydata/curated/vessel/vessel_year.parquet
    description: >
      One row per vid in the `vessel` schema and year, 2007 to the build's year: the usage type, engine power
      and length in force that year, each with its basis and witnesses (plan 016 §4 step 5, plan 028 step 7,
      reference/vessels/vessel_year.R). vessel.parquet holds today's values for every year; the effort on a
      fix is kW x hours, so the trail takes the kW of the fix's own year from here. SKB pleasure craft are not
      in the register and have no row.
    details: >
      Each attribute takes the first that has it: `register` (the register's value in force on 1 July),
      `register_later` (its earliest value after that day, a hull registered later), `register_earlier` (its
      last before it, a hull struck before), `current` (the `vessel` schema's current value, for a hull the
      register never carries), or `none`. Added 2026-10-23 by Claude (AI-assisted), from the script and the
      built file (TODO 51).
    columns:
      - name: vid
        type: number(id)
        examples: [0, 1796, 4329, 6108, 9855]
        constraints: [primary_key]
        description: >
          Vessel identifier. With `year`, the row's key (the script stops otherwise).
      - name: year
        type: number(ordinal)
        range: [2007, 2026]
        constraints: [primary_key]
        description: >
          Calendar year.
      - name: mclass
        type: number(id)
        examples: [0, 44, 58, 69, 6304]
        description: >
          The `vessel` schema's usage-category code (the register PDFs' printed types mapped to it, decision
          136).
      - name: usage
        type: string
        examples:
          - "A - FLUTNINGASKIP - ANNAÐ"
          - "FRÍSTUNDAFISKISKIP"
          - "Nótaveiði/Skuttog ari"
          - "Skólaskip"
          - "Þangskurðar‐ prammi"
        description: >
          The register's usage type as text; NA unless `mclass_basis` is `register`.
      - name: mclass_basis
        type: enum
        values: [register, register_later, register_earlier, current, none]
        description: >
          Where `mclass` came from (see the table's details).
      - name: mclass_source
        type: string
        examples: ["", vessel]
        description: >
          The witnesses of `mclass` in the register's decisions, as source families joined by "+" (pdf,
          hreidar, vessel, kvoti...); empty where the decisions name none, NA where the basis is not the
          register.
      - name: segment
        type: string
        examples: [Distant waters, Multi, Other, Stern, other]
        description: >
          Hreiðar's segment (Megingerð), 2007-2021 (staging/hreidar/vessel_year.parquet); NA after 2021 and
          where his list has none.
      - name: kw
        type: number(quantity)
        units: kW
        range: [1, 12000]
        description: >
          The vessel's power (power_kw); the main engine's power stands in where power_kw is missing.
      - name: kw_basis
        type: enum
        values: [register, register_later, register_earlier, current, none]
        description: >
          Where `kw` came from (see the table's details).
      - name: kw_source
        type: string
        examples: [hreidar, review, vessel]
        description: >
          The witnesses of `kw`, as for `mclass_source`.
      - name: loa
        type: number(quantity)
        units: m
        range: [0.1, 172.95]
        description: >
          Length overall (max_length).
      - name: loa_basis
        type: enum
        values: [register, register_later, register_earlier, current, none]
        description: >
          Where `loa` came from (see the table's details).
      - name: loa_source
        type: string
        examples: [hreidar, hreidar+pdf, hreidar+vessel, pdf, vessel]
        description: >
          The witnesses of `loa`, as for `mclass_source`.
  - name: vessel_class
    source:
      parquet: ../../fishydata/curated/vessel/vessel_class.parquet
    description: >
      The fisheries-management class of each vessel over time (aflamark, krókaaflamark, strandveiðar,
      frístundaveiðar, ...): one row per vid and class period, [t1, t2) in whole days, from the ship
      register's history (plan 028 step 7, reference/vessels/vessel_class.R). A licence class, not the usage
      type (that is vessel_year's `mclass`): a boat in a frístundaveiðar class at the time of a fix is leisure
      fishing (the trail's `leisure`), and a boat with a fishing class and AIS but no logbook or landings in a
      year is a coverage gap (plan 016 §4 step 5).
    details: >
      Consecutive stretches of one class that touch are merged, and a gap (time off the register) is kept.
      The class names come from the code table, not the register's `operational_category`. Added 2026-10-23
      by Claude (AI-assisted), from the script and the built file (TODO 51).
    columns:
      - name: vid
        type: number(id)
        examples: [1, 1824, 2982, 6621, 9854]
        constraints: [primary_key]
        description: >
          Vessel identifier. With `t1`, the row's key: the script stops on overlapping periods.
      - name: class_code
        type: number(id)
        examples: [-14, 2, 20, 90, 101]
        description: >
          The register's class code (operational_category_no).
      - name: t1
        type: date
        range: [1901-01-01, 2026-05-08]
        constraints: [primary_key]
        description: >
          First day of the period.
      - name: t2
        type: date
        range: [1962-01-01, 2099-12-31]
        description: >
          The day after the period ends (exclusive). The last class is open, written 2099-12-31, and is
          carried, not observed, after `observed_to`.
      - name: class_name
        type: string
        examples:
          - Aflamarksheimild
          - "Hvalveiðiskip"
          - "Rækjubátur í Arnarfirði"
          - "Sóknarheimild"
          - "Þróunarsjóður"
        description: >
          The class's name, from the code table (vessel.operational_category); a code the table lacks takes
          the name the `vessel` schema's rows give it.
      - name: leisure
        type: boolean
        description: >
          TRUE for the frístundaveiðar classes (codes -11, 89, 95).
      - name: observed_to
        type: date
        range: [2026-06-16, 2026-06-16]
        description: >
          The `vessel` schema's last change in its history tables: after it a class is carried, not observed.
      - name: basis
        type: string
        examples: [recorded]
        description: >
          The register's basis of the merged stretches, joined by "+".
  - name: vessel_sign
    source:
      parquet: ../../fishydata/curated/vessel/vessel_sign.parquet
    description: >
      Call sign, local sign (ÍS-8) and name of each vessel over time: one row per kind, mark, vid and period
      [t1, t2), from the ship register's history (plan 016 §4 step 6b, plan 028 step 7,
      reference/vessels/vessel_sign.R). A vid is the hull for life; its marks wander between hulls, and hulls
      change name. A name is history for a reader, never a key: one name is on many hulls at once.
    details: >
      The register chooses one value per hull and column at a time and keeps it only while the hull is on
      the register, so a hull holds one mark of a kind at a time. Across hulls a call sign or local sign
      gets one holder at a time, bar a few periods flagged `conflict`. The examples show codes only. Added
      2026-10-23 by Claude (AI-assisted), from the script and the built file (TODO 51).
    columns:
      - name: kind
        type: enum
        values:
          cs: call sign
          uid: local sign (region letters and number)
          name: the vessel's name
        description: >
          Which mark the row holds.
      - name: key
        type: string
        examples: [GK274, KO253, SH444, VS006, TFAA, TFKN, TFZZ]
        description: >
          The mark for matching: upper case, Icelandic letters folded (Í -> I, Þ -> TH, ...), a local sign as
          letters and a 3-digit number (IS008, as vessel.parquet's `uid`).
      - name: vid
        type: number(id)
        examples: [1, 1230, 2475, 6492, 9855]
        description: >
          Vessel identifier.
      - name: value
        type: string
        examples: [GK-78, RE-48, SU-840, TFAA, TFKN]
        description: >
          The mark as the register writes it (TFBR, ÍS-8, a name in upper case).
      - name: t1
        type: date
        range: [1860-01-01, 2026-05-08]
        description: >
          First day of the period.
      - name: t2
        type: date
        range: [1861-01-02, 2099-12-31]
        description: >
          The day after the period ends (exclusive); 2099-12-31 is open.
      - name: source
        type: string
        examples: [hreidar, hreidar+kvoti.skipasaga+vessel, kvoti.skipasaga+pdf, pdf+samgongustofa, vessel]
        description: >
          The witnesses of the value in the register's decisions, joined by "+": pdf, hreidar,
          kvoti.skipasaga, ufs.skip_jn, vessel, samgongustofa, mbl.
      - name: window
        type: enum
        values:
          source: one stretch of the register
          merged: consecutive stretches of one value
          cut: closed where the next holder took the mark
          conflict: two hulls on one mark at once, for a reader to settle
        description: >
          How the period was made.
      - name: basis
        type: string
        examples: [recorded]
        description: >
          The register's basis.
  - name: staging_afli_sent_record
    source:
      parquet: ../../fishydata/staging/afli_sent/record.parquet
    description: >
      One row per record (FAERSLA) of every message afli's electronic logbook apps sent
      (fs_afli.afladagb_xml_mottaka, 565,192 messages, 2002-2024): what became of each copy. A record
      is sent again when changed (a higher VERSION) and sometimes unchanged in another message; the
      latest version of each record is the one staged in the other tables of staging/afli_sent. Plan
      037's sent layer; sources/afli_sent/convert.R.
    columns:
      - name: .xid
        type: number
        range: [16001, 566147001]
        examples: [14998007, 94505017, 246855001, 404210005, 534606002]
        description: >
          The copy's key: its message id x 1000 + its ordinal in the message (`mid`, `rec`).
      - name: mid
        type: number
        range: [16, 566147]
        examples: [14998, 94505, 246855, 404210, 534606]
        description: >
          The message (afladagb_xml_mottaka.id).
      - name: rec
        type: number
        range: [1, 533]
        examples: [1, 2, 6, 13, 55]
        description: >
          The record's ordinal in its message, from 1.
      - name: vid
        type: number
        range: [5, 9999]
        examples: [1019, 1451, 1976, 2586, 2893]
        description: >
          The vessel: the message's SKIP_NR as sent. Oracle's receipt (skip_nr) is NULL on 11,440
          copies whose message names it.
      - name: visir_sent
        type: number
        range: [-15834, 116372682]
        examples: [112, 932, 3032, 8645, 78552860]
        description: >
          The record's VISIR as sent: the app's own number, reused by the apps years apart, so not
          an identity alone.
      - name: version
        type: number
        range: [0, 20]
        examples: [1]
        description: >
          The record's VERSION as sent.
      - name: date
        type: datetime
        time_zone: naive
        range: [1899-12-30T00:00:00, 2099-11-01T00:00:00]
        description: >
          The fishing date (STOFN/VEDAGS) as sent, at 00:00: a date only.
      - name: received
        type: datetime
        time_zone: naive
        range: [2002-12-05T10:32:14, 2024-07-12T14:59:03]
        description: >
          When Oracle received the message (afladagb_xml_mottaka.snt).
      - name: test_message
        type: boolean
        description: >
          The message is marked a test (afladagb_xml_mottaka.gerd = 9).
      - name: .sid
        type: number
        range: [-10556515003, -379]
        examples: [-1274128, -998904, -660872, -332853, -69942]
        description: >
          The record this copy is a copy of, as staged (station.parquet's .sid). NA for a copy in a
          test message that belongs to no loaded record.
      - name: .sid_loaded
        type: number
        range: [-1326693, -379]
        examples: [-1260779, -997000, -667422, -337826, -73548]
        description: >
          The rafr_stofn row this copy was loaded as (the lesser of two for the 34 copies Oracle
          loaded twice); NA where Oracle did not load it. With .sid it maps every rafr_stofn row
          found in its message to its staged record: 15,916 rows are another version of a record,
          or the same version loaded again, and not the record's .sid.
      - name: n_sid
        type: number
        range: [0, 2]
        examples: [0, 1]
        description: >
          How many rafr_stofn rows the copy was loaded as: 2 for the 34 sent records Oracle loaded
          twice from one message, 0 for copies Oracle did not load.
      - name: copy_loaded
        type: boolean
        description: >
          This copy is the one Oracle loaded: the source of a rafr_stofn row (its
          xml_sending_visir, xml_faerslu_version and xml_faerslu_visir).
      - name: key_form
        type: number
        range: [1, 3]
        examples: [1]
        description: >
          Where copy_loaded: the form of the sent VISIR in rafr_stofn.xml_faerslu_visir, tried in
          this order: 1 as sent, 2 negated, 3 -(1,000,000 + VISIR) (2003-2011).
      - name: .xid_staged
        type: number
        range: [107001, 566147001]
        examples: [15120001, 94024007, 244175120, 401236003, 534550001]
        description: >
          The staged copy of its record (the highest VERSION, then the copy Oracle loaded, then the
          last received).
      - name: version_staged
        type: number
        range: [1, 20]
        examples: [1]
        description: >
          The staged copy's VERSION.
      - name: version_loaded
        type: number
        range: [1, 12]
        examples: [1]
        description: >
          The VERSION of the record's copy Oracle loaded; NA where Oracle loaded none.
      - name: staged
        type: boolean
        description: >
          This copy is the one staged for its record.
      - name: outcome
        type: enum
        values: ["loaded", "loaded, a newer version sent", "loaded, the same version staged from another message", "never loaded", "newer than the loaded one", "older version", "repeated in the message", "same haul as a loaded record, another VISIR", "same version, other message", "test message"]
        description: >
          What became of the copy, one each: "loaded" (Oracle loaded it, and it is staged); "newer
          than the loaded one" (staged: a later version than the one Oracle loaded); "never loaded"
          (staged: Oracle holds no version of the record); "loaded, a newer version sent" (Oracle
          loaded it as a row of its own, and a later version is staged); "loaded, the same version
          staged from another message" (Oracle loaded the same version twice, from two messages);
          "older version" (a later version of its record was sent); "same version, other message"
          (its record's version is staged from another copy); "same haul as a loaded record,
          another VISIR" (not loaded, and not a version of a loaded record by VISIR and date, but
          the same vessel, date, gear section and a sent time as a loaded record: the haul sent
          again under another number, kept with that record and never staged); "repeated in the
          message" (the same VISIR and VERSION again in its message); "test message" (in a test
          message, and a version of no loaded record). A copy is a version of a loaded record when
          it has the same vessel and VISIR and a date within 31 days of that record's loaded copy.
      - name: schema
        type: enum
        values: ["afli"]
        description: >
          The source system: always "afli" (the layer is in `layer`).
      - name: layer
        type: enum
        values: ["sent"]
        description: >
          The layer of afli's electronic logbook the row is from (plan 037 <c2><a7>2): always
          "sent", the XML the app sent.
      - name: app
        type: enum
        values: ["SeaData - Fishing Log", "SeaData - Fishing Logbook", "Trackwell - SeaData - Fishing Log", "Trackwell - TrackWell - Fishing Log", "Trackwell - Trackwell - Fishing Log", "XML Spy"]
        description: >
          The app that sent the message, its HUGBUNADUR without the version (e.g. "Trackwell -
          TrackWell - Fishing Log"); NA on the 4,400 messages that name none (Oracle's receipt
          names none for them either).
      - name: app_version
        type: string
        examples: ["1.1.0.0", "1.3.0.0", "2.6.26.0", "2.7.0.0", "4.4"]
        description: >
          The app's version, the numbers ending HUGBUNADUR (e.g. "2.6.7.0").
  - name: staging_afli_sent_trip
    source:
      parquet: ../../fishydata/staging/afli_sent/trip.parquet
    description: >
      One row per trip of afli's electronic records as sent, derived as sources/afli/convert.R derives
      afli's: the staged records of a vessel that share the landing date and port they were sent with
      (STOFN/LONDUN). Plan 037's sent layer; sources/afli_sent/convert.R.
    columns:
      - name: .tid
        type: number
        range: [-10556246012, -379]
        examples: [-1277340, -1037782, -743146, -440001, -129183]
        description: >
          Trip key: the least Oracle .sid among its records, so it equals the edited layer's .tid
          where the grouping is the same; the least .sid where Oracle loaded none of them.
      - name: vid
        type: number
        range: [5, 9999]
        examples: [967, 1636, 2457, 2732, 2893]
        description: >
          The vessel, the message's SKIP_NR.
      - name: T1
        type: datetime
        time_zone: naive
        range: [1899-12-30T00:00:00, 2024-06-27T00:00:00]
        description: >
          The trip's first fishing date (VEDAGS), at 00:00: no departure is sent.
      - name: T2
        type: datetime
        time_zone: naive
        range: [2001-10-03T00:00:00, 2024-06-27T00:00:00]
        description: >
          The landing date its records were sent with (STOFN/LONDUN@DAGSETNING), at 00:00. Oracle
          replaces it on loading with the landing confirmation's on many records, and in-house
          edits change it again: the edited layer's differs on 133,174 of 1,274,136 shared stations
          (Claude, 2026-10-21).
      - name: hid2
        type: number
        range: [-1, 3477]
        examples: [11, 21, 65, 97, 147]
        description: >
          The landing port its records were sent with (STOFN/LONDUN@HOFN), afli's port code.
      - name: n_crew
        type: number
        range: [-4, 99]
        examples: [2, 3, 4, 9, 15]
        description: >
          Crew (STOFN/AHOFN) of the trip's key record (the one whose .sid is .tid).
      - name: schema
        type: enum
        values: ["afli"]
        description: >
          The source system: always "afli" (the layer is in `layer`).
      - name: layer
        type: enum
        values: ["sent"]
        description: >
          The layer of afli's electronic logbook the row is from (plan 037 <c2><a7>2): always
          "sent", the XML the app sent.
      - name: app
        type: enum
        values: ["SeaData - Fishing Log", "SeaData - Fishing Logbook", "Trackwell - SeaData - Fishing Log", "Trackwell - TrackWell - Fishing Log", "Trackwell - Trackwell - Fishing Log", "XML Spy"]
        description: >
          The app that sent the message, its HUGBUNADUR without the version (e.g. "Trackwell -
          TrackWell - Fishing Log"); NA on the 4,400 messages that name none (Oracle's receipt
          names none for them either).
      - name: app_version
        type: string
        examples: ["1.1.0.0", "1.1.9.0", "2.6.26.0", "2.7.1.0", "4.4"]
        description: >
          The app's version, the numbers ending HUGBUNADUR (e.g. "2.6.7.0").
      - name: port
        type: string
        examples: ["Akranes", "F<U+00E1>skr<U+00FA><U+00F0>sfj<U+00F6>r<U+00F0>ur", "Keflav<U+00ED>k", "Stykkish<U+00F3>lmur", "<U+00DE><U+00F3>rsh<U+00F6>fn"]
        description: >
          The landing port's name (curated/reference/port.parquet).
      - name: pid2
        type: string
        examples: ["IS-AKR", "IS-DRA", "IS-HVM", "IS-SAN", "IS-VPN"]
        description: >
          The landing port in the standard port key.
  - name: staging_afli_sent_station
    source:
      parquet: ../../fishydata/staging/afli_sent/station.parquet
    description: >
      One row per staged record of afli's electronic logbook as the apps sent it: the latest version of
      each record (see record.parquet). Plan 037's sent layer, keyed so that .sid is the edited layer's
      (staging/afli/station.parquet) wherever Oracle loaded the record; values only from the message,
      nothing from the loaded or edited layers. sources/afli_sent/convert.R.
    columns:
      - name: .sid
        type: number
        range: [-10556515003, -379]
        examples: [-1274920, -1008235, -675683, -342301, -74427]
        description: >
          Station key. Where Oracle loaded the record: rafr_stofn.visir of its row, found through
          the message id, VERSION and VISIR in one of its three forms (record.key_form). Oracle
          loads some versions as rows of their own, so a vessel's loaded rows of one VISIR within
          31 days are one record. Its .sid is the one row Oracle did not delete (rafr_stofn.eytt 0)
          where exactly one is (plan 037 ask i, option b, 2026-10-22), else the row loaded from its
          highest version (then the last received); sid_row says which. It is the edited layer's
          .sid on 1,273,674 of the 1,302,406 records Oracle loaded (Claude, 2026-10-22);
          record.parquet maps every other row. Where Oracle holds no version: -(10^10 + .xid of the
          record's first copy), outside every Oracle id. Unique.
      - name: .tid
        type: number
        range: [-10556246012, -379]
        examples: [-1272319, -1005643, -674698, -341994, -74204]
        description: >
          The trip (trip.parquet).
      - name: .xid
        type: number
        range: [107001, 566147001]
        examples: [16035025, 98847025, 252044034, 406843002, 535760004]
        description: >
          The staged copy (record.parquet). Unique.
      - name: date
        type: datetime
        time_zone: naive
        range: [1899-12-30T00:00:00, 2099-11-01T00:00:00]
        description: >
          The fishing date (STOFN/VEDAGS) as sent, at 00:00.
      - name: lon1
        type: number
        range: [-180.0833333, 174.9719444]
        examples: [-26.33333333, -24.09833330, -22.59888890, -17.36666667, -11.81666667]
        description: >
          Start longitude, decimal degrees, as sent: STOFN/POS@LON (decimal degrees to the
          arc-second, west negative), else STOFN/STADSETNING@LENGD (the older apps' DDMM, west
          positive, read as sources/afli/convert.R reads Oracle's). Placeholders such as 0 are kept
          as sent.
      - name: lat1
        type: number
        range: [-66.2333333, 90.98333333]
        examples: [63.20000000, 63.84611110, 64.95000000, 66.21722220, 67.08333333]
        description: >
          Start latitude, decimal degrees, as sent: STOFN/POS@LAT, else STOFN/STADSETNING@BREIDD
          (DDMM).
      - name: lon2
        type: number
        range: [-180, 180]
        examples: [-26.20000000, -24.06666667, -22.57833330, -17.55611110, -11.72777780]
        description: >
          End longitude, decimal degrees, as sent: STOFN/POS_END@LON (never loaded by Oracle), else
          STOFN/STADSETNING_LOK@LENGD (DDMM; the value Oracle overwrote with the end latitude on
          many 2010-2012 records, decision 158).
      - name: lat2
        type: number
        range: [-65.6027778, 90]
        examples: [63.19805560, 63.86666667, 64.98138890, 66.25833330, 67.10555560]
        description: >
          End latitude, decimal degrees, as sent: STOFN/POS_END@LAT, else
          STOFN/STADSETNING_LOK@BREIDD (DDMM).
      - name: pos1_form
        type: enum
        values: ["ddmm", "degrees"]
        description: >
          The start position's form: "degrees" (POS) or "ddmm" (STADSETNING, to the minute); NA
          where none was sent.
      - name: pos2_form
        type: enum
        values: ["ddmm", "degrees"]
        description: >
          The end position's form, as pos1_form.
      - name: sq
        type: number
        range: [-12632, 3230]
        examples: [319, 372, 474, 623, 719]
        description: >
          Statistical rectangle (reitur), derived from lat1, lon1 (geo::d2r, as Oracle derives
          rafr_stofn.reitur).
      - name: ssq
        type: number
        range: [1, 4]
        examples: [1, 2, 3, 4]
        description: >
          Sub-rectangle (smareitur, 1-4), derived from lat1, lon1 (geo::d2sr).
      - name: sq_basis
        type: enum
        values: ["derived"]
        description: >
          "derived" where sq and ssq are computed, "none" where no start position was sent.
      - name: z1_raw
        type: number
        range: [-1, 14795]
        examples: [27.432, 75.000, 140.000, 238.000, 514.000]
        description: >
          Start depth, STOFN/DYPI as sent (decimal commas read as points). Its unit is not decided
          here: SeaData 1.x sent fathoms, the later apps mostly metres, Fishing Log 2.6 and 2.7
          fathoms on some vessels in some periods (the TODO 113 notes); the per-vessel-period unit
          test is curate/'s.
      - name: z2_raw
        type: number
        range: [-2, 1047281]
        examples: [23.89631996, 77.00000000, 146.00000000, 243.00000000, 530.00000000]
        description: >
          End depth, STOFN/DYPI_LOK as sent; unit as z1_raw. Some values are negative as sent.
      - name: record_closed
        type: datetime
        time_zone: naive
        range: [2000-11-29T13:12:44, 2095-09-05T04:38:25]
        description: >
          When the record was closed in the app (FAERSLA_LOKUD), never loaded by Oracle.
      - name: edited_after_closing
        type: boolean
        description: >
          STOFN@BREYTT_EFTIR_LOKUN as sent: true where the app marked the record changed after
          closing (669 copies); NA where absent. Oracle stores it as 0.
      - name: version
        type: number
        range: [1, 20]
        examples: [1]
        description: >
          The staged copy's VERSION.
      - name: n_versions
        type: number
        range: [1, 12]
        examples: [1]
        description: >
          Distinct VERSIONs sent of the record under its own VISIR.
      - name: n_copies
        type: number
        range: [1, 606]
        examples: [1, 2]
        description: >
          Copies of the record sent under its own VISIR (versions, resends and repeats).
      - name: n_other_visir
        type: number
        range: [0, 10]
        examples: [0]
        description: >
          Copies of the same haul sent under another VISIR (record.outcome "same haul as a loaded
          record, another VISIR").
      - name: loaded
        type: boolean
        description: >
          Oracle holds a version of the record (.sid is Oracle's).
      - name: copy_loaded
        type: boolean
        description: >
          The staged copy is the one loaded as the record's .sid row; false on the 5 records whose
          latest version Oracle did not load.
      - name: version_loaded
        type: number
        range: [1, 12]
        examples: [1]
        description: >
          The VERSION of the copy loaded as the record's .sid row; NA where Oracle loaded none.
      - name: n_oracle_rows
        type: number
        range: [0, 12]
        examples: [1]
        description: >
          rafr_stofn rows that hold the record: more than 1 where Oracle loaded several versions,
          or one version twice, as rows of their own (14,370 records); 0 where it loaded none.
      - name: sid_row
        type: enum
        values: ["latest", "only", "undeleted"]
        description: >
          Which of Oracle's rows .sid is: "only" (the record's one row), "undeleted" (the one row
          of several that Oracle did not delete, rafr_stofn.eytt 0), "latest" (of several, none or
          more than one undeleted: the row loaded from the highest version); NA where Oracle loaded
          none.
      - name: schema
        type: enum
        values: ["afli"]
        description: >
          The source system: always "afli" (the layer is in `layer`).
      - name: layer
        type: enum
        values: ["sent"]
        description: >
          The layer of afli's electronic logbook the row is from (plan 037 <c2><a7>2): always
          "sent", the XML the app sent.
      - name: app
        type: enum
        values: ["SeaData - Fishing Log", "SeaData - Fishing Logbook", "Trackwell - SeaData - Fishing Log", "Trackwell - TrackWell - Fishing Log", "Trackwell - Trackwell - Fishing Log", "XML Spy"]
        description: >
          The app that sent the message, its HUGBUNADUR without the version (e.g. "Trackwell -
          TrackWell - Fishing Log"); NA on the 4,400 messages that name none (Oracle's receipt
          names none for them either).
      - name: app_version
        type: string
        examples: ["1.1.0.0", "1.1.9.0", "2.6.26.0", "2.7.1.0", "4.4"]
        description: >
          The app's version, the numbers ending HUGBUNADUR (e.g. "2.6.7.0").
  - name: staging_afli_sent_fishing_sample
    source:
      parquet: ../../fishydata/staging/afli_sent/fishing_sample.parquet
    description: >
