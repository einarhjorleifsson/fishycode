  - name: link_station_event
    source:
      parquet: ../../fishydata/curated/link/station_event.parquet
    description: >
      One row per logbook station and event time it carries (t1 setting start, t2 setting end / gear on the
      bottom, t3 hauling start, t4 hauling end): the fix that bounds the event's phase - the next fix for a start
      (t1, t3), the previous for an end (t2, t4) - how far it is, and the gap between the fixes on either side
      (curate/link_station_event.R, ramb::rb_link_record_events(); decision 088). The fixes from a t1 fix to its
      t2 fix are the setting, from a t3 fix to its t4 fix the hauling; a tow is the fixes strictly between its t2
      and t3 fixes. A fix bounds the events of at most one station and one phase of it: when two would share it,
      the event nearer in time keeps it, then the earlier event, then the lower (.sid, schema) (decisions 090,
      091).
    details: >
      Key: (.sid, schema, event), one row each. The spec has no key over several columns, so it is stated here.
    columns:
      - name: .sid
        type: number
        examples: [1, 2]
        description: >
          The logbook station. A station is (.sid, schema).
      - name: schema
        type: string
        examples: [adb, afli, fs_afladagbok]
        description: >
          Logbook source of the station.
      - name: vid
        type: number
        examples: [1421, 2835]
        description: >
          The vessel.
      - name: event
        type: string
        examples: [t1, t2, t3, t4]
        description: >
          Which event time: the column name in station_window.parquet.
      - name: event_time
        type: string
        examples: ["2023-06-01 04:12:00"]
        description: >
          The event time as the station window reads it (adb's towed start and end already moved to t2/t3).
      - name: event_basis
        type: string
        examples: [derived, recorded]
        description: >
          "recorded", or "derived" for afli's tow end (t2 plus the towing time). Both are matched alike.
      - name: event_flag
        type: string
        examples: [suspect_clock]
        description: >
          "suspect_clock" for a clock value far commoner than its neighbours, which reads as "time unknown": afli
          set starts at 23:59, fs_afladagbok tow starts at 00:00. NA otherwise. Still matched.
      - name: time
        type: string
        examples: ["2023-06-01 04:13:05"]
        description: >
          The bounding fix's time (in curated/ais/ping); NA when it lies more than an hour from the event, or
          went to a nearer event of another station or phase (ping_lost).
      - name: dt_s
        type: number
        examples: [-120, 0, 65]
        description: >
          time - event_time, in seconds: at least 0 for t1 and t3, at most 0 for t2 and t4; NA with time.
      - name: gap_s
        type: number
        examples: [0, 330, 640]
        description: >
          Seconds between the last fix at or before the event and the first at or after it: how precisely the
          track can place the event. 0 when a fix falls on it, NA when the track does not reach both sides.
      - name: ping_lost
        type: boolean
        examples: [false, true]
        description: >
          TRUE when the bounding fix, within the hour, went to a nearer event of another station or of the other
          phase of this one (decision 091); time and dt_s are then NA, and gap_s says how sparse the track was.
