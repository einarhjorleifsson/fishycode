        range: [2024-06-01T00:05:28, 2024-06-30T23:59:55]
        description: >
          Time of the fix, UTC.
      - name: .sid
        type: number
        examples: [-1326692, 329366, 332269, 335191, 384496]
        description: >
          The logbook station.
      - name: schema
        type: string
        examples: [afli, fs_afladagbok]
        description: >
          Logbook source; the station is (.sid, schema).
      - name: .tid
        type: string
        examples: ["-1326685", "146251", "153722", "162205"]
        description: >
          The station's logbook trip.
      - name: gear
        type: string
        examples: [DRB, FPO, LHM, OTB, SDN]
        description: >
          Gear code.
      - name: target
        type: string
        examples: [CRU, DEF, DES, SPF, SWD]
        description: >
          Target group of the station's gear (the middle part of `metier`), as in logbook_gear.
      - name: target2
        type: string
        examples: [DEF, DES, GHL, LUM, SPF, SWD]
        description: >
          Finer target of the station's gear (the last part of `metier`), as in logbook_gear.
      - name: gear_class
        type: string
        examples: [jigged, other, static, towed]
        description: >
          `static`, `towed`, `jigged` or `other`.
      - name: phase
        type: string
        examples: [day, jig, set, tow]
        description: >
          `tow`, `haul`, `set`, `jig` or `day`.
      - name: phase_frac
        type: number
        examples: [0, 0.247166, 0.497686, 0.749907, 0.999979]
        description: >
          Position within the phase window (0-1); NA for `day`.
      - name: win_basis
        type: string
        examples: [capped, derived, recorded, synthesised]
        description: >
          How the window was drawn.
      - name: events
        type: string
