  - name: logbook_catch_flag
    source:
      parquet: ../../fishydata/curated/logbook/catch_flag.parquet
    description: >
      One row per (logbook station, species) whose catch the trip's landing contradicts: the trip logged more of
      the species than 10 times what its linked landings hold of it, and at least 1,000 kg more (plan 038 §8 step
      1c, decision 216; curate/corrections/catch_landing_contradicted.{yml,R}). A flag, never a corrected value:
      the kilograms stay in logbook_catch and on the fixes, where ais_catch carries them as `kg_flagged`. The
      landings are those lid_map links to the trip, with the landing's own schema. Duplicate twins and catch let
      go (negative codes) are left out. A trip with no linked landing, or whose landing holds none of the species,
      is not judged here. Not yet in the store: built with the next rebuild; the ranges are a scratch build's of
      2026-10-23 (87,838 rows on 8,703 trip-species pairs, 294 kt).
    constraints:
      - assert: trip_kg_landed > 0 AND trip_kg_logged > 10 * trip_kg_landed AND trip_kg_logged - trip_kg_landed >= 1000
        description: The margin, on every row.
      - assert: sid = sid_landing OR (sid = 830 AND sid_landing = 30)
        description: The logbook's code, compared as the landings record it.
      - assert: kg > 0 AND sid >= 0
        description: Catch kept, with a weight.
    columns:
      - name: .sid
        type: number
        constraints: [primary_key]
        description: >
          The station, as in logbook_station; unique with schema.
      - name: schema
        type: enum
        values: [afli, fs_afladagbok, adb, aflaskeyti]
        constraints: [primary_key]
        description: >
          The logbook source system, as in logbook_station.
      - name: .tid
        type: string
        description: >
          The station's logbook trip, as in logbook_station: the trip whose logged and landed kilograms are
          compared.
      - name: sid
        type: number
        constraints: [primary_key]
        description: >
          Species, the logbook's code, as in logbook_catch.
      - name: kg
        type: number
        range: [1, 9999999]
        description: >
          The station's kilograms of `sid` (logbook_catch.catch, summed over the station's rows of it).
      - name: sid_landing
        type: number
        description: >
          The code compared with the landings: `sid`, except the logbook's 830 (herring, Atlanto-Scandian stock)
          as the landings' 30. The stock is not compared here.
      - name: trip_kg_logged
        type: number
        range: [1013, 9999999]
        description: >
          The trip's logged kilograms of `sid_landing`, every station of the trip with it.
      - name: trip_kg_landed
        type: number
        range: [0, 139024]
        description: >
          What the trip's linked landings hold of `sid_landing`, kg. Over 0 on every row; three pairs rest on a
          positive landing row under 1 kg.
      - name: flag
        type: enum
        values: [landing_contradicts]
        description: >
          The rule that flagged the row; one value so far.
