    terms:
    - time interval
    - truncated
    - minimum reporting frequency
    - Article 11 of the NEAFC Scheme of Control and Enforcement
  - topic: reported speed against derived speed
    step: ping
    box: other
    theme: data quality of submissions
    kind: finding
    pages: 105-106
    pdf_pages: 111-112
    summary: Reported speeds were much better than in earlier years and were checked
