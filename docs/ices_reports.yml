      terms (the report's own words)
    code: name; what; language; where; does; formats; limits; pages; pdf_pages
    vocabulary: term (verbatim); meaning (paraphrase); pages
reports:
- report:
    id: WGSFD_2019
    file: WGSFD_2019.pdf
    doi: 10.17895/ices.pub.5648
    licence: 'reproduction only with permission of the copyright holder: paraphrase
      and cite'
    title: Working Group on Spatial Fisheries Data (WGSFD)
    series: ICES Scientific Reports 1:52
    year: 2019
    meeting: 24-28 June 2019, Lysekil, Sweden
    set_out_to_do: The group collates and analyses spatial fisheries data to describe
      fishing effort, intensity and frequency in European waters, in the first year
      of a three-year cycle. In 2019 it quality-checked the VMS and logbook data call
      for 2009-2018, compared AIS with VMS for MSFD seabed-disturbance assessment,
      tested finer grid resolutions, scoped static-gear effort indicators, studied
      displacement of fishing, and supported WKBEDPRES and WGDEC. It also began work
      on anonymity rules for higher-resolution products.
    parts:
    - 1 of 2, PDF pages 1-72
    - 2 of 2, PDF pages 73-150
    terms_of_reference:
    - id: a
      summary: Evaluate the AIS datasets available to the group, their fitness for
        advice, and whether AIS could enter the ICES VMS data call.
      pages: 3-21
    - id: b
      summary: Assess the need for and feasibility of a finer grid (0.01 instead of
        0.05 degree c-squares) in the data call, using interpolation and a voluntary
        test call.
      pages: 21-26
    - id: c
      summary: Develop spatial effort indicators for static gears.
      pages: 26-30
    - id: d
      summary: Identify drivers of fishing displacement and describe spatial conflicts,
        by modelling suitable fishing habitat and analysing effort near restricted
        areas and other sea uses.
      pages: 30-56
    - id: e
      summary: Support the WKBEDPRES workshop on benthic pressure layers, including
        options for finer-resolution fishing layers.
      pages: 56-59
    - id: f
      summary: Analyse NEAFC VMS data to support WGDEC on fishing near vulnerable
        marine ecosystems.
      pages: 59-66
    - id: g
      summary: Investigate how higher-resolution outputs affect vessel anonymity and
        agree a method that protects it.
      pages: '66'
    - id: a
      summary: Assess the AIS datasets available to the group, their fitness for advice,
        and whether AIS could enter the annual ICES VMS data call.
      pages: 85, 87-88
    - id: b
      summary: Test, through a voluntary interpolated data call by a few countries,
        moving from 0.05 to 0.01 degree c-squares, and weigh the risks of finer resolution.
      pages: '85'
    - id: c
      summary: Develop spatial effort indicators for static gears using soak time,
        gear length or hook numbers estimated from VMS, fleet and observer data.
      pages: 85-86
    - id: d
      summary: Identify drivers of fisheries displacement over time and model likely
        reallocation of effort when space is contested.
      pages: '86'
    - id: e
      summary: Give WKBEDPRES guidance on using non-fisheries datasets to assess physical
        disturbance of the seabed.
      pages: '86'
    - id: f
      summary: Map bottom-contacting fishing in NEAFC areas from NEAFC VMS and logbook
        data so WGDEC can combine them with VME distributions.
      pages: '86'
    - id: g
      summary: Analyse how much aggregated international VMS data fall under the three-vessel
        anonymity rule, compare ways of preserving anonymity and approve a method
        that keeps most information.
      pages: '87'
    data_call:
      summary: ICES called for aggregated VMS and logbook data for 2009-2018; the
        secretariat and the group checked submissions with a quality-control document,
        a standardised R script producing yearly summaries and difference maps, and
        a pre-meeting review, asking submitters to resubmit where needed. The 2015
        R workflow given to submitters was amended in 2019 to report the number of
        distinct vessels per c-square; Table 1 lists which countries submitted. The
        2019 ICES VMS and logbook data call aggregates by country, year, month, 0.05-degree
        c-square, gear and level-6 metier and newly carries the number of distinct
        vessels per record, so cells with fewer than three vessels can be withheld;
        the group tested replacing the count with a list of anonymised vessel ids,
        and an annex records the quality control of the 2019 submissions, corrections
        and annotations.
      pages: II, 1-2, 67, 74-75, 94-97
    outputs:
    - summary: Quality-check reports on each national submission, returned to data
        providers via the ICES Data Centre.
      pages: '2'
    - summary: Technical guidance on when and how AIS can be used to map fishing effort
        and seabed disturbance for the MSFD.
      pages: 18-21
    - summary: A table of costs and benefits of options for finer-resolution fishing
        layers, prepared for WKBEDPRES.
      pages: 56-59
    - summary: Maps, rasters and putative tows of NEAFC VMS fishing effort near VME
        closures, delivered to WGDEC.
      pages: 59-66
    - summary: A questionnaire to national delegates on static-gear data holdings,
        with a timeline for a possible data call.
      pages: '30'
    - summary: Maps by Benthis metier of c-squares with fewer than three vessels versus
        three or more, and a 2018 table of restricted cell proportions.
      pages: 67-74
    - summary: Guidelines for publishing sensitive VMS data and a test of anonymised
        vessel ids with Danish and Finnish 2018 data.
      pages: 74-75
    - summary: 'Four recommendations: a VMS governance group, a static gear questionnaire,
        PostgreSQL/PostGIS and an R Shiny Server at the Data Centre.'
      pages: '89'
    - summary: Responses to an economic questionnaire on valuing landings, and the
        static gear questionnaire form.
      pages: 90-93
    - summary: Audit trail of the quality control of the 2019 VMS and logbook submissions.
      pages: 94-97
    - summary: Analysis of 2018 NEAFC VMS data and maps of fishing near VMEs, delivered
        in a joint section with WGDEC and reviewed by RGVME.
      pages: 98-144
