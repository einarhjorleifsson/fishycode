    terms:
    - fishing effort is inferred
    - steaming
    - searching
    - mobile bottom gears
    - static gears
    - undefined gear types
  - topic: putative tows reviewed by hand
    step: fishing
    box: other
    theme: gear and activity classification
    kind: method
    pages: '106'
    pdf_pages: '112'
    summary: Consecutive fishing-speed pings of bottom-contacting gears are joined
      into tows, inspected manually to drop erroneous runs and plotted; tracks running
      along depth contours support that they are fishing.
    terms:
    - putative "tows"
    - manually reviewed
    - bathymetric contours
  - topic: vessels without recorded gear
    step: gear
    box: other
    theme: gear and activity classification
    kind: finding
    pages: '106'
    pdf_pages: '112'
    summary: As in the previous year, many vessels had no gear given and few gear
      types were reported; the ping counts per gear include large unknown and no-gear
      groups.
    terms:
    - No gear recorded
    - NIL
    - UNK
    - Grouping
    - Static Bottom
    - Mobile Bottom
    - Pelagic Gear
  - topic: maps of NEAFC fishing near VMEs
    step: effort
    box: hours
    theme: vmes
    kind: product
    pages: 107-117
    pdf_pages: 113-123
    summary: For each area, bottom-trawl tow tracks and gridded fishing hours for
      trawl, static and no-gear vessels are drawn over the VME index, VME closures,
      existing NEAFC fishing areas and EEZs.
    terms:
    - tow tracks
    - Gridded data (fishing hours)
    - existing NEAFC fishing areas
    - VME closures
  - topic: Hatton Bank fishing activity
    step: none
    box: ''
    theme: vmes
    kind: finding
    pages: 107-109
    pdf_pages: 113-115
    summary: Closures on both sides of Hatton Bank are largely respected, activity
      is lower than last year, a few trawl tows lie south of the north-east fishing
      area, and no static or no-gear activity was seen.
    terms:
    - well observed
    - existing fishing area
  - topic: Rockall Bank fishing activity
    step: none
    box: ''
    theme: vmes
    kind: finding
    pages: 109-112
    pdf_pages: 115-118
    summary: Fishing is most intense along the western edges of the Northwest Rockall
      closure and the Haddock Box, with a few tows in the south-west closure, low
      static-gear activity in open areas, and no-gear vessels along closure edges.
    terms:
    - Northwest Rockall closure
    - Haddock Box
    - artefact
  - topic: south of Iceland fishing activity
    step: none
    box: ''
    theme: vmes
    kind: finding
    pages: 112-114
    pdf_pages: 118-120
    summary: Activity near the Reykjanes Ridge resembles last year, concentrated north
      of the existing fishing area at about 2000 m, with low levels further south
      and in a corner of the northern MAR closure, all by trawlers or no-gear vessels.
    terms:
    - Reykjanes Ridge
    - northern mid-Atlantic ridge VME closure
  - topic: depth used to judge bottom contact
    step: gear
    box: other
    theme: gear and activity classification
    kind: method
    pages: 112, 114, 126
    pdf_pages: 118, 120, 132
    summary: 'Water depth is used to judge the real gear: trawling south of Iceland
      at 2000-3000 m is probably midwater trawling for redfish, no-gear activity below
      3000 m on the MAR is unlikely to touch bottom, and static gear west of Josephine
      at 3000-5000 m is likely pelagic longlining.'
    terms:
    - mid-water trawls targeting redfish
    - very unlikely to be with bottom contacting gears
    - longline gears targeting pelagic species
  - topic: Mid Atlantic Ridge seamounts activity
    step: none
    box: ''
    theme: vmes
    kind: finding
    pages: 114-115
    pdf_pages: 120-121
    summary: Only very limited no-gear activity occurred, outside the Southern MAR
      closure; the bottom trawling of earlier years was absent and no static gear
      was seen.
    terms: Southern MAR NEAFC VME closure
  - topic: Barents Sea NEAFC fishing activity
    step: none
    box: ''
    theme: vmes
    kind: finding
    pages: 115-117
    pdf_pages: 121-123
    summary: Fishing stays inside the existing fishing area apart from a few north-west
      tows, bottom trawlers work two main areas, no-gear vessels are densest in the
      north, and static gears are absent.
    terms:
    - bottom otter trawl
    - focus areas
  - topic: Josephine Seamount advice request
    step: none
    box: ''
    theme: vmes
    kind: request
    pages: '118'
    pdf_pages: '124'
    summary: A new 2021 NEAFC request asks for all VME information on Josephine and
      nearby seamounts and the fishing there, to advise on measures against significant
      adverse impacts of bottom fishing.
    terms:
    - significant adverse impacts
    - surrounding seamounts
  - topic: Josephine Seamount history of advice
    step: none
    box: ''
    theme: vmes
    kind: context
    pages: 118-119
    pdf_pages: 124-125
    summary: Josephine is an existing NEAFC bottom-fishing area and an OSPAR MPA since
      2011; ICES advised in 2013 a closure matching the MPA boundary, 2013 VMS showed
      no bottom fishing inside it, and the 2018 index gave medium likelihood with
      medium to low confidence.
    terms:
    - existing bottom fishing area
    - OSPAR High Seas MPA
    - VME Elements
  - topic: existing Josephine VME records
    step: none
    box: ''
    theme: vmes
    kind: finding
    pages: 119-121
    pdf_pages: 125-127
    summary: Nothing new was submitted in 2021, so the existing records are shown
      with their index (medium) and confidence outputs.
    terms:
    - VME indicator records
    - Medium
  - topic: OSPAR background document taxa
    step: none
    box: ''
    theme: vmes
    kind: finding
    pages: 121-124
    pdf_pages: 127-130
    summary: The OSPAR document and the literature it cites list an endemic gorgonian,
      dense gorgonian aggregations, sponges, scleractinians, stylasterids and black
      corals, some absent from the VME database and fit for the 2022 VME data call.
    terms:
    - endemic species
    - dense gorgonian aggregations
    - VME Data Call 2022
  - topic: GeoMar SO280 bathymetry
    step: none
    box: ''
    theme: vmes
    kind: finding
    pages: 124-125
    pdf_pages: 130-131
    summary: Multibeam mapping in 2020 shows a nearly flat-topped seamount with very
      steep southern slopes, suggesting but not confirming habitat for VME indicators.
    terms:
    - high resolution bathymetric mapping
    - near-flat topped seamount
  - topic: inferring VMEs from topography
    step: none
    box: ''
    theme: vmes
    kind: method
    pages: '125'
    pdf_pages: '131'
    summary: Because accelerated currents near summits and ridges favour corals and
      sponges, multibeam data plus ecological knowledge can indicate likely VME presence,
      in line with the precautionary approach.
    terms:
    - topographically induced flows
    - precautionary approach
    - UNGA 61/105
  - topic: Madeira-Tore EBSA proposal
    step: none
    box: ''
    theme: vmes
    kind: context
    pages: '126'
    pdf_pages: '132'
    summary: Josephine is part of a 2019 CBD proposal for an EBSA, which it meets
      on every criterion except naturalness because of fishing.
    terms:
    - Ecologically or Biologically Significant Marine Area (EBSA)
    - Naturalness
  - topic: NEAFC VMS on Josephine Seamount
    step: none
    box: ''
    theme: vmes
    kind: finding
    pages: 126-129
    pdf_pages: 132-135
    summary: Set longlines from two vessels dominate on the summit inside the existing
      footprint, one bottom trawler made three tows there at 200-250 m, very light
      trawling occurs near the Portuguese EEZ, and no no-gear vessels fished.
    terms:
    - static gear activity
    - LLS
    - OTB
    - existing fishing footprint
  - topic: catch composition supports gear use
    step: gear
    box: other
    theme: gear and activity classification
    kind: method
    pages: '126'
    pdf_pages: '132'
    summary: The catches of the two longline vessels are typical seamount species,
      which is taken as support that their set longlines fished on the seabed.
    terms: characteristic of seamount species
  - topic: potential damage from bottom and static gear
    step: none
    box: ''
    theme: seabed pressure and impact
    kind: context
    pages: 129-130
    pdf_pages: 135-136
    summary: Bottom trawling harms the seafloor more than static gear, but longlines
      can hook or drag across benthic fauna and lost gear and litter add harm; static-gear
      seabed behaviour needs study, and about 50 mostly longline vessels used the
      area in 2012-2014.
    terms:
    - ghost-fishing
    - lateral movement of the lines
    - lost and/or discarded fishing gears
  - topic: reconsider the 2013 closure
    step: none
    box: ''
    theme: vmes
    kind: recommendation
    pages: '130'
    pdf_pages: '136'
    summary: WGDEC recommends revisiting the 2013 closure proposal, aligned with the
      OSPAR MPA boundary, on precautionary grounds to protect Josephine and nearby
      seamounts.
    terms:
    - closure proposal
    - precautionary approach
    - UNGA Resolution 61/105
  - topic: VMS versus AIS for MSFD D6
    step: none
    box: ''
    theme: ais
    kind: plan
    pages: 138, 141-142
    pdf_pages: 144, 147-148
    summary: The resolution asks for a side-by-side comparison of VMS with logbooks
      against AIS for mapping bottom-fishing disturbance, covering data holders, access,
      coverage, resolution, accuracy and processing needs, with overlap maps and cell
      counts for AIS only, VMS only and both.
    terms:
    - fitness for purpose
    - side-by-side comparison
    - AIS only, VMS only and both
    - MSFD D6
  - topic: other tracking for small vessels
    step: none
    box: ''
    theme: small-scale fisheries
    kind: context
    pages: '142'
    pdf_pages: '148'
    summary: The resolution notes that GPS and phone-based monitoring for smaller
      vessels is being developed in some regions.
    terms:
    - GPS and cell-phone based systems
    - smaller vessels
  - topic: finer resolution test call
    step: none
    box: ''
    theme: high-resolution data
    kind: plan
    pages: '138'
    pdf_pages: '144'
    summary: A voluntary test call for a few countries would submit 0.01 degree c-squares
      built by interpolation, to measure the change in footprint and weigh risks such
      as confidentiality and credibility.
    terms:
    - 0.01 degree
    - 0.05 degree
    - interpolation methods
    - voluntary test datacall
  - topic: static gear effort indicators
    step: effort
    box: pressure (gear size)
    theme: gear and activity classification
    kind: plan
    pages: 138-139
    pdf_pages: 144-145
    summary: Effort of passive gears needs soak time, gear length and hook numbers;
      the group will test whether these can come from VMS, fleet data and observers,
      to derive speed filters and a typology of fishing events per gear.
    terms:
    - soaking time
    - gear length
    - number of hooks
    - speed filters
    - typology of various fishing events
  - topic: fisheries displacement drivers
    step: none
    box: ''
    theme: marine spatial planning
    kind: plan
    pages: '139'
    pdf_pages: '145'
    summary: Using data-call VMS and logbook data, the group plans to study what drives
      fleets to move, such as climate, management and other sea uses, and to model
      likely reallocation.
    terms:
    - Fisheries territories
    - displacement
    - predictive models
  - topic: support to WKBEDPRES
    step: none
    box: ''
    theme: seabed pressure and impact
    kind: plan
    pages: '139'
    pdf_pages: '145'
    summary: The group is to give criteria for collecting, managing and reporting
      non-fisheries spatial data on physical seabed disturbance.
    terms:
    - physical disturbance to the seabed
    - non-fisheries spatial data
  - topic: NEAFC maps and gear data narrative
    step: none
    box: ''
    theme: vmes
    kind: request
    pages: 139-140
    pdf_pages: 145-146
    summary: WGSFD must supply WGDEC with NEAFC maps split by mobile and static bottom
      gear and suggest how NEAFC could improve data on gear design, size, rigging
      and operation.
    terms:
    - mobile bottom contacting gear
    - static gear
    - rigging and operational methods
  - topic: anonymity procedure plan
    step: none
    box: ''
    theme: data access and governance
    kind: plan
    pages: '140'
    pdf_pages: '146'
    summary: The data centre would filter aggregated cells with three vessels or less
      and offer scenarios such as gear, area or international grouping, from which
      the group approves a method.
    terms:
    - vessel anonymity
    - 3 vessels or less
    - gear groupings
  - topic: best practices for VMS worldwide
    step: none
    box: ''
    theme: workflow and code
    kind: plan
    pages: 140-141
    pdf_pages: 146-147
    summary: A literature review would describe best practice for analysing and sharing
      VMS and logbook data internationally, given two decades of published work.
    terms:
    - best practices
    - decadal view
  - topic: three-year work plan
    step: none
    box: ''
    theme: ais
    kind: plan
    pages: '141'
    pdf_pages: '147'
    summary: Year 1 standardises VMS, logbook and AIS processing and assesses AIS
      quality, year 2 invites aggregated AIS, VMS and logbook data, and year 3 extends
      AIS submission to all countries.
    terms:
    - Quality Assessment and Harmonization
    - AIS data submission
  - topic: priority and users
    step: none
    box: ''
    theme: products and users
    kind: context
    pages: '141'
    pdf_pages: '147'
    summary: Fine-scale spatial fishing information is in demand, with OSPAR and HELCOM
      using intensity outputs for MSFD descriptor 6 and ecoregion advice drawing on
      them.
    terms:
    - fine scaled spatial fisheries information
    - MSFD descriptor 6
  - topic: resources and linkages
    step: none
    box: ''
    theme: group organisation
    kind: context
    pages: '142'
    pdf_pages: '148'
    summary: The ICES Data Centre is expected to host, check and process the VMS,
      logbook and AIS data, the group has about 20-25 members, and it links to WGDEC,
      WGBYC, WKBEDPRES, OSPAR and HELCOM among others.
    terms:
    - ICES Data Centre
    - Linkages
  - topic: 2021 submission and quality control
    step: none
    box: ''
    theme: data quality of submissions
    kind: data-call
    pages: '143'
    pdf_pages: '149'
    summary: Data came through the ICES portal with a DATSU format check and a QC
      report the submitter could act on; the chairs then flagged issues, leading either
      to correction and resubmission or to an annotation, and some countries did not
      pass.
    terms:
    - DATSU check
    - QC report
    - correction
    - annotation
  - topic: combined all-country check
    step: none
    box: ''
    theme: data quality of submissions
    kind: method
    pages: '143'
    pdf_pages: '149'
    summary: A further check on the merged dataset computed key variables per year,
      such as record counts, effort and landings, to find doubtful deviations.
    terms:
    - full VMS dataset
    - questionable deviations
  - topic: VMS length threshold change
    step: none
    box: ''
    theme: data coverage
    kind: finding
    pages: '143'
    pdf_pages: '149'
    summary: A jump in one country's VMS records between 2011 and 2012 came from lowering
      the vessel length that requires VMS from 15 m to 12 m.
    terms:
    - minimum vessel length
    - 15m to 12m
  - topic: real changes behind record counts
    step: none
    box: ''
    theme: data quality of submissions
    kind: finding
    pages: 143-144
    pdf_pages: 149-150
    summary: 'Some flagged changes were real: a 30% fall in activity, a 2019 fall
      from the eastern Baltic cod ban, a 2020 rise from more Gulf of Riga herring
      quota, and 2020 falls in crustacean and demersal landings attributed to Brexit
      and Covid.'
    terms:
    - real reduction in activity
    - cod fishery ban
    - Brexit and Covid effect
  - topic: errors fixed by resubmission
    step: none
    box: ''
    theme: data quality of submissions
    kind: finding
    pages: '144'
    pdf_pages: '150'
    summary: Spikes in LPUE or value per kWh, logbook rectangles not matching VMS,
      and VMS outside the ICES area without logbooks were acknowledged nationally
      and resubmitted.
    terms:
    - LPUE
    - Acknowledged at national level
    - outside ICES area
  - topic: catch-effort QC plots by metier
    step: none
    box: ''
    theme: data quality of submissions
    kind: method
    pages: '143'
    pdf_pages: '149'
    summary: Odd catch-effort plots mixed large and small vessels within a target
      assemblage; plotting per metier level 5 would separate active from passive gears,
      and the number of vessels behind each dot is unknown.
    terms:
    - target assemblage
    - metier level 5
    - catch-effort plots
  - topic: unresolved and out-of-scope records
    step: none
    box: ''
    theme: data quality of submissions
    kind: finding
    pages: '144'
    pdf_pages: '150'
    summary: Data before 2014 for a Barents Sea crustacean fishery could not be retrieved
      and is noted for comparisons, and long-distance fishery points as far east as
      123°E lie outside the call and will be removed.
    terms:
    - Data before 2014 could not be retrieved
    - long-distance fishery
    - geographical scope of the data call
  - topic: VME review group scope
    step: none
    box: ''
    theme: vmes
    kind: context
    pages: '145'
    pdf_pages: '151'
    summary: The review group, working by correspondence, assessed the WGDEC and WGSFD
      answers to the EU and NEAFC requests and closed with recommendations.
    terms:
    - RGVME
    - By correspondence
  - topic: VME database record counts
    step: none
    box: ''
    theme: vmes
    kind: finding
    pages: '145'
    pdf_pages: '151'
    summary: Since May 2020, 11,160 presence and 3,985 absence records were added,
      bringing presence records to 72,370, of which 273 new ones lie in the NEAFC
      area, 2,500 in NAFO and 8,387 in national EEZs.
    terms:
    - presence records
    - absence records
    - resubmissions
  - topic: VME data quality assurance sub-group
    step: none
    box: ''
    theme: data quality of submissions
    kind: recommendation
    pages: '146'
    pdf_pages: '152'
    summary: WGDEC's new QA sub-group can reject faulty VME submissions; the review
      group asks that the same checks be run on older data.
    terms:
    - VME data quality assurance sub-group
    - reject submissions
  - topic: absence data rules
    step: none
    box: ''
    theme: vmes
    kind: recommendation
    pages: '146'
    pdf_pages: '152'
    summary: Absences were accepted only from scientific trawl surveys that also recorded
      a VME; the review group questions the second condition, since adequate surveys
      without VMEs also inform models.
    terms:
    - absence data
    - predictive habitat suitability modelling
  - topic: quantitative VME data required
    step: none
    box: ''
    theme: vmes
    kind: recommendation
    pages: 146-147
    pdf_pages: 152-153
    summary: Abundance data should be required rather than encouraged, thresholds
      per taxon and sampling type should be defined, and the weighted index serves
      only in the short term.
    terms:
    - quantitative information
    - thresholds
    - weighted VME index
  - topic: gear recording in NEAFC data
    step: gear
    box: other
    theme: gear and activity classification
    kind: recommendation
    pages: '147'
    pdf_pages: '153'
    summary: The review group notes that improved speed data allowed separate speed
      profiles by gear group, but many vessels lacked gear, and hopes gear recording
      improves.
    terms:
    - speed profiles
    - gear recording
  - topic: map the recent footprint
    step: none
    box: ''
    theme: vmes
    kind: recommendation
    pages: 147-148, 150
    pdf_pages: 153-154, 156
    summary: The single existing-fishing-area polygon hides trends, so the footprint
      of the previous two to three years should be mapped as well.
    terms:
    - NEAFC Existing Fishing Areas
    - fishing footprint
    - previous 2-3 year period
  - topic: compliance from fishing pings
    step: fishing
    box: other
    theme: vmes
    kind: recommendation
    pages: '148'
    pdf_pages: '154'
    summary: Counting fishing pings inside closures against a surrounding reference
      area would give a coarse compliance measure, limited by four-hour polling, and
      could be tracked over years.
    terms:
    - number of pings (identified as fishing)
    - reference area
    - low polling frequency of 4h
    - compliance
  - topic: fishing over high VME index
    step: none
    box: ''
    theme: vmes
    kind: recommendation
    pages: '148'
    pdf_pages: '154'
    summary: Some 2020 fishing overlies cells of high VME index, and the review group
      misses an assessment of that overlap to judge current risk.
    terms:
    - high VME Index
    - level of risk
  - topic: Josephine evidence judged insufficient
    step: none
    box: ''
    theme: vmes
    kind: recommendation
    pages: 148-150
    pdf_pages: 154-156
    summary: The review group finds the taxa list lacks quantities, the arguments
      would fit any seamount and nearby seamounts are not covered, so it advises collecting
      quantitative data before reconsidering the closure.
    terms:
    - quantitative information
    - surrounding seamounts
    - re-visiting the application
  - topic: summit fishing and flank VMEs
    step: none
    box: ''
    theme: vmes
    kind: finding
    pages: '149'
    pdf_pages: '155'
    summary: Josephine is a guyot whose fishing lies mainly on the flat summit, while
      VMEs are most likely on the steep flanks, so effort and VMEs may be spatially
      apart.
    terms:
    - guyot shape
    - flat summit
    - flanks
  - topic: EU request on mammals and seabirds
    step: none
    box: ''
    theme: bycatch
    kind: recommendation
    pages: 149-150
    pdf_pages: 155-156
    summary: The EU request on fishing impacts on mammals, seabirds and incidental
      catch went unanswered, as only bottom gears were mapped; the review group asks
      for an explanation and suggests covering surface and midwater gears, and notes
      over 1100 kg of Geodia bycatch at Tromsøflaket.
    terms:
    - incidental catches
    - surface and midwater gears
    - Geodia
  - topic: review group overall verdict
    step: none
    box: ''
    theme: vmes
    kind: finding
    pages: 150-151
    pdf_pages: 156-157
    summary: The VMS analysis adequately shows bottom-contacting fishing near VMEs,
      and the VME indices are the best current means, but the assessment must turn
      quantitative and the EU and Josephine answers fell short.
    terms:
    - analysed adequately
    - best available current means
    - more quantitative assessment
