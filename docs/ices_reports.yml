    step: record
    box: other
    theme: terminology
    kind: definition
    pages: '14'
    pdf_pages: '20'
    summary: A fishing event is a haul or a use of passive gear as logbooks hold it,
      an operation covers all fishing steps and may hold no event, a haul ends an
      event and a set starts one (set also naming a string of joined passive gear);
      tracks may show fishing-like acts, such as lifting damaged or idle gear, that
      logbooks would not count.
    terms:
    - Fishing event
    - Fishing operation
    - Haul
    - Set/deploy
