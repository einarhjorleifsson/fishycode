    terms:
    - derived speed
    - great-circle (orthodromic) distance
  - topic: speed thresholds by gear group
    step: fishing
    box: speed range of the gear
    theme: gear and activity classification
    kind: method
    pages: 105-106
    pdf_pages: 111-112
    summary: Pings at or below 5 knots count as fishing for mobile bottom gears, 4
      knots for static gears and 6 knots where the gear is undefined; faster pings
