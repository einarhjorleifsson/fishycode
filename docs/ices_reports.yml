  - topic: 'Scope: upload and quality assurance'
    step: none
    box: ''
    theme: data quality of submissions
    kind: context
    pages: '2'
    pdf_pages: '8'
    summary: The group's remit covers data upload in response to the calls and quality
      assurance done both automatically, by restricting fields to a set format, and
      manually, through reports for sense-checking submissions.
    terms:
    - quality assurance
    - sense checking data submissions
    - specified format
  - topic: 'Scope: benthic impact and effort measures'
    step: effort
    box: pressure (gear size)
    theme: seabed pressure and impact
    kind: context
    pages: '2'
