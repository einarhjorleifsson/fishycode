  vocabulary:
  - term: VMS
    meaning: Vessel Monitoring System, satellite position reports from fishing vessels
      used with logbook data for spatial fisheries advice.
    pages: '1'
  - term: VMS and coupled logbook data
    meaning: Position records joined to logbook information, the subject of the ICES
      data call.
    pages: '1'
  - term: data call
    meaning: The ICES request to member countries to submit VMS and logbook data,
      first issued in 2014.
    pages: '1'
  - term: rules of vessel anonymity
    meaning: Rules from earlier WGSFD reports that a product must meet before publication
      so no vessel can be identified.
    pages: '4'
  - term: Quality Check routines
    meaning: Standardised R checks run on data outputs that report anonymity issues.
    pages: '4'
  - term: ICES workflow script
    meaning: The R script used to prepare national submissions to the data call.
    pages: '4'
  - term: swept-area ratio
    meaning: A benthic impact measure derived from VMS and logbook data.
    pages: '2'
  - term: MWh
    meaning: An effort measure (megawatt-hours) named as an example output.
    pages: '2'
  - term: Benthis métiers
    meaning: A gear grouping used to aggregate impact and effort outputs.
    pages: '2'
  - term: métier level 6
    meaning: A detailed fishing activity classification used as an aggregation level.
    pages: '2'
  - term: aggregated and anonymised products
    meaning: Outputs above original submissions in the access hierarchy, released
      under licensing rules.
    pages: '2'
  - term: VMS and Logbook DB
    meaning: The ICES database of submitted VMS and logbook data that the group governs.
    pages: '7'
  - term: Manifesto
    meaning: The group's founding statement of scope, completed early in 2021.
    pages: '4'
  - term: Governance Framework
    meaning: The plan of objectives, responsibilities, processes and resources the
      group set out to establish.
    pages: 4, 7
  - term: DSTSG
    meaning: Data Science and Technology Steering Group, to which the group reports
      from 2021.
    pages: '3'
  - term: DIG
    meaning: Data and Information Group, the umbrella for data and software governance
      that the group updates.
    pages: 3, 9
  notes: A short business report (9 printed pages) with no technical methods. The
    resolution's ToR a text names the Acoustic Trawl Data Portal and a WGAcousticGov
    manifesto, apparently carried over from another governance group's template; the
    other ToRs name the VMS and Logbook DB. The executive summary repeats the mission
    and achievements sections, so rows cite the main text. References and participants
    are omitted in the input.
- report:
    id: WGSFD_2025a
    file: WGSFD_2025a.pdf
    doi: 10.17895/ices.pub.30501452.v2
    licence: CC BY 4.0
    title: Working Group on Spatial Fisheries Data (WGSFD; outputs from 2024 meeting)
    series: ICES Scientific Reports 7:81
    year: 2025
    meeting: 26-30 September 2022, ICES HQ, Copenhagen, Denmark; 25-29 September 2023,
      ICES HQ, Copenhagen, Denmark; 7-11 October 2024, Sukarrieta, Spain
    set_out_to_do: The group reports the last year of a three-year cycle in which
      it maintains the ICES VMS and logbook data call and its R workflow. It added
      habitat and depth layers to the data call, reviewed and documented the workflow
      step by step, moved swept-area calculation to the submitters, and drew on WKSSFGEO
      work to set protocols for high-frequency tracking data from small-scale and
      static-gear fisheries.
    parts:
    - 1 of 2, PDF pages 1-50
    - 2 of 2, PDF pages 51-99
    terms_of_reference:
    - id: A
      summary: Add a habitat and bathymetry layer to the data call so fishing effort
        and swept area can be split by habitat and depth within c-squares.
      pages: 6-10
    - id: B
      summary: Review the VMS and logbook data call process and the R workflow that
        submitters run.
      pages: 11-41
    - id: C
      summary: 'Small-scale fisheries spatial data: case studies, pre-processing and
        analysis protocols, and position frequency for small and static-gear vessels.'
      pages: 42-47
    - id: a
      summary: With WGFBIT and the Secretariat, choose habitat layers that serve advice
        requesters and study adding them to the data call, its workflow and anonymity.
      pages: '90'
    - id: b
      summary: Review the VMS data call workflow so that it stays adequate as the
        call's requirements change.
      pages: 90-91
    - id: c
      summary: Review small-scale and static-gear tracking case studies, set best
        practice for handling tracking and electronic monitoring data, and evaluate
        effort metrics from high-frequency data linked to other sources.
      pages: '91'
    - id: d
      summary: Document national VMS polling frequencies over time and by fishery,
        to show where finer spatial resolution of products is possible.
      pages: 91-92
    - id: e
      summary: Make WGSFD outputs more useful to the wider ICES community, e.g. scallop
        maps for WGSCALLOP and pelagic trawl and longline maps for WGBYC.
      pages: '92'
    - id: f
      summary: Map bottom-contacting fishing in NEAFC areas from NEAFC VMS and logbooks,
        and test ICES data call data for refining that advice.
      pages: 92-93
    - id: g
      summary: Identify drivers of change in fisheries' spatio-temporal patterns relative
        to other sea uses, and develop a common nested spatial data framework with
        the ICES Data Centre.
      pages: '93'
    - id: h
      summary: With WGFTFB, comment on current and potential maximum depth of mobile
        and static bottom-contacting gears in the NEAFC Regulatory Area, for OECM
        work.
      pages: '94'
    data_call:
      summary: 'Member states submit fleet activity built from VMS pings merged with
        logbooks (TACSAT and EFLALO), processed with a WGSFD R workflow in three blocks
        (cleaning, analysis, submission formatting) and aggregated to c-squares (Table
        1) and ICES rectangles (Table 2) before upload to the ICES Data Centre through
        DATSU. It targets vessels of 12 m and over with roughly two-hourly VMS; small-scale
        data are not yet requested. In 2024 habitat and depth were added as optional
        fields, and swept area and SAR are to be computed by each submitter at ping
        level before submission. ICES receives no raw VMS: national submitters send
        two tables prepared with a common workflow script, one of VMS-derived fishing
        activity and one of the associated logbook data, aggregated by level 6 métier
        and 0.05 degree c-square for 2009 to the year before. Landings of all species
        are pooled and spread over fishing-speed pings with SplitAmongPings; since
        2022 a field for the average interval between pings has been added.'
      pages: 11-41, 58, 63-64
    outputs:
    - summary: Habitat (MSFD broad benthic habitat types) and GEBCO depth bands attached
        to VMS points in the 2024 data call, with a worked swept-area-ratio-by-habitat
        example for Skagerrak and Kattegat.
      pages: 6-10
    - summary: Step-by-step documentation of the data call R workflow with each step's
        status, issues and priority.
      pages: 14-28
    - summary: A revised function for assigning logbook log-event details to pings
        on multi-gear or multi-rectangle trips.
      pages: 19-20
    - summary: A decision that swept area and SAR are calculated by each data provider
        and checked in the QC report before ICES uses them.
      pages: '39'
    - summary: A proposed benchmark process for the data call workflow, with full
        and review-level cycles.
      pages: '41'
    - summary: A framework table relating ping rate, gear type and analysis methods
        for small-scale fisheries, and a recommended position interval of at most
        30 seconds for vessels under 12 m.
      pages: 44-46
    - summary: Conclusions and recommendations on effort estimation for small-scale
        and passive-gear fleets, including a 30 second positional interval for vessels
        under 12 m.
      pages: '50'
    - summary: Case studies from Portugal, Denmark, Scotland and France on classifying
        fishing from high-resolution tracks and sensors.
      pages: 51-57
    - summary: Maps of average VMS polling interval by c-square and by country for
        2009-2022.
      pages: 58-62
    - summary: A set of frequently asked questions and guidance on what the data call
        can and cannot provide, and proposals for changing it.
      pages: 63-67
    - summary: 'Table 4: the group''s responses to the specific requests in ToR e.'
      pages: 68-70
    - summary: Maps of bottom trawl, static gear and no-gear activity in the NEAFC
        Regulatory Area for 2021.
      pages: 71-75
    - summary: The WGSFD Spatial Data Framework and an analysis of c-square area,
        latitude and ping interval, with alternative grids.
      pages: 76-87
    - summary: Draft benchmark issue list for the data call workflow.
      pages: '96'
