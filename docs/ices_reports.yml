  vocabulary:
  - term: VMS
    meaning: Satellite vessel monitoring for control, at least two-hourly for EU vessels,
      coupled with logbooks in the data call.
    pages: 1, 8
  - term: AIS
    meaning: Collision-avoidance broadcast system received by shore stations and satellites,
      giving dense but uneven tracks.
    pages: 5, 8
  - term: ICES VMS data call
    meaning: Annual request to member countries for aggregated VMS and logbook effort
      data.
    pages: 1, 5
  - term: MMSI
    meaning: Nine-digit radio identity tied to the AIS device rather than the vessel.
    pages: '8'
  - term: IMO number
    meaning: The only lifetime hull identifier, still uncommon on fishing vessels.
    pages: '14'
  - term: vid
    meaning: Icelandic national vessel identifier used to link logbooks, VMS and AIS.
    pages: 10-11
  - term: c-square
    meaning: Grid cell notation; the data call uses 0.05 by 0.05 degree cells.
    pages: 11, 23
  - term: ICES rectangle
    meaning: Statistical grid of 1 by 0.5 degrees used for official effort.
    pages: '9'
  - term: métier (DCF level 4 / level 6)
    meaning: Gear-based fishing activity class; level 6 from logbooks ties gear to
      the trip, level 4 from registers does not.
    pages: '10'
  - term: Benthis metier
    meaning: Gear grouping used for seabed impact, such as OT_DMF or TBB.
    pages: 11, 16
  - term: MBCG
    meaning: Mobile bottom contacting gears such as trawls, dredges and seines.
    pages: '11'
  - term: fish
    meaning: Binary flag marking a track point as fishing.
    pages: 11, 15
  - term: dt
    meaning: Time difference between consecutive points, used as the effort per point
      and capped.
    pages: 12, 16
  - term: fishing speed interval
    meaning: Speed range taken as fishing, calibrated per vessel or gear.
    pages: 15, 20
  - term: SAR (swept area ratio)
    meaning: Swept area in a cell divided by the cell area, separately for surface
      and subsurface contact.
    pages: '21'
  - term: MSFD D6 / D6C2
    meaning: EU seafloor integrity descriptor and its physical disturbance criterion.
    pages: ii, 5
  - term: AIS Class B
    meaning: Low-power, non-mandatory AIS used by small craft, with weaker reception.
    pages: '19'
  - term: DATSU
    meaning: ICES format specification and screening service for submissions.
    pages: '1'
  - term: QC report
    meaning: Quality-control summary of a submission for the submitter and chairs.
    pages: '1'
  - term: AnonymizedVesselID
    meaning: Data call field identifying vessels without revealing them.
    pages: '2'
  - term: RID
    meaning: NEAFC anonymous vessel key linking tables, renewed annually.
    pages: '60'
  - term: ENT / EXT
    meaning: NEAFC messages for a vessel entering or leaving the regulatory area.
    pages: '61'
  - term: putative tows
    meaning: Runs of consecutive pings at fishing speed grouped as presumed tows.
    pages: '61'
  - term: CAT reports
    meaning: NEAFC catch reports, sent in the North Atlantic Format.
    pages: '68'
  - term: three-vessel rule
    meaning: Anonymity rule that published cells need at least three distinct vessels.
    pages: '69'
  - term: restricted
    meaning: a c-square fished by fewer than three unique vessels, which must be withheld
      from publication
    pages: 70-71
  - term: Benthis_metiers
    meaning: gear groupings from the Benthis project used to report seabed pressure
    pages: 70-71
  - term: Swept area ratios (SAR)
    meaning: area swept by gear relative to cell area, judged not sensitive for publication
    pages: '74'
  - term: suppressed value
    meaning: a withheld value that must not be recoverable from published totals
    pages: '74'
  - term: VME
    meaning: vulnerable marine ecosystem, a habitat easily damaged by fishing
    pages: '76'
  - term: VME indicator
    meaning: a record of a taxon that signals a possible VME
    pages: '76'
  - term: VME habitat
    meaning: a record confirming the habitat itself is present
    pages: '77'
  - term: VME Index
    meaning: per-cell likelihood (low, medium, high) of meeting a VME, from the weighting
      algorithm
    pages: '77'
  - term: confidence layer
    meaning: per-cell confidence attached to the VME index
    pages: '77'
  - term: VME Elements
    meaning: geomorphological features, such as seamount summits and flanks, that
      can support VME indicators
    pages: '118'
  - term: absence records
    meaning: survey records showing no VME, kept out of the weighting algorithm
    pages: 76, 146
  - term: RID
    meaning: NEAFC vessel key linking VMS, catch and register tables, changed each
      year for anonymity
    pages: '105'
  - term: ENT
    meaning: NEAFC message for a vessel entering the regulatory area; removed before
      analysis
    pages: '105'
  - term: EXT
    meaning: NEAFC message for a vessel leaving the regulatory area; removed before
      analysis
    pages: '105'
  - term: putative "tows"
    meaning: runs of consecutive fishing-speed pings from bottom gears treated as
      tows
    pages: '106'
  - term: existing fishing area
    meaning: NEAFC area with documented historical bottom fishing where bottom fishing
      remains allowed
    pages: 107, 118
  - term: mobile bottom contacting gear (MBCG)
    meaning: towed gears touching the seabed, analysed apart from static gear
    pages: '147'
  - term: static gears
    meaning: set gears such as longlines and pots
    pages: 105-106
  - term: NIL
    meaning: gear code for no gear recorded in NEAFC data
    pages: '106'
  - term: LLS
    meaning: set longlines
    pages: 106, 126
  - term: DATSU check
    meaning: ICES format check applied at data submission
    pages: '143'
  - term: annotation
    meaning: a QC issue accepted with a note instead of resubmission
    pages: '143'
  - term: metier level 5
    meaning: gear type combined with target assemblage
    pages: '143'
  - term: Haddock Box
    meaning: a fishing closure on Rockall Bank that also holds many VME records
    pages: 79, 109-110
  - term: EBSA
    meaning: Ecologically or Biologically Significant Marine Area under the CBD
    pages: '126'
  notes: 'Part 1 holds the data call chapter and ToRs a, b, c, d, f and g (ToR e is
    not in this part). Several sections restate 2019 work. Figure and section cross-references
    in the text are off by one or two from the figure captions. Numeric tables (Table
    8 effort by area) were removed from the input. ToR c reports an inability to progress
    for lack of static gear parameters. | Chapters 4 and 5 are copies of joint sections
    with WGDEC; most VME content is WGDEC''s, while the NEAFC VMS analysis (4.5, 5.4)
    is WGSFD''s. Numbering mismatches as printed: the anonymity text cites Tables
    11-12 and Figures 51-56, but the captions are Tables 12-13 and Figures 49-54;
    the EBSA criteria are listed as 7-13 while the text calls naturalness number 7;
    the review group''s correspondence period is printed as 2020 although the meeting
    and review are 2021. The resolution (ToR g) says three vessels or less, while
    section 2 uses fewer than three. Table 5.2 coordinates, Annex 1 participants and
    the reference lists are omitted from the input. The resolution names the chairs
    and lists meetings for 2019 (Lysekil), 2020 (by correspondence) and 2021 (online).
    The review group criticises ToR-related products: the EU request on marine mammals
    and seabirds was not addressed.'
- report:
    id: WGSFDGOV_2023
    file: WGSFDGOV_2023.pdf
    doi: 10.17895/ices.pub.22308919.v1
    licence: CC BY 4.0
    title: Working Group on Spatial Fisheries Data Governance (WGSFDGOV; outputs from
      2022 meeting)
    series: 'ICES Business Reports 03: 09'
    year: 2023
    meeting: Twelve meetings 2020-2022, four per year, all online except 29 September
      2022 in Copenhagen, Denmark; last on 8 December 2022 (multiannual cycle, reporting
      year 3/3)
    set_out_to_do: The group was set up in 2020 to take over governance of the ICES
      VMS and logbook dataflow from WGSFD. Over three years it aimed to keep personal
      and commercial data in ICES databases and products protected, to make the database
      outputs reliable through quality checks, and to rationalise the spatial fisheries
      data calls and make guidance for submitters clearer.
    parts: whole
    terms_of_reference:
    - id: a
      summary: Set up a governance framework with a forward-looking plan, objectives,
        responsibilities, processes and resources (the resolution text names the Acoustic
        Trawl Data Portal here).
      pages: '7'
    - id: b
      summary: Provide a platform, organised on GitHub, for user feedback and requests
        on the VMS and Logbook database, listed and prioritised with responsibilities
        and resource needs.
      pages: 7-8
    - id: c
      summary: Oversee and advise on how recommendations and requests to the VMS and
        Logbook database are interpreted and prioritised, using a GitHub project board.
      pages: '8'
    - id: d
      summary: Oversee the development of guidance and training for those submitting
        data to the VMS and Logbook database.
      pages: '8'
    data_call:
      summary: ICES issued its first call for VMS and coupled logbook data in 2014
        to answer an OSPAR request; it has been improved since and widened to the
        whole ICES advisory area, with WGSFD overseeing format, vessel anonymity and
        outputs from 2013, and governance of the dataflow moved to WGSFDGOV in 2020.
        The group worked on the workflow script, upload routines and quality check
        routines of the data call.
      pages: 1, 4
    outputs:
    - summary: A WGSFDGOV Manifesto, finalised early in 2021, as part of a governance
        framework begun with an evaluation questionnaire.
      pages: '4'
    - summary: R routines, built with WGSFD and the ICES Data Centre, that check large
        data outputs for anonymity and produce a report for each output.
      pages: '4'
    - summary: Advice on several requests to check whether planned data publications
        kept vessels anonymous.
      pages: '4'
    - summary: Contributions to the December 2021 WGSFD hackathon and the following
        year's work on the R scripts of the ICES data call.
      pages: '4'
  topics:
  - topic: Why ICES needs VMS and logbook data
    step: none
    box: ''
    theme: high-resolution data
    kind: context
    pages: '1'
    pdf_pages: '7'
    summary: Advice on area closures, bottom trawling impact, the economics of closures
      and the fisheries and ecosystem overviews needs data fine in time and space,
      which VMS and electronic logbooks supply best.
    terms:
    - footprint of fisheries activities
    - high resolution data
    - electronic logbook data
    - fisheries overviews
  - topic: Regulated and sensitive data
    step: none
    box: ''
    theme: data access and governance
    kind: context
    pages: '1'
    pdf_pages: '7'
    summary: Because the data are regulated under fisheries commissions' control rules
      and are commercially sensitive, ICES had to build security protocols and governance
      over inputs and outputs so countries can legally provide them.
    terms:
    - control regulation
    - commercial sensitivity
    - security protocols
    - governance
  - topic: History of the VMS data call
    step: none
    box: ''
    theme: data call
    kind: data-call
    pages: '1'
    pdf_pages: '7'
    summary: The first ICES call for VMS with coupled logbook data came in 2014 for
      OSPAR, was then extended to the whole ICES advisory area, and its governance
      passed from WGSFD to a dedicated group in 2020.
    terms:
    - data call
    - VMS and coupled logbook data
    - ICES advisory area
    - dataflow
  - topic: Mission statement
    step: none
    box: ''
    theme: data access and governance
    kind: context
    pages: '1'
    pdf_pages: '7'
    summary: 'The group set three aims: data and products must not compromise personal
      or commercial protection, database outputs must be reliable through effective
      quality checks, and data calls should be rationalised with clear guidance for
      submitters.'
    terms:
    - Mission Statement
    - quality checks
