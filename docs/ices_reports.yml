meta:
  what: 'A reading map of ICES reports on spatial fisheries data: what each report
    treats, where (printed pages), and how it falls on the flow diagram of docs/one_flow.qmd.
    The index from which the book of plan 033 is drafted; the reports'' own text,
    at the cited pages, is the material.'
  read: '2026-10-19'
  ai_use: 'Read by AI subagents (Claude, Anthropic), one per report or part of one,
    on page-marked text with padding, contents, numeric table bodies, reference and
    participant lists removed. Checked by Claude against the full text: every row''s
    pages against the page markers, a row''s own terms on its cited pages, no 8-word
    run copied, and each code row''s name on its pages; WGSFD 2025b also by hand (8
    rows). Not reviewed line by line by a person.'
  record: fishycode decision 150; plan 033 section 11.1
  source: $FISHYDATA/raw/external/ices/ (the PDFs, with provenance) and raw/external/ices/text/
    (the page-marked texts)
  reports_read:
  - WGSFD_2019
  - WGSFD_2022
  - WGSFDGOV_2023
  - WGSFD_2025a
  - WGSFD_2025b
  - WKSSFGEO_2022
  - WKSSFGEO2_2023
  reports_not_yet_read:
  - WGSFD_2013
  - WGSFD_2014
  - WGSFD_2015
  - WGSFD_2016
  - WGSFD_2017
  - WGSFD_2018
  counts:
    topics: 983
