    - RID
    - NEAFC fleet registry
    - authorisation details
  - topic: catch linked by catch date
    step: catch
    box: other
    theme: logbooks and electronic reporting
    kind: method
    pages: '105'
    pdf_pages: '111'
    summary: This year the catch date was supplied, so catches were attached to each
      vessel on the day of operation.
    terms:
    - catch date
    - date of operation
  - topic: removing duplicate and out-of-year polls
    step: ping
    box: duplicate
    theme: data quality of submissions
    kind: method
    pages: '105'
    pdf_pages: '111'
    summary: In R the VMS data were cleared of duplicate reports and of polls falling
