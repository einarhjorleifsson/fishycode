  vocabulary:
  - term: Small Scale Fisheries (SSF)
    meaning: In EU law, fishing by vessels under 12 m that use no towed gear, plus
      fishers on foot.
    pages: '12'
  - term: High-resolution geo-spatial data
    meaning: Positions at most 15 minutes apart, typically seconds to minutes.
    pages: '12'
  - term: iVMS
    meaning: Inshore VMS fitted to vessels under 12 m.
    pages: 7, 12
  - term: BlackBox
    meaning: Danish electronic monitoring system recording position, speed and course,
      with video.
    pages: 9, 12
  - term: Greenbox
    meaning: Phone-network tracking unit installed on Balearic artisanal boats.
    pages: 10, 12
  - term: Passive gears
    meaning: Static gears that catch as animals move to them, such as traps, gillnets
      and hooks.
    pages: '12'
  - term: Days at sea
    meaning: Each 24 h or part of it spent away from port in a fishing area.
    pages: '12'
  - term: Fishing day
    meaning: A calendar day at sea with fishing; the workshop proposes any day at
      sea with a fishing operation.
    pages: 12-13
  - term: Fishing trip
    meaning: A voyage with fishing from leaving port to arriving back in port.
    pages: '13'
  - term: Vessel activity
    meaning: Any time a vessel is away from port or mooring, fishing or not.
    pages: '13'
  - term: Fishing activity
    meaning: Legal term spanning searching, setting, towing, hauling, taking catch
      aboard, processing and landing.
    pages: '13'
  - term: Fishing event
    meaning: A haul or a use of passive gear, as recorded in logbooks.
    pages: '14'
  - term: Fishing operation
    meaning: All work connected with searching for and catching fish; may contain
      no fishing event.
    pages: '14'
  - term: Haul
    meaning: Retrieval of a gear, ending a fishing event.
    pages: '14'
  - term: Set/deploy
    meaning: Placing a gear, starting a fishing event; set also names a string of
      joined passive gears.
    pages: '14'
  - term: Fishing time
    meaning: Hours at sea minus transit, dodging, idle and repair time; unclear for
      static gears.
    pages: '14'
  - term: Soaking time
    meaning: Time from setting each passive gear unit until its removal begins.
    pages: '15'
  - term: Fishing effort
    meaning: Capacity times activity, or amount of gear used per unit time, nominal
      or standardised.
    pages: '15'
  - term: Capacity
    meaning: Number of vessels and their GT, kW and age.
    pages: '15'
  - term: Base port
    meaning: Where a fishing unit actually works from, which may differ seasonally
      from its home port.
    pages: '16'
  - term: Point in harbour / boat parking areas
    meaning: Where a boat is berthed, moored or launched, beaches included.
    pages: 16, 28
  - term: Electronic Monitoring (EM)
    meaning: Sensors, GPS and computer, optionally cameras, logging effort and catch
      without extra crew.
    pages: '16'
  - term: coastal_ban_zone
    meaning: Layer of waters near shore closed to towed gear, used to rejoin AIS trips
      broken by gaps.
    pages: 37, 47
  - term: t-AIS
    meaning: AIS received by terrestrial stations, with frequent gaps of signal.
    pages: 47, 57
  - term: three category verification indicator
    meaning: Flag saying whether set and haul, only haul, or only set were found for
      an operation.
    pages: '29'
  notes: 'Personal names of presenters, chairs, authors, the reviewer and contacts
    are left out; some code names as printed embed authors'' handles (jepol, galdelli_pulcinella_tassetti).
    Figures disagree inside the report: 48 participants (expert group page, PDF 6)
    vs 49 (pages 2, 5); 13 countries (page 2) vs nine (page 5) vs eight teams from
    8 countries (page 58); SSF share of the EU fleet given as nearly 75% (page 3),
    80% (page 2) and 85%, 70,000 vessels (page 39); subgroups described as four (page
    1) vs 2 in person and 3 remote (page 58). The executive summary (PDF 5, no printed
    number) lists six framework steps (data sources, preprocessing, trips, fishing
    activity, validation, effort indicators) that sections 4.1-4.6 treat in full,
    so rows cite the main text. Hardware named but not listed as code: Teltonika FMM640,
    hall-effect hauler sensor, accelerometers (Technosmart axy-5-s, about 390 euro
    each), Star Oddi tags, Tinytag loggers, RBR sensors. Multi-column tables (3.1,
    4.1-4.6, 5.1-5.7) were interleaved in the text and read as best possible. Numeric
    bodies of the annex 3 trip tables were removed from the input; only the shown
    extracts were used.'
- report:
    id: WKSSFGEO2_2023
    file: WKSSFGEO2_2023.pdf
    doi: 10.17895/ices.pub.22789475
    licence: CC BY 4.0
    title: Workshop on Small Scale Fisheries and Geo-Spatial Data 2 (WKSSFGEO2)
    series: ICES Scientific Reports 5:49
    year: 2023
    meeting: 13-16 March 2023, Faro, Portugal; hybrid meeting (38 participants)
    set_out_to_do: The workshop carried on the WKSSFGEO work on high-resolution positional
      data for small-scale fisheries, and for large-scale fisheries with short fishing
      events. It built an open, anonymisable database of example tracks, compared
      methods that label positions as fishing, began testing how ping rate affects
      them, and (per the executive summary) produced an SSF overview from FDI, the
      ICES VMS/logbook data call and Global Fishing Watch AIS, plus guidance on an
      EU-wide SSF tracking system.
    parts:
    - 1 of 2, PDF pages 1-46
    - 2 of 2, PDF pages 47-110
    terms_of_reference:
    - id: a.i
      summary: Build an open, anonymised data set of case studies covering several
        gears and locations for testing methods.
      pages: '8'
    - id: a.ii
      summary: Test and compare methods (random forest, machine learning, geocomputation)
        that classify positions into fishing activities across tracking data types
        and gears, to infer effort parameters.
      pages: '18'
    - id: a.iii
      summary: Recommend the best or maximum time between pings, by gear type, for
        inferring fishing activities.
      pages: '37'
    - id: a.i
      summary: Assemble an anonymised open dataset of case studies with several gears
        and places for testing methods.
      pages: '78'
    - id: a.ii
      summary: Test and compare classifiers of positions into fishing activity (random
        forest, machine learning, geocomputing) across tracking data types and gears
        to derive effort parameters.
      pages: '78'
    - id: a.iii
      summary: Recommend the best or maximum interval between pings by gear type for
        inferring fishing activity.
      pages: '78'
    - id: b.i
      summary: Analyse which VMS and logbook data submitted to ICES concern small-scale
        fisheries in EU waters.
      pages: 41, 78
    - id: b.ii
      summary: Use the FDI database to describe the extent of small-scale fisheries
        and of bottom-contacting gear in EU waters, and recommend data collection
        and effort determination for the gears that most affect the seafloor.
      pages: 41, 78
    - id: b.iii
      summary: Combine the datasets to quantify how much of the small-scale fleet
        in EU waters is covered.
      pages: 41, 78
    - id: c
      summary: Write a guidance document from a group discussion on the opportunities,
        challenges and benefits of tracking small vessels.
      pages: 68, 78
    data_call:
      summary: Named in the executive summary only, as one of three sources (with
        EU FDI and Global Fishing Watch AIS) for the SSF overview; VMS said to cover
        vessels over 12 m well, AIS possibly supplementing smaller ones. Treated in
        part 2. The ICES VMS/Logbook data call has two tables, VMS by 0.05 x 0.05
        degree c-square and logbook data by ICES rectangle, submitted aggregated by
        month and with new vessel length groups since 2022; a VMSenabled field in
        the logbook table says whether a row is covered by VMS. Member states derive
        fishing activity with their own speed-based methods, which may introduce country
        biases. For future small-vessel tracking data the group envisages a similar
        anonymised, monthly aggregated call on a finer 0.01 degree c-square grid.
      pages: ii, 42, 44, 54, 69-70
    outputs:
    - summary: An open example database of SSF tracks (nine full case studies per
        the executive summary) with a script to anonymise them, on the ICES GitHub.
      pages: ii, 8, 12
    - summary: A metadata form, a 14-column data template, and an R script that checks,
        plots and standardises the example data sets.
      pages: 8-12
    - summary: A comparison of fishing-activity classification methods across case
        studies, with a table of participants' methods, issues and recommendations.
      pages: 18-36
    - summary: A script-based framework for testing ping rate effects, and a conservative
        recommendation of a 30-second ping interval.
      pages: 37-40
    - summary: 'Per the executive summary: maps, figures and tables giving an SSF
        overview in EU waters, and a guidance document on an EU-wide SSF tracking
        system (in part 2).'
      pages: ii
    - summary: An overview of small-scale fishing effort in EU waters from FDI, ICES
        VMS/logbook and Global Fishing Watch AIS data, by length group, gear group
        and area.
      pages: 41-65
    - summary: Draft recommendations for collecting data on, and determining effort
        of, the gears most impacting the seafloor.
      pages: 65-67
    - summary: A guidance discussion on opportunities, benefits and challenges of
        an EU-wide tracking system for small vessels.
      pages: 68-71
    - summary: General conclusions and ways forward.
      pages: 72-73
    - summary: Tables comparing 2021 fishing days with mobile bottom-contacting gears
        from AIS, ICES logbooks and FDI, and the share of FDI effort from vessels
        under 12 m.
      pages: 80-87
    - summary: An annex documenting the script that standardises and merges the open
        high-resolution example dataset of eight national case studies.
      pages: '- (PDF 94-110)'
