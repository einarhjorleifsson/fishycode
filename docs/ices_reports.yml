    - trip to trip comparison
  - topic: Annex conclusions on trip methods
    step: trip
    box: voyage from port stays
    theme: track gaps
    kind: finding
    pages: 56-57
    pdf_pages: 62-63
    summary: Both procedures erred; create_fishing_trip needs its own column names
      and new layers outside the Mediterranean, works on cleaned pings without interpolation
      through a 3-6 ping sliding window and no duration limits, and rebuilds trips
      across gaps or ending outside harbour, whereas define_trip_pol uses minimum
      and maximum durations yet exceeded the maximum with defaults.
    terms:
    - sliding window
    - minimum and maximum duration
    - preprocessed (i.e., cleaned) pings
  - topic: Run time and port coverage limits
    step: none
    box: ''
    theme: computing and storage
    kind: finding
    pages: '57'
    pdf_pages: '63'
    summary: create_fishing_trip took about 5 minutes against under one for define_trip_pol,
      reflecting ping-by-ping handling of gappy t-AIS, and could not run on the Portuguese
      GPS example for want of harbours.
    terms:
    - about 5 minutes
    - example_data_GPS.csv
  - topic: 'Review: why the workshop was needed'
    step: none
    box: ''
    theme: group organisation
    kind: context
    pages: '58'
    pdf_pages: '64'
    summary: WGSFD in 2021 found that methods for two-hourly VMS do not fit second-to-minute
      tracks needed for short SSF activities such as hauling, and saw a workshop as
      useful also to WGCATCH, WGBYC and WGTIFD.
    terms:
    - On-site expert review
    - higher temporal resolution
  - topic: Review of ToR a
    step: none
    box: ''
    theme: group organisation
    kind: finding
    pages: 58-59
    pdf_pages: 64-65
    summary: Eight national teams presented, and subgroups sorted issues into five
      sections (preprocessing, trips, activity, validation, effort) and code into
      GitHub, so methods were compiled more than applied; comparing them on case studies
      is left to a later workshop.
    terms:
    - five sections
    - compilation of methods
  - topic: Review of ToR b
    step: none
    box: ''
    theme: workflow and code
    kind: plan
    pages: '59'
    pdf_pages: '65'
    summary: The repository holds methods from polygon trip definition to machine-learning
      event inference, but a finished template R script with a workflow has still
      to be built and tested.
    terms:
    - tentative workflow
    - polygons approach
  - topic: Review of ToR c
    step: effort
    box: other
    theme: effort indicators
    kind: finding
    pages: '59'
    pdf_pages: '65'
    summary: Geodata can inform several DCF effort variables and sharpen fishing time
      to minutes, but definitions suit mobile gears; for static gear set on one trip
      and lifted on another, hours fished equals soak time, and spotting deployment
      is the main obstacle.
    terms:
    - Data Collection Framework
    - deployed
    - soak time
  - topic: Review recommendations for the next workshop
    step: none
    box: ''
    theme: recommendations to ICES
    kind: recommendation
    pages: '60'
    pdf_pages: '66'
    summary: A further workshop should gather the code into a template workflow, test
      it on participants' case studies, refine SSF static-gear effort definitions,
      and improve estimation of deployment, hauling and soak time.
    terms:
    - Further workshop
    - tentative workflow
    - soak time
