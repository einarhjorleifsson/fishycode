  vocabulary:
  - term: c-square
    meaning: Grid cell used to aggregate data call output, adopted so that ICES holds
      no raw positions; proposed as the official ICES grid.
    pages: 3, 8, 20, 35
  - term: swept area ratio (SAR)
    meaning: Seabed area contacted by gear relative to the cell, a core input to benthic
      pressure indicators.
    pages: 18-19
  - term: métier level 4
    meaning: The métier level at which the group recommends publishing annual SAR
      values.
    pages: '3'
  - term: BENTHIS gear width
    meaning: Reference gear widths supplied through icesVMS; for seines they are total
      rope length, possibly over 6 km.
    pages: '19'
  - term: high resolution data
    meaning: Position data acquired every 10 minutes or less; coarser data are low
      resolution.
    pages: '23'
  - term: HRD / SSFD
    meaning: Shorthand for high-resolution data and for small-scale (under 12 m) fisheries
      data in the data call.
    pages: '34'
  - term: small-scale fisheries (SSF)
    meaning: Small vessels, discussed mainly as the under-12 m segment, often multi-gear
      and using passive gear.
    pages: 8, 10, 14, 26
  - term: Scottish seine (SSC) / Danish seine
    meaning: Seines whose seabed contact is set by the loop of ropes hauled in, not
      by towing distance.
    pages: 18-19
  - term: soak time
    meaning: Time a passive gear stays fishing in the water, predicted from tracks
      and a main gear predictor.
    pages: 10, 26
  - term: signal jamming
    meaning: Deliberate disruption of the position signal, either by switching off
      or covering the device or by spoofing via a pseudolite.
    pages: '25'
  - term: MMSI
    meaning: AIS identifier of a vessel's radio equipment; it may change and does
      not match fisheries identifiers.
    pages: '31'
  - term: CFR
    meaning: Common Fleet Register code identifying an EU fishing vessel in fisheries
      management systems.
    pages: '31'
  - term: EUFR
    meaning: EU Fleet Register, listing MMSI and CFR and whether vessels declare AIS
      or VMS.
    pages: 31-32
  - term: ERS
    meaning: EU Electronic Reporting System for coded activity messages from departure
      to landing.
    pages: 13-14
  - term: FAR
    meaning: Fishing Activity Report message with catch, gear, positions and discards.
    pages: '13'
  - term: DEP, PNO, RTP, LAN
    meaning: Departure, prior notification, return to port and landing declaration
      messages of the ERS.
    pages: '13'
  - term: DATSU
    meaning: ICES webpage for uploading data call submissions.
    pages: '6'
  - term: WGSFDGOV
    meaning: Governance group for spatial fisheries data, handling data flow, documentation
      and the workflow repository.
    pages: 7-8
  - term: National Correspondent (NC)
    meaning: National contact with access to restricted data, proposed as the route
      to appoint SFDTools contributors.
    pages: 8, 20
  - term: LE_GEAR
    meaning: Gear field on which the workflow would branch to the seine-specific SAR
      calculation.
    pages: '19'
  - term: quality template
    meaning: ICES quality control output run on each national submission and reviewed
      for outliers.
    pages: 16-17
  - term: mode method
    meaning: Fishing classification method of Rufino et al. (2023), compared with
      speed thresholds and random forest.
    pages: '27'
  - term: MTS
    meaning: Tracking with post-trip data upload, contrasted with real-time VMS.
    pages: '34'
  - term: RDBES
    meaning: ICES database whose adoption makes coverage relative to logbooks and
      sales notes relevant.
    pages: '16'
  - term: FBIT
    meaning: The benthic impact group, now the main user of the data call products.
    pages: '8'
  notes: PDF page 43 (Annex 2, ToR a-c) has no printed page in its marker; 40 is inferred
    from the sequence (PDF 44 is printed 41). The formal recommendations on SAR at
    métier level 4 and on c-squares as the ICES grid appear only in the executive
    summary (p. 3); the missing-data and MPA/offshore-wind recommendations are also
    treated in the main text (pp. 12-13, 36). Section 1.4 (p. 8) says only two countries
    had not submitted, while sections 1.1 and 5.2 name four. Section 4.2.8 gives 293
    of 3595 Spanish AIS vessels as 4.7%. The resource text (p. 41) names ToR e for
    the common spatial-temporal framework, which ToR f describes. Table 2 cells are
    interleaved in the compact text and Table 3's body was removed. Figure 5 (high
    vs low resolution workflow) is described only through the surrounding text. Sections
    1.5 and 1.6 summarise member presentations and two papers (Rufino et al., 2025;
    a paper under review on SSF tracking) rather than group work.
- report:
    id: WKSSFGEO_2022
    file: WKSSFGEO_2022.pdf
    doi: 10.17895/ices.pub.10032
    licence: CC BY 4.0
    title: Workshop on Geo-Spatial Data for Small-Scale Fisheries (WKSSFGEO)
    series: ICES Scientific Reports 4:10
    year: 2022
    meeting: 29 November – 3 December 2021, Lisbon, Portugal, online meeting (48 participants)
    set_out_to_do: The workshop met to discuss and apply methods for tracking data
      at high time resolution from small-scale fisheries, and from large-scale fisheries
      with short fishing events, in order to find trips and hauls, passive gears included.
      It aimed to assemble the participants' approaches into a template R workflow
      and to judge how such data improve effort estimates and describe the extent
      of SSF, with an eye on the EU rules on SSF tracking then in preparation.
    parts: whole
    terms_of_reference:
    - id: a
      summary: Discuss and apply methods to identify trips and hauls in SSF, passive
        gears included, from high-resolution tracks, using participants' own case-study
        data to reach best practice.
      pages: 1, 45
    - id: b
      summary: From that best practice, build an R script that can serve as a template
        for analysing SSF geo-spatial data.
      pages: 1, 45
    - id: c
      summary: Assess how high-resolution geo-spatial data improve effort estimates
        and help quantify the extent of SSF.
      pages: 1, 45
    data_call:
      summary: The annual ICES VMS/logbook call asks for spatial data only from vessels
        carrying VMS (2009-2020 in the call then current), so vessels without VMS,
        mostly small-scale, are missing from outputs used in advice to the EU, OSPAR
        and HELCOM such as swept area ratio, and pressure in coastal waters is underestimated;
        with no EU rule to track vessels under 12 m there is no mandate to ask for
        such data; WGSFD's VMS workflow for the call is named as the link for future
        work.
      pages: 3-4, 41, 45
    outputs:
    - summary: Practical recommendations for running hybrid meetings.
      pages: '4'
    - summary: A terminology table compiling legal and report definitions of fishing
        days, trips, events, soak time, effort and ports, with the group's comments.
      pages: 12-16
    - summary: Framework tables for preprocessing, trip identification, inferring
        fishing, model validation, classification variables and effort indicators
        from high-resolution tracks.
      pages: 17-34
    - summary: A shared GitHub repository of R scripts, with a workflow figure and
        tables of contributed functions.
      pages: 35-38
    - summary: Conclusions and recommendations, including a follow-up workshop linked
        to WGSFD and WGTIFD.
      pages: 39-41
    - summary: An annex comparing two trip-identification functions on shared example
        AIS data.
      pages: 47-57
    - summary: An on-site expert review of how each ToR was met, with recommendations
        for a further workshop.
      pages: 58-60
  topics:
  - topic: Workshop format and daily plan
    step: none
    box: ''
    theme: group organisation
    kind: context
    pages: '1'
    pdf_pages: '7'
    summary: The hybrid meeting at IPMA opened with national case-study talks, then
      ran subgroups on preprocessing, trip and activity definition, validation, effort
      indicators and R code, plus one gathering legal definitions, with a plenary
      round table each day.
    terms:
    - hybrid meeting
    - subgroups
    - round table
  - topic: Social media coverage
    step: none
    box: ''
    theme: small-scale fisheries
    kind: context
    pages: '2'
    pdf_pages: '8'
    summary: ICES publicised the meeting, citing 49 experts from 13 countries and
      28 institutions and stating that SSF make up 80% of the EU fleet.
    terms:
    - common framework
    - 80% of the EU fleet
  - topic: Policy context of small-scale fisheries
    step: none
    box: ''
    theme: small-scale fisheries
    kind: context
    pages: '3'
    pdf_pages: '9'
    summary: SSF are diverse, make up nearly three quarters of EU registered vessels,
      weigh most in the Mediterranean and southern Europe, and are spared several
      CFP duties such as fishing authorisations, landing declarations and sales notes.
    terms:
    - Common Fisheries Policy
    - landing declarations
    - sales notes
  - topic: Control regulation revision and SSF tracking
    step: none
    box: ''
    theme: logbooks and electronic reporting
    kind: context
    pages: '3'
    pdf_pages: '9'
    summary: The proposed revision of the control regulation would require every vessel,
      those under 12 m included, to report catch electronically and carry a tracking
      system whose specification is left flexible; EMFAF priorities are also cited.
    terms:
    - control regulation
    - tracking system
    - EMFAF
  - topic: VMS interval too coarse for SSF
    step: none
    box: ''
    theme: high-resolution data
    kind: context
    pages: '3'
    pdf_pages: '9'
    summary: VMS is required only above 12 m with up to two hours between positions,
      too sparse for SSF trips that often last under two hours, and no common framework
      exists for SSF and passive-gear effort.
    terms:
    - VMS
    - two hours
    - passive gears
  - topic: Data call misses vessels without VMS
    step: none
    box: ''
    theme: data call
    kind: data-call
    pages: '3'
    pdf_pages: '9'
    summary: The annual ICES VMS/logbook call covers only vessels with VMS, so small
      vessels are absent from outputs behind advice on fishing abrasion (swept area
      ratio) for the EU, OSPAR and HELCOM.
    terms:
    - VMS/Logbook data
    - Swept Area Ratio
    - fishing abrasion
  - topic: Needs of related ICES groups
    step: none
    box: ''
    theme: group organisation
    kind: context
    pages: '3'
    pdf_pages: '9'
    summary: WGSFD holds a ToR on spatial effort indicators for static gears and asked
      for this workshop in 2021, and WGCATCH has a ToR on using GPS and AIS to improve
      SSF effort estimates.
    terms:
    - WGSFD
    - WGCATCH
    - spatial effort indicators for static gears
  - topic: Passive-gear effort for bycatch work
    step: effort
    box: pressure (gear size)
    theme: effort indicators
    kind: request
    pages: '3'
    pdf_pages: '9'
    summary: WGBYC data calls lack fine-scale passive-gear effort for PETS bycatch,
      such as net length, hook numbers, soak time and gear position, which high-resolution
      tracks and methods could help supply.
    terms:
    - WGBYC
    - PETS
    - net length
    - number of hooks
    - soak time
  - topic: No mandate for tracking under 12 m
    step: none
    box: ''
    theme: data access and governance
    kind: context
    pages: '4'
    pdf_pages: '10'
    summary: With no EU rule to track vessels under 12 m there is no basis to request
      such data in a data call, though national schemes exist (the Portuguese bivalve
      dredge fleet since 2016) and EU-MAP asks for whole-fleet effort variables, by
      other sampling where control rules do not apply.
    terms:
    - EU-MAP
    - alternative sampling methods
    - control regulation
  - topic: Recommendations for hybrid meetings
    step: none
    box: ''
    theme: group organisation
    kind: recommendation
    pages: '4'
    pdf_pages: '10'
    summary: Advice covers reliable networks, headsets, in-room people joining the
      online platform, one on-site moderator for the remote side, mixed subgroups
      of 5-6 in separate rooms, clear schedules, a co-editing tool better than SharePoint,
      and testing the setup a week ahead.
    terms:
    - hybrid meetings
    - Teams
    - Sharepoint
    - subgroups
  - topic: Participants' data overview
    step: none
    box: ''
    theme: high-resolution data
    kind: finding
    pages: 5-6
    pdf_pages: 11-12
    summary: Participants from 28 institutions and 20 projects brought data on 16
      gear types (mainly pots, gillnets, longlines and dredges), 33 SSF and 14 LSF
      sets, mostly at 1 s to 1 min and at most 20 min, from AIS (17), GPS (13) and
      VMS (13).
    terms:
    - Temporal resolution
    - Large Scale Fisheries (LSF)
    - AIS
    - GPS
    - VMS
  - topic: Recopesca gear identification by machine learning
    step: gear
    box: predicted from the track
    theme: gear and activity classification
    kind: finding
    pages: 6-7
    pdf_pages: 12-13
    summary: On 25,612 trips by 107 voluntary French vessels with GPS every 15 minutes
      or less, five classifiers were compared on 96 trip-level motion, speed and time
      features; XGBoost reached 94.89% accuracy over 10 gear classes including steaming,
      kept it with 34 features, and transfer to VMS and AIS remains untested.
    terms:
    - Recopesca
    - SAIL
    - XGBoost
    - gear classes
  - topic: Irish iVMS deployment and power supply
    step: none
    box: ''
    theme: tracking devices
    kind: finding
    pages: '7'
    pdf_pages: '13'
    summary: iVMS is compulsory for about 70 razor-clam hydraulic dredgers reporting
      every 1-10 minutes and voluntary on some potters and netters; units from several
      suppliers had power problems, so self-powered units are now required, and port
      geofences that slow the ping rate save battery.
    terms:
    - iVMS
    - autonomous
    - geofences
    - ping frequency
  - topic: Gear sensors kept for validation only
    step: fishing
    box: other
    theme: validation
    kind: decision
    pages: '7'
    pdf_pages: '13'
    summary: Irish trials of gear sensors to record effort were stopped; future sensors,
