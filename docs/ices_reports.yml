  vocabulary:
  - term: SSF
    meaning: Small-scale fisheries, contrasted with large-scale fisheries (LSF).
    pages: ii, 1
  - term: ping rate
    meaning: Time interval between successive recorded positions; also called temporal
      resolution.
    pages: ii, 37
  - term: VMS (Vessel Monitoring System)
    meaning: Satellite or wireless position reporting at fixed intervals, secure and
      meant not to be switched off.
    pages: 8-9
  - term: iVMS (Inshore Vessel Monitoring Systems)
    meaning: VMS for small coastal vessels that reports over mobile phone networks.
    pages: '8'
  - term: AIS (Automatic Identification System)
    meaning: Open VHF collision-avoidance broadcast, receivable by anyone and possible
      to switch off.
    pages: 8-9
  - term: Class A / Class B
    meaning: AIS transponder types; Class A is costlier with more power and range.
    pages: '7'
  - term: Green Boxes (GB)
    meaning: Andalusian GPS/GPRS units sending a position about every 3 minutes, queuing
      them when out of coverage.
    pages: 3, 9
  - term: grey boxes
    meaning: Portuguese GPS/GPRS units sending position and engine status every 30
      seconds.
    pages: 1-2, 9
  - term: STATUS
    meaning: 'Template field with the validated activity: setting, hauling or not
      fishing for passive gears, fishing or not for active.'
    pages: '11'
  - term: PASSIVE_ACTIVE
    meaning: Template field saying whether the gear is passive or active.
    pages: '11'
  - term: QUALITY
    meaning: Optional template flag for doubts about the validated STATUS.
    pages: '12'
  - term: COURSE
    meaning: Direction of movement over ground, clockwise from north.
    pages: '12'
  - term: HEADING
    meaning: Direction the bow points, clockwise from north.
    pages: '12'
  - term: setting
    meaning: Deploying a passive gear; its start point for soak time.
    pages: 5, 11
  - term: hauling
    meaning: Retrieving a passive gear; more easily detected in tracks than setting.
    pages: 5, 32
  - term: soak time
    meaning: Time a passive gear stays in the water between setting and hauling.
    pages: 5, 26, 32
  - term: length hauled
    meaning: Total length of net retrieved, a gear-based effort metric summed per
      trip.
    pages: 26, 32
  - term: Mix_Transit
    meaning: Intermediate HMM state between Fishing and Transit in the Irish potting
      model.
    pages: '29'
  - term: Hidden Markov Models
    meaning: Classifiers in which each state depends on the previous one, keeping
      the sequence of pings.
    pages: '26'
  - term: geocomputation
    meaning: Spatial algorithms that turn classified positions into gear objects such
      as nets with linked sets and hauls.
    pages: 4, 32
  - term: consolidation process
    meaning: Step in net building that removes most false hauling detections.
    pages: 4, 36
  - term: First Sales Notes (FSN)
    meaning: Basque sales records linked to AIS by vessel and day to give gear and
      catch.
    pages: '6'
  - term: Expert based (visual)
    meaning: Validation by an expert labelling tracks by eye, as opposed to observers,
      video or sensors.
    pages: '16'
  - term: EU MAP variables
    meaning: Variables of the EU multiannual programme for data collection that the
      ping rate must support.
    pages: ii, 39
  - term: LPUE
    meaning: Landings per unit of effort, estimated per species in ABIOMMED.
    pages: '7'
  - term: SSF
    meaning: Small-scale fisheries, mostly vessels under 12 m that often lack VMS
      and logbooks.
    pages: 41, 65
  - term: MBCG
    meaning: 'Mobile bottom-contacting gears: dredges, bottom trawls and demersal
      seines grouped by gear code.'
    pages: '44'
  - term: Passive gears
    meaning: Static gear group of pots, traps, gillnets, trammel nets, lines and longlines.
    pages: '44'
  - term: VMSenabled
    meaning: Logbook-table field in the ICES data call marking whether a row is matched
      by VMS.
    pages: 42, 54
  - term: FDI
    meaning: EU Fisheries Dependent Information data call, public, by length group,
      gear and area.
    pages: 42-43
  - term: ICES statistical rectangle
    meaning: 1 x 0.5 degree cell, the usual position resolution of logbooks.
    pages: '42'
  - term: c-square
    meaning: Grid cell for aggregating positions, 0.05 degrees in the VMS data call.
    pages: 42, 70
  - term: GSA
    meaning: Geographical subarea used for the Mediterranean and Black Sea.
    pages: 42, 86
  - term: fishing days
    meaning: Effort unit compared across sources; in FDI one sales note may count
      as one day.
    pages: 45, 57
  - term: vessel length groups
    meaning: Coded length classes such as VL1012 or VL1215, differing between FDI
      and the ICES call.
    pages: '44'
  - term: Class A / Class B AIS
    meaning: AIS transponder types, A mandatory on larger EU fishing vessels, B voluntary
      on small ones.
    pages: 43, 66
  - term: S-AIS
    meaning: Satellite-received AIS, less reliable in busy waters than terrestrial
      reception.
    pages: '43'
  - term: navigational status
    meaning: Class A AIS field the crew sets, 7 meaning engaged in fishing.
    pages: '66'
  - term: iVMS
    meaning: Inshore VMS using GPRS mobile signals, being made mandatory for small
      vessels in England and Wales.
    pages: 68, 70
  - term: green boxes
    meaning: Andalusian real-time monitoring units on small vessels.
    pages: '68'
  - term: GFW vessel class
    meaning: Global Fishing Watch gear type assigned to vessels, used instead of logbook
      gear for AIS.
    pages: '44'
  - term: soaking time
    meaning: Time a passive gear stays in the water, suggested as a logbook field.
    pages: 65, 79
  - term: EU-MAP variables
    meaning: EU data collection effort variables the workshop aims to estimate from
      tracks.
    pages: 72, 78-79
  - term: ping rate
    meaning: Frequency of position reports; one-minute spacing with 30 s acquisition
      is recommended.
    pages: 66, 72
  - term: Natura 2000
    meaning: EU protected areas where AIS use is in places already mandatory.
    pages: 66, 68
  - term: LSF
    meaning: Large-scale fisheries, contrasted with SSF.
    pages: '73'
  - term: métier
    meaning: Fishing activity defined by gear and target, used to set suitable ping
      rates.
    pages: 41, 65
  - term: RECOPESCA
    meaning: Ifremer programme database providing the French example data.
    pages: '-'
  notes: 'Part 1 ends inside section 4; sections 5 (SSF overview from FDI, the ICES
    data call and GFW) and 6 (guidance on an EU-wide SSF tracking system) appear here
    only in the contents and executive summary. Case study counts differ: the executive
    summary says 9 full case studies, section 2.4 names seven countries'' cases, and
    Table 1 lists 10 files (DK, two ES, FR, two IE/IR, IT, two PT, UK). Table 1 numeric
    fields (dates, ping intervals, point, trip and vessel counts) were stripped from
    the input. Coined themes: ''ping rate'' (temporal resolution of tracking data)
    and ''data exchange format'' (the shared template and metadata form). Pages 19-25
    are one large table whose cells are interleaved in the text, so rows for it are
    approximate in page span. | Annex 5 (PDF 94-110) carries no printed page numbers,
    so its rows give pages as "-" and rely on pdf_pages. The Italian case study in
    Annex 5 is headed with the Irish file name IE_MII_2019_IVMS, apparently a copy
    slip. The second Annex 4 table caption repeats the FAO area 27 wording although
    the table lists Mediterranean GSAs. The conclusions (printed 72-73) repeat chapter
    5 and 6 text; only points new there (open dataset, methods, ping interval, bycatch)
    got their own rows. The Danish source appears in the merged table with a garbled
    region cell (Greater North Sea, Baltic Sea, Black Sea). Chapter 6.2 refers to
    a section 7.2 and section 3 that are in part 1 or absent. Numeric table bodies
    of Annexes 3-4 were removed from the input.'
