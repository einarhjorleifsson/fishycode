    pages: ii
    pdf_pages: '5'
    summary: The executive summary reports that FDI, the ICES data call and GFW AIS
      cannot be compared directly, that passive gears carry most effort, that about
      a third of EU effort in area 27 is mobile bottom-contacting, and that the maps
      show large gaps so no complete SSF profile is possible yet.
