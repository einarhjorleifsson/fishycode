  vocabulary:
  - term: VMS
    meaning: Satellite vessel monitoring for control, in the EU at least every two
      hours for vessels it covers.
    pages: '6'
  - term: AIS
    meaning: Safety and anti-collision broadcast of vessel identity and position,
      received by coastal stations and satellites.
    pages: '3'
  - term: AIS-B
    meaning: Optional low-power AIS class used by small craft, with limited range.
    pages: 17, 59
  - term: multi source AIS
    meaning: Terrestrial and satellite AIS combined by commercial providers.
    pages: '4'
  - term: MMSI
    meaning: Nine-digit radio identity tied to the transmitting device rather than
      the hull.
    pages: '6'
  - term: IMO number
    meaning: The only lifelong vessel identifier, but seldom present for fishing vessels.
    pages: '12'
  - term: vid
    meaning: Icelandic vessel identifier used to join lookup tables, logbooks and
      AIS.
    pages: 8-9
  - term: C-square
    meaning: Grid cell notation; the data call aggregates at 0.05 by 0.05 degree.
    pages: 1, 21
  - term: swept area ratio (SAR)
    meaning: Area swept by gear in a cell divided by the cell area, i.e. times the
      cell would be covered if effort were even.
    pages: '19'
  - term: surface and subsurface
    meaning: The two bottom-contact depths for which swept area is computed separately.
    pages: '19'
  - term: Benthis métier
    meaning: Gear groups of bottom-contacting fishing used for maps and swept area.
    pages: 2, 9
  - term: DCF level 6 / level 4
    meaning: Detailed trip métier from logbooks versus coarse gear type from registers.
    pages: '8'
  - term: mobile bottom contacting gears (MBCG)
    meaning: Towed gears touching the seabed, such as trawls, seines and dredges.
    pages: '9'
  - term: fish
    meaning: Binary flag set to 1 for track points classed as fishing.
    pages: 9, 13
  - term: dt
    meaning: Time between consecutive points, multiplied by the fishing flag to get
      fishing hours and capped at six hours.
    pages: 10, 14
  - term: gear attribution
    meaning: Assigning a gear to an AIS vessel from registers or other lists.
    pages: '12'
  - term: point in polygon
    meaning: Spatial test of whether a point lies in a harbour polygon.
    pages: '12'
  - term: MSFD D6C2
    meaning: Marine Strategy indicator of physical disturbance of the seabed.
    pages: II, 3
  - term: Fisheries Dependent Information
    meaning: DCF data call giving official effort quarterly by ICES rectangle.
    pages: '7'
  - term: four-eye principle
    meaning: Two people check each step of quality control.
    pages: '1'
  - term: RID
    meaning: Anonymised NEAFC vessel key linking VMS, catches and registry, renewed
      yearly.
    pages: '59'
  - term: ENT / EXT
    meaning: NEAFC messages marking entry to and exit from the regulatory area.
    pages: '59'
  - term: putative tows
    meaning: Runs of consecutive fishing-speed pings grouped as presumed tows.
    pages: '60'
  - term: NIL
    meaning: NEAFC entry for vessels with no gear code.
    pages: 60-61
  - term: displacement
    meaning: Movement of fishing effort in space, time or gear when an area becomes
      unavailable.
    pages: 30, 46
  - term: c-square
    meaning: Grid cell of the data call, 0.05 degrees in 2019, with 0.01 degrees under
      test.
    pages: 74, 85
  - term: Benthis metier
    meaning: Grouping of gears by target used to map bottom-contact fishing.
    pages: 67-74
  - term: number of distinct vessels
    meaning: Count of different vessels in a data call record, used to apply the three-vessel
      rule.
    pages: 67, 74
  - term: restricted
    meaning: A c-square with fewer than three vessels, whose values are withheld.
    pages: '74'
  - term: anonymous vessel identifiers
    meaning: Masked vessel ids listed per record so distinct vessels can be counted
      at any aggregation.
    pages: 74-75
  - term: Metier level 6
    meaning: Finest metier level in the data call, combining gear, target and mesh.
    pages: '74'
  - term: Swept area ratios (SAR)
    meaning: Area swept by gear relative to cell area, judged not sensitive for publication.
    pages: 74, 89
  - term: suppressed value
    meaning: A withheld cell value that must not be recoverable from published totals.
    pages: '74'
  - term: VMS Governance Group
    meaning: Proposed ICES body overseeing the VMS and logbook database, its policy
      and products.
    pages: 75, 89
  - term: correction
    meaning: QC outcome where data were returned to the country and resubmitted.
    pages: '94'
  - term: annotation
    meaning: QC outcome where an issue was acknowledged and no resubmission was needed.
    pages: '94'
  - term: steaming positions
    meaning: Pings while travelling rather than fishing, to be removed nationally
      before submission.
    pages: '94'
  - term: static gears
    meaning: Gillnets and entangling nets, pots and traps, and passive and active
      hooks and lines.
    pages: '91'
  - term: soaking time
    meaning: Time a static gear stays deployed, needed for static-gear effort.
    pages: '85'
  - term: sales notes
    meaning: First-sale records that give the value of landings.
    pages: '90'
  - term: electronic monitoring (EM)
    meaning: On-board recording systems, here giving fine-scale position and activity.
    pages: 77-78
  - term: VME
    meaning: Vulnerable marine ecosystem, a habitat sensitive to bottom fishing.
    pages: '98'
  - term: VME Index
    meaning: Gridded likelihood of meeting a VME, from the weighting algorithm.
    pages: '99'
  - term: confidence layer
    meaning: Grid grading confidence in the VME index per cell.
    pages: '99'
  - term: existing bottom fishing area
    meaning: NEAFC area where bottom fishing has taken place and is allowed.
    pages: 136-137
  - term: RID
    meaning: Anonymous NEAFC vessel key that changes yearly and links VMS, catches
      and register.
    pages: '132'
  - term: ENT/EXT
    meaning: NEAFC messages marking a vessel's entry to or exit from the regulatory
      area.
    pages: '132'
  - term: derived speed
    meaning: Speed computed from consecutive positions and times instead of the reported
      speed.
    pages: '133'
  - term: speed filtered pings
    meaning: Pings at or below the fishing speed cut-off, treated as fishing.
    pages: '133'
  - term: NIL
    meaning: NEAFC code for a vessel with no gear recorded.
    pages: 133-134
  notes: 'Part 1 ends mid ToR G (printed page 66); its remainder, section 3 (electronic
    monitoring, razor clam fishery, Natura 2000) and the annexes, including Annex
    5 (static gear questionnaire) and Annex 7 (NEAFC analysis), are in part 2. Table
    9 numeric body was removed from the input, so its area labels are not available.
    The executive summary mentions a voluntary discard programme and razor clam data;
    these are treated in part 2. Printed page = PDF page minus 6 from PDF page 7;
    the executive summary is printed page II (PDF 5). | This part covers the end of
    the anonymity section (2.7), the work plan update (2.8), three presentation summaries
    (section 3), references, and Annexes 1-8: participants, the 2019-2021 resolution,
    recommendations, the economic and static gear questionnaires, the QC audit trail,
    the joint NEAFC/WGDEC section, and the RGVME minutes. Figure numbers restart in
    this part (Figures 45-47 used twice) and the text cites Table 3 and Table 4 where
    Tables 13 and 14 are meant; the body of Table 14 is removed from the input. Inside
    Annex 7 the section numbering is the WGDEC report''s own (4.x), Iceland (4.3.10)
    and Canada (4.3.11) appear beyond the ten EEZ areas listed, and some cross-references
    print as ''Error! Reference source not found''. Table 12 shows only two of its
    rows in the input.'
- report:
    id: WGSFD_2022
    file: WGSFD_2022.pdf
    doi: 10.17895/ices.pub.21630236.v1
    licence: CC BY 4.0
    title: Working Group on Spatial Fisheries Data (WGSFD; outputs from 2021 meeting)
    series: ICES Scientific Reports 4:92
    year: 2022
    meeting: 7–11 June 2021, by Webex (third year of a cycle that met 24–28 June 2019
      in Lysekil, Sweden, and 8–12 June 2020 by Webex)
    set_out_to_do: The group gathers and analyses spatial fisheries data to describe
      fishing effort, intensity and frequency in European waters. In its final cycle
      year it reviewed the VMS and logbook data call submissions, produced NEAFC fishing
      maps for WGDEC (including the Josephine Seamount), and restated earlier work
      on AIS for seabed disturbance, finer data call resolution, static-gear effort,
      displacement of fishing, and anonymity.
    parts:
    - 1 of 2, PDF pages 1-75
    - 2 of 2, PDF pages 76-157
    terms_of_reference:
    - id: a
      summary: Assess AIS datasets available to the group, their fitness for advice,
        and whether AIS could enter the ICES VMS data call.
      pages: 5-23
    - id: b
      summary: Evaluate the need and feasibility of a finer spatial grid (0.01 instead
        of 0.05 degree c-squares) in the data call, using interpolation and a voluntary
        test.
      pages: 23-28
    - id: c
      summary: Develop spatial effort indicators for static (passive) gears.
      pages: 28-34
    - id: d
      summary: Identify drivers of displacement and spatial conflict of fisheries
        with other uses of the sea over time.
      pages: 34-60
    - id: f
      summary: Analyse NEAFC VMS and catch data to map bottom fishing near VMEs for
        WGDEC, including the Josephine Seamount, and advise NEAFC on better data.
      pages: 60-68
    - id: g
      summary: Investigate how a finer resolution in the data call affects vessel
        anonymity and agree methods that preserve it.
      pages: '69'
    - id: a
      summary: Assess the AIS datasets open to the group, whether they are fit for
        advice, and whether AIS could enter the annual ICES VMS data call.
      pages: '138'
    - id: b
      summary: Judge the need for, and feasibility of, finer resolution in the VMS
        data call (0.01 degree c-squares instead of 0.05) through a voluntary test
        call using interpolation.
      pages: '138'
    - id: c
      summary: Develop spatial effort indicators for static gears from parameters
        such as soak time, gear length and hook numbers.
      pages: 138-139
    - id: d
      summary: Identify drivers of fisheries displacement and describe spatial conflicts
        over several time-scales, aiming at a peer-reviewed paper.
      pages: '139'
    - id: e
      summary: Support WKBEDPRES with guidance on using non-fisheries data to assess
        physical disturbance of the seabed.
      pages: '139'
    - id: f
      summary: Map bottom-contacting fishing in and near VMEs in NEAFC areas, including
        Josephine Seamount, split into mobile and static gear, for WGDEC, and say
        how NEAFC could improve its gear data.
      pages: 139-140
    - id: g
      summary: Measure how much aggregated international VMS data is affected by vessel
        anonymity, compare ways to preserve it, and approve a method.
      pages: '140'
    - id: h
      summary: Present best practices for analysing and using VMS data from a world-wide
        perspective in a peer-reviewed publication.
      pages: 140-141
    data_call:
      summary: Annual ICES call since 2014 to member countries for aggregated VMS
        and logbook data (here years 2009–2020), to serve advice on fishing near VMEs
        and gear-specific fishing maps; format agreed by WGSFD, WGSFDGOV and the Secretariat
        and changed over time, submitted through the ICES VMS and logbook portal with
        a DATSU format screening and a QC report reviewed by the chairs; aggregation
        is by country, year, month, 0.05 degree c-square, gear and metier level 6,
        with a field for the number of distinct vessels added in 2019 for anonymity.
        The 2020 and 2021 data calls asked for unique vessel identifiers where fewer
        than three vessels fished a cell; the 2021 submission went through the ICES
        VMS and logbook data portal with a DATSU format check and a QC report visible
        to submitters, after which the chairs flagged issues for correction (resubmission)
        or annotation, and a combined all-country check looked for odd year-to-year
        deviations.
      pages: ii, 1-4, 69, 70; 143-144
    outputs:
    - summary: Maps of fishing by mobile bottom, static and unknown gears in NEAFC
        areas, including Regulatory Areas 2 and 3 and the Josephine Seamount, delivered
        to WGDEC as rasters, putative tows and points.
      pages: 60-67
    - summary: Suggestions to NEAFC on how its gear and catch reporting could improve
        advice.
      pages: '68'
    - summary: Technical guidance on using AIS to map fishing effort and seabed disturbance
        for MSFD D6, with conclusions and recommendations.
      pages: 20-23
    - summary: A list of submission problems and a plan to improve the data call workflow
        and submission process.
      pages: 2-4
    - summary: Maps of kW hours fished for pots and traps, entangling nets and longlines
        in 2020, as relative indicators of static gear activity.
      pages: 30-33
    - summary: Effort time-series around windfarms, MPAs and shipping lanes in the
        Greater North Sea as a displacement analysis.
      pages: 38-60
