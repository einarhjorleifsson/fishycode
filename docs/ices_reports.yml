      it should count only with fishing and noted that a two-hour SSF trip still makes
      a day.
    terms:
    - Days at sea
    - absent from port
  - topic: Redefining the fishing day
    step: effort
    box: other
    theme: effort indicators
    kind: recommendation
    pages: 12-13
    pdf_pages: 18-19
    summary: 'Fishing days rest on logbook calendar dates (EU-MAP: any calendar day
      at sea with fishing); the passive-gear rule counting every day a gear stays
      set cannot be applied as soak time is not mandatory in logbooks, so the workshop
      proposes any day at sea with a fishing operation, and many boats under 10 m
      keep no logbook.'
    terms:
    - Fishing Days
    - calendar days
    - Transversal Variables
    - remained operational gear
