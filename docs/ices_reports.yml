  vocabulary:
  - term: TACSAT
    meaning: Standard table of VMS positions used in the data call workflow.
    pages: '14'
  - term: EFLALO
    meaning: Standard logbook table with trip, log-event and landings fields.
    pages: '14'
  - term: FT_REF
    meaning: Fishing trip identifier in EFLALO, given to pings within the trip.
    pages: 18, 34
  - term: LE_ID
    meaning: Log event identifier, one entry per gear, rectangle or area change and
      day within a trip.
    pages: 19, 34
  - term: log event
    meaning: A logbook entry within a trip giving date, gear, rectangle and landed
      species.
    pages: '34'
  - term: c-square
    meaning: Grid cell, here 0.05 by 0.05 degrees, used to aggregate and publish effort.
    pages: 6, 8
  - term: swept area
    meaning: Seabed area touched by the gear, per ping time times speed times gear
      width.
    pages: 6, 34
  - term: SAR
    meaning: 'Swept area ratio: swept area divided by the area of the c-square or
      habitat.'
    pages: 7, 34
  - term: SAR_Nat
    meaning: Proposed SAR computed by each national data provider.
    pages: '34'
  - term: Benthis metiers
    meaning: Gear classes of the BENTHIS project used to estimate gear footprint from
      metiers.
    pages: '37'
  - term: HRVPD / LRVPD
    meaning: High-resolved (1-30 min) and low-resolved (1-2 h) vessel position data.
    pages: '12'
  - term: HRLD / MRLD / LRLD
    meaning: Logbooks resolved to fishing events, to daily rectangle entries, or to
      coarse areas or landings only.
    pages: '12'
  - term: VPD
    meaning: Vessel positional data, the regional coordination groups' term for tracks.
    pages: '12'
  - term: LSF / SSF
    meaning: Large-scale (12 m and over) and small-scale (under 12 m) fisheries.
    pages: 12, 42
  - term: Metier L5 / L6
    meaning: Fishing activity codes at gear plus target level, and with mesh and selectivity
      added.
    pages: 13, 20
  - term: pseudo-duplicates
    meaning: Pings too close in time to the previous one, removed below a threshold.
    pages: '16'
  - term: SI_STATE
    meaning: TACSAT field holding the fishing or steaming label.
    pages: '22'
  - term: steaming
    meaning: Pings outside the fishing speed range, i.e. not fishing.
    pages: 20, 22
  - term: INTV
    meaning: Ping interval field used as fishing effort.
    pages: '23'
  - term: EFLALOM / EFLALONM
    meaning: Logbook trips that do and do not match VMS records.
    pages: 22, 24
  - term: conserve
    meaning: splitAmongPings option sending unmatched landings to wider matches by
      vessel or fleet.
    pages: 24-25
  - term: Table 1 / Table 2
    meaning: 'Data call submissions: ping-based effort by c-square, and logbook-based
      activity by rectangle.'
    pages: 27-29
  - term: DATSU
    meaning: ICES data submission system and its vocabulary checks.
    pages: 11, 28
  - term: MSFD-BBHT
    meaning: Broad benthic habitat types layer used to tag pings with habitat.
    pages: '6'
  - term: benchmark
    meaning: Peer-review process proposed for adopting changes in the data call workflow.
    pages: '41'
  - term: soak time
    meaning: how long passive gear stays in the water fishing, between setting and
      hauling
    pages: 48-49
  - term: SSF
    meaning: small-scale fisheries, here boats under 12 m
    pages: '51'
  - term: WKSSFGEO
    meaning: ICES workshop on small-scale fisheries and geo-spatial data, spun out
      of WGSFD
    pages: 48, 50
  - term: REM
    meaning: 'remote electronic monitoring: on-board box with GPS and sensors, here
      a generator sensor'
    pages: '54'
  - term: EM
    meaning: electronic monitoring with sensors and cameras used to label fishing
      events
    pages: '53'
  - term: Recopesca
    meaning: Ifremer project fitting volunteer vessels with gear sensors and GPS since
      2005
    pages: '55'
  - term: polling frequency
    meaning: how often a vessel's position is reported; the inverse of the ping interval
    pages: 58-62
  - term: c-square
    meaning: hierarchical geocoded cell of an unprojected latitude-longitude grid,
      0.05 degree in the data call
    pages: 58, 77
  - term: ICES rectangle
    meaning: 0.5 by 1 degree statistical unit, the usual logbook catch location
    pages: '76'
  - term: level 6 metier
    meaning: detailed gear, target and mesh category by which the data call is aggregated
    pages: '63'
  - term: BENTHIS gears
    meaning: gear classes with known widths used to compute seabed contact
    pages: '64'
  - term: swept area ratio
    meaning: area swept by gear within a cell divided by the cell's area
    pages: '64'
  - term: SAR
    meaning: abbreviation for swept area ratio
    pages: '81'
  - term: SplitAmongPings
    meaning: VMStools function that shares logbook landings over matching fishing
      pings
    pages: '64'
  - term: DRB_MOL
    meaning: dredge métier for molluscs that pools scallops, queenies and mussels
    pages: 65, 68
  - term: TBB_MOL
    meaning: beam trawl métier for molluscs, in effect English Channel cuttlefish
    pages: '63'
  - term: steaming time
    meaning: time at sea moving between port and grounds rather than fishing
    pages: '65'
  - term: RDBES
    meaning: ICES regional database holding complete logbook, landings and effort
      records
    pages: '67'
  - term: TACSAT
    meaning: position table format of the data call workflow
    pages: '96'
  - term: EFLALO
    meaning: logbook table format of the data call workflow
    pages: '96'
  - term: DGGS
    meaning: 'discrete global grid system: nested global cells, often equal-area,
      e.g. H3'
    pages: 85-86
  - term: haddock box
    meaning: area at Rockall around which bottom trawling concentrates
    pages: '71'
  - term: gear creep
    meaning: gradual change in gear design within one métier that alters its impact
    pages: '69'
  - term: WGSFDGOV
    meaning: governance group alongside WGSFD to which recommendations on the data
      call go
    pages: 66, 90
  - term: DATSU
    meaning: ICES data screening vocabulary that submissions must comply with
    pages: '96'
  notes: Part 1 covers the front matter, executive summary, introduction, ToR A, ToR
    B (sections 3.1-3.9) and ToR C up to 4.1.4; the contents page shows later sections
    (4.2 effort metrics for static gear and SSF, 4.5.2 Scottish razor clam REM trial,
    8.3 VMS aggregation at different latitudes, 8.4 c-square size, Annex 3 benchmark
    issue list) that fall in part 2. Page 7 expands SAR as Stock Assessment Ratio
    where elsewhere it is swept area ratio. Page 47 leaves the finer scale requested
    as a placeholder (~???km2). The workflow tables carry change dates, priorities,
    GitHub issue links (issues 52 and 55) and named task leads, omitted here. The
    country dataflow section names individuals, omitted. The Iceland subsection of
    3.5 describes MFRI's own data sources. | Title not shown in this part; series
    and year taken from page headers, meeting from the 2024 row of the resolution
    in Annex 2. Section 6 contains unedited draft remarks (a bracketed query on whether
    data are submitted by métier, a first-person aside on an interactive tool, a market-model
    question, and a truncated sentence in 6.2.4), and 8.3.3 repeats the heading of
    8.3.2. Table 3 (Danish speed filter vs random forest error) has its numbers removed
    in the input. The Iceland polling-frequency finding (about 10 minutes, from thinned
    AIS) and the Icelandic longline case in Figure 10 bear directly on fishycode.
    Annex 1 participant list omitted.
- report:
    id: WGSFD_2025b
    file: WGSFD_2025b.pdf
    doi: 10.17895/ices.pub.30734759.v2
    licence: CC BY 4.0
    title: Working Group on Spatial Fisheries Data (WGSFD)
    series: ICES Scientific Reports 7:111
    year: 2025
    meeting: 6-10 October 2025; Malaga, Spain (28 participants)
    set_out_to_do: In the first year of a new three-year cycle, the group reviewed
      the 2025 VMS and logbook data call and its product, and heard members' work
      on uncertainty, small-scale fisheries, gear classification and large-data processing.
      It set out work on submission quality and coverage, on maintaining the data
      call workflow (seine swept area, a shared tools package, harbour positions),
      and on methods for high-resolution tracking data ahead of mandatory tracking
      of all EU fishing vessels by 2029.
    parts: ''
    terms_of_reference:
    - id: a
      summary: Deliver an aggregated product of fishing effort and estimates of its
        impact across the ICES area; worked jointly with ToR e as one quality and
        coverage subgroup.
      pages: 5, 16-17, 40
    - id: b
      summary: Support maintenance and updating of the VMS data call workflow so that
        it meets current data requirements.
      pages: 5, 18-22, 40
    - id: c
      summary: Develop methods for high-resolution spatial data and implement them
        in the WGSFD workflow.
      pages: 5, 23-35, 40
    - id: d
      summary: Improve the usefulness of WGSFD outputs to ICES and other users, including
        new data call variables or aggregation methods.
      pages: 5, 41
    - id: e
      summary: Establish a method to represent and present fleet coverage of the VMS
        data, relative to logbooks and landing declarations.
      pages: 5, 16-17, 41
    - id: f
      summary: Investigate a common spatial and temporal framework for representing
        data across ICES.
      pages: 5, 8, 41
    data_call:
      summary: The 2025 VMS and logbook data call was released late, on 29 May, after
        ICES IT changes, and submissions had to be uploaded through the DATSU webpage
        rather than from R scripts; format and workflow were unchanged from 2024 apart
        from a reminder on units. Ten submissions from nine countries arrived June-September;
        Faroes, Greenland and Portugal did not respond and Norway, absent since 2021,
        said it could not submit. National checks plus an online subgroup review on
        25 September led to endorsement of the product, subject to confirming the
        seine swept-area calculation; QC support, coverage of under-12 m data and
        finer c-squares are planned.
      pages: 6-7, 16-17, 34-36
    outputs:
    - summary: Endorsement of the 2025 data product, conditional on confirming the
        swept-area calculation for seine gears.
      pages: '6'
    - summary: A comparison of public Norwegian VMS effort with the data call effort
        in the northern North Sea, 2024 (Figure 1).
      pages: '7'
    - summary: 'Four formal recommendations: SAR at métier level 4, missing VMS data
        in advice, c-squares as the ICES grid, and a maintained compilation of MPA
        and offshore wind data.'
      pages: '3'
    - summary: A seine-specific swept-area method with drafted code changes for the
        workflow analysis script.
      pages: 18-19
    - summary: A proposal for a single R package of workflow functions, SFDTools.
      pages: 19-20
    - summary: A review of harbour position sources for the in-port filter and a plan
        for a dedicated port list.
      pages: 20-22
    - summary: A working definition of high-resolution data as positions every 10
        minutes or less.
      pages: '23'
    - summary: A prioritised table of nine gaps in high-resolution data and methods
        with target years (Table 2).
      pages: '24'
    - summary: A comparison of AIS-fitted and AIS-transmitting small vessels by country
        from the EU Fleet Register and Global Fishing Watch (Table 3).
      pages: 31-32
    - summary: A work plan for the quality control subgroup and for a validated high-resolution
        example dataset.
      pages: 16-17, 34-35
