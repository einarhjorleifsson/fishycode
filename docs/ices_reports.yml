    terms:
    - duplicate reports
    - polls outside the year 2020
  - topic: removing entry and exit messages
    step: ping
    box: other
    theme: data quality of submissions
    kind: method
    pages: '105'
    pdf_pages: '111'
    summary: Messages that mark a vessel entering or leaving the NEAFC regulatory
