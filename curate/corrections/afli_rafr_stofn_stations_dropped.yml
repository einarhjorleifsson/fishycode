id: afli_rafr_stofn_stations_dropped
title: the afli adapter builds stations from stofn.parquet only, so 40,155 stations that exist solely in rafr_stofn never enter the pipeline
status: confirmed - measured, repair NOT implemented
applies_to:
  - staging/afli/station.parquet
  - staging/afli/fishing_sample.parquet
  - curated/logbook/station.parquet
  - curated/logbook/fishing_sample.parquet
  - curated/logbook/sensor_gps
implementation: none yet
discovered: 2026-09-23, maintainer, on being told that 1.6% of logger fixes could not reach a vid - "because it should not"

context: >-
  curate/logbook_sensor_gps.R joins the GPS logger to a vessel through
  .sid -> .tid -> vid. 820,271 of the logger's fixes, 1.6%, found no vid. The
  maintainer's response was that this should not happen, which is what prompted the
  trace.

  It is not the join. Every .sid that reaches curated/logbook/fishing_sample.parquet
  resolves perfectly - .tid found, schema afli, vid present, zero lost at each of
  those three steps. The whole loss is that 17,008 stations are not in
  fishing_sample at all.

the_defect:
  summary: >-
    sources/afli/convert.R reads rafr_stofn.parquet at :28 ONLY to build the eytt
    deleted flag, and builds the station table itself from stofn.parquet at :37. Any
    station present in rafr_stofn and absent from stofn therefore never becomes a row.
  measurement:
    stofn_rows: 6885574
    rafr_stofn_rows: 1149278
    in_rafr_but_not_in_stofn: 40155        # 3.5% of rafr_stofn
    of_those_eytt_0_not_deleted: 23570
    of_those_eytt_1_deleted: 16585
  years: >-
    2003-2021, peaking 2008-2014 (3,000-4,700 a year). Plus 2 rows dated 1899 and 41
    dated 2095/2097/2099, which are corrupt timestamps of the same kind as
    curate/corrections/stk_trail_time_outliers.yml in a different source.
  where_it_first_showed: >-
    17,008 of the 40,155 are referenced by the GPS logger, costing 869,933 logger
    fixes - 1.68% of the raw logger rows. They are also present in rafr_soknartegund
    (17,007), rafr_toga (14,807) and rafr_afli (11,357), so these are stations with
    gear and catch records attached, not empty shells.

the_assumption_that_failed: >-
  The adapter's own comment at :26-27 states it: "eytt_deleted = FALSE -> active in
  Oracle (rafr_ era, 2003-2020); eytt_deleted = NA -> not in rafr_ (paper era, or
  2020-2022 direct-load)". It anticipates stations in stofn that are absent from
  rafr_stofn, and not the reverse. stofn was taken to be the superset. For 40,155
  stations it is not.

not_established: >-
  Whether the 23,570 undeleted rafr-only stations SHOULD be in the pipeline. That
  depends on what the two tables mean to the source system - whether rafr_stofn is
  an overlay on stofn or a parallel record of the electronic era - and that is the
  maintainer's to say, not something the data answers. The 16,585 flagged eytt = 1
  are a separate question and probably belong out.

if_they_should_be_included: >-
  The repair is in the adapter, not downstream: union the rafr_stofn-only stations
  into the station source rather than using that table solely as a flag lookup. That
  changes staging/afli and everything below it, including a rebuild of
  curated/logbook and of curated/logbook/sensor_gps, so it should be decided before
  it is done rather than discovered mid-rebuild.

open_questions:
  - Do the rafr-only stations carry positions and times, or only gear and catch? If
    the station geometry is missing they cannot be placed even once admitted.
  - 1.68% of logger fixes is the visible cost. The cost to the logbook tables
    themselves - catch, effort, stations - has not been measured, and is the larger
    number if these records are real.
