id: afli_rafr_stofn_stations_dropped
title: 23,570 live electronic logbook submissions never reach stofn, the source system's own merged table
status: confirmed and characterised - repair HELD, decided 2026-09-23, pending the source system's own answer
applies_to:
  - staging/afli/station.parquet
  - staging/afli/fishing_sample.parquet
  - curated/logbook/station.parquet
  - curated/logbook/fishing_sample.parquet
  - curated/logbook/sensor_gps
implementation: none, and none is to be written until the upstream answer arrives - see the_decision_taken
discovered: 2026-09-23, maintainer, on being told that 1.6% of logger fixes could not reach a vid - "because it should not"

the_model: >-
  Maintainer, 2026-09-23: rafr_* are what gets automatically fed FROM THE VESSELS;
  there is then internal bookkeeping where those are merged with logbooks that are
  not electronically submitted, which carry a positive visir.

  Confirmed. stofn.parquet holds 1,275,274 negative visir (electronic) and 5,610,300
  positive (paper), so it is the merged bookkeeping table. rafr_stofn.parquet is
  1,149,278 rows and every one is negative - the raw electronic feed.

the_merge_works_as_designed:
  measured: |
    eytt        not in stofn    in stofn     share reaching the merge
    0 (live)         23,570    1,108,796               97.9%
    1 (deleted)      16,585          327                1.9%
  reading: >-
    The merge EXCLUDES deleted submissions and ADMITS live ones. That is intent, not
    defect, and it means sources/afli/convert.R reading stofn.parquet is reading the
    correct table. An earlier version of this file claimed the adapter "drops 40,155
    stations"; that was wrong on the number and on the attribution. 16,585 of them
    are deleted and correctly absent.

the_actual_anomaly:
  count: 23570
  what: >-
    Electronic submissions, never deleted, that the source system's own merge did not
    carry into stofn. 2.1% of live electronic submissions.
  by_year: |
    2003    27   2009 1,697   2015 1,353
    2004   926   2010 2,421   2016 1,248
    2005   356   2011 3,288   2017 1,341
    2006   380   2012 2,364   2018   583
    2007   358   2013 2,193   2019    15
    2008 2,913   2014 2,098   2020     8
  shape: >-
    Peaks 2008-2014 and falls away after 2018. The fall is an artefact of the dump,
    not of the merge: rafr_stofn stops being populated around 2019 - 166,151 negative
    visir appear in stofn with no counterpart in rafr_stofn, and 163,233 of those are
    2020-2022, which is the "2020-2022 direct-load" the adapter's own comment at :27
    already names.
  as_a_rate_it_only_declines: >-
    Measured 2026-09-23 by curate/checks/afli_rafr_stofn_loss.R. The by_year COUNTS
    above peak in 2008-2014, but that is where the volume is. As a share of each
    year's submissions the loss is worst at the very start and falls monotonically:
    2004 19.1%, 2005-2008 5.0-6.3%, 2009-2014 2.2-3.3%, 2015-2017 1.4-1.5%, 2018
    0.58%, 2019 0.02%, 2020 0.02%. That is the shape of a reporting system maturing,
    not of an era with its own cause, and it revises the "shape" line above rather
    than contradicting the counts in it.
  which_matters_two_ways: >-
    The early years are far riskier than the 2.08% headline implies - anything
    computed over 2004-2008 carries a 5-19% per-year loss. And the defect had
    effectively stopped BEFORE the feed table did: at 0.02% in 2019-2020 it is
    reasonable to infer the 2020-2022 direct-load era does not carry it. That is an
    inference from the trend, not a measurement, and bounded_to_2019 below still
    stands - there is no feed to check those years against.
  not_empty_shells: >-
    The same stations appear in rafr_soknartegund, rafr_toga and rafr_afli, so they
    carry gear and catch records.

cost_where_it_surfaced: >-
  curate/logbook_sensor_gps.R could not reach a vid for 820,271 logger fixes (1.6%).
  Those point at 17,008 stations, of which 8,940 are the live anomaly and 8,068 are
  deleted records the logger had recorded against before deletion - the latter being
  unremarkable.

  Note what was NOT wrong: every .sid that does reach curated fishing_sample resolves
  perfectly - .tid found, schema afli, vid present, zero lost at each step.

what_they_are:
  measured: 2026-09-23
  they_are_real_hauls: >-
    Of the 22,475 anomalies that share an xml_faerslu_visir with a row that DID merge,
    only 14 (0.1%) are an exact twin on vessel, date, gear and position. 96.3% have no
    positional twin at all. So sharing an entry means "same submission", not
    "duplicate" - a submission routinely carries several hauls (1 row in 90,522
    entries, 2-8+ in ~11,000). These are individual hauls dropped out of multi-haul
    submissions while their siblings were kept.
  they_are_complete: >-
    100% carry breidd and lengd, 99.1% carry dypi - the same rates as the rows that
    merged. 31,210 catch records hang off them.
  no_truncation_pattern: >-
    Within a partly-dropped submission the lost rows sit in the middle 21,534 times of
    22,475, and the kept rows are middle 687,484 times of 702,153. The same
    proportion. It is not a cut-off at the end of a submission; it is scattered.
  so_not: supersession, resubmission, deletion, or truncation. None of the four fits.

the_skew_is_the_argument:
  overall_loss: 2.08%
  per_vessel_on_444_vessels_with_50plus_stations:
    median: 1.29%
    p90: 5.84%
    p95: 10.34%
    p99: 35.24%
    max: 78.40%
  vessels_losing_over_5pct: 53
  vessels_losing_over_10pct: 25
  vessels_losing_over_25pct: 7
  worst: "skipnr 2395 - 265 of its 338 electronic stations missing; skipnr 1440 - 1,698 of 4,686"
  reading: >-
    2% spread evenly would be ignorable. It is not spread evenly. For seven vessels a
    quarter or more of their logbook stations are absent from the curated data, and for
    one, four fifths. Any per-vessel quantity - effort, footprint, CPUE, spatial
    distribution - is materially wrong for those vessels, and nothing in the data as it
    stands says which they are.
  in_tonnage_it_is_small: "5,666,434 of 6,076,786,637 = 0.09% of catch. The event count, not the tonnage, is what matters here."

recommendation:
  recover_them: >-
    Yes, on the strength of the skew rather than the total. The records are real,
    complete and undeleted.
  but_not_in_the_adapter: >-
    AGENTS.md: "Corrections live in curate/, never in a source adapter. An adapter that
    reads two other sources is no longer an adapter." sources/afli/convert.R must go on
    reading stofn.parquet faithfully - it is the source system's own merged table and
    reproducing it is the adapter's job. The recovery belongs as
    curate/corrections/afli_rafr_stofn_stations_dropped.R, paired with this file,
    unioning the recovered stations with a basis column recording that they came from
    the electronic feed and not from the bookkeeping.
  bounded_to_2019: >-
    rafr_stofn stops being populated around 2019, so this defect can neither be
    measured nor repaired after that. 166,151 negative visir appear in stofn with no
    counterpart in the feed, 163,233 of them 2020-2022. Whether the same loss continues
    in the direct-load era is UNKNOWABLE from the data held here. State it; do not
    imply the repair is complete.
  report_upstream: >-
    This is a defect in the source system, not in this repo. 23,570 hauls with
    positions and 31,210 catch records, submitted electronically and never deleted,
    lost between the vessel feed and the bookkeeping table over 2003-2019. Whoever
    maintains that merge should know. Maintainer's action, not this repo's.
  when: >-
    Superseded by the_decision_taken, 2026-09-23. The recommendation above stands as
    the shape the repair should take IF it is ever written; it is not the plan of
    record. The plan of record is to hold.

the_decision_taken:
  date: 2026-09-23
  by: maintainer
  choice: >-
    Do NOT admit the rows yet. Report the defect upstream first and wait for the source
    system's own account of why its merge drops them. No R is to be written against this
    correction until that answer arrives.
  reason: >-
    Every explanation this repo could test has been tested and all four fail -
    supersession, resubmission, deletion, truncation. What is left is a mechanism inside
    the source system that this repo cannot observe. A repair built on a guess at that
    mechanism would be a second defect wearing a correction's clothes, and it would be
    harder to find than the first, because the recovered rows would carry a basis column
    asserting a provenance nobody had confirmed. A measured gap that says "23,570 rows
    are missing and we do not know why" is a more honest artefact than a repair that
    quietly implies we do.
  what_this_does_not_change: >-
    The measurements stand. The skew stands. Any per-vessel quantity over 2003-2019 is
    still materially wrong for the 53 vessels losing over 5% of their stations, and this
    file remains the only place that says so. Holding the repair is not the same as
    deciding the data is fine.
  what_unblocks_it: >-
    An answer from whoever maintains the stofn merge, on the record, saying what the
    merge does with these rows. If the answer is "they should have merged and did not",
    the recommendation above becomes the plan. If the answer names a legitimate exclusion
    rule this repo has not modelled, the correction is closed as "working as designed"
    and the by-vessel warning goes in docs/ instead.
  tracked_as: TODO item 19, needs maintainer
  the_warning_is_published: >-
    2026-09-23, so that holding the repair does not mean staying silent.
    curate/checks/afli_rafr_stofn_loss.R emits curated/check/afli_rafr_stofn_loss.parquet
    - one row per vessel, with a usable flag - and docs/afli-dropped-stations.qmd names
    the 53 vessels an analyst must not compute per-vessel figures for. The check
    reproduced every number in this file independently.

the_report_to_send:
  note: >-
    Drafted here so the decision and the thing it depends on are not in two places.
    Maintainer's to send, edit or discard. Written for someone who maintains the merge,
    not for someone who knows this repo.
  text: |
    Electronic logbook submissions that are never deleted are not all reaching stofn.

    Over 2003-2019, 23,570 rows in rafr_stofn carry eytt = 0 and have no counterpart
    in stofn. That is 2.1% of live electronic submissions. The merge is clearly doing
    the right thing with deleted records - only 327 of 16,912 deleted submissions
    appear in stofn - so this is not the deletion rule firing.

    The 23,570 look like ordinary records, not shells. 100% carry breidd and lengd,
    99.1% carry dypi, and 31,210 rows in rafr_afli hang off them. They also appear in
    rafr_soknartegund and rafr_toga.

    They are not duplicates or resubmissions. 22,475 of them share an
    xml_faerslu_visir with a row that did merge, but only 14 are an exact twin on
    vessel, date, gear and position, and 96.3% have no positional twin at all. What
    the sharing means is that a submission carries several hauls: these are individual
    hauls dropped out of multi-haul submissions while their siblings were kept. Within
    a partly-dropped submission the lost rows sit mid-sequence in the same proportion
    as the kept ones, so it is not a truncation at the end of a transfer either.

    The loss is very unevenly spread across vessels, which is why it matters more than
    2% suggests. Of 444 vessels with 50 or more electronic stations, the median loses
    1.29%, but the 95th percentile loses 10.3% and the worst loses 78.4% - skipnr 2395
    is missing 265 of its 338 electronic stations, and skipnr 1440 is missing 1,698 of
    4,686. 53 vessels lose over 5%, 25 over 10%, seven over a quarter.

    By year it peaks in 2008-2014 and falls away after 2018, but the fall may be an
    artefact of our extract: rafr_stofn appears to stop being populated around 2019,
    and 166,151 negative visir appear in stofn from then on with no counterpart in it,
    163,233 of those in 2020-2022. So we cannot tell from our copy whether the same
    loss continues after 2019.

    What would help: an account of what the merge does with these rows. If they were
    meant to merge and did not, we would like to know the mechanism before we decide
    whether to supplement our own copy from the feed. If there is an exclusion rule we
    have not modelled, we would rather model it than work around it.

the_decision_that_was_needed: >-
  Whether to supplement stofn with the 23,570 live rafr_stofn rows the source lost.
  This is not a bug fix in this repo - the adapter faithfully reproduces the source's
  merged table, which is arguably the correct thing for an adapter to do. Admitting
  them means this repo asserting that the electronic feed is more complete than the
  bookkeeping, which is a claim about the source system and the maintainer's to make.

  If admitted, the repair goes in curate/ and NOT in the adapter - see
  recommendation.but_not_in_the_adapter - and forces a rebuild of staging/afli,
  curated/logbook and curated/logbook/sensor_gps. An earlier revision of this line
  put the repair in the adapter; that contradicted AGENTS.md and is withdrawn.

open_questions:
  - Is the loss a property of particular submission software or shore systems? The
    per-vessel skew suggests something systematic rather than random, but it is not a
    test of what. Partly narrowed 2026-09-23: as a rate the loss declines steadily
    from 2004 to 2019, so whatever it is got better over time rather than switching
    on in one era. rafr_stofn would need a column identifying the submitting client,
    and it has not been looked for.
  - Does the same loss continue after rafr_stofn stops being populated around 2019?
    UNKNOWABLE from the data held here - there is no feed to compare stofn against
    for 2020-2022. Only the source-system maintainer can answer it.
  - Answered 2026-09-23, kept so the questions are not asked twice - the 23,570 DO
    carry geometry (100% breidd and lengd, 99.1% dypi), and the cost to the logbook
    tables IS measured (23,570 stations, 31,210 catch records, 0.09% of tonnage).
