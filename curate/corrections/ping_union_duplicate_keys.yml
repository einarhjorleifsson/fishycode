id: ping_union_duplicate_keys
title: ping_union carries 21,920 duplicate position keys from three unrelated causes
status: astd population REPAIRED 2026-09-23; cross-provider copies flagged in ping_clean 2026-10-08 (decision 069); the rest left in the union by design; TODO item 5 closed 2026-10-08 - see closed_2026_10_08
applies_to:
  - staging/ais/ping_union   (all years)
affects_rows: 21,952 excess rows in 527,960,318 (0.0042%)
affects_rows_after_rebuild_2026_09_22: >-
  22,401 excess in 543,088,458 (0.0041%) across 22,369 groups. Up slightly because
  astdB now reaches the union: groups spanning two providers rise from 405 to 653.
  Group sizes are 2 (21,690 single-provider, 653 cross-provider), 3 (21), 4 (4)
  and 5 (1).
implementation: curate/ais_ping_union.R, astd block - see repair.implemented below
discovered: 2026-09-21 (25 rows in 2020, unquantified); measured in full 2026-09-21
detection: curate/corrections/ping_union_duplicate_keys.R

supersedes_todo_wording: >-
  TODO item 5 described these as "exactly-duplicated rows - same vid, time, lon,
  lat" and proposed "count(vid, time, lon, lat) |> filter(n > 1)" as the check.
  Both need correcting. curate/ais_ping_union.R binds its four sources with
  union(), not union_all(), at lines 98-101. dplyr's union() renders SQL UNION,
  which is UNION DISTINCT - verified with sql_render() on a simulated backend,
  not assumed. Rows identical in every column are therefore already removed
  before anything is written. Every group counted here is a KEY COLLISION whose
  members differ in at least one non-key column. The proposed check is still the
  right query; it is not counting what the item says it counts.

  The item also proposed "most likely one fix arriving from two providers, or a
  provider delivering a ping twice" as alternatives. Both are true, of different
  populations. And the 25 rows originally seen in 2020 are the stk population -
  2020 is the single year with ZERO astd duplicates, so the year the defect was
  first noticed is the year least representative of its bulk.

measurement:
  method: >-
    Per year (and per month for 2017, which exceeds memory as a single group):
    GROUP BY vid, time, lon, lat HAVING COUNT(*) > 1, carrying the distinct
    provider set and the distinct-value count of speed, heading and mmsi within
    each group. Read directly from year=YYYY/ paths rather than through the
    dataset, to avoid the duplicated `year` column of TODO item 11 (closed 2026-10-08,
    decision 003: the union carries `year` only in the path).
  totals_by_population: |
    population      groups   excess   speed differs   heading differs   mmsi differs
    astd            21,142   21,142      15,821             0                0
    astd+emodnet       405      405         404             0                0
    stk                373      405         323           304                0
    TOTAL           21,920   21,952
  by_year: |
    2007 stk 2      2013 astd 315   stk 2     2020 stk 25
    2008 stk 9      2014 astd 417   stk 20    2021 stk 20
    2009 stk 14     2015 astd 3285  stk 27    2022 stk 27
    2010 stk 13     2016 astd 3350  stk 91    2023 stk 27
    2011 stk 33     2017 astd 4171  stk 2     2024 stk 35
    2012 stk 7           astd+emodnet 405     2025 stk 9
                    2018 astd 4504  stk 6     2026 stk 3
                    2019 astd 5100  stk 1

populations:
  astd:
    shape: >-
      Confined to 2013-2019 and ZERO from 2020 onward. Rises 315 -> 5,100 across
      the seven affected years, then stops dead. A bounded era, not a trend -
      which is what distinguishes a property of how the 2013-2019 astd staging
      was assembled from a property of the feed.
    heading_never_differs: >-
      Not a finding about the data. curate/ais_ping_union.R:48 does not select a
      heading for astd, so the column is NULL for every astd row and cannot
      differ. Recorded so the zero is not read as agreement.
    speed_differs_in_75_percent: >-
      astd speed is DERIVED in this script, at line 46, as
      dist_nextpoint / sec_nextpoint. The share of groups whose speed differs
      climbs from 28% (2013) to 100% (2019).
    why_it_differs_MEASURED_2026_09_22: >-
      The inference previously recorded here - that the feed computed a different
      SUCCESSOR for each copy, so the copies were not adjacent in the source
      ordering - is WRONG. Checked against staging/ais/astd itself, which the note
      admitted had never been done.

      What is actually there: one member of the pair carries dist_nextpoint = 0
      and sec_nextpoint = 1 EXACTLY, and the other carries a real distance and a
      real duration (368 s, 36 s, 360 s, 81 s, 238 s, 360 s in the six groups read).
      Every emission column - co, co2, nox, fuelcons, blackcarbon and the rest -
      scales with the duration, so they are tiny on the degenerate member too and
      differ for the same single reason.

      It is not two positions in a sequence. It is one real row and one placeholder.

      Quantified over 2019: of 5,613 duplicate groups, 5,536 (98.6%) have EXACTLY
      ONE member with (0 m, 1 s); 69 have none and 8 have both.

      (0 m, 1 s) also occurs outside duplicate groups - 26,497 rows of the
      40,710,111 Icelandic astd rows in 2019, 0.065%. Whether it is a sentinel or a
      genuinely stationary vessel sampled a second apart is NOT established. Inside
      a duplicate group it does not matter: the same ping cannot have two different
      true successors, and the member with a real distance is the informative one.
    answered_2026_09_22: >-
      YES - they exist upstream, in staging/ais/astd, and in far greater numbers
      than reach the union. Grouping that staging by (mmsi, date_time_utc,
      longitude, latitude) over Icelandic MMSIs: 766,625 duplicate groups in 2015,
      5,613 in 2019, 6,661 in 2021. The union did NOT create them.

      Two things follow. The union is a filter, not a source: only Icelandic
      registry vessels survive the mmsi join and UNION DISTINCT removes members
      identical in every column, which is why 766,625 groups upstream in 2015
      become 3,285 in the union, and why 2021 shows 6,661 upstream and zero in the
      union. And the bounded 2013-2019 shape recorded above is a property of the
      union's population, not of the astd feed - the feed has duplicates in 2021
      too.

      The repair still belongs in curate/, not in the adapter: AGENTS.md puts
      corrections in curate/ and never in a source adapter, and staging/ais/astd
      is 123 GB, so de-duplicating at the union is both the rule-conformant and the
      cheap place.
  astd_plus_emodnet:
    shape: >-
      405 groups, all in 2017, which is the ONLY year emodnet covers
      (raw/ais/EmodNet/is2017.csv). This is genuinely the same position reported
      by two providers, and is the one population TODO item 5's first hypothesis
      describes. It cannot recur in another year without another emodnet snapshot.
  stk:
    shape: >-
      373 groups spread evenly over all 20 years, 1-91 per year, no trend. The
      only population where heading also differs (304 of 373). Unrelated to the
      astd populations by every measure taken.
    ruled_out: >-
      NOT an artefact of the mid -> vid temporal interval join at line 32. A mid
      matching two vid intervals yields rows with different vid, and vid is part
      of the group key, so those cannot appear here. A mid matching the same vid
      twice yields rows identical in every column, which UNION removes.
  all_populations:
    mmsi_never_differs: >-
      Zero groups in any year, any provider, have more than one distinct mmsi.
      Whatever these are, they are not two vessels colliding on a key.

repair:
  proposed_2026_09_22: >-
    For astd, prefer the member whose next-point is real - i.e. drop the one with
    dist_nextpoint = 0 and sec_nextpoint = 1. This is not a tie-break between two
    readings; the degenerate member's derived speed is 0/1 = 0 knots, a fabricated
    stationary value, and stationary is exactly what decides "not fishing"
    downstream. It resolves 98.6% of the astd groups.

    An earlier proposal - prefer the SMALLER sec_nextpoint, on the theory that the
    nearest successor in time is the true one - would have selected the placeholder
    every time. It was built on the inference above, before that inference was
    checked. Recorded because the rule looked principled and was exactly backwards.

    Unresolved by this rule: the 69 groups per year with no degenerate member and
    the 8 with two, plus the 373 stk-internal groups, which have no derived
    quantity to reason from. Carry both members flagged rather than invent a rule.
  implemented_2026_09_23: >-
    Built and verified end to end. The union fell from 543,088,458 rows to
    543,045,030 - 43,428 degenerate members dropped, which is larger than the
    21,142 astd groups previously counted IN the union because the filter runs on
    all Icelandic-MMSI astd rows, before the vid join narrows them to registry
    vessels.

    Checked on the rebuilt 2019 partition: 5,101 duplicate groups before, 69 after
    - exactly the 69 measured as having no degenerate member. The 8 both-degenerate
    groups disappear without being targeted: with both speeds at 0 the two rows are
    identical in every selected column, so UNION DISTINCT removes one.

    What remains in the union is therefore the residue the rule declines to guess
    at, not a failure of it.
  still_the_maintainers: >-
    Whether the cross-provider groups (653 after the 2026-09-22 rebuild, was 405)
    take a provider precedence, and which. stk is the domestic receiver and the
    others are resold, which argues for stk first, but that is a judgement about
    the feeds and not something in the data.
  answered_2026_10_08: >-
    Settled downstream of the union. Decision 069 and
    curate/corrections/ais_cross_feed_duplicates.yml take the feed order
    stk > astd > astdB > emodnet (the tie order ais_ping_trail.R already used) and
    flag a lower feed's copy of a report as whack_stage "duplicate" in
    ais_ping_clean.R when it is within 10 s and 128.6 m of a higher feed's ping.
    The cross-provider groups here are 0 s and 0 m apart, so they fall inside that
    rule. Nothing is removed from the union.
  why_it_is_not_just_a_distinct: >-
    Picking either member arbitrarily is not safe. Downstream, speed is what
    decides whether a ping is fishing - it is the input to ais_ping_clean.R and
    to trip segmentation. For 15,821 astd groups and 323 stk groups the two
    members disagree on exactly that value, so "take the first" silently makes a
    fishing/not-fishing call by row order.
  constraint: >-
    A repair adds columns, per this project's rule. Whichever member is chosen,
    the other's speed and the basis for the choice should survive alongside it.

closed_2026_10_08: >-
  TODO item 5 closed on the second half of its check: the keys that survive in
  ping_union are legitimate there. The union is the source-shaped merge and keeps
  every member, because a correction never destroys the original. What is left in it
  is the residue the astd rule declines to guess at (about 69 groups a year), the
  stk-internal groups (373 over 20 years, measured 2026-09-21), and the
  cross-provider copies, now flagged in ping_clean (repair.answered_2026_10_08).
  One row per (vid, time) is enforced where analysis starts, in ais_ping_trail.R:
  stk first, then provider name, then lon, lat. Measured 2026-10-08 on
  curated/ais/trail, year by year: 562,417,835 rows, 0 duplicate (vid, time). That
  order is deterministic but does not decide which of two stk members is right; the
  member not taken stays upstream. The populations were not re-measured on the
  current union. Closing check by Claude (AI-assisted).

impact:
  on_analysis: >-
    Negligible by volume - 0.0042% of pings. It matters for two reasons that are
    not about volume. First, vid + time is the key trip segmentation and speed
    filtering operate on, so a duplicated key is a row that cannot be resolved by
    joining. Second, the astd population is bounded to 2013-2019, so any
    per-period comparison spanning 2019/2020 crosses a boundary in the data's
    duplicate structure as well as in its content.
  priority: >-
    Low by volume, but it should be settled BEFORE the item 13 rebuild, because
    every downstream stage inherits it and re-deriving them later means re-running
    from the union.

related:
  - astd_missing_months   (why 2017-07 shows no astd duplicates: there is no astd 2017-07)
