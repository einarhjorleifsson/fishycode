id: ais_key_callsign_reuse
title: a reused call sign sends the AIS match to the wrong keel - 235,121 pings on a vessel that never landed
status: confirmed - defect measured against landings (3 of 31 patched), against
  other-provider AIS activity for non-landing classes (18 more found, decision
  044), and 2026-09-28 those 18 track-correlated against candidate vids'
  positions (7 clean handovers + 4 ghosts + TÝR confirmed, proposed but NOT YET
  entered via overrides/ - see curate/decisions/045-track-correlation-resolves-callsign-reuse.md);
  structural repair (ais_key.R itself) still NOT implemented
applies_to:
  - curated/vessel/vessel_ais_key.parquet
  - raw/ais/stk/stk_mobile_match-and-duals.ods
implementation: >-
  Partial, 2026-09-23. Three cases (vid 3047, 2605, the recent era of 3045) added as
  rows to raw/ais/stk/stk_mobile_match-and-duals.ods, tagged basis: reconstructed to
  mark them apart from the human-reviewed basis: recorded rows. This is a row-level
  patch, not the structural fix - see proposed_repair.
discovered: 2026-09-22, running the landings cross-check proposed by the maintainer, for curate/plans/003-stk-vessel-identity.md

context: >-
  The Icelandic vid is assigned to the keel: a vessel may change name, call sign and
  local sign, but the vid stays with it from cradle to grave. Call signs, by contrast,
  are reissued. reference/vessels/ais_key.R builds its call-sign lookup at :245 as a
  flat set - pull(cs) |> unique() - with no time dimension, so a call sign that has
  moved from one keel to another matches whichever row the join happens to reach.

defect:
  summary: >-
    Call sign TFBR is held by two vids - 1473 (HOLMBERG, registry yh2 = 2006) and
    3047 (HILDUR SH777). mid 101759 has loid = 1473, glid = TFBR and a first ping of
    2011-07-22. The key assigns it vid 1473, mmsi 251176000, step vid_cs, from
    2011-07-22 to the 2028-12-24 sentinel.
  pings_misattributed: 235121
  evidence:
    landings_vid_1473: 0
    landings_vid_3047: 3770
    landings_vid_3047_span: 2025-01-11 .. 2026-04-14
    reading: >-
      235,121 pings are attributed to a vessel with no landing record at all, while the
      vessel that landed 3,770 times in 2025-26 has no AIS identity anywhere in the key.
      Whether the whole 2011-2026 span belongs to 3047, or 1473 is simply stale in STK's
      own loid, has NOT been established - only that the current assignment is wrong for
      the recent part of the span.

scope: >-
  Measured 2026-09-22, re-measured and reviewed candidate-by-candidate 2026-09-23.
  curate/checks/ais_key_reused_callsign.R goes to raw/ais/stk/mobile.parquet and
  raw/ais/stk/trail/ directly rather than off the finished key, so it catches a
  vessel that got the WRONG vid, not only one left with none. Restricted to domestic
  vessels (call sign starts TF, vid < 3700); reference/vessels/ais_key.R already
  states vid 3700-4999 gets no further matching effort, so foreign misses there are
  expected, not counted here.

  31 vessels showed a real STK mobile id broadcasting their own call sign, with
  pings covering their own landing window, that vessel_ais_key did not assign to
  them. The full per-vessel review - method, disposition and why - is
  curate/decisions/020-reused-callsign-candidate-review.md. In short: 3 fixed (this
  file's implementation, above); 13 turned out to already be correctly keyed via a
  separate mid the call-sign search never found - never actually defects; 13 more
  show no discontinuity anywhere near the claimed landing window and read as
  landings-side noise, not an AIS defect; 2 are weak/mixed and were not acted on.

  vid 1599 (uid BA021, named in an earlier version of this note as unexamined) is
  NOT a mismatch: no STK mobile id, ever, broadcasts that local sign. It is one of
  the ~50 remaining "landed, no AIS identity" domestic vessels that appear to have
  genuinely never transmitted to STK, a different and larger open question than
  this defect - not counted in the 31 above.

  None of this is asserted as ground truth - the premise that one STK mobile id can
  be legitimately time-split between two real vessels is a modelling choice, not
  something directly observable in the data. A conclusion drawn from any one row
  still re-enters through overrides/ as an input, never as a computed output.

  Extended 2026-09-28 (curate/decisions/044): this whole review was scoped to
  vessels with landings, which by construction misses every non-fishing class -
  Coast Guard, ferries, and others. The maintainer's own cross-check of
  curated/ais/ping (vids with real pings in ASTD/astdB/EMODnet but none at all in
  STK) found 19 such vids; 18 show the identical defect once the vessel's own
  other-provider ping window stands in for a landing window as the independent
  activity signal - 9 ghost, 8 overlapping, and TFBR itself turns out to be a
  three-way collision (HOLMBERG/1473, HILDUR/3047 - already patched as if it were
  a clean two-way split - and DISA/2815, previously missed, whose own activity
  overlaps the same era HILDUR's does). One more (TYR/1421) is a fourth pattern:
  its matching mid is absent from vessel_ais_key.parquet entirely, not assigned
  elsewhere. None of the 18 is patched - see decision 044 for the per-vessel list.

proposed_repair: >-
  Structural, not a row edit. Plan 003 section 4.1: split vessel_ais_key into an identity
  table (mid-period -> vid, the keel) and an attribute table (vid, t1, t2 -> mmsi, cs,
  uid, vessel), and make every lookup set in the cascade a time-constrained join instead
  of a flat set. Under that construction TFBR in 2011 fails to match HOLMBERG, whose
  attribute window closes in 2006, instead of matching it silently.
  Any per-case conclusion drawn from landings re-enters through overrides/, never as a
  computed output - the AIS -> vid -> logbook -> AIS cycle in AGENTS.md.
