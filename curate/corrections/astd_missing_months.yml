id: astd_missing_months
title: staging/ais/astd is missing four months, one of them held in raw and never loaded
status: measured - gap located and bounded, repair is a re-run and is NOT done
applies_to:
  - staging/ais/astd   (year=2017, year=2019, year=2023)
affects_rows: unknown until loaded; the two recoverable months are 1.17 GB zipped, 10.1 GB of CSV
implementation: none yet
discovered: 2026-09-21, while measuring ping_union_duplicate_keys

defect:
  summary: >-
    staging/ais/astd has 12 monthly partitions for most years and fewer for
    three. Two of the gaps are genuine source gaps. Two are not: the raw
    delivery is present and the conversion never produced an output.
  coverage: |
    year   staging months   raw zips   verdict
    2017   11 (no 07)       11         source gap - the zip does not exist
    2019   11 (no 01)       11         source gap - the zip does not exist
    2023   10 (no 08, 09)   12         DATA LOSS - both zips are present in raw
    all others  12          12         complete
  the_two_lost_months: >-
    raw/ais/astd/ASTD_area_level1_202308_manual.zip  (614 MB)
    raw/ais/astd/ASTD_area_level1_202309_manual.zip  (558 MB)
    Both carry the "_manual" suffix, and inside, the CSV entry is not
    ASTD_area_level1_YYYYMM.csv but a dumped SQL query:
      _SELECT_mmsi_123456789_as_ship_id_mmsi_imonumber_date_time_utc_v_202406271208.csv
    So these two months were exported by hand from the provider's query console
    (the literal mmsi_123456789 is a placeholder in the SELECT) rather than
    delivered through the normal channel, and they are the only two zips in the
    set of 155 that are shaped this way. That they are also the only two
    recoverable months absent from staging is unlikely to be coincidence.

cause:
  not_the_file_pattern: >-
    Checked, and ruled out. dump/ais/astd.R:93 and :261 glob "\\.zip$", which
    matches. :348 picks the entry by "\\.csv$", which matches. :266 takes the
    year-month with regexpr("\\d{6}") on the ZIP basename, which yields 202308
    correctly. :206 documents the suffix explicitly as
    ASTD_area_level1_YYYYMM[_manual].zip. R's unzip(list = TRUE) sees the entry
    and it satisfies the pattern. Nothing in the code excludes these files.
  where_it_stopped: >-
    No month=08 or month=09 directory exists under year=2023 at all. :381
    creates the output directory BEFORE the copy, so the loop cannot have reached
    that line. The only earlier exits are the unzip failure at :341 and the
    no-CSV-found branch at :350, and both only warning() and next(). The
    pipeline did not break either, since 2023-10 through 12 were written.
  the_cause: >-
    THE ZIPS USE DEFLATE64, WHICH R CANNOT READ. Established 2026-09-21 by
    running the script and reading zipinfo, after three wrong guesses recorded
    below.

      zipinfo -v, compression method:
        ASTD_area_level1_202312.zip          deflated                 <- works
        ASTD_area_level1_202309_manual.zip   deflated (enhanced-64k)  <- fails

    "enhanced-64k" is Deflate64, PKWARE method 9. R's unz() and unzip() are
    built on zlib, which implements only method 8, so R cannot read these two
    members at all - not a row of them. unz() fails immediately with "error
    reading from the connection", which is why sniff_zip() returns NULL at :60
    and the month never enters cols_by_month, and the same failure recurs at
    :341 in the conversion loop.
  visible_in_the_scripts_own_output: >-
    The sniff prints "Sniffing 155 files" and then "Canonical schema across 153
    months" - two files silently absent - and its non-standard-column-set table
    jumps 202307 -> 202310. The number 153 appears in the output of every run
    and has never been compared with 155.
  wrong_guesses_recorded: >-
    Three, all plausible and all wrong, kept because each is the kind of thing
    that will be guessed again:
      1. The "_manual" filename defeating the glob. No - :93/:261 glob "\.zip$"
         and :206 documents the suffix.
      2. The member exceeding 4 GB. No - 202312 at 4.46 GB reads fine while
         202309 at 4.50 GB fails.
      3. A transient temp-space failure during the 155-file run. No - it is
         deterministic and reproduces on demand.
    The first two were asserted from reading code and file sizes. Only running
    the script and inspecting the container settled it.
  the_log_is_still_empty: >-
    dump/ais/astd.R:313 creates staging/ais/log/ for a per-run log and the
    directory is EMPTY, so nothing recorded the two warnings at the time.
    curate/decisions/003-undeclared-dump-inputs.md records the run as "clean:
    2,769,131,193 rows, 2013-2026, 124 GB, in 25.5 min" - a row total with
    nothing to check month coverage against. That remains a defect in its own
    right even now the cause is known.

repair:
  a_plain_rerun_does_not_work: >-
    Tried 2026-09-21. The script skips the 153 written months, reaches
    202308_manual, fails in unzip() for the reason above, warns and next()s, and
    2023 is still at ten partitions. Re-running is not the repair.
  the_failure_was_never_silent: >-
    Worth stating plainly, because this registry's whole premise is silent
    corruption and this is NOT an instance of it. The run ends with:

        --- Summary ---
          Written:  0
          Skipped:  153  (parquet already existed)
          Failed:   2
          Failed months:
            202308
            202309

    The script names the two failed months, by number, every time it runs. It
    also leaves the tree clean - no empty partition directories, no truncated
    parquet, verified after the 2026-09-21 run. The tooling did its job. What
    went wrong is that curate/decisions/003-undeclared-dump-inputs.md recorded
    the original run as "clean: 2,769,131,193 rows, 2013-2026, 124 GB, in
    25.5 min" - a row total taken from a run whose own summary said Failed: 2.
    The defect is in the reading, not the reporting.
  an_earlier_claim_here_was_wrong: >-
    This file first said the script "exits reporting success". It does not, and
    that was written without having run it. Corrected the same day.
  action: >-
    Decompress the two members with a tool that implements method 9, then read
    the CSV. macOS Info-ZIP unzip does: `unzip -p` streams both files correctly.
    bsdtar does NOT (it stops after 224 bytes). 7z is not installed here.
    Either pre-extract the two CSVs by hand and point the COPY at them, or give
    :341 a fallback that shells out to `unzip -p` when R's unzip() fails -
    preferable, because it also fixes the sniff at :68 and survives the next
    hand-exported month.
  two_more_things_differ_in_these_files: >-
    Both must be handled whichever route is taken, and neither is visible until
    the file can be read at all:
      * An EXTRA LEADING COLUMN, ship_id, that no other month has - 28 columns
        against 27. It is the "mmsi_123456789_as_ship_id" of the filename: the
        hand-written SELECT aliased a placeholder MMSI into a column. The
        canonical SELECT at :288 names columns explicitly, so an extra one is
        ignored, but cols_by_month will not have these months and :369 will
        borrow the previous month's column set.
      * Quoted header names and a quoted imonumber where other months are bare,
        and a millisecond timestamp (2023-08-31 17:43:31.000). CAST AS TIMESTAMP
        handles the milliseconds; 202308/202309 are not in mdy_period at :230,
        which is correct, as the format is ISO.
  cost: >-
    The schema sniff over all 155 zips re-runs unconditionally (its saveRDS
    cache is commented out at :88) at 0.0-0.4 s per zip, about a minute. The two
    months are 10.1 GB of CSV to decompress and copy, a few minutes more.
  hazard: >-
    DO NOT run it where the machine may sleep or shut down mid-copy. :388 skips
    on file.exists(out_file), not on a completed write, so a truncated
    astd_202308.parquet left behind by an interrupted COPY would be treated as
    done by every subsequent run. Delete any partial output before retrying.
  then: >-
    Re-measure ping_union_duplicate_keys after loading, because the two new
    months are inside the 2013-2019 band where the astd duplicate population
    lives, and 2023 currently has none.

separate_finding:
  summary: >-
    :388's existence check is a silent-success hazard in its own right, and the
    same shape as TODO item 7's three cases: it cannot distinguish a complete
    parquet from a truncated one. A size or row-count assertion, or a write to a
    temporary name followed by a rename, would remove it. Worth an item of its
    own; not raised as one here because it belongs to the dump/ scripts, which
    sit outside the targets graph by design (decision 003).

impact:
  on_analysis: >-
    Two months of 2023 AIS are absent from every stage downstream of the union.
    Nothing errors, and nothing in the product says so. Any 2023 effort, coverage
    or trip count is low by two months of the year and reads as a real decline.
  priority: >-
    HIGH relative to its size, and it must be settled BEFORE the item 13 rebuild.
    Rebuilding the trail now bakes a two-month hole in 2023 into the product, and
    the hole is invisible once it is there.

related:
  - ping_union_duplicate_keys   (found while measuring it; explains the 2017-07 zero)
