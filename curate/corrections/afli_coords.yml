id: afli_coords
title: Wacky coordinates in the afli GPS logger tables
status: parked - incumbent retained, alternative measured but not adopted
applies_to:
  - raw/logbooks/afli/sjalfvirkir_maelar.parquet
  - raw/logbooks/afli/rafr_sjalfvirkir_maelar.parquet
affects_rows: ~26,800,000
implementation: curate/corrections/afli_coords.R

defect:
  summary: >-
    Positions were stored as DDMMmm integers, where the last two digits are
    hundredths of a minute (00-99). Downstream processing decoded them as
    seconds. Where the hundredths value was >= 60 - impossible as seconds but
    valid in DDMMmm - the software rolled the minute up and subtracted 60.
  formula: |
    x_wacky = dd + mm/60       + dm/3600         if dm <  60
            = dd + (mm+1)/60   + (dm-60)/3600    if dm >= 60
  displacement_m: 741
  affected_share: ~40% of records (those with dm >= 60)
  documented_in: docs/wacky-tracks_recovery.qmd

recoverability:
  verified: 2026-09-20, 200000 synthetic records against the documented formula
  unique_inverse: false
  finding: >-
    The encoding is not uniquely invertible - the rollover destroys the
    information distinguishing (mm, dm>=60) from (mm+1, dm-60). But it collapses
    to exactly TWO candidate decodings of the vessel's own GPS reading, and the
    true value is one of them in 100.00% of cases. The candidates are separated
    by a constant 741 m.
  candidates: |
    dd    <- trunc(w); total <- (w - dd) * 3600      # = mm*60 + dm, dm in [0,59]
    mm    <- floor(total / 60); dm <- total - mm * 60
    A     <- dd + mm/60       + dm/6000              # no rollover occurred  (~60%)
    B     <- dd + (mm-1)/60   + (dm+60)/6000         # rollover occurred     (~40%)

current_method:
  approach: >-
    Discards the logger coordinate and substitutes a position linearly
    interpolated from AIS tracks onto the logger timestamp. The original is
    retained as w_lon/w_lat.
  emits: [lon, lat, w_lon, w_lat, dt_sec]
  problems:
    - >-
      Throws away precision. The logger records to 0.01 minute (~18 m); an AIS
      interpolation is only as good as dt_sec, which the script itself flags as
      a reliability caveat.
    - >-
      Yields NA for any vessel with no AIS coverage in that year, so pre-AIS and
      untranspondered vessels get nothing.
    - >-
      Makes the output AIS-derived, which is why it is then folded back into the
      AIS ping table as provider = "wacky" - a circular dependency that keeps
      afli_coords outside the targets graph.

proposed_method:
  approach: >-
    Choose between candidate A and B rather than replacing the position. The
    logger track itself should disambiguate most points: pick the candidate that
    keeps the track continuous, since the wrong choice implies a 741 m jump and
    an immediate jump back. Use AIS only as a fallback for points the track
    cannot resolve.
  emits: [lon, lat, w_lon, w_lat, basis, margin_m]

retain_both_methods:
  decision: 2026-09-20, at the user's request
  rationale: >-
    The two derivations are independent estimates of the same thing - one from the
    vessel's own instrument, one from the shore/satellite AIS network - so keeping
    both supports analysis of how they differ. It also follows the project rule
    that a correction adds columns and never overwrites.
  how_without_reintroducing_the_cycle: >-
    The two are computed in DIFFERENT places, which is what keeps the DAG acyclic:

      curate/corrections/afli_coords.R   logger only, no AIS input.
                                         Emits lon/lat (candidate-selected),
                                         w_lon/w_lat (original wacky), basis,
                                         margin_m. Depends on nothing downstream,
                                         so the bootstrap cycle disappears.

      curate/checks/afli_coords_vs_ais.R joins the recovered positions to
                                         curated/ais/ping and adds lon_ais/lat_ais
                                         (AIS interpolated onto the logger clock,
                                         the current method) plus dt_sec and the
                                         distance between the two estimates.
                                         Emits curated/check/afli_coords.

    The correction sits upstream of AIS; the comparison sits downstream of both.
    Nothing is lost and no edge points backwards.
  benefits:
    - keeps the logger's own ~18 m precision instead of an interpolation
    - works without AIS for most points, so pre-AIS years are recoverable
    - output is logbook data, not AIS-derived; the circular dependency disappears
  status: validated against AIS, ready to implement

validation:
  date: 2026-09-20
  method: >-
    Recovered 57 afli stations by candidate selection and compared each against
    that vessel's AIS track over the same window (provider != "wacky", so the
    comparison is independent of the correction being tested). AIS interpolated
    onto the logger clock supplies the reference position.
  results:
    median_distance_to_ais_wacky_m: 718
    median_distance_to_ais_recovered_m: 333
    stations_improved: 53 of 57 (93%)
    median_improvement_m: 255
  corroboration: >-
    The 718 m wacky error matches the 741 m displacement the encoding predicts,
    independently confirming the model. Track roughness (mean implied speed
    between consecutive fixes) also falls for every station tested, e.g.
    3.72 -> 3.13 kn, 4.38 -> 3.87 kn.
  residual: >-
    333 m is not error in the recovery alone: AIS fixes are minutes apart so the
    interpolated reference is itself approximate, and the vessel genuinely moves
    between them. The logger's own precision is ~18 m.

method_detail:
  disambiguation: >-
    lat and lon carry independent rollover bits, so each fix has four candidates.
    A forward pass picks the one closest to a dead-reckoned prediction from the
    previous accepted fix, using the logger's OWN recorded speed (skip_hradi) and
    heading (skip_stefna) - no external data needed. 44-92% of choices are
    decisive by a margin over 100 m.
  no_ais_required: >-
    Works for vessel-years with no AIS at all, which the AIS-interpolation method
    returns as NA. Only 3,144 of 31,852 STK mobile ids ever matched to a vessel,
    so untranspondered boats are the population that gains. NOT yet quantified.

retracted_claim:
  claim: "recovers everything before 2007, which currently comes back NA"
  status: WRONG - withdrawn 2026-09-20
  why: >-
    Checked the logger tables rather than assuming. They run 2000-2024 but only
    start in earnest in 2008: sjalfvirkir_maelar has 1,307 pre-2007 rows of
    27,388,332 (0.0%), rafr_sjalfvirkir_maelar 1,088 of 22,758,786 (0.0%). The
    GPS loggers were not in place before then, so there is nothing there to
    recover. The claim came from extrapolating "AIS starts 2007" without looking.

open_question: >-
  If this is adopted, the recovered positions are logbook sensor data and belong
  at curated/logbook/sensor_gps, not inside curated/ais/ping. That removes
  26.8M non-AIS rows from the AIS table and changes the equivalence-gate baseline.
  See curate/decisions/000-restructuring.md, "Open question: wacky positions".

accuracy_measured:
  date: 2026-09-20
  note: >-
    Per POINT, not per station. Earlier figures were per-station medians, which
    hide the tail: a median cannot see 10% of points being wrong by 742 m.
  reference: AIS interpolated onto the logger clock, 1,578 points over 57 stations
  table: |
                     median   mean    p90   >500m
      wacky            652    676   1127   67.0%
      recovered        322    362    795   34.6%
  reading: >-
    The share of fixes more than 500 m from the vessel's own AIS track falls from
    67% to 35%. Not solved - roughly a third of fixes remain well off - but half
    the error removed. Part of the residual is the reference itself: AIS fixes are
    minutes apart, so the interpolated position is approximate.

latitude_bias:
  observed: >-
    Rollover detected on 29.4% of latitudes against a true rate near 40%
    (longitude 39.3%, essentially exact). Suspected cause: the wacky value sits
    ss/9000 degrees north of candidate A, so a seed taken from it leans toward
    the northerly candidate.
  attempted_fix: seed the first pass from cand_a(w) - 0.4/150, the expected true value
  result: FAILED
  evidence: |
      rollover rate   latitude 15.3% -> 40.7%   (target ~40%)
      but distance to AIS, per point:
        current     median 322  mean 362  p90 795  >500m 34.6%
        de-biased   median 324  mean 376  p90 802  >500m 36.0%
      agree on 85.3% of points; where they differ the de-biased choice is closer
      only 40% of the time
  conclusion: >-
    Matching the aggregate rollover rate is not the same as choosing correctly.
    The de-bias hits the right rate by flipping points roughly at random. Not
    adopted. It also undercuts the inference that the rate gap implies a specific
    error count - the rate is off, but correcting the rate does not correct the
    positions.
  next_candidate: >-
    A per-track dynamic program (Viterbi over the four candidate states,
    minimising total implied movement) rather than a greedy forward pass. A
    greedy pass commits to each choice on partial information; a DP considers the
    whole track. Untested.

parked:
  date: 2026-09-20
  decision: >-
    Stop work on the algorithm. The immediate goal is infrastructure, not a
    better estimator, and two attempts to improve on the greedy forward pass have
    now been measured and rejected. Revisit later with the dynamic-programming
    approach.
  state:
    incumbent: >-
      curate/corrections/afli_coords_ais_interp.R - AIS interpolated onto the
      logger clock. Writes staging/afli/sensor_gps_ais. Carries the bootstrap
      cycle, so it stays outside the targets graph.
    alternative: >-
      curate/corrections/afli_coords.R - candidate selection from the logger's
      own reading. Writes staging/afli/sensor_gps, 50,147,118 rows, already
      built. No AIS input, so it could join the graph if adopted.
  both_retained: >-
    Deliberately, at the user's request: the two are independent estimates of the
    same position and the comparison is itself of interest. That is also why the
    parking costs nothing - the alternative's output exists and can be analysed
    whenever.
