id: logbook_nephrops_tails
title: four vessels log Nephrops as tails under the whole-animal code; their whole weight is the tail weight x 3.25
status: implemented 2026-10-29 (plan 050 step 5), held for plan 051; its factor read from the factor table since 2026-10-30 (plan 051 step 4, plan 054 step 2c), run in a scratch store the same day; in the live store since 2026-10-31 (nephrops_tails.parquet's fd.built, at 4627437)
applies_to:
  - curated/logbook/nephrops_tails.parquet          # new: every Nephrops station of a declared vessel and period, its trip's outcome and factor
  - curated/logbook/catch_by_species_station.parquet # catch_round = logged x the tails' factor, round_basis reconstructed
  - products/v0/logbook/catch.parquet               # catch_round, round_basis, round_factor per catch row
implementation: >-
  curate/corrections/logbook_nephrops_tails.R (the table, condition_corrected "tails"); R/whole_weight.R reads the
  factor of the named state from curated/reference/whole_weight_factor.parquet (reference/species/whole_weight_factor.yml)
discovered: >-
  2026-10-28, by an MFRI colleague's check of the new mar's Nephrops catch and CPUE series; measured here the same day
  (TODO 152) and again 2026-10-29 (plan 050 §1)
decided_by: >-
  the maintainer, 2026-10-29 (plan 050 ask c): the trips found by vessel and period, factor 3.3, with a guard on the
  trip's own ratio; the periods narrowed by Claude from the measurement below, and the guard put to the maintainer
  and chosen. The same day the factor was held for a review of whole weight (plan 051); its answer (ask a, 2026-10-30)
  takes the landings' factor of the day, 3.25 for Nephrops tails since 1992 (plan 054 step 2c)

# The rule's parameters, read by the implementation. A period's `to` is open where it is missing. The factor is the
# factor table's (state 3, tails), not this file's.
guard: 0.55
periods:
  - {vid: 173,  from: 2019-01-01}
  - {vid: 1645, from: 2004-01-01, to: 2006-12-31}
  - {vid: 1645, from: 2019-01-01}
  - {vid: 1752, from: 2019-01-01}
  - {vid: 2048, from: 2019-01-01}

rule: >-
  A logbook trip of a declared vessel with a Nephrops (sid 40) station dated in a declared period is a candidate. Its
  logged weight is the sum of its sid-40 catch, duplicate twins left out, and its landed weight is its landing's
  sid 40 (catch_by_species_trip.parquet). Every candidate trip falls in one outcome: `tails` where logged / landed is
  under the guard, `tails_no_landing` where it has no landing or the landing holds no sid 40, both converted; `whole`
  where logged / landed is the guard or more, left as logged. Named tails, the station's sid-40 whole weight is the
  weight as logged times the tails' factor of the day (R/whole_weight.R, the factor table: 3.25), with basis
  `reconstructed`. 0.55 lies between tails (1/3.25 = 0.31) and whole (1.0) on a log scale.

evidence: >-
  Plan 050 §1 and the check of 2026-10-29 (Claude, read-only, not checked by a person). Per trip, logged over landed
  sid 40, median: 0.28 (vid 173), 0.34 (1645), 0.35 (1752), 0.28 (2048) in 2019-2026, about 1 for every other vessel.
  By year, trips under 0.55: vid 1645 0 of 33 in 2002-2003, 40 of 42 in 2004-2006, 75 of 76 in 2019-2022; vid 173 54
  of 59 in 2019-2021; vid 1752 51 of 58 in 2019-2021; vid 2048 43 of 43 in 2019-2021, 0 of 1 in 2022 (1.22, whole), 4 of
  4 in 2026. The rows hold condition NA (afli), UNGU (fs_afladagbok) and GUTT or UNGU (adb): adb's GUTT trips log 0.28 of
  the landing, so the app's "gutted" is the tails there too. No row has catch_whole. afli as MFRI corrected it converted
  tails to whole weight in 2007-2018 (x 3.3, the colleague's figure), so those years are about 1 and are not declared.
  The factor fits the ratios: 1 / 0.28-0.35 is 2.9-3.6. The landings take tails x 3.25 in lods and agf, 1992-2026,
  and the regulations print 3.25 (plan 051 §1, §5 b); the colleague's 3.3 is afli's in-house edit of 2007-2018.

repair: >-
  catch.parquet is untouched: `catch` stays the weight as logged, in the state the logbook names, and the merge cannot
  take the correction since the guard reads lid_map, which is built from the merge. The table carries every candidate
  station with its trip's logged and landed weight, outcome and the state it names (NA where whole).
  calc_whole_weight() reads that state's factor from the factor table, the basis then `reconstructed`, so the
  per-station table and v0's catch rows use the one rule.

not_corrected: >-
  The trail's catch (curate/ais_catch.R) shares the logged `catch` over the fixes, with `raise_factor` the landed over
  the logged weight per trip and species: raised, these trips are right already; unraised they stay at the tail
  weight. sid 445 (afli's "Slitinn humar", broken Nephrops: 563 rows, 28.8 t, 2 vessels, 2010s and 2020s) is not
  touched. Low ratios inside the years afli converted (vid 173 12 of 36 trips in 2010, vids 1645 and 2048 7 trips each in
  2013) and other vessels' trips in 2000-2002 with less than half the landed weight (TODO 152) are not looked at.
