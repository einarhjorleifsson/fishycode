id: adb_vs_fs_afladagbok
title: adb renders the same records as fs_afladagbok in different units and with an unsigned longitude
status: implemented and rebuilt 2026-09-23 - depth units closed (decision 022);
  longitude sign fixed (curate/corrections/adb_vs_fs_afladagbok.R); both joined
  into curate/logbook.R, adb now wired into the three-tier merge
  (curate/decisions/023-adb-wired-into-logbook.md), TODO.md item 1 closed
applies_to:
  - staging/adb/station.parquet
  - staging/adb/lon_sign.parquet   (new: .sid, lon1, lon2, lon1_raw, lon2_raw, lon1_basis, lon2_basis)
implementation: curate/corrections/adb_vs_fs_afladagbok.R (longitude sign only; depth handled by curate/logbook.R directly, per decision 022)
discovered: 2026-09-21, cross-checking adb against fs_afladagbok before wiring adb into the merge
implemented: 2026-09-23 (longitude sign)

context: >-
  adb is the LIVE VIEW of fs_afladagbok - the same underlying records, re-served.
  They share 467,635 .sid values, so the two can be compared row for row with no
  matching heuristic at all. This is the cleanest cross-check available anywhere
  in the project, and it is only possible because the keys coincide.

agreement:
  date:  differs on 68 rows (0.01%)
  t1:    differs on 68 rows (0.04%)
  summary: >-
    Timestamps agree almost perfectly, which establishes that these really are
    the same records and that the disagreements below are rendering faults, not
    different observations.

defect_1_depth_units:
  summary: adb stores depth in METRES where fs_afladagbok stores FATHOMS.
  evidence: >-
    Over the 443,718 shared stations with positive depth in both, the ratio
    z_adb / z_fs is 1.8288 at the 1st, 25th, 50th, 75th and 99th percentiles
    alike - 100.00% of rows fall within 0.001 of it. 1.8288 is the exact
    fathom-to-metre conversion. Not one row has a ratio of 1.
  which_is_canonical: >-
    fs_afladagbok. Established against GEBCO bathymetry, not by comparing the
    two sources to each other. Each source's stations were indexed to H3 res 8
    and their recorded z1 compared with the GEBCO depth of the cell
    (curated/reference/area_h3.parquet), on ~59,000 stations each inside the
    Icelandic box:

      source          median(GEBCO_metres / z1)   IQR
      afli                      1.891          1.71 - 2.18
      fs_afladagbok             1.891          1.82 - 2.07
      adb                       1.025          0.98 - 1.15

    afli and fs_afladagbok return the IDENTICAL ratio, close to the 1.8288
    fathom-to-metre constant, so both record FATHOMS. adb returns ~1.0, so it
    already records METRES. The ~3% excess over 1.8288 is expected: GEBCO is a
    cell mean and fishing gear does not sit at the deepest point of a cell.
  earlier_weaker_argument: >-
    First argued from medians alone - afli 83.0 against fs 60.0 being the same
    order of magnitude. That was not sufficient: a 1.38x difference can conceal a
    unit change, and it says nothing about what the shared unit IS. The GEBCO
    comparison is independent of both sources and answers both questions.
  severity: >-
    HIGH if adb is merged without repair. Depth is a single column in
    curated/logbook/station.parquet. Merging adb as-is would silently make 2026
    depths metres inside a column that is fathoms for 1950-2025. Nothing would
    error; every depth-based analysis crossing the boundary would be wrong.
  repair: >-
    SUPERSEDED 2026-09-23 - the maintainer settled the product-wide unit as
    METRES (curate/decisions/022-depth-unit-is-metres.md), which adb already
    is. adb needs no conversion; fs_afladagbok converts to metres instead
    (shared with afli_depth_units.yml). Every converted fs_afladagbok row
    keeps z1_raw/z2_raw and sets z1_basis/z2_basis = "reconstructed", per
    decision 022. Also per decision 022: exclude pelagic gear
    (gid %in% pelagic_gids, curate/link_lid_map.R) from any GEBCO-ratio
    measurement - fishing depth in the water column is not seabed depth.
  amended_2026_10_22: >-
    The metres were Oracle's view station_v, which the adapter read: its depth is
    the table adb.fishing_station's fathoms x 1.8288 on all 687,039 depths. Since
    adb_station_v_positions.yml the adapter reads the table, so adb's depth is
    fathoms like fs_afladagbok's and curate/logbook.R converts both the same way
    (same metres; z1_raw fathoms, z1_basis "reconstructed"). defect_2's sign rule
    still applies: the adapter turns the longitude's sign as the view did.

defect_2_longitude_sign:
  summary: adb drops the west sign on longitude for roughly a tenth of records.
  evidence: >-
    50,269 of 467,635 shared stations (10.8%) sit more than 10 km apart between
    the two renderings. Of those, 91.8% have a POSITIVE longitude in adb against
    1.5% in fs_afladagbok. Iceland lies near 21 degrees WEST, so a positive 21 is
    the same position mirrored onto the wrong side of the Greenwich meridian.
  relation_to_known_issue_13: >-
    This is the longitude sign heuristic. fs_afladagbok applies it; adb does not.
  residual: >-
    13,064 of the 50,269 outliers (26%, not the originally-estimated ~8%) are not
    explained by sign alone - negating does not bring them within 10 km either -
    and remain uncharacterised.
  severity: HIGH if merged without repair - positions land in the wrong ocean.
  repair: >-
    Implemented 2026-09-23, curate/corrections/adb_vs_fs_afladagbok.R. Rule,
    derived and checked against all 466,508 stations with usable coordinates on
    both sides (not a sample): negate lon when lon > 10.75 AND lat < 67.66. This
    is exactly fs_afladagbok's own restore-threshold (sources/fs_afladagbok/
    convert.R Step 3) - both systems share the same positive-magnitude
    convention and the same genuine-eastern-waters exception (Barents/Norwegian
    Sea, lon up to 51.5, lat mostly > 67.66, ~4,630 stations, all agreeing
    between adb and fs already). Result on the shared population: fixes 37,205
    of 50,269 mismatches, breaks ZERO previously-correct rows (checked
    exhaustively). Applied to the full adb table (628,314 rows, not just the
    fs-overlap subset - the rule needs only adb's own lon/lat): 42,548
    reconstructed (6.78%), 585,171 recorded, 595 NA. Only 53 of 20,530 2026
    rows are touched - the sign defect is concentrated outside the range adb
    exists to extend. lon1_raw/lon2_raw keep the original; lon1_basis/
    lon2_basis mark "reconstructed" vs "recorded", per AGENTS.md's basis
    invariant (same vocabulary as afli_depth_units.yml's z1_basis).

defect_3_gear_coding:
  summary: >-
    NOT a defect after all, and the cross-check resolves it. adb's gear code is
    fs_afladagbok's OLD coding (gid_old), not the unified gid.
  evidence: >-
    On the shared stations, adb's code equals fs's gid_old in the overwhelming
    majority: 6=6, 3=3, 5=5, 1=1, 2=2, 7=7, 25=25, 92=92, 14=14. The unified gid
    is then read off fs: 3 -> 14, 5 -> 11, 1 -> 12, 7 -> 9, 25 -> 3, 92 -> 22.
  exceptions: >-
    adb code 53 appears where fs says gid_old 15 (4,578 rows), and adb code 6
    appears where fs says gid_old 14 / gid 8 (4,352 rows). So the correspondence
    is not a function - adb 6 maps mostly to unified 6 but sometimes to 8.
  consequence: >-
    A crosswalk can be DERIVED from the 467,635 shared stations rather than
    guessed, with the ambiguous cases carrying an explicit confidence. This is
    strictly better than mapping adb codes against reference/gear.parquet, which
    is impossible: codes 92/99/91/29 are valid only as gear$map, code 10 only as
    gear$gid, and codes 53/51 as neither.
  resolved: >-
    2026-10-20, decision 154: adb's code is the old code (the GEAR schema's
    fishing_gear_no), and adb's own table fishing_gear maps it to the new gid,
    53 and 51 included; read so in curate/corrections/logbook_gear.R. Today's
    reference/gear.parquet holds every adb code but 53 and 51 among its old
    rows, and agrees with adb's table on all of them.

blocked: TODO.md item 1 (wire adb into the logbook merge) - closed 2026-09-23,
  see curate/decisions/023-adb-wired-into-logbook.md
