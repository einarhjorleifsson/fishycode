id: logger_runs_past_the_station
title: the afli GPS logger keeps recording after the fishing event ends, so .sid over-attributes fixes to a station
status: measured on one year - repair NOT implemented
applies_to:
  - curated/logbook/sensor_gps
  - raw/oracle/afli/sjalfvirkir_maelar/   # raw/logbooks/afli/sjalfvirkir_maelar.parquet until plan 018
  - raw/oracle/afli/rafr_sjalfvirkir_maelar.parquet
implementation: none yet
discovered: 2026-09-23, maintainer, while curate/logbook_sensor_gps.R was running

context: >-
  The logger is keyed by logbook EVENT - .sid, a fishing station - not by trip. The
  maintainer's observation: "unless the captain forgot to switch the logger off."
  A .sid on a logger fix therefore records which station was last keyed, not that
  the fix belongs to that fishing event.

  curate/logbook_sensor_gps.R keys its output by .sid and bounds the position
  interpolation by AIS VOYAGE. The voyage bound is right for what it is for - it
  stops a position being drawn across a harbour stop - but nothing trims a fix to
  the station's own event window, so the table positions these fixes correctly and
  then labels them with a station that had already finished.

measurement:
  scope: year 2013 only, from the freshly built curated/logbook/sensor_gps
  stations: 58085
  fixes: 3653458
  logger_span_per_station_hours:
    median: 4.83
    p95: 15.50
    p99: 24.67
    max: 5492          # 229 days on .sid -546515
    over_24h: 687      # 1.18% of stations
    over_48h: 119
  against_recorded_duration:
    comparable_stations: 50749      # those carrying duration_m > 0
    median_recorded_duration_h: 4.13
    median_logger_span_h: 5.33
    logger_over_1h_longer: 19890    # 39.2%
    logger_over_6h_longer: 4521     # 8.9%
    excess_hours_p99: 19.50
    excess_hours_max: 5475.20

gear_dependence:
  measured: 2026-09-23 on the 2013 logger stations, at the maintainer's suggestion
  pattern: |
    gear                        slots filled   stations
    OTB  bottom trawl           .23.             38,419
    OTM  midwater trawl         .23.              5,215
    LLS  longline               1..4              4,073
    GNS  gillnet                1..4              1,022
    SDN  Danish seine           ....              6,058
    PS   purse seine            ....              1,278
    LHM  handline               ...4                 93
  reading: >-
    TOWED gear fills the inner pair and PASSIVE gear the outer pair, which is what
    the fishing interval physically is in each case: a trawl fishes while it is
    towed, so start and end of tow; a longline or gillnet is set, soaks unattended
    and is hauled, so setting start and hauling end. Seines record neither.
  so_the_window_is: coalesce(t2, t1) .. coalesce(t3, t4)

against_the_gear_window:
  towed_t2_t3:
    stations: 43634
    median_window_h: 4.02
    median_logger_span_h: 5.17
    median_start_offset_h: 0.11     # logger starts just after the window opens
    median_end_offset_h: 0.78       # and stops ~47 min after it closes
    pct_running_1h_past: 41.1
    pct_running_6h_past: 6.5
    reading: >-
      The median 47-minute tail is the length of hauling the gear aboard, not
      forgetfulness. Whatever trim is chosen has to allow for it or it will cut the
      end of every tow.
  passive_t1_t4:
    stations: 5095
    median_window_h: 16.50
    median_logger_span_h: 7.50
    median_start_offset_h: 4.94     # logger starts ~5 h INTO the window
    median_end_offset_h: 0.32
    pct_running_1h_past: 28.9
    pct_running_6h_past: 5.6
    reading: >-
      Here the logger UNDER-covers: 7.5 h of a 16.5 h set-to-haul window, because the
      vessel leaves the gear soaking and returns. A trim to the window would be wrong
      in the opposite direction - there is no track to trim, there is track missing.
  asymmetry: >-
    39.8% of stations run more than an hour past the window's close; only 0.5% begin
    more than an hour before it opens. One-sided, which is the signature of a switch
    left on rather than of a mis-recorded window. Only 6.8% sit wholly inside.

why_it_matters: >-
  A consumer asking for "the logger track of station X" gets, two times in five, more
  than the fishing event - and the excess is not small at the tail. Any per-haul
  quantity computed by grouping the logger on .sid (duration, distance towed, mean
  depth, bottom temperature) inherits it. The positions themselves are sound; the
  attribution is not.

proposed_repair: >-
  Do not trim. Per this project's rule a correction adds a column: flag each fix
  against the station's own window rather than dropping it, so a consumer can choose
  whether to include the tail. duration_m is present on 50,749 of the 58,085 stations
  in 2013, which is enough to flag most of them; the rest would carry NA, which is
  the honest answer.

  Where the boundary belongs is NOT obvious and is the maintainer's: a fix a minute
  after the recorded end may well be part of hauling the gear, and a fix six hours
  later is not. Nothing in the data says where between those the event stops.

open_questions:
  - Measured on 2013 alone. Whether 39.2% is typical, or whether it tracks the
    logger generation (sensor_src gps1 vs gps2) or the fishery, is untested.
  - Every .sid in the 2013 sensor_gps is NEGATIVE (-591,898 .. -451,798), as are all
    58,085 stations. The vessel key carries negative vids too (-2605, -467). The
    convention is undocumented anywhere and may or may not be the same one.
  - RESOLVED 2026-09-23, and the reading above was wrong. It is not two schemas. It
    is ONE schema whose slots are filled BY GEAR, exactly as curate/decisions/010
    says - "the four event times stay four because the fishing interval moves with
    the gear". Maintainer's suggestion; measured and confirmed. See gear_dependence.
