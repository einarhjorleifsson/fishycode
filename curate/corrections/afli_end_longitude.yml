id: afli_end_longitude
title: afli's electronic-logbook haul end longitude is a copy of the end latitude (2010-2012); recovered from the record the logbook sent
status: coded 2026-10-20, not yet built into curated/ (with the next rebuild from logbook)
applies_to:
  - staging/afli/end_longitude.parquet     # the side table: .sid, lon2, lon2_raw, lon2_basis
  - curated/logbook/station.parquet        # lon2 (recovered or NA), lon2_raw, lon2_basis on afli rows
affects_rows: >-
  144,368 of afli's 339,795 stations with an end longitude have lon2 = -lat2 (dry run on the staging of 2026-10-20):
  136,798 recovered ("reconstructed"), 7,570 not ("none", lon2 NA); the other 195,427 "recorded". By year: 2008 235,
  2009 1,251, 2010 47,455, 2011 69,185, 2012 26,216, 2013-2017 26; every one an electronic-logbook station. A test
  merge of curate/logbook.R into scratch (2026-10-20) gave the same counts in station.parquet, changed no other column
  or row, and left trip and catch identical. Not covered: lon2 = -lat2 on 7 adb and 54 fs_afladagbok stations.
implementation: curate/corrections/afli_end_longitude.R (target afli_end_longitude); joined in curate/logbook.R
discovered: 2026-10-20, the vessel overview session (TODO 106); its source found the same night (decision 158's session)

defect: >-
  In afli.stofn and in its electronic-logbook copy fs_afli.rafr_stofn, lengd_lok (the haul's end longitude, DDMM)
  holds the value of breidd_lok (the end latitude) on most electronic-logbook stations (negative visir) of 2010-2012,
  so the adapter's lon2 = -geoconvert(lengd_lok) is -lat2. The adapter reads the right columns (x2 = lengd_lok,
  y2 = breidd_lok); the copy is in Oracle.
origin: >-
  The XML each logbook sent (fs_afli.afladagb_xml_mottaka.sending) holds the end position as
  <STADSETNING_LOK BREIDD=".." LENGD=".."/>, with distinct values: the latitude was copied over the longitude when the
  record was loaded, not by the app. Every faulty station is an electronic-logbook one; none of the paper book's.

rule: >-
  A station whose end longitude is -lat2 is found in the message that delivered it (rafr_stofn.xml_sending_visir =
  message id, xml_faerslu_visir and xml_faerslu_version = the record's VISIR and VERSION in it). Its lon2 becomes the
  sent LENGD where the record is found with one end position, the sent BREIDD equals breidd_lok, the sent LENGD
  differs from it and has fewer than 60 minutes; lon2_basis "reconstructed". Otherwise lon2 is NA (the stored value is
  a latitude, not a longitude), lon2_basis "none". lon2_raw keeps the adapter's value on every row.

evidence: >-
  Of the 144,368, 139,132 are found in their message, 139,131 with one sent end position whose latitude agrees with
  breidd_lok; on those the sent start position agrees with lengd/breidd too (raw check: 45,936 of 47,225 found in
  2010, 70,039 of 71,217 in 2011). The recovered end lies as far from the haul's start as the recorded ends do:
  median 4.3 km both, 90th percentile 23.4 km against 23.7 km. About 220 sent longitudes have 60 minutes or more
  (three digits, such as 169 or 270) and are not recovered. Scripts: $FISHYDATA/archive/2026-10-plan035/scripts/
  (end_longitude_recover.R, end_longitude_check.R).

what_it_changes: >-
  Only the end positions an analyst reads in station.parquet. The flow never reads lon2/lat2: hauls meet the pings by
  time, and logbook positions never join the track.

worth_telling: >-
  Fiskistofa, which loads the XML into afli: the end longitude of 2010-2012's electronic-logbook stations is the end
  latitude in afli.stofn and fs_afli.rafr_stofn while the sent record holds the right one. Not drafted.

