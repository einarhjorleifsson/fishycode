id: logbook_app_profile
title: each logbook app's habits, field by field, found by rule; values kept as recorded and flagged (plan 053)
status: >-
  drafted 2026-10-29 by Claude (AI) from plan 053's measurements, for a person's review (plan 053 ask a); every row
  reviewed by the maintainer, 18 the same evening and 27 on 2026-10-30 (the `reviewed` field), the evidence in
  $FISHYDATA/archive/2026-10-29-elogbook-feed/ (review-sheet.md); four rows added from decision 249 (T2-afli, T3-afli,
  T20) and T11's afli half split into its own row (T11-afli), 2026-10-30. The flag and note rows of the times, the
  positions and the catch coded by Claude (AI) on 2026-10-30 (plan 054 step 2a) and traced on a scratch store; not
  built on the live store
applies_to:
  - curated/logbook/fishing_sample.parquet   # t1_flag ... t4_flag, t1_rule ... t4_rule, t1_action ... t4_action
  - curated/logbook/station.parquet          # pos1_flag, pos2_flag with their rule and action; z_unit (step 8)
  - curated/logbook/trip.parquet             # T1_flag, T2_flag with their rule and action: a copy of a station's time
  - curated/logbook/catch.parquet            # species_flag with its rule and action (K2)
  - curated/logbook/station_window.parquet   # a flagged time opens and closes no window
implementation: >-
  R/logbook_app_profile.R, applied in curate/logbook.R after the twins (plan 053 step 5): each flag and note row of
  the times (t1-t4, the trip's T1 and T2), the positions and the catch, coded from its text, in the order of
  APP_TIME_ORDER, first match wins. A field's `<field>_action` says what the flow does: "flag" leaves the value out of
  every window, link and duration (judged_time_sql(), R/duration_limit.R; calc_effort(), R/logbook_effort.R), "note"
  keeps it. A row's `note_for` names the values within its scope that are noted rather than flagged. The windows
  (curate/station_window.R, plan 053 step 6): a station with no usable time gets ramb's day window (W1); a trip_time
  station takes the trip's departure and return where its own times are flagged, basis derived (T4, T10); a pressed
  record runs from its start to the gear's 95th percentile span or the vessel's next station, basis synthesised
  (T14). The `read_as` rows are the adapters' position decoders' (step 7), the `convert` rows and D4-D5 depth's
  (step 8). I4 needs the landing link, built after the merge: it is listed by the check (step 4). P8's 8 merged
  stations need Trackwell's own copy as a frozen list, not yet made
discovered: 2026-10-29, plan 053 (from decisions 157, 158, 206, 210, 211, 242, 243 and TODOs 103, 107, 126, 164)
decided_by: the maintainer, 2026-10-29 and 30 (plan 053 asks a-e, h); asks f and g open
evidence: >-
  $FISHYDATA/archive/2026-10-29-elogbook-feed/ (findings.md; counts/tables.md renders every count file named below).
  Measured by Claude (AI) on the dumps of 2026-10-16 and the store of 2026-10-29, read-only; not checked by a person.
  "merged" counts the stations the merge holds (fs_afladagbok, and adb from 2025-11-19), duplicate twins out.

vocabulary:
  app: >-
    the trip's uppruni (fs_afladagbok) or source (adb), trimmed, with the suffixes " - GAFL AUTO" and " - Skrifstofa
    VES" taken off; on the afli route the message's software and its major.minor version. "*" is any app.
  scope: >-
    app = every value of the field for that app and period; value = only the values that show the pattern (an
    equality within 1 min, 10 min for the landing, unless the row says otherwise)
  holds: >-
    recorded | copy:<field> (equal to another field, and that field is the true one) | trip:<departure|return|landing>
    (the trip's time, not the station's) | placeholder | date | derived | default:<value> | unit:<unit> |
    form:<form> | sign:<convention> | precision:<value>
  action: >-
    flag = the flag column is set and the windows and durations leave the value out (the judged_time_sql() model);
    note = the flag is set and the value is still used (a weak sign, for analysts); read_as = the adapter reads the
    stored form this way; convert = a unit converted, the original kept, basis reconstructed; none = checked, nothing
    done, or done elsewhere as named
  note_for: >-
    the values within the row's scope that are noted, not flagged: by `gear` or `apps`, with the note's own `flag`
    word where the row gives one (R/logbook_app_profile.R reads it)
  gear: >-
    the gear class from curated/reference/gear_window.parquet by the logbook's gid (static, jig = jigged, towed, seine =
    the Danish seine, other), or an ICES gear code
  reviewed: null until a person has read the row's evidence and agreed its reading and action

