# Issues for DuckDB (https://github.com/duckdb/duckdb), found while rebuilding fishycode under DuckDB 2.0.0 (TODO 150,
# decisions 235 and 239). Drafted 2026-10-28 by Claude (AI) for the maintainer of fishycode; not checked by a person and
# not sent. Both reprexes run on synthetic data only (gen_synth.R): no MFRI data is in them. Their files, each with the
# command that reruns it: $FISHYDATA/archive/2026-10-28-duckdb2/synth/.

repository: duckdb/duckdb
version: DuckDB 2.0.0, through the R package duckdb 2.0.0 compiled from CRAN's source; compared with 1.5.6
environment: macOS (Darwin 25.6.0), Apple M4 Pro, 24 GB, 14 threads; R 4.5.2; spatial extension from the core repository
sent: no
sent_how: ""

issues:
  - title: "2.0.0: a query with a large DISTINCT sometimes spills without bound until max_temp_directory_size (1.5.6 does not)"
    labels: [bug]
    files: [gen_synth.R, make_reprex_sql.R, reprex.sql, run_reprex.R, run_reprex.sh, run_reprex.log]
    body: |
      A 63-line query (generated by an R package; it finds the times vessels spend in port from their positions) reads
      three Parquet files of 55 million synthetic positions each and writes about 92,000 rows. Under 2.0.0 it usually
      takes 15 s with a peak of about 6.5 GB. Now and then, with the same data, query and settings, the temporary
      directory instead grows by about 2 GB a second until `max_temp_directory_size`, and the query fails:

      ```
      Out of Memory Error: failed to offload data block of size 32.0 KiB (18.6 GiB/18.6 GiB used).
      This limit was set by the 'max_temp_directory_size' setting.
      ```

      Without the cap it wrote 74 GB, the limit DuckDB derived from the free disk. The plan is the same in every run
      (EXPLAIN, 11 times across 4 sessions), so the difference is in execution. Under 1.5.6 the same query never did
      this.

      Each run in a fresh process, on the synthetic data below (`run_reprex.sh`, `run_reprex.log`):

      | engine and settings                         | ran away   | others: median time, peak |
      |---|---|---|
      | 2.0.0, defaults (14 threads, 19.1 GiB)      | 1 of 18    | 14.6 s, 6.4 GB |
      | 2.0.0, `threads = 4`                        | 5 of 10    | 12.6 s, 6.5 GB |
      | 2.0.0, `preserve_insertion_order = false`   | 1 of 10    | 14.6 s, 5.9 GB |
      | 1.5.6, defaults                             | 0 of 10    | 15.4 s, 6.1 GB |

      On the real data it was 5 of 21 runs under 2.0.0 and 0 of 8 under 1.5.6. A run that runs away does so within
      about 10 s of starting.

      **Where it happens.** A stack sample taken while the temporary directory grew shows `PhysicalHashAggregate::Sink`
      fed by a Parquet table scan, allocating through `GroupedAggregateHashTable` and evicting through
      `StandardBufferManager::EvictBlocksOrThrow` and `TemporaryFileManager::WriteTemporaryBuffer`. The only hash
      aggregate on a Parquet scan in the query is a `SELECT DISTINCT vid, time` over all 165 million positions, whose
      result is joined to 852,000 events:

      ```sql
      LEFT JOIN (SELECT DISTINCT vid, time FROM read_parquet(['ping_2017.parquet', 'ping_2018.parquet', 'ping_2019.parquet'])) c
        USING (vid, time)
      ```

      Alone, that DISTINCT runs in under a second even with `memory_limit = '1GB'`. Narrowing its input to the
      events' positions first (a SEMI JOIN before the DISTINCT) made the full query pass 15 times in 15 on the real
      data, where it had run away in 5 of 21 runs before.

      **Reproduce.** `gen_synth.R` writes the data with DuckDB SQL alone: 2,000 vessels, a position every ~19 min
      over three years, 400 square ports. `reprex.sql` is the query with those files as its inputs. Run from the data's
      folder, several times, each on a fresh in-memory database. We ran it from R (`run_reprex.R`, one fresh process
      per run); the CLI should behave the same, but that is untested:

      ```sh
      for i in $(seq 1 10); do duckdb < reprex.sql; done
      ```

      Data generation (DuckDB SQL; `setseed(0.42)`):

      ```sql
      CREATE TABLE portc AS SELECT i::INTEGER AS port_id, -30 + random() * 40 AS cx, 60 + random() * 15 AS cy FROM range(400) t(i);
      CREATE TABLE ves AS SELECT i::INTEGER AS vid, (random() * 399)::INTEGER AS hp FROM range(2000) t(i);
      -- for each year 2017, 2018, 2019:
      COPY (SELECT v.vid, TIMESTAMP '2018-01-01' + to_seconds(n * 1146 + (random() * 600)::BIGINT) AS time,
                   CASE WHEN (n // 200) % 3 = 0 THEN p.cx + (random() - 0.5) * 0.008 ELSE p.cx + (random() - 0.5) * 6 END AS lon,
                   CASE WHEN (n // 200) % 3 = 0 THEN p.cy + (random() - 0.5) * 0.008 ELSE p.cy + (random() - 0.5) * 3 END AS lat,
                   'recorded' AS pos_basis
            FROM ves v JOIN portc p ON p.port_id = v.hp CROSS JOIN range(27500) r(n)) TO 'ping_2018.parquet';
      ```

      (the events and ports files: `gen_synth.R`).

  - title: "2.0.0: a filter on a hive partition column is estimated at ~1 row, so joins are built on the wrong side"
    labels: [performance]
    files: [estimate_reprex.R]
    body: |
      Under 2.0.0, `WHERE year = 2018` on a hive-partitioned dataset with one file per partition is estimated at about
      1 row. Under 1.5.6 it is the partition's rows. Synthetic positions, 55,000,000 a year, laid out as
      `hive/year=2017/data_0.parquet`, `year=2018/…` and `year=2019/…`:

      ```sql
      EXPLAIN SELECT * FROM read_parquet('hive/*/*.parquet', hive_partitioning = true) WHERE year = 2018;
      -- 2.0.0:  ~1 row              1.5.6:  ~55,000,000 rows
      EXPLAIN SELECT * FROM read_parquet('hive/*/*.parquet', hive_partitioning = true);
      -- 2.0.0:  ~165,000,000 rows   1.5.6:  ~171,309,246 rows
      EXPLAIN SELECT * FROM read_parquet('hive/year=2018/*.parquet', hive_partitioning = true);
      -- 2.0.0:  ~55,000,000 rows    1.5.6:  ~55,000,000 rows
      ```

      The same holds with `hive_types = {'year': BIGINT}` or `INTEGER`, `hive_types_autocast = false`, a cast literal,
      `IN (2018)` and `BETWEEN 2018 AND 2018`. With the estimate at 1 row, a spatial join of a year's 37 million
      positions to 10,062 port polygons built its index on the positions and ran out of memory; reading the year's
      folder instead gives the right estimate and the right build side. On a dataset with several files per
      partition we saw a realistic estimate, so the file count may matter.
