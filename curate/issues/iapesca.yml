# Issues for iapesca (https://github.com/JulRodrigu/r-packages_iapesca), found while porting its trip finder to ramb
# for the voyage bench (plan 031). Drafted 2026-10-19 by Claude (AI) for the maintainer of ramb/fishycode, who reviewed
# them and sent them to the package's author by personal email the same day, as a Quarto document and its HTML
# rendered from this file. None is filed on GitHub.
# Each reprex was run against r-packages_iapesca at 1b7248c (2022-11-16), first by sourcing its R/ folder, then with
# the package installed by the maintainer (library(iapesca)): the same output both ways. Each body carries its own
# reprex; the combined script stayed in the drafting session's notes and is not kept.
#
# A second batch, `batch_2026_10_27` at the end, is in iapesca 1.3 on Ifremer's GitLab: found by reading it
# (decision 232), then each confirmed by running its reprex against the package installed from the clone at 1882892
# into a scratch library. Drafted by Claude (AI), not yet reviewed by the maintainer, not sent.

