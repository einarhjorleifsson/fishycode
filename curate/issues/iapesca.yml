response: |
  The author answered by email on 2026-10-20 and 2026-10-22: fixed in GitLab work item #14, commits bb145a9
  (2026-10-21) and 1882892 (2026-10-22). Read against main at 1882892 on 2026-10-27 (decision 232), in the order below:
  s2 off, fixed (Check_sfObject); min.stop, fixed in 2023 (3edff8f), before this was sent; the buffer cap, fixed as
