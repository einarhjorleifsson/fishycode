    Read in decision 232 and not confirmed: CalcThresholds() leaves its limits NA when GaussianQt is missing, but it is
    internal and every caller passes GaussianQt, so no user reaches it. Four more are design points for discussion, not
    defects: Spatialize_FE's interval per ping, Retrieve_SettingOperations matching not one to one, match_Obs2Pos not
    telling "not observed" from "observed, not fishing", and headings as atan2(dy, dx) averaged linearly.
  shared_setup: |
