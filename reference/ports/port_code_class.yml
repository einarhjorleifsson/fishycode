# port_code_class.yml — the class of every landing code that is not a harbour with a pid (decision 208 e).
# Read by reference/ports/port_code.R, which puts it on curated/reference/port_code.parquet. A code that
# curated/reference/port.parquet gives a pid is a harbour. Every other code a landing uses, as its port or as an
# export's origin port, or a logbook trip (fs_afladagbok) as its departure or landing port, is listed here, or the
# build stops. A new code is classed here by hand.
#
# The logbook's codes were added by Claude (AI) on 2026-11-07 (TODO 196): nine codes no landing uses, classed by
# their names in ask.londunarstadir, with fs_afladagbok's trip ends counted in `note`; not yet checked by a person.
#
# Drafted by Claude (AI) on 2026-10-30 from decision 208 e, kvoti.stadur's and ask.londunarstadir's names, and the
# staged landings' counts (plan 054 step 2i); not yet checked by a person. The four codes decision 208 left to be
# looked up (41, 71, 197, 200) and the origin ports 9, 10 and 102 are classed by their names, with their landings
# counted in `note`.
#
# class:
#   harbour      a place in Iceland a landing is made at; here one with no harbour polygon (so no pid)
#   disposition  not a place but what became of the catch: 159 Gámur/Sigling, exported in a container or landed
#                abroad (the maintainer, 2026-10-21; decision 208). Its origin port says which.
#   abroad       landed abroad: a country, or a sailing abroad
#   transfer     moved to another vessel
#   placeholder  no place: missing, various, corrections, registrations
