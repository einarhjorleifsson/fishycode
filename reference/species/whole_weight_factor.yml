  - {sid: [29], state: 1, from: 1997-09-01, factor: 1.087, basis: derived, witness: kvoti.lods_i_oslaegt}
  - {sid: [5], state: 1, from: 1992-09-01, to: 2007-08-31, factor: 1.0, basis: derived, witness: kvoti.lods_i_oslaegt,
     note: redfish is landed and counted ungutted (the regulations' article on the quota)}
  - {sid: [5, 49], state: 1, from: 2007-09-01, factor: 1.0638, basis: derived, witness: ask.studlar,
     note: agf's few gutted redfish and orange roughy}
  - {sid: [19], state: 1, from: 1992-09-01, to: 2002-07-01, factor: 1.25, basis: derived, witness: kvoti.lods_i_oslaegt}
  - {sid: [19], state: 1, from: 2002-07-02, factor: 1.0, basis: derived, witness: kvoti.lods_i_oslaegt,
     note: argentine is landed ungutted; lods's gutted weight is the weight as landed}
  - {sid: [61], state: 1, from: 1992-09-01, factor: 1.0, basis: derived, witness: kvoti.lods_i_oslaegt,
     note: deep-sea redfish is landed and counted ungutted; lods's gutted weight is the weight as landed}
  - {sid: [39, 47, 62, 161], state: 1, from: 2014-09-01, factor: 1.1111, basis: derived, witness: kvoti.lods_i_oslaegt,
