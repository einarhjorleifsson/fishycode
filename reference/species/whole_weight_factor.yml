# The products processed at sea: the landing system sets a factor per landing, so the table holds a yearly mean with its
# 10-90 % range for each species, state and area, computed from aflagrunnur's rows (plan 051 ask d).
year_mean_states: [2, 11, 12, 13, 15, 17, 26, 48, 50, 51, 59, 60, 61]

# The logbook: which landings row each logged condition reads ----------------------------------------------------
# The logbooks name GUTT, UNGU and RELE; UNGU and RELE are the whole weight. A correction may name another state where
# the logbook's is wrong (`condition_corrected`, e.g. Nephrops tails, curate/corrections/logbook_nephrops_tails.yml).
logbook:
  - {condition: GUTT, state: 1, note: the species' own gutted factor}
  - {condition: GUTT, sid: [48, 951], state: 6, read_sid: 951, basis: derived,
     witness: plan 051 §1 (logged over landed per trip 0.28-0.30 on fs_afladagbok's GUTT lumpfish),
     note: lumpfish logged gutted is roe}
  - {condition: tails, sid: [40], state: 3}
  # A species the landings give no gutted factor for: the logbook's own 1.25 (decision 066).
  - {condition: GUTT, sid: any, state: 1, factor: 1.25, basis: derived, witness: decision 066, fallback: true,
     note: the logbooks' own whole weight (fs_afladagbok's afli = magn x 1.25)}

# afli's lumpfish logbook (TODO 167): roe kg by salting stage to the whole lumpfish. Provisional until HV 2020-33's
# authors answer (TODO 169; plan 054 ask d).
lumpfish_logbook:
  gsi: 29.4          # fresh roe, % of the ungutted fish (HV 2020-33)
  stages:            # grasl_stofn.teg_verkunar: fresh roe = roe at the stage / factor (HV 2020-33, Table 1)
    - {stage: 1, factor: 1.00, name: with all fluid}
    - {stage: 2, factor: 0.92, name: drained}
    - {stage: 3, factor: 0.77, name: ready for salting}
    - {stage: 4, factor: 0.81, name: salted}
  witness: HV 2020-33

# Held, not applied ------------------------------------------------------------------------------------------------
held:
  - {sid: [951], state: 6, from: 2010-03-24, to: 2016-12-31, factor: 4.2517, basis: derived,
     witness: MFRI's lumpfish advice of June 2020,
     note: MFRI's 3.4014 x 1.25 for the Directorate's 20 % roe deduction; reproduces MFRI's 2008-2019 landings}
  - {sid: [951], state: barrel, from: 2020-06-01, factor: 472, basis: derived, witness: HV 2020-33,
     note: "kg of ungutted fish per barrel of 105 kg salted roe; earlier 487 (2012-2014), 445 (2015-2016), 427 (2017-2020)"}
