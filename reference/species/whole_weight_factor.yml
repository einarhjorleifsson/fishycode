# whole_weight_factor.yml — the factors from a weight as landed or logged to the whole (ungutted) weight (plan 051 step 3).
# Read by reference/species/whole_weight_factor.R, which expands it to curated/reference/whole_weight_factor.parquet.
#
# Drafted by Claude (AI) on 2026-10-30 from plan 051's step 1 table ($FISHYDATA/archive/2026-10-whole-weight/,
# draft_factor_table.parquet) and the fishing years' regulations on the total allowable catch; not yet checked by a
# person.
#
# `state` is the landing system's own code (ask.astand). The factor multiplies the weight in that state to the whole
# weight: the landings' own value (1.1905 is 1 / 0.84 as the landings round it). `regulation` is the factor as a
# regulation prints it (gutted = ungutted x factor), where one states it. `basis`: recorded where a regulation states
# the factor, derived where only the landings' rows and the landing system's tables give it. `to` missing is open. A
# period's `area` is the landing system's (IS, Iceland's waters) unless given.

# The landings: one row per species, state and period -----------------------------------------------------------
periods:
  # Gutted (1). The regulations' factor article; before 1997-09-01 the landings' lods table alone.
  - {sid: [1, 2, 3], state: 1, from: 1992-09-01, to: 1997-08-31, factor: 1.25, basis: derived,
     witness: kvoti.lods_i_oslaegt}
  - {sid: [1, 2, 3], state: 1, from: 1997-09-01, factor: 1.1905, regulation: 0.84, reg_group: cod_haddock_saithe,
     basis: recorded, witness: regulation, witness_landings: kvoti.lods_i_oslaegt; ask.veidistofnar_i_oslaegt}
  - {sid: [4], state: 1, from: 1992-09-01, factor: 1.25, basis: derived, witness: kvoti.lods_i_oslaegt,
     note: whiting is not in the regulations' factor article}
  - {sid: [6], state: 1, from: 1992-09-01, factor: 1.25, regulation: 0.80, reg_group: ling, basis: recorded,
     witness: regulation, witness_landings: kvoti.lods_i_oslaegt; ask.veidistofnar_i_oslaegt}
  - {sid: [7], state: 1, from: 1992-09-01, factor: 1.25, regulation: 0.80, reg_group: blue_ling, basis: recorded,
     witness: regulation, witness_landings: kvoti.lods_i_oslaegt; ask.veidistofnar_i_oslaegt}
  - {sid: [9], state: 1, from: 1992-09-01, factor: 1.1111, regulation: 0.90, reg_group: wolffish, basis: recorded,
     witness: regulation, witness_landings: kvoti.lods_i_oslaegt; ask.veidistofnar_i_oslaegt,
     note: the landings stored 1.11 to 1997-08-31; folded into 1.1111}
  - {sid: [8, 14], state: 1, from: 1992-09-01, factor: 1.1111, regulation: 0.90, reg_group: tusk_monkfish,
     basis: recorded, witness: regulation, witness_landings: kvoti.lods_i_oslaegt; ask.veidistofnar_i_oslaegt,
     note: the landings stored 1.11 to 1997-08-31; folded into 1.1111}
  - {sid: [13], state: 1, from: 1992-09-01, factor: 1.1111, basis: derived, witness: kvoti.lods_i_oslaegt; ask.veidistofnar_i_oslaegt,
     note: spotted wolffish is not in the regulations' factor article}
  - {sid: [10, 12, 15, 16, 93], state: 1, from: 1992-09-01, factor: 1.1111, basis: derived,
