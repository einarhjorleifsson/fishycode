  - {sid: [17], state: 1, from: 1992-09-01, factor: 1.25, basis: derived, witness: kvoti.lods_i_oslaegt}
  - {sid: [21, 22, 23, 24, 25, 26, 27, 28, 95], state: 1, from: 1992-09-01, to: 1997-08-31, factor: 1.09,
