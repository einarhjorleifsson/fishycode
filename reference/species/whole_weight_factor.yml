  - {sid: [951], state: 1, from: 2011-03-13, factor: 0.0, basis: derived, witness: ask.studlar,
     note: gutted lumpfish; its roe carries the fish}
  # Ungutted (0), whole (27) and capelin residue (95): the weight is the whole weight, any species.
  - {sid: any, state: [0, 27, 95], from: 1992-09-01, factor: 1.0, basis: derived, witness: ask.studlar}
  # Tails (3): Nephrops.
  - {sid: [40], state: 3, from: 1992-09-01, factor: 3.25, regulation: 3.25, reg_group: nephrops_tails, basis: recorded,
     witness: regulation, witness_landings: kvoti.lods_i_oslaegt; ask.studlar,
     note: the regulation multiplies the tails by 3.25 to the whole animal}
  # Liver (4), roe (6), heads (7), trimmings (10), Greenland halibut tails (47): not counted as fish, any species but those below.
  - {sid: any, state: [4, 6, 7, 10, 47], from: 1992-09-01, factor: 0.0, basis: derived, witness: ask.studlar}
  - {sid: [31], state: 6, from: 1992-09-01, factor: 1.0, basis: derived, witness: ask.studlar, note: capelin roe is capelin}
  - {sid: [22], state: [7, 47], from: 2007-09-01, to: 2022-01-15, factor: 0.0, basis: derived, witness: ask.studlar}
  - {sid: [22], state: [7, 47], from: 2022-01-16, factor: 1.087, basis: derived, witness: aflagrunnur rows,
     note: "regulation nr. 1464/2021 (in force 2022-01-01) counts tails, heads and bodies as the catch; the landings change on 2022-01-16"}
  # Lumpfish roe (6) to the whole lumpfish.
  - {sid: [951], state: 6, from: 2007-09-01, to: 2010-03-23, factor: 3.0303, basis: derived, witness: ask.studlar,
     note: 100/33}
  - {sid: [951], state: 6, from: 2010-03-24, to: 2012-08-31, factor: 3.7879, basis: derived, witness: ask.studlar,
     note: 1.25 x 100/33}
  - {sid: [951], state: 6, from: 2012-09-01, factor: 3.4014, regulation: 3.4, reg_group: lumpfish_roe, basis: recorded,
     witness: regulation, witness_landings: ask.studlar,
     note: "100/29.4; the regulation prints 3.4 (first by amendment nr. 151/2012 of 2012-02-17, when the landings still took 3.7879)"}
  # Lumpfish roe as its own species: lods kept it as roe.
  - {sid: [949], state: [0, 1], from: 1992-09-01, factor: 1.0, basis: derived, witness: kvoti.lods_i_oslaegt,
     note: the roe is its own species code; the logbook's gutted 949 reads this row}

# The fishing years' regulations on the total allowable catch, their article on slægingarstuðlar ----------------
# Read by Claude (AI) as web pages on 2026-10-30, not checked by a person: the URL and each article's text in
# $FISHYDATA/archive/2026-10-30-plan054-whole-weight/regulations/. The factor as printed: gutted = ungutted x factor
# (for the tails and the roe, whole = tails or roe x factor). The years 1996/1997 to 1999/2000 (B nr. 362/1996,
# 414/1997, 448/1998, 516/1999) are listed in the register but no text of them is online as a web page: their periods
# stay `derived`, on the landings' own tables. A group the year's article does not name is not recorded that year.
